---
- name: Domain Manager Protection Plan examples
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip }}"
      nutanix_username: "{{ username }}"
      nutanix_password: "{{ password }}"
      validate_certs: false
  tasks:
    - name: Create domain manager protection plan
      nutanix.ncp.ntnx_domain_manager_protection_plan_v2:
        state: present
        domain_manager_ext_id: "00000000-0000-0000-0000-000000000001"
        remote_location:
          cluster_reference:
            ext_id: "00000000-0000-0000-0000-000000000002"
            name: "remote-cluster"
        remote_site:
          remote_cluster:
            name: "remote-pc-cluster"
            external_address:
              ipv4:
                value: "10.0.0.10"
            cluster_type: "AOS"
            port: 9440
        failover_network_details:
          network_ext_id: "00000000-0000-0000-0000-000000000003"
          default_gateway:
            ipv4:
              value: "10.0.0.1"
          subnet_mask:
            ipv4:
              value: "255.255.255.0"
      register: create_result
      ignore_errors: true

    - name: Update domain manager protection plan
      nutanix.ncp.ntnx_domain_manager_protection_plan_v2:
        state: present
        ext_id: "{{ create_result.ext_id | default('11111111-1111-1111-1111-111111111111') }}"
        domain_manager_ext_id: "00000000-0000-0000-0000-000000000001"
        remote_location:
          cluster_reference:
            ext_id: "00000000-0000-0000-0000-000000000002"
        remote_site:
          remote_cluster:
            name: "remote-pc-cluster-updated"
            external_address:
              ipv4:
                value: "10.0.0.11"
            cluster_type: "AOS"
        failover_network_details:
          network_ext_id: "00000000-0000-0000-0000-000000000003"
          default_gateway:
            ipv4:
              value: "10.0.0.1"
          subnet_mask:
            ipv4:
              value: "255.255.255.0"
      register: update_result
      ignore_errors: true

    - name: Failover domain manager
      nutanix.ncp.ntnx_failover_domain_manager_v2:
        ext_id: "{{ create_result.ext_id | default('11111111-1111-1111-1111-111111111111') }}"
        failover_type: "UNPLANNED"
        network_spec:
          network_ext_id: "00000000-0000-0000-0000-000000000003"
          external_address:
            ipv4:
              value: "10.0.0.20"
          default_gateway:
            ipv4:
              value: "10.0.0.1"
          subnet_mask:
            ipv4:
              value: "255.255.255.0"
      register: failover_result
      ignore_errors: true

    - name: Get domain manager protection plan using ext_id
      nutanix.ncp.ntnx_domain_manager_protection_plans_info_v2:
        ext_id: "{{ create_result.ext_id | default('11111111-1111-1111-1111-111111111111') }}"
      register: get_result
      ignore_errors: true

    - name: List all domain manager protection plans
      nutanix.ncp.ntnx_domain_manager_protection_plans_info_v2:
      register: list_result
      ignore_errors: true

    - name: List domain manager protection plans with filter
      nutanix.ncp.ntnx_domain_manager_protection_plans_info_v2:
        filter: "domainManagerExtId eq '00000000-0000-0000-0000-000000000001'"
      register: filter_result
      ignore_errors: true

    - name: List domain manager protection plans with limit
      nutanix.ncp.ntnx_domain_manager_protection_plans_info_v2:
        limit: 1
      register: limit_result
      ignore_errors: true

    - name: List all domain manager protection plans with fetch_all
      nutanix.ncp.ntnx_domain_manager_protection_plans_info_v2:
        fetch_all: true
      register: fetch_all_result
      ignore_errors: true

    - name: Delete domain manager protection plan
      nutanix.ncp.ntnx_domain_manager_protection_plan_v2:
        state: absent
        ext_id: "{{ create_result.ext_id | default('11111111-1111-1111-1111-111111111111') }}"
      register: delete_result
      ignore_errors: true
