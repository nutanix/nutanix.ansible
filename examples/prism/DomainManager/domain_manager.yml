---
# Example playbook covering the Nutanix Prism Central Domain Manager v4 modules:
#   - nutanix.ncp.ntnx_domain_managers_info_v2  (ListDomainManagers,
#       GetDomainManagerById, ListBackupTargets, ListRestorableDomainManagers,
#       ListRestorePoints)
#   - nutanix.ncp.ntnx_scale_up_domain_manager_by_id_v2  (ScaleUpDomainManagerById)
#
# Credentials and the PC endpoint are set once on the play via module_defaults.
# The restorable_domain_managers / restore_points methods normally need the
# hosting Prism Element endpoint instead — swap `nutanix_host` on those tasks
# when running against your own cluster.
#
# All examples use env-backed variables so the same playbook can be used on
# any Nutanix endpoint:
#   NUTANIX_HOST / NUTANIX_USERNAME / NUTANIX_PASSWORD / NUTANIX_PORT

- name: Nutanix Prism Central Domain Manager v4 playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ lookup('env', 'NUTANIX_HOST') }}"
      nutanix_username: "{{ lookup('env', 'NUTANIX_USERNAME') }}"
      nutanix_password: "{{ lookup('env', 'NUTANIX_PASSWORD') }}"
      nutanix_port: "{{ lookup('env', 'NUTANIX_PORT') | default('9440', true) }}"
      validate_certs: false
  tasks:
    - name: List all domain managers (Prism Centrals) known to this PC
      nutanix.ncp.ntnx_domain_managers_info_v2:
        method: domain_managers
      register: all_domain_managers
      ignore_errors: true

    - name: Capture a domain manager ext_id for the follow-up tasks
      ansible.builtin.set_fact:
        domain_manager_ext_id: >-
          {{ (all_domain_managers.response | default([]) | first | default({})).ext_id
             | default('cfddac63-ffdb-4d9c-9a8c-54abf89ce234') }}

    - name: Get a specific domain manager (Prism Central) by ext_id
      nutanix.ncp.ntnx_domain_managers_info_v2:
        method: domain_managers
        ext_id: "{{ domain_manager_ext_id }}"
      register: one_domain_manager
      ignore_errors: true

    - name: List all backup targets configured on the domain manager
      nutanix.ncp.ntnx_domain_managers_info_v2:
        method: backup_targets
        domain_manager_ext_id: "{{ domain_manager_ext_id }}"
      register: all_backup_targets
      ignore_errors: true

    - name: Get a specific backup target by ext_id (if any backup target exists)
      nutanix.ncp.ntnx_domain_managers_info_v2:
        method: backup_targets
        domain_manager_ext_id: "{{ domain_manager_ext_id }}"
        ext_id: "{{ (all_backup_targets.response | default([]) | first | default({})).ext_id | default('00000000-0000-0000-0000-000000000000') }}"
      register: one_backup_target
      ignore_errors: true

    - name: List restorable domain managers for a given restore source (run against PE)
      nutanix.ncp.ntnx_domain_managers_info_v2:
        method: restorable_domain_managers
        restore_source_ext_id: "d4e44c2b-944c-48b0-8de1-b0adae3d54c6"
      register: restorable_domain_managers
      ignore_errors: true

    - name: List restore points for a given restorable domain manager (run against PE)
      nutanix.ncp.ntnx_domain_managers_info_v2:
        method: restore_points
        restore_source_ext_id: "d4e44c2b-944c-48b0-8de1-b0adae3d54c6"
        restorable_domain_manager_ext_id: "{{ domain_manager_ext_id }}"
      register: restore_points
      ignore_errors: true

    - name: Dry-run a Prism Central scale up (safe — the API only validates the request)
      nutanix.ncp.ntnx_scale_up_domain_manager_by_id_v2:
        ext_id: "{{ domain_manager_ext_id }}"
        size: "LARGE"
        dryrun: true
      register: scale_up_dryrun
      ignore_errors: true

    - name: Trigger a real Prism Central scale up (SMALL -> LARGE), do not wait
      nutanix.ncp.ntnx_scale_up_domain_manager_by_id_v2:
        ext_id: "{{ domain_manager_ext_id }}"
        size: "LARGE"
        wait: false
      register: scale_up_result
      ignore_errors: true
