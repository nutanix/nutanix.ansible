---
# Summary:
# This playbook will do:
# 1. Update the ADS configuration of a VM
# 2. Get the ADS configuration of a VM

- name: VM ADS config CRUD playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        vm_ext_id: "23423423-2342-2342-2342-234234234234"

    - name: Update the ADS configuration of a VM
      nutanix.ncp.ntnx_vm_ads_config_v2:
        vm_ext_id: "{{ vm_ext_id }}"
        auto_migration: "INCLUDE"
      register: result

    - name: Print update result
      ansible.builtin.debug:
        msg: "{{ result }}"

    - name: Get the ADS configuration of a VM
      nutanix.ncp.ntnx_vm_ads_config_info_v2:
        vm_ext_id: "{{ vm_ext_id }}"
      register: result

    - name: Print get result
      ansible.builtin.debug:
        msg: "{{ result }}"
