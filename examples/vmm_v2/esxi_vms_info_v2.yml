---
# Summary:
# This playbook will do:
# 1. List all ESXi VMs
# 2. List ESXi VMs with limit
# 3. List ESXi VMs with fetch_all
# 4. List ESXi VMs using filter
# 5. Fetch a single ESXi VM using ext_id
# Requires a Prism Central with an ESXi cluster registered via vCenter.

- name: ESXi VMs info playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        vm_ext_id: "<esxi_vm_ext_id>"
        vm_name: "<esxi_vm_name>"

    - name: List all ESXi VMs
      nutanix.ncp.ntnx_esxi_vms_info_v2:
      register: result
      ignore_errors: true

    - name: List ESXi VMs with limit
      nutanix.ncp.ntnx_esxi_vms_info_v2:
        limit: 2
      register: result
      ignore_errors: true

    - name: List ESXi VMs with fetch_all
      nutanix.ncp.ntnx_esxi_vms_info_v2:
        fetch_all: true
      register: result
      ignore_errors: true

    - name: List ESXi VMs using filter on name
      nutanix.ncp.ntnx_esxi_vms_info_v2:
        filter: name eq '{{ vm_name }}'
      register: result
      ignore_errors: true

    - name: Fetch ESXi VM using ext_id
      nutanix.ncp.ntnx_esxi_vms_info_v2:
        ext_id: "{{ vm_ext_id }}"
      register: result
      ignore_errors: true
