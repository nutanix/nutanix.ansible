---
# Summary:
# Fetch all available VMs from Prism Central using fetch_all.
# When fetch_all is true, the module paginates through the list API
# until every entity is returned (API default page size is 50).

- name: Fetch all VMs with fetch_all
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: List all VMs (default page / current behavior)
      nutanix.ncp.ntnx_vms_info_v2:
      register: default_page

    - name: List all VMs with fetch_all
      nutanix.ncp.ntnx_vms_info_v2:
        fetch_all: true
      register: all_vms

    - name: Show counts
      ansible.builtin.debug:
        msg:
          - "Default page count: {{ default_page.response | length }}"
          - "Total available: {{ all_vms.total_available_results }}"
          - "Fetched with fetch_all: {{ all_vms.response | length }}"
