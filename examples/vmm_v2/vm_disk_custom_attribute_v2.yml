---
# Summary:
# This playbook demonstrates adding and removing custom attributes on an
# AHV VM disk in Nutanix Prism Central using the v4 VMM APIs.
# 1. Add custom attributes to a VM disk
# 2. Remove custom attributes from a VM disk

- name: VM disk custom attribute playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        vm_uuid: "<vm_ext_id>"
        disk_uuid: "<disk_ext_id>"

    - name: Add custom attributes to a VM disk
      nutanix.ncp.ntnx_vm_disk_custom_attribute_v2:
        state: present
        vm_ext_id: "{{ vm_uuid }}"
        ext_id: "{{ disk_uuid }}"
        custom_attributes:
          - "environment:production"
          - "tier:gold"
          - "owner:ansible"
      register: add_result
      ignore_errors: true

    - name: Remove custom attributes from a VM disk
      nutanix.ncp.ntnx_vm_disk_custom_attribute_v2:
        state: absent
        vm_ext_id: "{{ vm_uuid }}"
        ext_id: "{{ disk_uuid }}"
        custom_attributes:
          - "tier:gold"
      register: remove_result
      ignore_errors: true
