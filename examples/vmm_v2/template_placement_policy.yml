---
# Summary:
# This playbook will do:
# 1. Create a template placement policy
# 2. Get a template placement policy by ext_id
# 3. List all template placement policies
# 4. List template placement policies with filter
# 5. List template placement policies with limit
# 6. Update a template placement policy
# 7. Delete a template placement policy

- name: Template Placement Policy playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        content_category_ext_id: "6e50299a-b7c9-5c5c-9faf-246ee249c597"
        cluster_category_ext_id: "48d64692-23f4-54ff-a9c4-854c6b6f5f1d"

    - name: Create a template placement policy
      nutanix.ncp.ntnx_template_placement_policy_v2:
        state: present
        name: "ansible-test-template-placement-policy"
        description: "Template placement policy created by Ansible"
        placement_type: "SOFT"
        content_filter:
          type: "CATEGORIES_MATCH_ALL"
          category_ext_ids:
            - "{{ content_category_ext_id }}"
        cluster_filter:
          type: "CATEGORIES_MATCH_ANY"
          category_ext_ids:
            - "{{ cluster_category_ext_id }}"
      register: result
      ignore_errors: true

    - name: Set template placement policy ext_id
      ansible.builtin.set_fact:
        policy_ext_id: "{{ result['response']['ext_id'] }}"

    - name: Get template placement policy by ext_id
      nutanix.ncp.ntnx_template_placement_policies_info_v2:
        ext_id: "{{ policy_ext_id }}"
      register: result
      ignore_errors: true

    - name: List all template placement policies
      nutanix.ncp.ntnx_template_placement_policies_info_v2:
      register: result
      ignore_errors: true

    - name: List template placement policies with filter
      nutanix.ncp.ntnx_template_placement_policies_info_v2:
        filter: "name eq 'ansible-test-template-placement-policy'"
      register: result
      ignore_errors: true

    - name: List template placement policies with limit
      nutanix.ncp.ntnx_template_placement_policies_info_v2:
        limit: 1
      register: result
      ignore_errors: true

    - name: Update an existing template placement policy
      nutanix.ncp.ntnx_template_placement_policy_v2:
        state: present
        ext_id: "{{ policy_ext_id }}"
        name: "ansible-test-template-placement-policy-updated"
        description: "Updated template placement policy"
        content_filter:
          type: "CATEGORIES_MATCH_ANY"
          category_ext_ids:
            - "{{ content_category_ext_id }}"
        cluster_filter:
          type: "CATEGORIES_MATCH_ALL"
          category_ext_ids:
            - "{{ cluster_category_ext_id }}"
      register: result
      ignore_errors: true

    - name: Delete the template placement policy
      nutanix.ncp.ntnx_template_placement_policy_v2:
        state: absent
        ext_id: "{{ policy_ext_id }}"
      register: result
      ignore_errors: true
