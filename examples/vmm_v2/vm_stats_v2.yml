---
# Summary:
# Fetch ESXi VM stats (list / get / disk / NIC) via ntnx_vm_stats_info_v2 and
# ntnx_vm_stat_v2. Requires a Prism Central with an ESXi cluster registered
# via vCenter; AHV-only PCs reject these endpoints.

- name: ESXi VM stats playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting variables
      ansible.builtin.set_fact:
        start_time: "2026-07-21T00:00:00.000Z"
        end_time: "2026-07-21T01:00:00.000Z"
        vm_ext_id: "<esxi_vm_ext_id>"
        disk_ext_id: "<esxi_vm_disk_ext_id>"
        nic_ext_id: "<esxi_vm_nic_ext_id>"

    - name: List all ESXi VM stats within the time window
      nutanix.ncp.ntnx_vm_stats_info_v2:
        start_time: "{{ start_time }}"
        end_time: "{{ end_time }}"
      register: all_stats
      ignore_errors: true

    - name: List all ESXi VM stats with fetch_all
      nutanix.ncp.ntnx_vm_stats_info_v2:
        start_time: "{{ start_time }}"
        end_time: "{{ end_time }}"
        fetch_all: true
      register: all_stats_fetch_all
      ignore_errors: true

    - name: List ESXi VM stats with sampling, aggregation, and paging
      nutanix.ncp.ntnx_vm_stats_info_v2:
        start_time: "{{ start_time }}"
        end_time: "{{ end_time }}"
        sampling_interval: 60
        stat_type: AVG
        limit: 5
        page: 0
        orderby: stats/hypervisorCpuUsagePpm
        select: "extId,stats/hypervisorCpuUsagePpm"
      register: paged_stats
      ignore_errors: true

    - name: List ESXi VM stats filtered by hypervisor CPU usage
      nutanix.ncp.ntnx_vm_stats_info_v2:
        start_time: "{{ start_time }}"
        end_time: "{{ end_time }}"
        filter: "stats/any(a:a/hypervisorCpuUsagePpm gt 0)"
      register: filtered_stats
      ignore_errors: true

    - name: Get stats for a single ESXi VM by external ID
      nutanix.ncp.ntnx_vm_stats_info_v2:
        ext_id: "{{ vm_ext_id }}"
        start_time: "{{ start_time }}"
        end_time: "{{ end_time }}"
        sampling_interval: 30
        stat_type: AVG
      register: single_vm_stats
      ignore_errors: true

    - name: Get stats for an ESXi VM using ntnx_vm_stat_v2
      nutanix.ncp.ntnx_vm_stat_v2:
        ext_id: "{{ vm_ext_id }}"
        start_time: "{{ start_time }}"
        end_time: "{{ end_time }}"
        sampling_interval: 30
        stat_type: AVG
      register: vm_stat
      ignore_errors: true

    - name: Get stats for an ESXi VM disk
      nutanix.ncp.ntnx_vm_stat_v2:
        ext_id: "{{ vm_ext_id }}"
        disk_ext_id: "{{ disk_ext_id }}"
        start_time: "{{ start_time }}"
        end_time: "{{ end_time }}"
        sampling_interval: 30
        stat_type: AVG
        select: "stats/controllerNumIops,stats/controllerAvgIoLatencyMicros"
      register: disk_stats
      ignore_errors: true

    - name: Get stats for an ESXi VM NIC
      nutanix.ncp.ntnx_vm_stat_v2:
        ext_id: "{{ vm_ext_id }}"
        nic_ext_id: "{{ nic_ext_id }}"
        start_time: "{{ start_time }}"
        end_time: "{{ end_time }}"
        sampling_interval: 30
        stat_type: SUM
        select: >-
          stats/networkDroppedReceivedPackets,stats/networkDroppedTransmittedPackets
      register: nic_stats
      ignore_errors: true
