---
# Summary:
# This playbook demonstrates how to work with file server recommendations using the
# Nutanix Prism Central v4 APIs.
#
# Recommendations are generated by the file server (One-Click Performance Optimizer)
# to advise scaling up, scaling out, or rebalancing a file server. They cannot be
# created or updated, so this playbook covers the supported operations:
# 1. Get a specific recommendation using ext_id
# 2. List all recommendations for a file server
# 3. List recommendations for a file server with a filter
# 4. List recommendations for a file server with a limit
# 5. Delete (dismiss) a recommendation

- name: Files Recommendation playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        file_server_ext_id: "38dc16f4-90b6-4b1c-8b8c-1f0fdc7b3a2e"
        recommendation_ext_id: "b1c2d3e4-90b6-4b1c-8b8c-1f0fdc7b3a2e"

    - name: Get a specific file server recommendation using ext_id
      nutanix.ncp.ntnx_files_recommendations_info_v2:
        file_server_ext_id: "{{ file_server_ext_id }}"
        ext_id: "{{ recommendation_ext_id }}"
      register: result
      ignore_errors: true

    - name: List all recommendations for a file server
      nutanix.ncp.ntnx_files_recommendations_info_v2:
        file_server_ext_id: "{{ file_server_ext_id }}"
      register: result
      ignore_errors: true

    - name: List recommendations for a file server with a filter
      nutanix.ncp.ntnx_files_recommendations_info_v2:
        file_server_ext_id: "{{ file_server_ext_id }}"
        filter: "recommendationType eq Files.Config.RecommendationType'SCALE_UP'"
      register: result
      ignore_errors: true

    - name: List recommendations for a file server with a limit
      nutanix.ncp.ntnx_files_recommendations_info_v2:
        file_server_ext_id: "{{ file_server_ext_id }}"
        limit: 1
      register: result
      ignore_errors: true

    - name: Delete a file server recommendation
      nutanix.ncp.ntnx_files_recommendation_v2:
        state: absent
        file_server_ext_id: "{{ file_server_ext_id }}"
        ext_id: "{{ recommendation_ext_id }}"
      register: result
      ignore_errors: true
