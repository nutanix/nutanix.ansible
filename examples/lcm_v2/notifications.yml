---
# Summary:
# This playbook demonstrates how to use the LCM (Life Cycle Manager) Notifications
# v4 API modules against a live Nutanix Prism Central. It:
#   1. Computes LCM upgrade notifications for a target entity.
#   2. Fetches the same LCM upgrade notification by external ID.

- name: LCM Notifications playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip | default('10.44.76.28') }}"
      nutanix_username: "{{ username | default('admin') }}"
      nutanix_password: "{{ password | default('Nutanix.123') }}"
      validate_certs: "{{ validate_certs | default(false) }}"
  tasks:
    - name: Set defaults for the target LCM entity
      ansible.builtin.set_fact:
        cluster_ext_id: "47474747-4747-4747-4747-474747474747"
        lcm_entity_external_id: "11111111-2222-3333-4444-555555555555"
        lcm_entity_target_version: "1.0.0"

    - name: Compute LCM upgrade notifications for the target entity
      nutanix.ncp.ntnx_lcm_notification_v2:
        cluster_ext_id: "{{ cluster_ext_id }}"
        notifications_spec:
          - entity_uuid: "{{ lcm_entity_external_id }}"
            to_version: "{{ lcm_entity_target_version }}"
      register: compute_notifications_result
      ignore_errors: true

    - name: Fetch the same LCM upgrade notification by external ID
      nutanix.ncp.ntnx_lcm_notifications_info_v2:
        ext_id: "{{ compute_notifications_result.ext_id }}"
      register: notification_info
      when:
        - compute_notifications_result.ext_id is defined
        - compute_notifications_result.ext_id | length > 0
