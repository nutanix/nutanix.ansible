---
# Summary:
# This playbook will do:
# 1. Create a patched image
# 2. Get the patched image by ext_id
# 3. List all patched images
# 4. List patched images with filter by name
# 5. List patched images with limit
# 6. Delete the patched image

- name: Patched images playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ nutanix_host }}"
      nutanix_username: "{{ nutanix_username }}"
      nutanix_password: "{{ nutanix_password }}"
      validate_certs: false
  tasks:
    - name: Set variables
      set_fact:
        patched_image_name: "ahv_patched_image_ansible"
        patched_image_ext_id: "b6c8f0a2-4d1e-4f0a-9c1a-2d3e4f5a6b7c"
        node_ext_id: "c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f"
        node_hostname: "ahv-host-01"

    - name: Create AHV patched image
      nutanix.ncp.ntnx_patched_images_v2:
        state: present
        host_type: "AHV"
        name: "{{ patched_image_name }}"
        image_details:
          ext_id: "{{ patched_image_ext_id }}"
        node_configurations:
          - node_ext_id: "{{ node_ext_id }}"
            host_configuration:
              hostname: "{{ node_hostname }}"
              network_details:
                management:
                  mtu_bytes: 1500
                  vlan_id: 1
                  ip:
                    ipv4:
                      value: "10.0.0.11"
                      prefix_length: 24
                  gateway:
                    ipv4:
                      value: "10.0.0.1"
                      prefix_length: 24
                  bond_settings:
                    bond_config:
                      active_backup_bond:
                        nics:
                          mac_address:
                            - "aa:bb:cc:dd:ee:01"
              nameservers:
                - ipv4:
                    value: "8.8.8.8"
              ntpservers:
                - fqdn:
                    value: "pool.ntp.org"
      register: create_result
      ignore_errors: true

    - name: Get patched image by ext_id
      nutanix.ncp.ntnx_patched_imagess_info_v2:
        ext_id: "{{ patched_image_ext_id }}"
      register: get_result
      ignore_errors: true

    - name: List all patched images
      nutanix.ncp.ntnx_patched_imagess_info_v2:
      register: list_result
      ignore_errors: true

    - name: List patched images with filter
      nutanix.ncp.ntnx_patched_imagess_info_v2:
        filter: "name eq '{{ patched_image_name }}'"
      register: filter_result
      ignore_errors: true

    - name: List patched images with limit
      nutanix.ncp.ntnx_patched_imagess_info_v2:
        limit: 1
      register: limit_result
      ignore_errors: true

    - name: Delete patched image
      nutanix.ncp.ntnx_patched_images_v2:
        state: absent
        ext_id: "{{ patched_image_ext_id }}"
      register: delete_result
      ignore_errors: true

