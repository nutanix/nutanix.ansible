---
# Summary:
# This playbook will do:
# 1. Create a Data Services IP Mapping
# 2. Update a Data Services IP Mapping
# 3. List all Data Services IP Mappings of the Recovery Plan
# 4. List all Data Services IP Mappings of the Recovery Plan using filter
# 5. List all Data Services IP Mappings of the Recovery Plan using limit
# 6. Get a Data Services IP Mapping using ext_id
# 7. Delete a Data Services IP Mapping

- name: Data Services IP Mapping playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        recovery_plan_ext_id: "23140353-726d-410d-87c2-af46f8bea264"
        primary_cluster: "23140353-726d-410d-87c2-af46f8bea264"
        recovery_cluster: "23140353-726d-410d-87c2-af46f8bea264"
        primary_data_services_ip:
          ipv4: "10.10.10.10"
        recovery_data_services_ip:
          ipv4: "10.10.10.11"
        primary_test_data_services_ip:
          ipv4: "10.10.10.12"
        recovery_test_data_services_ip:
          ipv4: "10.10.10.13"

    - name: Create a Data Services IP Mapping
      nutanix.ncp.ntnx_data_services_ip_mapping_v2:
        state: present
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        primary_cluster: "{{ primary_cluster }}"
        recovery_cluster: "{{ recovery_cluster }}"
        primary_data_services_ip: "{{ primary_data_services_ip }}"
        recovery_data_services_ip: "{{ recovery_data_services_ip }}"
      register: create_result
      ignore_errors: true

    - name: Save created Data Services IP Mapping ext_id
      ansible.builtin.set_fact:
        data_services_ip_mapping_ext_id: "{{ create_result.ext_id | default('') }}"

    - name: Update the Data Services IP Mapping
      nutanix.ncp.ntnx_data_services_ip_mapping_v2:
        state: present
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        ext_id: "{{ data_services_ip_mapping_ext_id }}"
        primary_cluster: "{{ primary_cluster }}"
        recovery_cluster: "{{ recovery_cluster }}"
        primary_data_services_ip: "{{ primary_data_services_ip }}"
        recovery_data_services_ip: "{{ recovery_data_services_ip }}"
        primary_test_data_services_ip: "{{ primary_test_data_services_ip }}"
        recovery_test_data_services_ip: "{{ recovery_test_data_services_ip }}"
      register: update_result
      ignore_errors: true
      when: data_services_ip_mapping_ext_id | length > 0

    - name: List all Data Services IP Mappings of the Recovery Plan
      nutanix.ncp.ntnx_data_services_ip_mappings_info_v2:
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
      register: list_result
      ignore_errors: true

    - name: List all Data Services IP Mappings of the Recovery Plan using filter
      nutanix.ncp.ntnx_data_services_ip_mappings_info_v2:
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        filter: "primaryCluster/extId eq '{{ primary_cluster }}'"
      register: list_result_filter
      ignore_errors: true

    - name: List all Data Services IP Mappings of the Recovery Plan using limit
      nutanix.ncp.ntnx_data_services_ip_mappings_info_v2:
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        limit: 1
      register: list_result_limit
      ignore_errors: true

    - name: Get a Data Services IP Mapping using ext_id
      nutanix.ncp.ntnx_data_services_ip_mappings_info_v2:
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        ext_id: "{{ data_services_ip_mapping_ext_id }}"
      register: get_result
      ignore_errors: true
      when: data_services_ip_mapping_ext_id | length > 0

    - name: Delete the Data Services IP Mapping
      nutanix.ncp.ntnx_data_services_ip_mapping_v2:
        state: absent
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        ext_id: "{{ data_services_ip_mapping_ext_id }}"
      register: delete_result
      ignore_errors: true
      when: data_services_ip_mapping_ext_id | length > 0
