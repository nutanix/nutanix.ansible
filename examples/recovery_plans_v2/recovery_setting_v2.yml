---
# Summary:
# This playbook will do:
# 1. Create a Recovery setting
# 2. Update a Recovery setting
# 3. List all Recovery settings of the Recovery Plan
# 4. List all Recovery settings of the Recovery Plan using filter
# 5. List all Recovery settings of the Recovery Plan using limit
# 6. Get a Recovery setting using ext_id
# 7. Delete a Recovery setting

- name: Recovery Setting playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        recovery_plan_ext_id: "e7ae4b0d-726d-410d-87c2-af46f8bea264"
        vm_ext_id: "9e9c7f6a-4b28-4d5f-a1d9-1f1b3a92aa11"

    - name: Create a Recovery setting
      nutanix.ncp.ntnx_recovery_setting_v2:
        state: present
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        recovery_setting:
          vm:
            vm:
              ext_id: "{{ vm_ext_id }}"
            power_state: "ON"
            in_guest_script_execution_config:
              is_enabled: true
              timeout_secs: 300
      register: create_result
      ignore_errors: true

    - name: Save created Recovery setting ext_id
      ansible.builtin.set_fact:
        recovery_setting_ext_id: "{{ create_result.ext_id | default('') }}"

    - name: Update the Recovery setting
      nutanix.ncp.ntnx_recovery_setting_v2:
        state: present
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        ext_id: "{{ recovery_setting_ext_id }}"
        recovery_setting:
          vm:
            vm:
              ext_id: "{{ vm_ext_id }}"
            power_state: "OFF"
            in_guest_script_execution_config:
              is_enabled: false
      register: update_result
      ignore_errors: true
      when: recovery_setting_ext_id | length > 0

    - name: List all Recovery settings of the Recovery Plan
      nutanix.ncp.ntnx_recovery_settings_info_v2:
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
      register: list_result
      ignore_errors: true

    - name: List all Recovery settings of the Recovery Plan using filter
      nutanix.ncp.ntnx_recovery_settings_info_v2:
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        filter: "scope eq Datapolicies.Config.RecoverySettingScope'VM'"
      register: list_result_filter
      ignore_errors: true

    - name: List all Recovery settings of the Recovery Plan using limit
      nutanix.ncp.ntnx_recovery_settings_info_v2:
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        limit: 1
      register: list_result_limit
      ignore_errors: true

    - name: Get a Recovery setting using ext_id
      nutanix.ncp.ntnx_recovery_settings_info_v2:
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        ext_id: "{{ recovery_setting_ext_id }}"
      register: get_result
      ignore_errors: true
      when: recovery_setting_ext_id | length > 0

    - name: Delete the Recovery setting
      nutanix.ncp.ntnx_recovery_setting_v2:
        state: absent
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        ext_id: "{{ recovery_setting_ext_id }}"
      register: delete_result
      ignore_errors: true
      when: recovery_setting_ext_id | length > 0
