---
# Summary:
# This playbook will do:
# 1. Create a Recovery stage
# 2. Update a Recovery stage
# 3. List all Recovery stages of the Recovery Plan
# 4. List all Recovery stages of the Recovery Plan using filter
# 5. List all Recovery stages of the Recovery Plan using limit
# 6. Get a Recovery stage using ext_id
# 7. Delete a Recovery stage

- name: Recovery Stage playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        recovery_plan_ext_id: "e7ae4b0d-726d-410d-87c2-af46f8bea264"
        vm_ext_id: "9e9c7f6a-4b28-4d5f-a1d9-1f1b3a92aa11"
        category_ext_id: "bbc3555a-133b-5348-9764-bfff196e84e4"

    - name: Create a Recovery stage with all attributes
      nutanix.ncp.ntnx_recovery_stage_v2:
        state: present
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        entity_type: "VM"
        entities:
          - ext_id: "{{ vm_ext_id }}"
        category_ext_ids:
          - "{{ category_ext_id }}"
        priority: 1
        post_actions:
          - config:
              delay_action:
                delay_secs: 30
      register: create_result
      ignore_errors: true

    - name: Save created Recovery stage ext_id
      ansible.builtin.set_fact:
        recovery_stage_ext_id: "{{ create_result.ext_id | default('') }}"

    - name: Update the Recovery stage with all attributes
      nutanix.ncp.ntnx_recovery_stage_v2:
        state: present
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        ext_id: "{{ recovery_stage_ext_id }}"
        entity_type: "VM"
        entities:
          - ext_id: "{{ vm_ext_id }}"
        category_ext_ids:
          - "{{ category_ext_id }}"
        priority: 2
        post_actions:
          - config:
              delay_action:
                delay_secs: 60
      register: update_result
      ignore_errors: true
      when: recovery_stage_ext_id | length > 0

    - name: List all Recovery stages of the Recovery Plan
      nutanix.ncp.ntnx_recovery_stages_info_v2:
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
      register: list_result
      ignore_errors: true

    - name: List all Recovery stages of the Recovery Plan using filter
      nutanix.ncp.ntnx_recovery_stages_info_v2:
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        filter: "entityType eq Datapolicies.Config.RecoverableEntityType'VM'"
      register: list_result_filter
      ignore_errors: true

    - name: List all Recovery stages of the Recovery Plan using limit
      nutanix.ncp.ntnx_recovery_stages_info_v2:
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        limit: 1
      register: list_result_limit
      ignore_errors: true

    - name: Get a Recovery stage using ext_id
      nutanix.ncp.ntnx_recovery_stages_info_v2:
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        ext_id: "{{ recovery_stage_ext_id }}"
      register: get_result
      ignore_errors: true
      when: recovery_stage_ext_id | length > 0

    - name: Delete the Recovery stage
      nutanix.ncp.ntnx_recovery_stage_v2:
        state: absent
        recovery_plan_ext_id: "{{ recovery_plan_ext_id }}"
        ext_id: "{{ recovery_stage_ext_id }}"
      register: delete_result
      ignore_errors: true
      when: recovery_stage_ext_id | length > 0
