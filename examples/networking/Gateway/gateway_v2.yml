---
# Summary:
# This playbook will do:
# 1. Create a remote BGP network gateway with minimum attributes
# 2. Create a remote BGP network gateway with all applicable attributes
# 3. Get gateway using ext_id
# 4. List all gateways
# 5. List gateways with filter
# 6. List gateways with limit
# 7. Update gateway
# 8. Upgrade gateway
# 9. Delete gateway
#
# A LOCAL gateway (VPN / VTEP / BGP) requires a PE cluster reference, a
# management VLAN subnet with a static IP + default gateway, and the Network
# Gateway appliance image staged on the cluster.

- name: Network Gateway v2 playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        gateway_name: "gateway_ansible_example"
        vpc_uuid: "f47927e8-8339-43ad-8dfc-d727c44a5418"

    - name: Create gateway
      nutanix.ncp.ntnx_gateway_v2:
        state: present
        name: "{{ gateway_name }}_all"
        description: "Remote BGP gateway created by Ansible example playbook"
        gateway_device_vendor: "GENERIC"
        vpc_reference: "{{ vpc_uuid }}"
        project_ext_id: "00000000-0000-0000-0000-000000000000"
        services:
          remote_services:
            remote_bgp_service:
              asn: 65001
              address:
                ipv4:
                  value: "192.0.2.11"
                  prefix_length: 32
      register: result
      ignore_errors: true

    - name: Set gateway all ext_id
      ansible.builtin.set_fact:
        gateway_ext_id: "{{ result.ext_id }}"

    - name: Get gateway using ext_id
      nutanix.ncp.ntnx_gateways_info_v2:
        ext_id: "{{ gateway_ext_id }}"
      register: result
      ignore_errors: true

    - name: List all gateways
      nutanix.ncp.ntnx_gateways_info_v2:
      register: result
      ignore_errors: true

    - name: List gateways with filter
      nutanix.ncp.ntnx_gateways_info_v2:
        filter: "name eq '{{ gateway_name }}_all'"
      register: result
      ignore_errors: true

    - name: List gateways with limit
      nutanix.ncp.ntnx_gateways_info_v2:
        limit: 1
      register: result
      ignore_errors: true

    - name: Update gateway
      nutanix.ncp.ntnx_gateway_v2:
        state: present
        ext_id: "{{ gateway_ext_id }}"
        name: "{{ gateway_name }}_all_updated"
        description: "Updated remote BGP gateway description"
        gateway_device_vendor: "GENERIC"
        vpc_reference: "{{ vpc_uuid }}"
        project_ext_id: "00000000-0000-0000-0000-000000000000"
        services:
          remote_services:
            remote_bgp_service:
              asn: 65001
              address:
                ipv4:
                  value: "192.0.2.11"
                  prefix_length: 32
      register: result
      ignore_errors: true

    - name: Upgrade gateway
      nutanix.ncp.ntnx_gateway_v2:
        state: present
        ext_id: "{{ gateway_ext_id }}"
        upgrade: true
      register: result
      ignore_errors: true

    - name: Delete gateway
      nutanix.ncp.ntnx_gateway_v2:
        state: absent
        ext_id: "{{ gateway_ext_id }}"
      register: result
      ignore_errors: true
