---
- name: Nutanix Subnet migration examples
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip }}"
      nutanix_username: "{{ username | default(omit) }}"
      nutanix_password: "{{ password | default(omit) }}"
      validate_certs: "{{ validate_certs | default(false) }}"
  tasks:
    ############################################################
    # Discovery — locate VLAN Basic subnets and a target vNIC
    ############################################################

    - name: List all subnets
      nutanix.ncp.not_applicable:
      register: all_subnets

    - name: Fetch a specific subnet by external ID
      nutanix.ncp.not_applicable:
        ext_id: "{{ all_subnets.response[0].ext_id }}"
      register: subnet_details
      when: all_subnets.response | length > 0

    - name: List subnets filtered by name
      nutanix.ncp.not_applicable:
        filter: "name eq '{{ all_subnets.response[0].name }}'"
      register: filtered_subnets
      when: all_subnets.response | length > 0

    - name: List subnets with a page limit
      nutanix.ncp.not_applicable:
        limit: 1
      register: limited_subnets

    ############################################################
    # Bulk VLAN Basic to VLAN Advanced subnet migration
    ############################################################

    - name: Migrate a list of VLAN Basic subnets to VLAN Advanced
      nutanix.ncp.ntnx_subnet_migrate_v2:
        state: present
        subnets:
          - subnet_uuid: "5b5b8f0e-1b6a-4d2b-8a3f-1a2b3c4d5e6f"
      register: bulk_migration
      ignore_errors: true

    ############################################################
    # vNIC migration — move a single vNIC to a different subnet
    ############################################################

    - name: Migrate a single vNIC to a different subnet
      nutanix.ncp.ntnx_subnet_migrate_v2:
        state: present
        ext_id: "d3f1c2a4-5b6a-4d2b-8a3f-1a2b3c4d5e6f"
        network_uuid: "9c8b7a6d-5e4f-4a3b-9c2d-1e2f3a4b5c6d"
        requested_ip_addresses:
          - ipv4:
              value: "10.0.0.10"
      register: vnic_migration
      ignore_errors: true

    - name: Migrate a single vNIC with metadata and a requested IP
      nutanix.ncp.ntnx_subnet_migrate_v2:
        state: present
        ext_id: "d3f1c2a4-5b6a-4d2b-8a3f-1a2b3c4d5e6f"
        network_uuid: "9c8b7a6d-5e4f-4a3b-9c2d-1e2f3a4b5c6d"
        requested_ip_addresses:
          - ipv4:
              value: "10.0.0.10"
        metadata:
          category_ids:
            - "6b48c37c-7c9b-4c1a-9d1c-1a2b3c4d5e6f"
      register: vnic_migration_full
      ignore_errors: true
