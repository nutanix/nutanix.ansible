---
# Summary:
# This playbook demonstrates how to work with the third-party VPN appliance
# vendor configuration APIs exposed by Nutanix Prism Central (v4).
#
# The workflow it shows:
# 1. List all supported third-party VPN appliances for a given VPN connection.
# 2. List with a filter to narrow down to a specific vendor.
# 3. List with limit + orderby.
# 4. Fetch the vendor configuration payload (plain text) for a specific appliance
#    using the info module.
# 5. Download the vendor configuration payload using the primary
#    ntnx_vpn_appliances_by_vpn_connection_id_v2 module.
#
# Prerequisite: a VPN connection with C(vpn_connection_ext_id) must already
# exist on the target Prism Central. This entity is read-only - there is no
# create / update / delete for VPN appliance vendor configurations, they are
# generated by the platform from the VPN connection parameters.

- name: VPN Appliances by VPN Connection Id playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ nutanix_host | default(lookup('env', 'NUTANIX_HOST')) }}"
      nutanix_username: "{{ nutanix_username | default(lookup('env', 'NUTANIX_USERNAME')) }}"
      nutanix_password: "{{ nutanix_password | default(lookup('env', 'NUTANIX_PASSWORD')) }}"
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        vpn_connection_ext_id: "2e40ff57-20aa-4d2b-b179-298db969c20d"

    - name: List all supported third-party VPN appliances for the VPN connection
      nutanix.ncp.ntnx_vpn_appliances_by_vpn_connection_ids_info_v2:
        vpn_connection_ext_id: "{{ vpn_connection_ext_id }}"
      register: list_all_result
      ignore_errors: true

    - name: Save the first appliance ext_id for the follow up tasks
      ansible.builtin.set_fact:
        appliance_ext_id: "{{ list_all_result.response[0].ext_id | default('') }}"
      when:
        - list_all_result is defined
        - list_all_result.response is defined
        - list_all_result.response | length > 0

    - name: List VPN appliances filtered by name prefix
      nutanix.ncp.ntnx_vpn_appliances_by_vpn_connection_ids_info_v2:
        vpn_connection_ext_id: "{{ vpn_connection_ext_id }}"
        filter: "startswith(name, 'C')"
      register: filter_result
      ignore_errors: true

    - name: List VPN appliances with limit and orderby
      nutanix.ncp.ntnx_vpn_appliances_by_vpn_connection_ids_info_v2:
        vpn_connection_ext_id: "{{ vpn_connection_ext_id }}"
        limit: 1
        orderby: "name asc"
      register: limit_result
      ignore_errors: true

    - name: Fetch a specific third-party VPN appliance configuration (info module)
      nutanix.ncp.ntnx_vpn_appliances_by_vpn_connection_ids_info_v2:
        vpn_connection_ext_id: "{{ vpn_connection_ext_id }}"
        ext_id: "{{ appliance_ext_id }}"
      register: info_single_result
      ignore_errors: true
      when: appliance_ext_id | default('') | length > 0

    - name: Download third-party VPN appliance configuration
      nutanix.ncp.ntnx_vpn_appliances_by_vpn_connection_id_v2:
        state: present
        vpn_connection_ext_id: "{{ vpn_connection_ext_id }}"
        ext_id: "{{ appliance_ext_id }}"
      register: download_result
      ignore_errors: true
      when: appliance_ext_id | default('') | length > 0
