---
# Summary:
# This playbook will do the following:
# 1. Create an image rate limit policy
# 2. Update the image rate limit policy
# 3. Fetch the image rate limit policy using external ID
# 4. List all image rate limit policies
# 5. List image rate limit policies with filter
# 6. List image rate limit policies with limit
# 7. Delete the image rate limit policy
# Pre-requisites:
# Set the following variables:
# - category_ext_id_1
# - category_ext_id_2
# - policy_name

- name: Image rate limit policies playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Set variables
      ansible.builtin.set_fact:
        category_ext_id_1: "bbc3555a-133b-5348-9764-bfff196e84e4"
        category_ext_id_2: "e4bda88f-e5da-5eb1-a031-2c0bb00d923d"
        policy_name: "ansible_rate_limit_policy_test"

    - name: Create image rate limit policy
      nutanix.ncp.ntnx_image_rate_limit_policy_v2:
        state: present
        name: "{{ policy_name }}"
        description: "Image rate limit policy created by Ansible"
        rate_limit_kbps: 1024
        cluster_entity_filter:
          type: CATEGORIES_MATCH_ALL
          category_ext_ids:
            - "{{ category_ext_id_1 }}"
      register: result

    - name: Set policy external ID
      ansible.builtin.set_fact:
        policy_ext_id: "{{ result.response.ext_id }}"

    - name: Update image rate limit policy
      nutanix.ncp.ntnx_image_rate_limit_policy_v2:
        state: present
        ext_id: "{{ policy_ext_id }}"
        name: "{{ policy_name }}_updated"
        description: "Image rate limit policy updated by Ansible"
        rate_limit_kbps: 2048
        cluster_entity_filter:
          type: CATEGORIES_MATCH_ANY
          category_ext_ids:
            - "{{ category_ext_id_1 }}"
            - "{{ category_ext_id_2 }}"
      register: result

    - name: Fetch image rate limit policy using external ID
      nutanix.ncp.ntnx_image_rate_limit_policies_info_v2:
        ext_id: "{{ policy_ext_id }}"
      register: result

    - name: List all image rate limit policies
      nutanix.ncp.ntnx_image_rate_limit_policies_info_v2:
      register: result

    - name: List image rate limit policies with filter
      nutanix.ncp.ntnx_image_rate_limit_policies_info_v2:
        filter: name eq '{{ policy_name }}_updated'
      register: result

    - name: List image rate limit policies with limit
      nutanix.ncp.ntnx_image_rate_limit_policies_info_v2:
        limit: 1
      register: result

    - name: Delete image rate limit policy
      nutanix.ncp.ntnx_image_rate_limit_policy_v2:
        state: absent
        ext_id: "{{ policy_ext_id }}"
      register: result
