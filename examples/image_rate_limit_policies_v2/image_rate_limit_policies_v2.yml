---
# Summary:
# This playbook will do:
# 1. List all categories and select one for testing
# 2. Create an image rate limit policy with check mode
# 3. Create an image rate limit policy
# 4. Get the image rate limit policy by ext_id
# 5. List all image rate limit policies
# 6. List image rate limit policies with a filter
# 7. Update the image rate limit policy with check mode
# 8. Update the image rate limit policy
# 9. Delete the image rate limit policy with check mode
# 10. Delete the image rate limit policy

- name: Image Rate Limit Policies CRUD playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "10.97.192.208"
      nutanix_username: "admin"
      nutanix_password: "Nutanix.123"
      validate_certs: false
  tasks:
    - name: List all categories and choose the first one
      nutanix.ncp.ntnx_categories_info_v2:
      register: categories_result
      ignore_errors: true

    - name: Verify categories listed successfully
      ansible.builtin.assert:
        that:
          - categories_result.response is defined
          - categories_result.changed == false
          - categories_result.failed == false
          - categories_result.response | length > 0
        fail_msg: "Unable to list categories"
        success_msg: "Categories listed successfully"

    - name: Set category ext_id variable
      ansible.builtin.set_fact:
        category_ext_id: '{{ categories_result["response"][0]["ext_id"] }}'

    - name: Create image rate limit policy - check mode
      nutanix.ncp.ntnx_image_rate_limit_policy_v2:
        state: present
        name: "ansible_rate_limit_policy_example"
        description: "Example rate limit policy created by Ansible"
        rate_limit_kbps: 1024
        cluster_entity_filter:
          type: CATEGORIES_MATCH_ALL
          category_ext_ids:
            - "{{ category_ext_id }}"
        wait: true
      register: check_mode_result
      check_mode: true

    - name: Verify check mode result
      ansible.builtin.debug:
        var: check_mode_result

    - name: Create image rate limit policy
      nutanix.ncp.ntnx_image_rate_limit_policy_v2:
        state: present
        name: "ansible_rate_limit_policy_example"
        description: "Example rate limit policy created by Ansible"
        rate_limit_kbps: 1024
        cluster_entity_filter:
          type: CATEGORIES_MATCH_ALL
          category_ext_ids:
            - "{{ category_ext_id }}"
        wait: true
      register: create_result

    - name: Verify create result
      ansible.builtin.debug:
        var: create_result

    - name: Set policy ext_id
      ansible.builtin.set_fact:
        policy_ext_id: "{{ create_result.ext_id }}"

    - name: Get image rate limit policy by ext_id
      nutanix.ncp.ntnx_image_rate_limit_policies_info_v2:
        ext_id: "{{ policy_ext_id }}"
      register: get_result

    - name: Verify get result
      ansible.builtin.debug:
        var: get_result

    - name: List all image rate limit policies
      nutanix.ncp.ntnx_image_rate_limit_policies_info_v2:
      register: list_result

    - name: Verify list result
      ansible.builtin.debug:
        var: list_result

    - name: List image rate limit policies with filter
      nutanix.ncp.ntnx_image_rate_limit_policies_info_v2:
        filter: "name eq 'ansible_rate_limit_policy_example'"
      register: filter_result

    - name: Verify filter result
      ansible.builtin.debug:
        var: filter_result

    - name: Update image rate limit policy - check mode
      nutanix.ncp.ntnx_image_rate_limit_policy_v2:
        state: present
        ext_id: "{{ policy_ext_id }}"
        name: "ansible_rate_limit_policy_updated"
        description: "Updated rate limit policy"
        rate_limit_kbps: 2048
        cluster_entity_filter:
          type: CATEGORIES_MATCH_ALL
          category_ext_ids:
            - "{{ category_ext_id }}"
        wait: true
      register: update_check_mode_result
      check_mode: true

    - name: Verify update check mode result
      ansible.builtin.debug:
        var: update_check_mode_result

    - name: Update image rate limit policy
      nutanix.ncp.ntnx_image_rate_limit_policy_v2:
        state: present
        ext_id: "{{ policy_ext_id }}"
        name: "ansible_rate_limit_policy_updated"
        description: "Updated rate limit policy"
        rate_limit_kbps: 2048
        cluster_entity_filter:
          type: CATEGORIES_MATCH_ALL
          category_ext_ids:
            - "{{ category_ext_id }}"
        wait: true
      register: update_result

    - name: Verify update result
      ansible.builtin.debug:
        var: update_result

    - name: Delete image rate limit policy - check mode
      nutanix.ncp.ntnx_image_rate_limit_policy_v2:
        state: absent
        ext_id: "{{ policy_ext_id }}"
      register: delete_check_mode_result
      check_mode: true

    - name: Verify delete check mode result
      ansible.builtin.debug:
        var: delete_check_mode_result

    - name: Delete image rate limit policy
      nutanix.ncp.ntnx_image_rate_limit_policy_v2:
        state: absent
        ext_id: "{{ policy_ext_id }}"
        wait: true
      register: delete_result

    - name: Verify delete result
      ansible.builtin.debug:
        var: delete_result
