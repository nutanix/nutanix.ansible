---
# Summary:
# This playbook demonstrates listing effective image rate limit policies:
#
#   1. List all effective rate limit policies
#   2. List effective rate limit policies with a page limit
#   3. Filter effective rate limit policies by clusterExtId
#   4. List all effective rate limit policies with fetch_all
#
- name: Effective rate limit policies info playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: 10.44.76.16
      nutanix_username: admin
      nutanix_password: Nutanix.123
      validate_certs: false
  tasks:
    - name: List all effective rate limit policies
      nutanix.ncp.ntnx_effective_rate_limit_policies_info_v2:
      register: list_result
      ignore_errors: true

    - name: List effective rate limit policies with a page limit
      nutanix.ncp.ntnx_effective_rate_limit_policies_info_v2:
        limit: 1
      register: list_limited_result
      ignore_errors: true

    - name: Filter effective rate limit policies by cluster
      nutanix.ncp.ntnx_effective_rate_limit_policies_info_v2:
        filter: "clusterExtId eq '<cluster_ext_id>'"
      register: list_filtered_result
      ignore_errors: true

    - name: List all effective rate limit policies with fetch_all
      nutanix.ncp.ntnx_effective_rate_limit_policies_info_v2:
        fetch_all: true
      register: list_fetch_all_result
      ignore_errors: true
