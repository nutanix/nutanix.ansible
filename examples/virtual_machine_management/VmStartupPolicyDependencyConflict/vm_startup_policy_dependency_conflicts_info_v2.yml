---
# Summary:
# Example playbook that exercises the ntnx_vm_startup_policy_dependency_conflicts_info_v2 module.
# The VmStartupPolicyDependencyConflict resource is a read-only, derived object surfaced by
# Prism Central for each VM startup policy. It is generated by the platform whenever the
# category-based ordering rules configured on a startup policy produce a circular or
# unsatisfiable dependency chain. This playbook demonstrates:
#   1. Listing all dependency conflicts for a specific VM startup policy
#   2. Listing dependency conflicts with pagination (page/limit)
#   3. Fetching a specific dependency conflict by external ID
#   4. Listing the dependee VMs of a specific dependency conflict
#   5. Listing the dependent VMs of a specific dependency conflict

- name: VM startup policy dependency conflicts info playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting variables
      ansible.builtin.set_fact:
        vm_startup_policy_ext_id: "8c6bc5f3-c18c-4702-4c2d-b769fd5f94b0"
        dependency_conflict_ext_id: "0b0f7f13-3d13-4bfb-9df0-2af1a4a3e21b"

    - name: List all dependency conflicts for a VM startup policy
      nutanix.ncp.ntnx_vm_startup_policy_dependency_conflicts_info_v2:
        vm_startup_policy_ext_id: "{{ vm_startup_policy_ext_id }}"
      register: list_conflicts_result
      ignore_errors: true

    - name: List dependency conflicts with pagination
      nutanix.ncp.ntnx_vm_startup_policy_dependency_conflicts_info_v2:
        vm_startup_policy_ext_id: "{{ vm_startup_policy_ext_id }}"
        page: 0
        limit: 5
      register: paginated_conflicts_result
      ignore_errors: true

    - name: Fetch a specific dependency conflict by external ID
      nutanix.ncp.ntnx_vm_startup_policy_dependency_conflicts_info_v2:
        vm_startup_policy_ext_id: "{{ vm_startup_policy_ext_id }}"
        ext_id: "{{ dependency_conflict_ext_id }}"
      register: conflict_by_id_result
      ignore_errors: true

    - name: List dependee VMs for a specific dependency conflict
      nutanix.ncp.ntnx_vm_startup_policy_dependency_conflicts_info_v2:
        vm_startup_policy_ext_id: "{{ vm_startup_policy_ext_id }}"
        ext_id: "{{ dependency_conflict_ext_id }}"
        fetch_type: dependee_vms
      register: dependee_vms_result
      ignore_errors: true

    - name: List dependent VMs for a specific dependency conflict
      nutanix.ncp.ntnx_vm_startup_policy_dependency_conflicts_info_v2:
        vm_startup_policy_ext_id: "{{ vm_startup_policy_ext_id }}"
        ext_id: "{{ dependency_conflict_ext_id }}"
        fetch_type: dependent_vms
      register: dependent_vms_result
      ignore_errors: true
