---
# Summary:
# This playbook demonstrates the full lifecycle of a Nutanix PC report configuration:
# 1. Create a report configuration with all supported fields.
# 2. Fetch that report configuration by its ext_id.
# 3. List report configurations, optionally with a filter and a limit.
# 4. Update the report configuration with all supported fields.
# 5. Delete the report configuration.
#
# Variables:
#   report_config_name: Name used for the created report configuration.

- name: Report configurations playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting variables
      ansible.builtin.set_fact:
        report_config_name: "ansible_report_config_example"

    - name: Create report configuration with all fields
      nutanix.ncp.ntnx_report_config_v2:
        state: present
        name: "{{ report_config_name }}"
        description: "Full report configuration created by Ansible"
        timezone: "UTC"
        is_private: false
        supported_formats:
          - PDF
          - CSV
        default_section_entity_type: VM
        start_time_offset_secs: 86400
        end_time_offset_secs: 0
        schedule:
          schedule_interval: DAILY
          frequency: 1
          start_time: "2026-01-01T00:00:00Z"
          end_time: "2026-12-31T00:00:00Z"
        retention_config:
          retention_count: 10
        notification_policy:
          recipient_formats:
            - PDF
          recipients:
            - email_address: "reports@example.com"
              recipient_name: "Reports Team"
          email_subject: "Daily VM report"
          email_body: "Please find the attached VM report."
        report_customization:
          header_html: "<h1>VM Report</h1>"
          footer_html: "<footer>Generated by Ansible</footer>"
          css_style_sheet: "body{font-family:Arial;}"
        sections:
          - name: "vm_overview"
            description: "Overview of virtual machines"
            time_filter: CREATED_TIME
            repeat_criteria:
              entity_type: VM
            rows:
              - widgets:
                  - widget_config:
                      entity_type: VM
                      heading: "VM Count"
                      description: "Count of virtual machines"
                      type: COUNT_SUMMARY
                      size: SMALL
                      widget_id: "vm_count_widget"
                      time_filter: CREATED_TIME
                      data_criteria:
                        sort_column: "name"
                        sort_order: ASCENDING
                        limit: 10
                      fields:
                        - label: "Total VMs"
                          name: "vm_count"
                          aggregate_function: COUNT
                          unit: ABSOLUTE
                  - widget_template:
                      widget_template: CLUSTER_INACTIVE_VM_TABLE
      register: create_result

    - name: Get created report configuration
      nutanix.ncp.ntnx_report_configs_info_v2:
        ext_id: "{{ create_result.ext_id }}"
      register: get_result

    - name: List all report configurations
      nutanix.ncp.ntnx_report_configs_info_v2:
      register: list_result

    - name: List report configurations filtered by name
      nutanix.ncp.ntnx_report_configs_info_v2:
        filter: "name eq '{{ report_config_name }}'"
      register: filter_result

    - name: List report configurations with limit
      nutanix.ncp.ntnx_report_configs_info_v2:
        limit: 1
      register: limit_result

    - name: Update report configuration with all fields
      nutanix.ncp.ntnx_report_config_v2:
        state: present
        ext_id: "{{ create_result.ext_id }}"
        name: "{{ report_config_name }}_updated"
        description: "Updated by Ansible"
        timezone: "UTC"
        is_private: true
        supported_formats:
          - PDF
        default_section_entity_type: CLUSTER
        start_time_offset_secs: 172800
        end_time_offset_secs: 3600
        schedule:
          schedule_interval: WEEKLY
          frequency: 2
        retention_config:
          retention_count: 5
        notification_policy:
          recipient_formats:
            - PDF
          recipients:
            - email_address: "ops@example.com"
              recipient_name: "Ops"
          email_subject: "Weekly cluster report"
          email_body: "Weekly cluster report body."
        report_customization:
          header_html: "<h2>Cluster Report</h2>"
          footer_html: "<footer>Updated by Ansible</footer>"
        sections:
          - name: "cluster_overview"
            description: "Overview of clusters"
            time_filter: LAST_OCCURRED_TIME
            repeat_criteria:
              entity_type: CLUSTER
            rows:
              - widgets:
                  - widget_config:
                      entity_type: CLUSTER
                      heading: "Top Clusters"
                      type: DATA_TABLE
                      size: LARGE
                      widget_id: "cluster_table_widget"
                      data_criteria:
                        sort_column: "name"
                        sort_order: DESCENDING
                        limit: 5
      register: update_result

    - name: Delete report configuration
      nutanix.ncp.ntnx_report_config_v2:
        state: absent
        ext_id: "{{ create_result.ext_id }}"
      register: delete_result
