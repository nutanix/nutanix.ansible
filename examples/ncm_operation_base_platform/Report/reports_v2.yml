---
# Summary:
# This playbook demonstrates the ncm_operation_base_platform Report modules end-to-end:
#   1. Look up an existing Report Configuration (prerequisite for generation).
#   2. Generate (create) a Report instance from that configuration.
#   3. Fetch a specific Report by external ID.
#   4. List all Reports and list with filter/limit.
#   5. Delete the generated Report instance.

- name: Reports playbook (opsmgmt v4 - ncm_operation_base_platform / Report)
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip }}"
      nutanix_username: "{{ username }}"
      nutanix_password: "{{ password }}"
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        report_name: "ansible_example_report"
        report_config_ext_id: "aaaaaaaa-1111-2222-3333-444444444444"
        report_start_time: "2026-01-01T00:00:00Z"
        report_end_time: "2026-01-31T23:59:59Z"

    - name: Generate a Report with all attributes (async, waits for task)
      nutanix.ncp.ntnx_report_v2:
        state: present
        name: "{{ report_name }}"
        description: "Report generated by Ansible example playbook"
        config_ext_id: "{{ report_config_ext_id }}"
        start_time: "{{ report_start_time }}"
        end_time: "{{ report_end_time }}"
        is_persistent: true
        timezone: "UTC"
        override_supported_formats:
          - PDF
          - CSV
        recipient_formats:
          - PDF
        recipients:
          - email_address: "ops-lead@example.com"
            recipient_name: "Ops Lead"
        entity_selection:
          entity_type: "VM"
          entity_ext_id:
            - "11111111-2222-3333-4444-555555555555"
      register: create_result
      ignore_errors: true

    - name: Set generated report ext_id
      ansible.builtin.set_fact:
        report_ext_id: "{{ create_result.ext_id | default(create_result.response.ext_id | default('')) }}"
      when: create_result.ext_id is defined or (create_result.response is defined and create_result.response.ext_id is defined)

    - name: Fetch the generated report using ext_id
      nutanix.ncp.ntnx_reports_info_v2:
        ext_id: "{{ report_ext_id }}"
      register: fetch_result
      when: report_ext_id is defined and report_ext_id | length > 0
      ignore_errors: true

    - name: List all reports
      nutanix.ncp.ntnx_reports_info_v2:
      register: list_all_result
      ignore_errors: true

    - name: List reports with filter
      nutanix.ncp.ntnx_reports_info_v2:
        filter: "name eq '{{ report_name }}'"
      register: list_filter_result
      ignore_errors: true

    - name: List reports with limit
      nutanix.ncp.ntnx_reports_info_v2:
        limit: 1
      register: list_limit_result
      ignore_errors: true

    - name: Delete generated report
      nutanix.ncp.ntnx_report_v2:
        state: absent
        ext_id: "{{ report_ext_id }}"
      register: delete_result
      when: report_ext_id is defined and report_ext_id | length > 0
      ignore_errors: true
