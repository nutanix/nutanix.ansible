---
# Summary:
# This playbook will do:
# 1. Create a project with all fields (name, project_id, description)
# 2. Create a project without setting project_id
# 3. Update the project description
# 4. Fetch a project using external ID
# 5. List all projects
# 6. List projects with name filter
# 7. List projects with limit
# 8. Delete the project

- name: Projects playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        project_name: "ansible-example-project"
        project_id: "ansible-example-project-id"
        project_ext_id: "11223344-1234-1111-2222-6788222f17b8"

    ###########################################################
    # CREATE OPERATIONS
    ###########################################################
    - name: Create a project with all fields
      nutanix.ncp.ntnx_project_v2:
        state: present
        name: "{{ project_name }}-full"
        project_id: "{{ project_id }}-full"
        description: "A comprehensive example project created using Ansible"
      register: result
      ignore_errors: true

    - name: Create a project without setting project_id
      nutanix.ncp.ntnx_project_v2:
        state: present
        name: "{{ project_name }}-without-id"
      register: result
      ignore_errors: true

    ###########################################################
    # UPDATE OPERATIONS
    ###########################################################
    - name: Update project description
      nutanix.ncp.ntnx_project_v2:
        state: present
        ext_id: "{{ project_ext_id }}"
        description: "Updated description via Ansible automation"
      register: result
      ignore_errors: true

    ###########################################################
    # INFO OPERATIONS
    ###########################################################
    - name: Fetch project using external ID
      nutanix.ncp.ntnx_projects_info_v2:
        ext_id: "{{ project_ext_id }}"
      register: result
      ignore_errors: true

    - name: List all projects
      nutanix.ncp.ntnx_projects_info_v2:
      register: result
      ignore_errors: true

    - name: List projects with name filter
      nutanix.ncp.ntnx_projects_info_v2:
        filter: "name eq '{{ project_name }}-full'"
      register: result
      ignore_errors: true

    - name: List projects with limit
      nutanix.ncp.ntnx_projects_info_v2:
        limit: 2
      register: result
      ignore_errors: true

    ###########################################################
    # DELETE OPERATIONS
    ###########################################################
    - name: Delete project
      nutanix.ncp.ntnx_project_v2:
        state: absent
        ext_id: "{{ project_ext_id }}"
      register: result
      ignore_errors: true
