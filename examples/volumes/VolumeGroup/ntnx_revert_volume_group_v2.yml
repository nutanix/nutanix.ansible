---
# Summary:
# End-to-end example for the ntnx_revert_volume_group_v2 module.
#
# This playbook demonstrates the full revert workflow:
#   1. Create a Volume Group that will be reverted.
#   2. Create a Volume Group recovery point (via the top-level recovery point API).
#   3. Look up the nested Volume Group recovery point ext_id.
#   4. Update the Volume Group (so we can prove the revert actually rolled state back).
#   5. Revert the Volume Group to the recovery point using
#      nutanix.ncp.ntnx_revert_volume_group_v2.
#   6. Fetch the Volume Group using the info companion nutanix.ncp.not_applicable
#      to confirm the state after the revert.
#   7. Clean up (delete the recovery point and Volume Group).
#
# Prerequisites:
#   * A reachable Nutanix Prism Central and cluster.
#   * The user has permissions to Create / Update / Delete Volume Groups AND
#     to Create / Delete Recovery Points.
#   * The target AOS cluster is auto-discovered by listing clusters connected
#     to Prism Central and picking the first non-PC cluster.

- name: Revert Volume Group playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ lookup('env', 'NUTANIX_HOST') | default('<pc_ip>', true) }}"
      nutanix_username: "{{ lookup('env', 'NUTANIX_USERNAME') | default('<user>', true) }}"
      nutanix_password: "{{ lookup('env', 'NUTANIX_PASSWORD') | default('<pass>', true) }}"
      validate_certs: false
  tasks:
    - name: Setting variables
      ansible.builtin.set_fact:
        vg_name: "ansible-revert-vg-example"
        recovery_point_name: "ansible-revert-rp-example"
        expiration_time: '{{ lookup(''pipe'', ''date -u -d "+1 hour" +%Y-%m-%dT%H:%M:%SZ'') }}'

    - name: Discover AOS cluster to place the Volume Group on
      nutanix.ncp.ntnx_clusters_info_v2:
      register: clusters_result

    - name: Pick the first non-PC cluster
      ansible.builtin.set_fact:
        cluster_ext_id: >-
          {{
            (clusters_result.response
              | selectattr('config', 'defined')
              | selectattr('config.cluster_function', 'defined')
              | rejectattr('config.cluster_function', 'contains', 'PRISM_CENTRAL')
              | list
              | first
            ).ext_id
          }}

    - name: Create Volume Group to be reverted
      nutanix.ncp.ntnx_volume_groups_v2:
        name: "{{ vg_name }}"
        description: "Original VG description (example)"
        cluster_reference: "{{ cluster_ext_id }}"
      register: create_vg
      # sample:
      #   changed: true
      #   failed: false
      #   ext_id: "c9a481c1-b6df-4459-6c93-8ef1a74f05be"
      #   task_ext_id: "ZXJnb24=:ee8d670c-9e15-4eb0-8d91-803d552da1a4"
      #   response:
      #     ext_id: "c9a481c1-b6df-4459-6c93-8ef1a74f05be"
      #     name: "ansible-revert-vg-example"
      #     description: "Original VG description (example)"
      #     cluster_reference: "0006555e-4e63-4a5e-185b-ac1f6b6f97e2"
      #     attachment_type: "NONE"
      #     protocol: "NOT_ASSIGNED"
      #     should_load_balance_vm_attachments: false
      #     target_name: "volumegroup-c9a481c1-b6df-4459-6c93-8ef1a74f05be"

    - name: Store Volume Group ext_id
      ansible.builtin.set_fact:
        vg_ext_id: "{{ create_vg.ext_id }}"

    - name: Create Volume Group recovery point
      nutanix.ncp.ntnx_recovery_points_v2:
        name: "{{ recovery_point_name }}"
        expiration_time: "{{ expiration_time }}"
        recovery_point_type: "CRASH_CONSISTENT"
        volume_group_recovery_points:
          - volume_group_ext_id: "{{ vg_ext_id }}"
      register: create_rp
      # sample:
      #   changed: true
      #   failed: false
      #   ext_id: "f71d77c1-48af-4306-aed9-0aaa1baff649"
      #   task_ext_id: "ZXJnb24=:e752fcc8-2860-4597-95c5-414e0bd772d6"
      #   response:
      #     ext_id: "f71d77c1-48af-4306-aed9-0aaa1baff649"
      #     name: "ansible-revert-rp-example"
      #     creation_time: "2026-07-20T07:55:23.820338+00:00"
      #     expiration_time: "2026-07-20T08:55:18+00:00"
      #     status: "COMPLETE"
      #     recovery_point_type: "CRASH_CONSISTENT"
      #     location_references:
      #       - location_ext_id: "0006555e-4e63-4a5e-185b-ac1f6b6f97e2"
      #     volume_group_recovery_points:
      #       - ext_id: "756ea8a2-3cdf-4369-a768-8dbe5b7e0cc2"
      #         volume_group_ext_id: "c9a481c1-b6df-4459-6c93-8ef1a74f05be"

    - name: Store recovery point ext_ids
      ansible.builtin.set_fact:
        recovery_point_ext_id: "{{ create_rp.ext_id }}"
        vg_recovery_point_ext_id: "{{ create_rp.response.volume_group_recovery_points[0].ext_id }}"

    - name: Update the Volume Group so we can observe the revert rolling changes back
      nutanix.ncp.ntnx_volume_groups_v2:
        ext_id: "{{ vg_ext_id }}"
        name: "{{ vg_name }}"
        description: "Updated VG description (this will be reverted)"
      register: update_vg
      # sample:
      #   changed: true
      #   failed: false
      #   ext_id: "c9a481c1-b6df-4459-6c93-8ef1a74f05be"
      #   task_ext_id: "ZXJnb24=:bdfafb3d-dfcc-4f94-b884-e5b186b30839"
      #   response:
      #     ext_id: "c9a481c1-b6df-4459-6c93-8ef1a74f05be"
      #     name: "ansible-revert-vg-example"
      #     description: "Updated VG description (this will be reverted)"
      #     cluster_reference: "0006555e-4e63-4a5e-185b-ac1f6b6f97e2"

    - name: Revert Volume Group to the recovery point
      nutanix.ncp.ntnx_revert_volume_group_v2:
        ext_id: "{{ vg_ext_id }}"
        volume_group_recovery_point_ext_id: "{{ vg_recovery_point_ext_id }}"
      register: revert_result
      # sample:
      #   changed: true
      #   failed: false
      #   ext_id: "c9a481c1-b6df-4459-6c93-8ef1a74f05be"
      #   task_ext_id: "ZXJnb24=:dc073560-3791-4fed-b40c-651b2addcf1f"
      #   response:
      #     ext_id: "ZXJnb24=:dc073560-3791-4fed-b40c-651b2addcf1f"
      #     status: "SUCCEEDED"
      #     operation: "RevertVolumeGroup"
      #     operation_description: "Revert Volume Group"
      #     progress_percentage: 100
      #     entities_affected:
      #       - ext_id: "756ea8a2-3cdf-4369-a768-8dbe5b7e0cc2"
      #         name: "ansible-revert-rp-example"
      #         rel: "dataprotection:config:volume-group-recovery-point"
      #       - ext_id: "c9a481c1-b6df-4459-6c93-8ef1a74f05be"
      #         name: "ansible-revert-vg-example"
      #         rel: "volumes:config:volume-group"
      #     cluster_ext_ids:
      #       - "0006555e-4e63-4a5e-185b-ac1f6b6f97e2"
      #     started_time: "2026-07-20T07:55:32.194017+00:00"
      #     completed_time: "2026-07-20T07:55:34.297963+00:00"

    - name: Fetch reverted Volume Group using the info companion
      nutanix.ncp.not_applicable:
        ext_id: "{{ vg_ext_id }}"
      register: fetched_vg
      # sample:
      #   changed: false
      #   failed: false
      #   ext_id: "c9a481c1-b6df-4459-6c93-8ef1a74f05be"
      #   response:
      #     ext_id: "c9a481c1-b6df-4459-6c93-8ef1a74f05be"
      #     name: "ansible-revert-vg-example"
      #     description: "Original VG description (example)"
      #     cluster_reference: "0006555e-4e63-4a5e-185b-ac1f6b6f97e2"
      #     sharing_status: "NOT_SHARED"
      #     protocol: "NOT_ASSIGNED"
      #     target_name: "volumegroup-c9a481c1-b6df-4459-6c93-8ef1a74f05be"

    - name: Cleanup - delete the recovery point
      nutanix.ncp.ntnx_recovery_points_v2:
        state: absent
        ext_id: "{{ recovery_point_ext_id }}"
      register: delete_rp
      # sample:
      #   changed: true
      #   failed: false
      #   ext_id: "f71d77c1-48af-4306-aed9-0aaa1baff649"
      #   task_ext_id: "ZXJnb24=:964b77cb-7ab9-4b03-b9eb-660a9eecb395"
      #   response:
      #     status: "SUCCEEDED"
      #     operation: "DeleteRecoveryPoint"
      #     operation_description: "Delete Recovery Point"
      #     progress_percentage: 100

    - name: Cleanup - delete the Volume Group
      nutanix.ncp.ntnx_volume_groups_v2:
        state: absent
        ext_id: "{{ vg_ext_id }}"
      register: delete_vg
      # sample:
      #   changed: true
      #   failed: false
      #   ext_id: "c9a481c1-b6df-4459-6c93-8ef1a74f05be"
      #   task_ext_id: "ZXJnb24=:7314d27a-a6b7-4846-9068-3d09ccfc8473"
      #   response:
      #     status: "SUCCEEDED"
      #     operation: "VolumeGroupDelete"
      #     operation_description: "Delete Volume Group"
      #     progress_percentage: 100
