---
# Summary:
# Prefer examples/Volume_groups_v2/volume_groups_nvmf_clients_v2.yml for the full
# attach / info / detach lifecycle. This playbook covers info-only operations:
#   1. List all NVMe-TCP (NVMf) clients
#   2. List with filter on clusterReference
#   3. List with pagination + ordering
#   4. List with fetch_all
#   5. Fetch a single NVMe-TCP client by external ID

- name: Volumes NVMe-TCP (NVMf) Clients info playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Set variables
      ansible.builtin.set_fact:
        nvmf_client_ext_id: "<nvmf_client_ext_id>"

    - name: List all NVMe-TCP clients across Volume Groups
      nutanix.ncp.ntnx_volume_group_nvmf_clients_info_v2:
      register: all_nvmf_clients
      ignore_errors: true

    - name: List NVMe-TCP clients filtered by clusterReference
      nutanix.ncp.ntnx_volume_group_nvmf_clients_info_v2:
        filter: "clusterReference eq '00061663-9fa0-28ca-185b-ac1f6b6f97e2'"
      register: filtered_nvmf_clients
      ignore_errors: true

    - name: List NVMe-TCP clients with pagination and ordering
      nutanix.ncp.ntnx_volume_group_nvmf_clients_info_v2:
        page: 0
        limit: 5
        orderby: "extId asc"
      register: paged_nvmf_clients
      ignore_errors: true

    - name: List all NVMe-TCP clients with fetch_all
      nutanix.ncp.ntnx_volume_group_nvmf_clients_info_v2:
        fetch_all: true
      register: fetch_all_nvmf_clients
      ignore_errors: true

    - name: Fetch a specific NVMe-TCP client by external ID
      nutanix.ncp.ntnx_volume_group_nvmf_clients_info_v2:
        ext_id: "{{ nvmf_client_ext_id }}"
      register: single_nvmf_client
      ignore_errors: true
