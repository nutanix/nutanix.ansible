---
# Summary:
# This playbook will do:
# 1. Trigger sync for an entity sync policy
# 2. Get an entity sync policy using ext_id
# 3. List all entity sync policies
# 4. List all entity sync policies using filter
# 5. List all entity sync policies using limit

- name: Entity Sync Policy playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        entity_sync_policy_ext_id: "2e40ff57-20aa-4d2b-b179-298db969c20d"

    - name: Trigger sync for an entity sync policy
      nutanix.ncp.ntnx_entity_sync_policy_v2:
        ext_id: "{{ entity_sync_policy_ext_id }}"
      register: result
      ignore_errors: true

    - name: Get an entity sync policy using ext_id
      nutanix.ncp.ntnx_entity_sync_policies_info_v2:
        ext_id: "{{ entity_sync_policy_ext_id }}"
      register: get_result
      ignore_errors: true

    - name: List all entity sync policies
      nutanix.ncp.ntnx_entity_sync_policies_info_v2:
      register: list_result
      ignore_errors: true

    - name: List all entity sync policies using filter
      nutanix.ncp.ntnx_entity_sync_policies_info_v2:
        filter: "entityType eq Datapolicies.Config.SyncedEntityType'SECURITY_POLICY'"
      register: list_result_filter
      ignore_errors: true

    - name: List all entity sync policies using limit
      nutanix.ncp.ntnx_entity_sync_policies_info_v2:
        limit: 1
      register: list_result_limit
      ignore_errors: true
