---
# Summary:
# This playbook will do:
# 1. Fetch Volume Disk stats with minimum params
# 2. Fetch Volume Disk stats with all attributes

- name: Volume Disk Stats Info playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Set variables
      ansible.builtin.set_fact:
        vg_ext_id: "4712a60e-b532-4532-8640-314229495921"

    - name: Get start time (2 hours ago) in extended ISO-8601 format
      ansible.builtin.command: date -u -d "-7200 seconds" +"%Y-%m-%dT%H:%M:%S.%3NZ"
      register: start_time
      changed_when: false

    - name: Get end time (now) in extended ISO-8601 format
      ansible.builtin.command: date -u +"%Y-%m-%dT%H:%M:%S.%3NZ"
      register: end_time
      changed_when: false

    - name: Discover existing Volume Disks
      nutanix.ncp.ntnx_volume_disks_info_v2:
        volume_group_ext_id: "{{ vg_ext_id }}"
        limit: 5
      register: existing_vds

    - name: Pick the first VD
      ansible.builtin.set_fact:
        vd_ext_id: "{{ existing_vds.response[0].ext_id }}"

    - name: Fetch Volume Disk stats with minimum params
      nutanix.ncp.ntnx_volume_disk_stats_info_v2:
        ext_id: "{{ vd_ext_id }}"
        start_time: "{{ start_time.stdout }}"
        end_time: "{{ end_time.stdout }}"
      register: vd_stats_min

    - name: Fetch Volume Disk stats with all attributes
      nutanix.ncp.ntnx_volume_disk_stats_info_v2:
        ext_id: "{{ vd_ext_id }}"
        start_time: "{{ start_time.stdout }}"
        end_time: "{{ end_time.stdout }}"
        sampling_interval: 120
        stat_type: "AVG"
        select: "*"
      register: vd_stats_full

    - name: Show Volume Disk stats
      ansible.builtin.debug:
        var: vd_stats_full.response
