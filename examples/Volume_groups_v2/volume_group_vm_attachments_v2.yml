---
# Summary:
# This playbook will do:
# 1. Attach a new VM to the Volume Group
# 2. Detach the VM from the Volume Group

- name: Volume Group VM Attachments playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        volume_group_ext_id: "0005b6b1-0b3b-4b3b-8b3b-0b3b4b3b4b35"
        vm_ext_id: "0005b6b1-0b3b-4b3b-8b3b-0b3b4b3b4a5d"
        index: 1
      register: result
      ignore_errors: true

    - name: Attach the VM to the Volume Group
      nutanix.ncp.ntnx_volume_group_vm_attachment_v2:
        state: present
        volume_group_ext_id: "{{ volume_group_ext_id }}"
        ext_id: "{{ vm_ext_id }}"
        index: "{{ index }}"
      register: result
      ignore_errors: true

    - name: Set VM external ID
      ansible.builtin.set_fact:
        vm_ext_id: "{{ result.response.ext_id }}"
      register: result
      ignore_errors: true

    - name: Detach the VM from the Volume Group
      nutanix.ncp.ntnx_volume_group_vm_attachment_v2:
        state: absent
        volume_group_ext_id: "{{ volume_group_ext_id }}"
        ext_id: "{{ vm_ext_id }}"
      register: result
      ignore_errors: true
