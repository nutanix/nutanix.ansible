---
# Summary:
# This playbook will do:
# 1. Attach NVMe-TCP client to VG using initiator name
# 2. Fetch specific NVMe-TCP client
# 3. List NVMe-TCP clients with filter / pagination / fetch_all
# 4. Detach NVMe-TCP client from VG

- name: Volume groups NVMe-TCP (NVMf) clients playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Set variables
      ansible.builtin.set_fact:
        vg1_uuid: "<volume_group_ext_id>"
        nvmf_initiator_name: "nqn.2014-08.org.nvmexpress:uuid:ansible-nvmf-test"
        nvmf_client_uuid: "<nvmf_client_ext_id>"

    - name: Attach NVMe-TCP client to VG using initiator name
      nutanix.ncp.ntnx_volume_groups_nvmf_clients_v2:
        volume_group_ext_id: "{{ vg1_uuid }}"
        nvmf_initiator_name: "{{ nvmf_initiator_name }}"
      register: attach_result
      ignore_errors: true

    - name: Fetch specific NVMe-TCP client
      nutanix.ncp.ntnx_volume_group_nvmf_clients_info_v2:
        ext_id: "{{ attach_result.ext_id | default(nvmf_client_uuid) }}"
      register: result
      ignore_errors: true

    - name: List NVMe-TCP clients filtered by clusterReference
      nutanix.ncp.ntnx_volume_group_nvmf_clients_info_v2:
        filter: "clusterReference eq '00061663-9fa0-28ca-185b-ac1f6b6f97e2'"
      register: result
      ignore_errors: true

    - name: List NVMe-TCP clients with pagination and ordering
      nutanix.ncp.ntnx_volume_group_nvmf_clients_info_v2:
        page: 0
        limit: 10
        orderby: "extId asc"
      register: result
      ignore_errors: true

    - name: List all NVMe-TCP clients with fetch_all
      nutanix.ncp.ntnx_volume_group_nvmf_clients_info_v2:
        fetch_all: true
      register: result
      ignore_errors: true

    - name: Detach NVMe-TCP client from VG
      nutanix.ncp.ntnx_volume_groups_nvmf_clients_v2:
        volume_group_ext_id: "{{ vg1_uuid }}"
        ext_id: "{{ attach_result.ext_id | default(nvmf_client_uuid) }}"
        state: absent
      register: result
      ignore_errors: true
