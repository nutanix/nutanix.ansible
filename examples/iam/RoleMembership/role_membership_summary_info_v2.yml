---
# Summary:
# This playbook will do:
# 1. List all role membership summaries
# 2. List role membership summaries with limit
# 3. List role membership summaries with filter

- name: Role Membership Summary info playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: List all role membership summaries
      nutanix.ncp.ntnx_role_membership_summary_info_v2:
      register: result
      ignore_errors: true
      # sample response:
      # "response": []

    - name: List role membership summaries with limit
      nutanix.ncp.ntnx_role_membership_summary_info_v2:
        limit: 5
      register: result
      ignore_errors: true
      # sample response:
      # "response": []

    - name: List role membership summaries with filter
      nutanix.ncp.ntnx_role_membership_summary_info_v2:
        filter: "extId eq '00000000-0000-0000-0000-000000000000'"
      register: result
      ignore_errors: true
      # sample response:
      # "response": []
