---
# Summary:
# This playbook will do:
# 1. Create a role membership for a user (non-default project)
# 2. Create a role membership for a user group (default project)
# 3. Get role membership by external ID
# 4. List all role memberships
# 5. List role memberships with limit
# 6. List role memberships with filter (roleExtId and projectExtId)
# 7. List all role membership summaries
# 8. List all role membership summaries with fetch_all
# 9. List role membership summaries with limit
# 10. List role membership summaries with filter
# 11. Delete the role membership

- name: Role memberships playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        role_ext_id: "93939393-9393-9393-9393-939393939393"
        user_ext_id: "90909090-9090-9090-9090-909090909090"
        user_group_ext_id: "e2dee03b-1234-1111-2222-6788222f17b8"
        identity_provider_uuid: "99999999-9999-9999-9999-999999999999"
        project_ext_id: "44444444-4444-4444-4444-444444444444"
        default_project_ext_id: "00000000-0000-0000-0000-000000000000"
        role_membership_ext_id: "12345678-1234-1234-1234-123456789012"

    - name: Create a role membership for a user with non-default project
      nutanix.ncp.ntnx_role_membership_v2:
        state: present
        role_ext_id: "{{ role_ext_id }}"
        identity_type: "USER"
        identity_ext_id: "{{ user_ext_id }}"
        project_ext_id: "{{ project_ext_id }}"
        scope_template_name: "ProjectsScopeTemplate"
        scope_template_name_values:
          - name: "projectExtId"
            value: "{{ project_ext_id }}"
        idp_ext_id: "{{ identity_provider_uuid }}"
      register: result
      ignore_errors: true

    - name: Create a role membership for a user group with default project
      nutanix.ncp.ntnx_role_membership_v2:
        state: present
        role_ext_id: "{{ role_ext_id }}"
        identity_type: "GROUP"
        identity_ext_id: "{{ user_group_ext_id }}"
        scope_template_name: "ProjectsScopeTemplate"
        scope_template_name_values:
          - name: "projectExtId"
            value: "{{ default_project_ext_id }}"
        idp_ext_id: "{{ identity_provider_uuid }}"
      register: result
      ignore_errors: true

    - name: Get role membership by external ID
      nutanix.ncp.ntnx_role_memberships_info_v2:
        ext_id: "{{ role_membership_ext_id }}"
      register: result
      ignore_errors: true

    - name: List all role memberships
      nutanix.ncp.ntnx_role_memberships_info_v2:
      register: result
      ignore_errors: true

    - name: List role memberships with limit
      nutanix.ncp.ntnx_role_memberships_info_v2:
        limit: 2
      register: result
      ignore_errors: true

    - name: List role memberships with filter by role ext_id and project ext_id
      nutanix.ncp.ntnx_role_memberships_info_v2:
        filter: "roleExtId eq '{{ role_ext_id }}' and projectExtId eq '{{ project_ext_id }}'"
      register: result
      ignore_errors: true

    - name: List all role membership summaries
      nutanix.ncp.ntnx_role_membership_summary_info_v2:
      register: result
      ignore_errors: true

    - name: List all role membership summaries with fetch_all
      nutanix.ncp.ntnx_role_membership_summary_info_v2:
        fetch_all: true
      register: result
      ignore_errors: true

    - name: List role membership summaries with limit
      nutanix.ncp.ntnx_role_membership_summary_info_v2:
        limit: 1
      register: result
      ignore_errors: true

    - name: List role membership summaries with filter on project extId
      nutanix.ncp.ntnx_role_membership_summary_info_v2:
        filter: "extId eq '{{ project_ext_id }}'"
      register: result
      ignore_errors: true

    - name: Delete the role membership
      nutanix.ncp.ntnx_role_membership_v2:
        state: absent
        ext_id: "{{ role_membership_ext_id }}"
      register: result
      ignore_errors: true
