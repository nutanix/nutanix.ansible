---
# Summary:
# This playbook will do:
# 1. List all operations
# 2. List all operations with fetch_all
# 3. List operations using ext id criteria
# 4. List operations using filter criteria

- name: Operations playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        test_permission_uuid: 00000000-0000-0000-0000-000000000001
        test_permission_name: "test_permission"

    - name: List all operations
      nutanix.ncp.ntnx_operations_info_v2:
      register: result
      ignore_errors: true

    - name: List all operations with fetch_all
      nutanix.ncp.ntnx_operations_info_v2:
        fetch_all: true
      register: result
      ignore_errors: true

    - name: List operations using ext_id criteria
      nutanix.ncp.ntnx_operations_info_v2:
        ext_id: "{{ test_permission_uuid }}"
      register: result
      ignore_errors: true

    - name: List operations using filter criteria
      nutanix.ncp.ntnx_operations_info_v2:
        filter: displayName eq '{{ test_permission_name }}'
      register: result
      ignore_errors: true
