---
# Summary:
# This playbook will do:
# 1. Activate a local user
# 2. Deactivate the user

- name: UserState action playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        user_ext_id: "00000000-0000-0000-0000-000000000001"

    - name: Activate user
      nutanix.ncp.ntnx_user_state_v2:
        ext_id: "{{ user_ext_id }}"
        status: ACTIVE
      register: result

    - name: Deactivate user
      nutanix.ncp.ntnx_user_state_v2:
        ext_id: "{{ user_ext_id }}"
        status: INACTIVE
      register: result
