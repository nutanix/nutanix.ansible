---
# Summary:
# This playbook will do:
# 1. Reset the user's password (admin action)
# 2. Change the user's own password (self-serve, authenticate as that user)

- name: UserPassword v4 module playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: 10.101.162.8
      nutanix_username: admin
      nutanix_password: Nutanix.123
      validate_certs: false
  tasks:
    - name: Setting variables
      ansible.builtin.set_fact:
        target_username: "user_ansible_pwd_wlrpqonbdmsk_target"
        starting_password: "OldStrong.Password.123"
        reset_password: "ResetStrong.Password.ffde21ihjsdf"
        changed_password: "ChangedStrong.Password.123gg4f4s4"
        user_ext_id: "c1c53338-59f4-5325-8d88-71a689e65223"

    - name: Reset the user's password (admin action)
      nutanix.ncp.ntnx_user_password_v2:
        state: present
        ext_id: "{{ user_ext_id }}"
        new_password: "{{ reset_password }}"
      register: reset_result

    - name: Debug Reset the user's password result
      ansible.builtin.debug:
        var: reset_result

    - name: Change the user's own password (self-serve, authenticate as that user)
      nutanix.ncp.ntnx_user_password_v2:
        nutanix_username: "{{ target_username }}"
        nutanix_password: "{{ reset_password }}"
        state: present
        username: "{{ target_username }}"
        old_password: "{{ reset_password }}"
        new_password: "{{ changed_password }}"
      register: change_result

    - name: Debug Change the user's own password result
      ansible.builtin.debug:
        var: change_result