---
# Summary:
# This playbook will do:
# 1. Get details of a specific storage backend
# 2. List all storage backends for an object store
# 3. List storage backends with filter
# 4. List storage backends with limit
# 5. List all storage backends with fetch_all

- name: Object store storage backends info playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false

  tasks:
    - name: Set variables
      ansible.builtin.set_fact:
        object_store_ext_id: "<object_store_ext_id>"
        storage_backend_ext_id: "<storage_backend_ext_id>"

    - name: Get details of a storage backend
      nutanix.ncp.ntnx_object_stores_storage_backends_info_v2:
        object_store_ext_id: "{{ object_store_ext_id }}"
        ext_id: "{{ storage_backend_ext_id }}"
      register: result

    - name: List all storage backends for an object store
      nutanix.ncp.ntnx_object_stores_storage_backends_info_v2:
        object_store_ext_id: "{{ object_store_ext_id }}"
      register: result

    - name: List storage backends with filter
      nutanix.ncp.ntnx_object_stores_storage_backends_info_v2:
        object_store_ext_id: "{{ object_store_ext_id }}"
        filter: "isPrimary eq true"
      register: result

    - name: List storage backends with limit
      nutanix.ncp.ntnx_object_stores_storage_backends_info_v2:
        object_store_ext_id: "{{ object_store_ext_id }}"
        limit: 1
      register: result

    - name: List all storage backends with fetch_all
      nutanix.ncp.ntnx_object_stores_storage_backends_info_v2:
        object_store_ext_id: "{{ object_store_ext_id }}"
        fetch_all: true
      register: result
