---
# Summary:
# This playbook exercises the AIOps Capacity Planning Scenario v4 modules end-to-end:
# 1. Create a scenario (with all supported fields populated)
# 2. Get the scenario using its ext_id
# 3. List all scenarios
# 4. List scenarios with a filter
# 5. List scenarios with a limit
# 6. Update the scenario (with all supported fields populated)
# 7. Delete the scenario

- name: AIOps Capacity Planning Scenarios playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        cluster_uuid: "0005f6f4-1c1c-6b3f-0000-0000000abcde"
        scenario_name: "ansible_scenario_demo"

    - name: Create a capacity planning scenario (full spec)
      nutanix.ncp.ntnx_scenario_v2:
        state: present
        name: "{{ scenario_name }}"
        cluster_ext_id: "{{ cluster_uuid }}"
        target_runway_days: 90
        vendors:
          - NUTANIX
          - DELL
        cluster_config:
          data_store_config:
            replication_factor: RF_2
            compression_saving_percent: 20.0
            dedup_saving_percent: 10.0
            erasure_coding_saving_percent: 5.0
            overall_saving_percent: 30.0
            cpu_over_commit_ratio: 4.0
            ram_over_commit_ratio: 1.0
            cpu_reservation_percentage: 10.0
            ram_reservation_percentage: 10.0
            storage_reservation_percentage: 5.0
          node_configs:
            - model: "NX-1065-G7"
              node_count: 3
              is_enabled: true
              node_source: EXISTING
              node_resource_capacity:
                cpu_ghz: 60.0
                ram_gb: 512.0
                hdd_gb: 20000.0
                ssd_gb: 5000.0
                nvme_gb: 0.0
        workloads:
          - schedule_date: "2026-02-01"
            is_enabled: true
            projected_resource_requirement:
              cpu_ghz: 10.0
              ram_gb: 32.0
              hdd_gb: 200.0
              ssd_gb: 100.0
              nvme_gb: 0.0
            workload_properties:
              capacity_update:
                percentage_change: 20
                change_type: INCREASE
      register: created_scenario
      ignore_errors: true

    - name: Set scenario ext_id
      ansible.builtin.set_fact:
        scenario_ext_id: "{{ created_scenario.response.ext_id }}"
      when: created_scenario.response is defined and created_scenario.response.ext_id is defined

    - name: Get scenario using ext_id
      nutanix.ncp.ntnx_scenarios_info_v2:
        ext_id: "{{ scenario_ext_id }}"
      register: fetched_scenario
      ignore_errors: true
      when: scenario_ext_id is defined

    - name: List all scenarios
      nutanix.ncp.ntnx_scenarios_info_v2:
      register: all_scenarios
      ignore_errors: true

    - name: List scenarios with a limit
      nutanix.ncp.ntnx_scenarios_info_v2:
        limit: 1
      register: limited_scenarios
      ignore_errors: true

    - name: Update the scenario (full spec)
      nutanix.ncp.ntnx_scenario_v2:
        state: present
        ext_id: "{{ scenario_ext_id }}"
        name: "{{ scenario_name }}_updated"
        cluster_ext_id: "{{ cluster_uuid }}"
        target_runway_days: 180
        vendors:
          - NUTANIX
        workloads:
          - schedule_date: "2026-03-01"
            is_enabled: true
            workload_properties:
              sql:
                db_count: 4
                profile_type: MEDIUM
                transaction_type: OLTP
                is_business_critical: true
      register: updated_scenario
      ignore_errors: true
      when: scenario_ext_id is defined

    - name: Delete the scenario
      nutanix.ncp.ntnx_scenario_v2:
        state: absent
        ext_id: "{{ scenario_ext_id }}"
      register: deleted_scenario
      ignore_errors: true
      when: scenario_ext_id is defined
