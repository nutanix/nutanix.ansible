---
# Summary:
# This playbook demonstrates every operation exposed by the read-only HostNic v4 API:
#   1. Discover a cluster and one of its hosts to derive parent IDs
#   2. List every host NIC on that host (scoped list)
#   3. Fetch a specific host NIC by external ID (get-by-ID)
#   4. List all host NICs across Prism Central (global list)
#   5. List host NICs with a $filter query
#   6. List host NICs with a $limit query
#
# HostNic is exposed only through GetHostNicById, ListHostNics and
# ListHostNicsByHostId. There is no Create/Update/Delete API — the Ansible
# module `ntnx_cluster_host_nics_info_v2` reflects that surface.

- name: Host NICs info playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ nutanix_host | default('10.44.76.28') }}"
      nutanix_username: "{{ nutanix_username | default('admin') }}"
      nutanix_password: "{{ nutanix_password | default('Nutanix.123') }}"
      validate_certs: "{{ validate_certs | default(false) }}"
  tasks:
    ####################################################################
    # Discover a cluster + host to derive the parent identifiers HostNic
    # get-by-ID and list-by-host operations require.
    ####################################################################
    - name: Fetch the list of clusters registered to Prism Central
      nutanix.ncp.ntnx_clusters_info_v2:
      register: clusters_result

    - name: Pick a Prism Element cluster
      ansible.builtin.set_fact:
        cluster_ext_id: >-
          {{
            (
              clusters_result.response
              | selectattr('config.cluster_function', 'defined')
              | rejectattr('config.cluster_function', 'contains', 'PRISM_CENTRAL')
              | list
              | default(clusters_result.response, true)
            )[0].ext_id
          }}

    - name: Fetch hosts in the chosen cluster
      nutanix.ncp.ntnx_hosts_info_v2:
        cluster_ext_id: "{{ cluster_ext_id }}"
      register: hosts_result

    - name: Pick the first host
      ansible.builtin.set_fact:
        host_ext_id: "{{ hosts_result.response[0].ext_id }}"

    ####################################################################
    # 1. List host NICs on the chosen host (ListHostNicsByHostId)
    ####################################################################
    - name: List every host NIC on the chosen host
      nutanix.ncp.ntnx_cluster_host_nics_info_v2:
        cluster_ext_id: "{{ cluster_ext_id }}"
        host_ext_id: "{{ host_ext_id }}"
      register: host_nics_by_host

    - name: Pick a host NIC ext_id for the get-by-ID example
      ansible.builtin.set_fact:
        host_nic_ext_id: "{{ host_nics_by_host.response[0].ext_id }}"

    ####################################################################
    # 2. Get a single host NIC by ext_id (GetHostNicById)
    ####################################################################
    - name: Fetch a specific host NIC using ext_id, cluster_ext_id and host_ext_id
      nutanix.ncp.ntnx_cluster_host_nics_info_v2:
        cluster_ext_id: "{{ cluster_ext_id }}"
        host_ext_id: "{{ host_ext_id }}"
        ext_id: "{{ host_nic_ext_id }}"
      register: host_nic

    ####################################################################
    # 3. Global list of host NICs (ListHostNics)
    ####################################################################
    - name: List all host NICs across Prism Central
      nutanix.ncp.ntnx_cluster_host_nics_info_v2:
      register: all_host_nics

    ####################################################################
    # 4. List with $filter — filter by NIC name
    ####################################################################
    - name: List host NICs with a filter
      nutanix.ncp.ntnx_cluster_host_nics_info_v2:
        filter: "name eq '{{ host_nics_by_host.response[0].name }}'"
      register: filtered_host_nics

    ####################################################################
    # 5. List with $limit — cap the page size to 1
    ####################################################################
    - name: List host NICs with a limit of 1
      nutanix.ncp.ntnx_cluster_host_nics_info_v2:
        limit: 1
      register: limited_host_nics
