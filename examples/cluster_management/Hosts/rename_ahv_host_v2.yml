---
# Summary:
# This playbook will rename the AHV host

- name: Rename AHV host example playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip }}"
      nutanix_username: "{{ username }}"
      nutanix_password: "{{ password }}"
      validate_certs: false
  tasks:
    - name: Set variables for rename operation
      ansible.builtin.set_fact:
        cluster_ext_id: "0006361b-6855-3644-7458-2268f8ffb2bd"
        host_ext_id: "af49a0bb-b3d7-41c0-b9c2-f4ca0e8763e9"

    - name: Rename AHV host
      nutanix.ncp.ntnx_rename_ahv_host_v2:
        cluster_ext_id: "{{ cluster_ext_id }}"
        host_ext_id: "{{ host_ext_id }}"
        name: "renamed-ahv-host-01"
      register: result
      ignore_errors: true

    - name: Print rename result
      ansible.builtin.debug:
        var: result
