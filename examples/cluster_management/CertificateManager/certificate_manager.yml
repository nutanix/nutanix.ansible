---
# Summary:
# This playbook demonstrates CRUD operations for Cluster Certificate v4
# modules in the clustermgmt namespace, including info get/list.
# All operations target Prism Central (PC).
# It will do:
# 1. Add a Certificate to a cluster
# 2. Get a Certificate using ext_id
# 3. List all Certificates on a cluster
# 4. Delete a Certificate

- name: Cluster Certificate playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ lookup('env', 'NUTANIX_HOST') }}"
      nutanix_username: "{{ lookup('env', 'NUTANIX_USERNAME') }}"
      nutanix_password: "{{ lookup('env', 'NUTANIX_PASSWORD') }}"
      nutanix_port: "{{ lookup('env', 'NUTANIX_PORT') }}"
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        cluster_ext_id: "00061fa4-ef93-7dd8-185b-ac1f6b6f97e2"

    - name: Add a Certificate to a cluster
      nutanix.ncp.ntnx_cluster_certificate_v2:
        state: present
        cluster_ext_id: "{{ cluster_ext_id }}"
        certificate: "{{ certificate_base64 }}"
        certificate_chain: "{{ certificate_chain_base64 }}"
        private_key: "{{ private_key_base64 }}"
        csr_ext_id: "7c6bc5f3-c18c-4702-4c2d-b769fd5f94b0"
        description: "Certificate added by Ansible"
        purpose: "SERVER_AUTH"
      register: certificate_result
      ignore_errors: true

    - name: Set Certificate ext_id
      ansible.builtin.set_fact:
        certificate_ext_id: "{{ certificate_result.ext_id }}"
      when:
        - certificate_result.ext_id is defined
        - certificate_result.ext_id

    - name: Get a Certificate using ext_id
      nutanix.ncp.ntnx_cluster_certificate_info_v2:
        cluster_ext_id: "{{ cluster_ext_id }}"
        ext_id: "{{ certificate_ext_id }}"
      register: result
      ignore_errors: true
      when: certificate_ext_id is defined

    - name: List all Certificates on a cluster
      nutanix.ncp.ntnx_cluster_certificate_info_v2:
        cluster_ext_id: "{{ cluster_ext_id }}"
      register: result
      ignore_errors: true

    - name: List Certificates with filter
      nutanix.ncp.ntnx_cluster_certificate_info_v2:
        cluster_ext_id: "{{ cluster_ext_id }}"
        filter: "purpose eq 'SERVER_AUTH'"
      register: result
      ignore_errors: true

    - name: Delete a Certificate
      nutanix.ncp.ntnx_cluster_certificate_v2:
        state: absent
        cluster_ext_id: "{{ cluster_ext_id }}"
        ext_id: "{{ certificate_ext_id }}"
      register: result
      ignore_errors: true
      when: certificate_ext_id is defined
