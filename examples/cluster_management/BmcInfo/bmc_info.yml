---
# Summary:
# BMC (Baseboard Management Controller) info playbook — demonstrates the two
# operations the v4 clustermgmt BMC API exposes:
#   1. Fetch BMC info for a host in a cluster
#   2. Update BMC credentials for the same host
#
# The BMC info resource is a sub-resource of a host in a cluster. There is
# no create or delete operation on this resource — only Get and Update.
# On update, only credential is writable; ip_address and status are read-only.
#
# Note: the BMC endpoint may return HTTP 503 "Grpc server unavailable"
# on smaller PC deployments (documented in Nutanix' QA "clustermgmt v4 API
# Coverage" page). The example uses `ignore_errors: true` so that a 503 on
# such deployments does not stop the whole playbook; on a Large/X-Large PC
# with AOS 7.0+ the same tasks return live BMC info and drive an update.

- name: BmcInfo playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip }}"
      nutanix_username: "{{ username }}"
      nutanix_password: "{{ password }}"
      validate_certs: false
  tasks:
    - name: Discover a cluster to work with
      nutanix.ncp.ntnx_clusters_info_v2:
        filter: "config/clusterFunction/any(f:f eq Clustermgmt.Config.ClusterFunctionRef'AOS')"
      register: clusters_info

    - name: Pick the first AOS cluster
      ansible.builtin.set_fact:
        cluster_ext_id: "{{ clusters_info.response[0].ext_id }}"

    - name: Discover a host in that cluster
      nutanix.ncp.ntnx_hosts_info_v2:
        cluster_ext_id: "{{ cluster_ext_id }}"
      register: hosts_info

    - name: Pick the first host as the target
      ansible.builtin.set_fact:
        host_ext_id: "{{ hosts_info.response[0].ext_id }}"

    - name: Fetch BMC info for a host
      nutanix.ncp.ntnx_cluster_bmc_info_v2:
        cluster_ext_id: "{{ cluster_ext_id }}"
        ext_id: "{{ host_ext_id }}"
      register: bmc_info_before
      ignore_errors: true

    - name: Update BMC credential for a host
      nutanix.ncp.ntnx_cluster_bmc_v2:
        state: present
        cluster_ext_id: "{{ cluster_ext_id }}"
        ext_id: "{{ host_ext_id }}"
        credential:
          username: "ADMIN"
          password: "SuperSecret.123"
      register: bmc_update_result
      ignore_errors: true
