---
# Summary:
# This playbook will do:
# 1. Create a content repository
# 2. Update the content repository description
# 3. Fetch a content repository using external ID
# 4. List all content repositories
# 5. List content repositories with name filter
# 6. List content repositories with limit
# 7. List content repository items
# 8. Subscribe to a source content repository (requires paired domains)
# 9. Sync items of a subscribed content repository
# 10. Migrate an image to a content repository
# 11. Delete the content repository

- name: Content repositories playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        content_repo_name: "ansible-example-content-repo"
        project_ext_id: "00000000-0000-0000-0000-000000000000"
        content_repo_ext_id: "7a8b9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d"
        source_domain_manager_ext_id: "11111111-1111-1111-1111-111111111111"
        image_ext_id: "015e6709-d4a6-44bd-8df7-9898f062635b"

    ###########################################################
    # CREATE OPERATIONS
    ###########################################################
    - name: Create a content repository
      nutanix.ncp.ntnx_content_repository_v2:
        state: present
        name: "{{ content_repo_name }}"
        description: "A content repository created using Ansible"
        project_ext_id: "{{ project_ext_id }}"
      register: result
      ignore_errors: true

    - name: Save content repository ext_id
      ansible.builtin.set_fact:
        content_repo_ext_id: "{{ result.ext_id }}"
      when: result.ext_id is defined

    ###########################################################
    # UPDATE OPERATIONS
    ###########################################################
    - name: Update content repository description
      nutanix.ncp.ntnx_content_repository_v2:
        state: present
        ext_id: "{{ content_repo_ext_id }}"
        name: "{{ content_repo_name }}"
        description: "Updated description via Ansible automation"
      register: result
      ignore_errors: true

    ###########################################################
    # INFO OPERATIONS
    ###########################################################
    - name: Fetch content repository using external ID
      nutanix.ncp.ntnx_content_repositories_info_v2:
        ext_id: "{{ content_repo_ext_id }}"
      register: result
      ignore_errors: true

    - name: List all content repositories
      nutanix.ncp.ntnx_content_repositories_info_v2:
      register: result
      ignore_errors: true

    - name: List content repositories with name filter
      nutanix.ncp.ntnx_content_repositories_info_v2:
        filter: "name eq '{{ content_repo_name }}'"
      register: result
      ignore_errors: true

    - name: List content repositories with limit
      nutanix.ncp.ntnx_content_repositories_info_v2:
        limit: 5
      register: result
      ignore_errors: true

    - name: List content repository items
      nutanix.ncp.ntnx_content_repository_items_info_v2:
        ext_id: "{{ content_repo_ext_id }}"
      register: result
      ignore_errors: true

    ###########################################################
    # SUBSCRIBE / SYNC / MIGRATE
    ###########################################################
    - name: Subscribe to a source content repository
      nutanix.ncp.ntnx_content_repository_subscribe_v2:
        ext_id: "{{ content_repo_ext_id }}"
        source_domain_manager_ext_id: "{{ source_domain_manager_ext_id }}"
        project_ext_id: "{{ project_ext_id }}"
      register: result
      ignore_errors: true

    - name: Sync items of a subscribed content repository
      nutanix.ncp.ntnx_content_repository_sync_v2:
        ext_id: "{{ content_repo_ext_id }}"
      register: result
      ignore_errors: true

    - name: Migrate an image to a content repository
      nutanix.ncp.ntnx_images_migrate_v2:
        image_ext_id: "{{ image_ext_id }}"
        content_repository_ext_id: "{{ content_repo_ext_id }}"
      register: result
      ignore_errors: true

    ###########################################################
    # DELETE OPERATIONS
    ###########################################################
    - name: Delete content repository
      nutanix.ncp.ntnx_content_repository_v2:
        state: absent
        ext_id: "{{ content_repo_ext_id }}"
      register: result
      ignore_errors: true
