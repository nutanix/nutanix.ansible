---
# Summary:
# This playbook will do:
# 1. Create a Guest Reboot Policy with immediate reboot schedule
# 2. Create a Guest Reboot Policy with later reboot schedule
# 3. Get Guest Reboot Policy using ext_id
# 4. List all Guest Reboot Policies
# 5. List all Guest Reboot Policies with fetch_all
# 6. List Guest Reboot Policies with filter
# 7. List Guest Reboot Policies with limit
# 8. Update Guest Reboot Policy (name, description and reboot schedule)
# 9. Delete Guest Reboot Policies

- name: Guest Reboot Policies playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        category_ext_id_1: "6e50299a-b7c9-5c5c-9faf-246ee249c597"
        category_ext_id_2: "342d6f64-87c3-5c22-9aef-cf54b5fbdce4"
        immediate_policy_name: "guest_reboot_policy_immediate_ansible"
        later_policy_name: "guest_reboot_policy_later_ansible"

    - name: Create a Guest Reboot Policy with immediate reboot schedule
      nutanix.ncp.ntnx_guest_reboot_policy_v2:
        state: present
        name: "{{ immediate_policy_name }}"
        description: "Guest Reboot Policy with immediate schedule created by Ansible"
        categories:
          - ext_id: "{{ category_ext_id_1 }}"
        reboot_schedule:
          immediate: {}
        wait: true
      register: result
      ignore_errors: true

    - name: Set immediate Guest Reboot Policy ext_id
      ansible.builtin.set_fact:
        immediate_policy_ext_id: "{{ result.ext_id }}"

    - name: Create a Guest Reboot Policy with later reboot schedule
      nutanix.ncp.ntnx_guest_reboot_policy_v2:
        state: present
        name: "{{ later_policy_name }}"
        description: "Guest Reboot Policy with later schedule created by Ansible"
        categories:
          - ext_id: "{{ category_ext_id_1 }}"
          - ext_id: "{{ category_ext_id_2 }}"
        reboot_schedule:
          later:
            day_of_week: SUNDAY
            time_of_day: "02:30"
        wait: true
      register: result
      ignore_errors: true

    - name: Set later Guest Reboot Policy ext_id
      ansible.builtin.set_fact:
        later_policy_ext_id: "{{ result.ext_id }}"

    - name: Get Guest Reboot Policy using ext_id
      nutanix.ncp.ntnx_guest_reboot_policies_info_v2:
        ext_id: "{{ later_policy_ext_id }}"
      register: result
      ignore_errors: true

    - name: Print Guest Reboot Policy details
      ansible.builtin.debug:
        msg: "{{ result.response }}"

    - name: List all Guest Reboot Policies
      nutanix.ncp.ntnx_guest_reboot_policies_info_v2:
      register: result
      ignore_errors: true

    - name: Print the number of Guest Reboot Policies
      ansible.builtin.debug:
        msg: "Total Guest Reboot Policies: {{ result.total_available_results }}"

    - name: List all Guest Reboot Policies with fetch_all
      nutanix.ncp.ntnx_guest_reboot_policies_info_v2:
        fetch_all: true
      register: result
      ignore_errors: true

    - name: Print the number of Guest Reboot Policies fetched with fetch_all
      ansible.builtin.debug:
        msg: "Fetched {{ result.response | length }} of {{ result.total_available_results }} Guest Reboot Policies"

    - name: List Guest Reboot Policies with filter
      nutanix.ncp.ntnx_guest_reboot_policies_info_v2:
        filter: "name eq '{{ later_policy_name }}'"
      register: result
      ignore_errors: true

    - name: Print filtered Guest Reboot Policies
      ansible.builtin.debug:
        msg: "{{ result.response }}"

    - name: List Guest Reboot Policies with limit
      nutanix.ncp.ntnx_guest_reboot_policies_info_v2:
        limit: 1
      register: result
      ignore_errors: true

    - name: Print Guest Reboot Policies fetched with limit
      ansible.builtin.debug:
        msg: "{{ result.response }}"

    - name: Update Guest Reboot Policy name, description and reboot schedule
      nutanix.ncp.ntnx_guest_reboot_policy_v2:
        state: present
        ext_id: "{{ later_policy_ext_id }}"
        name: "{{ later_policy_name }}_updated"
        description: "Guest Reboot Policy updated by Ansible"
        reboot_schedule:
          later:
            day_of_week: FRIDAY
            time_of_day: "23:00"
        wait: true
      register: result
      ignore_errors: true

    - name: Update the immediate Guest Reboot Policy to a later reboot schedule
      nutanix.ncp.ntnx_guest_reboot_policy_v2:
        state: present
        ext_id: "{{ immediate_policy_ext_id }}"
        reboot_schedule:
          later:
            day_of_week: MONDAY
            time_of_day: "06:15"
        wait: true
      register: result
      ignore_errors: true

    - name: Delete the immediate Guest Reboot Policy
      nutanix.ncp.ntnx_guest_reboot_policy_v2:
        state: absent
        ext_id: "{{ immediate_policy_ext_id }}"
        wait: true
      register: result
      ignore_errors: true

    - name: Delete the later Guest Reboot Policy
      nutanix.ncp.ntnx_guest_reboot_policy_v2:
        state: absent
        ext_id: "{{ later_policy_ext_id }}"
        wait: true
      register: result
      ignore_errors: true
