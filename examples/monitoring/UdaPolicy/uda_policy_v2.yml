---
# Summary:
# This playbook demonstrates managing Nutanix Prism Central User-Defined Alert
# (UDA) policies via the v4 API-based Ansible modules:
# 1. Create a User-Defined Alert policy (with all attributes)
# 2. Update the User-Defined Alert policy (with all attributes)
# 3. Get the policy details using ext_id
# 4. List all User-Defined Alert policies
# 5. List User-Defined Alert policies with filter
# 6. List User-Defined Alert policies with limit
# 7. Delete the User-Defined Alert policy

- name: User-Defined Alert (UDA) Policy playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ lookup('env', 'NUTANIX_HOST') | default('<pc_ip>', true) }}"
      nutanix_username: "{{ lookup('env', 'NUTANIX_USERNAME') | default('<user>', true) }}"
      nutanix_password: "{{ lookup('env', 'NUTANIX_PASSWORD') | default('<pass>', true) }}"
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        uda_policy_title: "vm_high_cpu_uda_policy_ansible"

    - name: Fetch a Prism Element cluster to scope the UDA policy
      nutanix.ncp.ntnx_clusters_info_v2:
      register: clusters_info

    - name: Pick the first PE cluster ext_id
      ansible.builtin.set_fact:
        target_cluster_ext_id: >-
          {{ (clusters_info.response
              | rejectattr('config.cluster_function', 'contains', 'PRISM_CENTRAL')
              | list
              | default(clusters_info.response, true)
              | first).ext_id }}

    - name: Create User-Defined Alert policy (all attributes)
      nutanix.ncp.ntnx_uda_policy_v2:
        state: present
        title: "{{ uda_policy_title }}"
        description: "Trigger critical alert when cluster CPU usage exceeds 90%"
        is_enabled: true
        is_auto_resolved: true
        is_expected_to_error_on_conflict: false
        entity_type: "cluster"
        trigger_wait_period: 600
        impact_types:
          - PERFORMANCE
          - CPU_CAPACITY
        filters:
          group_filters:
            - ext_id: "{{ target_cluster_ext_id }}"
              type: CLUSTER
        trigger_conditions:
          - condition_type: STATIC_THRESHOLD
            severity_level: CRITICAL
            condition:
              metric_name: "hypervisor_cpu_usage_ppm"
              operator: GREATER_THAN
              threshold_value:
                int_value: 900000
      register: create_result

    - name: Set UDA policy ext_id
      ansible.builtin.set_fact:
        uda_policy_ext_id: "{{ create_result.ext_id }}"

    - name: Update User-Defined Alert policy (all attributes)
      nutanix.ncp.ntnx_uda_policy_v2:
        state: present
        ext_id: "{{ uda_policy_ext_id }}"
        title: "{{ uda_policy_title }}_updated"
        description: "Trigger warning alert when cluster CPU usage exceeds 80%"
        is_enabled: true
        is_auto_resolved: true
        is_expected_to_error_on_conflict: false
        entity_type: "cluster"
        trigger_wait_period: 900
        impact_types:
          - PERFORMANCE
        filters:
          group_filters:
            - ext_id: "{{ target_cluster_ext_id }}"
              type: CLUSTER
        trigger_conditions:
          - condition_type: STATIC_THRESHOLD
            severity_level: WARNING
            condition:
              metric_name: "hypervisor_cpu_usage_ppm"
              operator: GREATER_THAN
              threshold_value:
                int_value: 800000
      register: update_result

    - name: Get User-Defined Alert policy using ext_id
      nutanix.ncp.ntnx_uda_policies_info_v2:
        ext_id: "{{ uda_policy_ext_id }}"
      register: single_result

    - name: List all User-Defined Alert policies
      nutanix.ncp.ntnx_uda_policies_info_v2:
      register: list_all_result

    - name: List User-Defined Alert policies with filter
      nutanix.ncp.ntnx_uda_policies_info_v2:
        filter: "title eq '{{ uda_policy_title }}_updated'"
      register: filtered_result

    - name: List User-Defined Alert policies with limit
      nutanix.ncp.ntnx_uda_policies_info_v2:
        limit: 1
      register: limited_result

    - name: Delete User-Defined Alert policy
      nutanix.ncp.ntnx_uda_policy_v2:
        state: absent
        ext_id: "{{ uda_policy_ext_id }}"
      register: delete_result
