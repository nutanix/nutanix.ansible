---
# Summary:
# This playbook demonstrates how to run a Test Failover on a Recovery Plan.
#
# A Test Failover recovers the protected entities (VMs, Volume Groups) of a
# Recovery Plan on the target/recovery site in an isolated test environment
# without disrupting the production entities on the primary site.
#
# NOTE: This playbook MUST be executed against the target/recovery Prism
# Central (i.e. the PC that will host the recovered test entities).

- name: Test Failover Recovery Plan playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false

  tasks:
    - name: Set variables for the Test Failover
      ansible.builtin.set_fact:
        recovery_plan_ext_id: "0005c0ef-b0f4-40b6-a5a1-2a5a2a5a2a5a"
        source_domain_manager_ext_id: "d4d3f6d5-1111-2222-3333-4444d3f6d5c3"
        target_domain_manager_ext_id: "d4d3f6d5-5555-6666-7777-8888d3f6d5c3"
        source_cluster_ext_id: "000647b8-ddb3-6bbb-0000-000000028f57"
        target_cluster_ext_id: "000647b8-ddb3-6bbb-0000-000000028f58"

    - name: Test Failover Recovery Plan across different domain managers
      nutanix.ncp.ntnx_test_failover_recovery_plan_v2:
        ext_id: "{{ recovery_plan_ext_id }}"
        name: "ansible-test-failover-job"
        should_ignore_warnings: true
        is_instant_restore: false
        failover_directions:
          - source_domain_manager_ext_id: "{{ source_domain_manager_ext_id }}"
            target_domain_manager_ext_id: "{{ target_domain_manager_ext_id }}"
      register: test_failover_diff_pc
      ignore_errors: true

    - name: Test Failover Recovery Plan within the same domain manager (with cluster refs)
      nutanix.ncp.ntnx_test_failover_recovery_plan_v2:
        ext_id: "{{ recovery_plan_ext_id }}"
        name: "ansible-test-failover-same-pc"
        should_ignore_warnings: false
        is_instant_restore: true
        failover_directions:
          - source_domain_manager_ext_id: "{{ source_domain_manager_ext_id }}"
            source_cluster:
              ext_id: "{{ source_cluster_ext_id }}"
            target_domain_manager_ext_id: "{{ source_domain_manager_ext_id }}"
            target_cluster:
              ext_id: "{{ target_cluster_ext_id }}"
      register: test_failover_same_pc
      ignore_errors: true
