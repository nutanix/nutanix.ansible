---
# Summary:
# This playbook demonstrates fetching execution steps of a recovery plan job:
#   1. List all execution steps for a recovery plan job (mandatory parent id)
#   2. List execution steps with a page size limit
#   3. List execution steps ordered by start time in descending order
#   4. List execution steps filtered by phase
#
# The `recovery_plan_job_ext_id` variable MUST point at an existing Recovery
# Plan Job (e.g. one produced by triggering a planned/unplanned/test failover
# on a Recovery Plan). Execution steps are auto-generated by the platform
# when a job runs; they cannot be created, updated or deleted directly.

- name: ExecutionStepsByRecoveryPlanJobId playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ nutanix_host | default(lookup('env', 'NUTANIX_HOST')) }}"
      nutanix_username: "{{ nutanix_username | default(lookup('env', 'NUTANIX_USERNAME')) }}"
      nutanix_password: "{{ nutanix_password | default(lookup('env', 'NUTANIX_PASSWORD')) }}"
      nutanix_port: "{{ nutanix_port | default(lookup('env', 'NUTANIX_PORT') | default(9440, true)) }}"
      validate_certs: false

  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        recovery_plan_job_ext_id: "{{ recovery_plan_job_ext_id | default('8c80727e-8fd7-4c00-83c7-ef0e55b7b236') }}"

    - name: List all execution steps of a recovery plan job
      nutanix.ncp.ntnx_execution_steps_by_recovery_plan_job_ids_info_v2:
        recovery_plan_job_ext_id: "{{ recovery_plan_job_ext_id }}"
      register: all_steps
      ignore_errors: true

    - name: Print all execution steps
      ansible.builtin.debug:
        var: all_steps

    - name: List execution steps of a recovery plan job with limit
      nutanix.ncp.ntnx_execution_steps_by_recovery_plan_job_ids_info_v2:
        recovery_plan_job_ext_id: "{{ recovery_plan_job_ext_id }}"
        limit: 1
      register: limited_steps
      ignore_errors: true

    - name: Print limited execution steps
      ansible.builtin.debug:
        var: limited_steps

    - name: List execution steps of a recovery plan job ordered by start time descending
      nutanix.ncp.ntnx_execution_steps_by_recovery_plan_job_ids_info_v2:
        recovery_plan_job_ext_id: "{{ recovery_plan_job_ext_id }}"
        orderby: "startTime desc"
      register: ordered_steps
      ignore_errors: true

    - name: Print ordered execution steps
      ansible.builtin.debug:
        var: ordered_steps

    - name: List execution steps of a recovery plan job with page and limit
      nutanix.ncp.ntnx_execution_steps_by_recovery_plan_job_ids_info_v2:
        recovery_plan_job_ext_id: "{{ recovery_plan_job_ext_id }}"
        page: 0
        limit: 5
      register: paged_steps
      ignore_errors: true

    - name: Print paged execution steps
      ansible.builtin.debug:
        var: paged_steps
