---
# Example playbook for the ntnx_validation_errors_by_recovery_plan_job_ids_info_v2 module.
#
# The module lists the validation errors and warnings generated by a Recovery
# Plan Job during its pre-execution checks. The parent Recovery Plan Job
# external ID is required; optional pagination / OData filter / OData orderby
# knobs mirror those exposed by the Nutanix Data Protection v4 REST API.
#
# Connection parameters are set once via `module_defaults` so individual tasks
# do not need to repeat credentials. Provide the Recovery Plan Job external ID
# either through inventory / `-e` (variable `rpj_ext_id`) or by exporting the
# `NUTANIX_RECOVERY_PLAN_JOB_EXT_ID` environment variable.

- name: Nutanix - ValidationErrorsByRecoveryPlanJobId v4 examples
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ lookup('env', 'NUTANIX_HOST') }}"
      nutanix_username: "{{ lookup('env', 'NUTANIX_USERNAME') }}"
      nutanix_password: "{{ lookup('env', 'NUTANIX_PASSWORD') }}"
      nutanix_port: "{{ lookup('env', 'NUTANIX_PORT') | default(9440, true) }}"
      validate_certs: false
  vars:
    rpj_ext_id: "{{ lookup('env', 'NUTANIX_RECOVERY_PLAN_JOB_EXT_ID') }}"
  tasks:
    - name: List all validation errors for a Recovery Plan Job
      nutanix.ncp.ntnx_validation_errors_by_recovery_plan_job_ids_info_v2:
        recovery_plan_job_ext_id: "{{ rpj_ext_id }}"
      register: all_validation_errors
      ignore_errors: true

    - name: List validation errors with a page size limit
      nutanix.ncp.ntnx_validation_errors_by_recovery_plan_job_ids_info_v2:
        recovery_plan_job_ext_id: "{{ rpj_ext_id }}"
        limit: 5
        page: 0
      register: limited_validation_errors
      ignore_errors: true

    - name: List validation errors ordered by external ID (descending)
      nutanix.ncp.ntnx_validation_errors_by_recovery_plan_job_ids_info_v2:
        recovery_plan_job_ext_id: "{{ rpj_ext_id }}"
        orderby: "extId desc"
      register: ordered_validation_errors
      ignore_errors: true

    - name: Fetch a single validation error by its external ID using an OData filter
      nutanix.ncp.ntnx_validation_errors_by_recovery_plan_job_ids_info_v2:
        recovery_plan_job_ext_id: "{{ rpj_ext_id }}"
        filter: "extId eq '00000000-0000-0000-0000-000000000000'"
      register: filtered_validation_error
      ignore_errors: true
