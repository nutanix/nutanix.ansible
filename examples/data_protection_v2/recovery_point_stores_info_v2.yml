---
# Summary:
# This playbook will do:
# 1. Get recovery point store using external ID
# 2. List all recovery point stores
# 3. List recovery point stores with filter on name
# 4. List recovery point stores with limit
# 5. List all recovery point stores with fetch_all

- name: Recovery Point Stores info playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false

  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        recovery_point_store_ext_id: "2bb43b2f-488c-4422-8e56-4f4866bf768c"
        recovery_point_store_name: "MyRecoveryPointStore_1"

    - name: Get recovery point store using external ID
      nutanix.ncp.ntnx_recovery_point_stores_info_v2:
        ext_id: "{{ recovery_point_store_ext_id }}"
      register: result
      ignore_errors: true

    - name: Print the result
      ansible.builtin.debug:
        var: result

    - name: List all recovery point stores
      nutanix.ncp.ntnx_recovery_point_stores_info_v2:
      register: result
      ignore_errors: true

    - name: Print the result
      ansible.builtin.debug:
        var: result

    - name: List recovery point stores with filter on name
      nutanix.ncp.ntnx_recovery_point_stores_info_v2:
        filter: "name eq '{{ recovery_point_store_name }}'"
      register: result
      ignore_errors: true

    - name: Print the result
      ansible.builtin.debug:
        var: result

    - name: List recovery point stores with limit
      nutanix.ncp.ntnx_recovery_point_stores_info_v2:
        limit: 1
      register: result
      ignore_errors: true

    - name: Print the result
      ansible.builtin.debug:
        var: result

    - name: List all recovery point stores with fetch_all
      nutanix.ncp.ntnx_recovery_point_stores_info_v2:
        fetch_all: true
      register: result
      ignore_errors: true

    - name: Print the result
      ansible.builtin.debug:
        var: result
