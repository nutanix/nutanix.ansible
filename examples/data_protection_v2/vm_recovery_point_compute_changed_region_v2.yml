---
# Summary:
# This playbook will compute changed regions for a VM disk recovery point

- name: VM Recovery Point Compute Changed Region playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false

  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        recovery_point_ext_id: "1ca2963d-77b6-453a-ae23-2c19e7a954a3"
        vm_recovery_point_ext_id: "522670d7-e92d-45c5-9139-76ccff6813c2"
        disk_recovery_point_ext_id: "21d467f0-ccef-4733-91cc-f04db58a92eb"
        reference_recovery_point_ext_id: "0bc9d9a7-eaf1-46f4-9f3c-2b52a5f57b6d"
        reference_vm_recovery_point_ext_id: "9bd35b60-1c26-4c0c-a2ba-8a2b7cb7fbcd"
        reference_disk_recovery_point_ext_id: "3f18f321-59e5-4a09-b74a-4b6d1adf5d47"

    - name: Compute changed regions for a VM disk recovery point
      nutanix.ncp.ntnx_vm_recovery_point_compute_changed_region_v2:
        recovery_point_ext_id: "{{ recovery_point_ext_id }}"
        vm_recovery_point_ext_id: "{{ vm_recovery_point_ext_id }}"
        disk_recovery_point_ext_id: "{{ disk_recovery_point_ext_id }}"
        offset: 0
        length: 1048576
        block_size_byte: 262144
        reference_recovery_point_ext_id: "{{ reference_recovery_point_ext_id }}"
        reference_vm_recovery_point_ext_id: "{{ reference_vm_recovery_point_ext_id }}"
        reference_disk_recovery_point_ext_id: "{{ reference_disk_recovery_point_ext_id }}"
      register: result
