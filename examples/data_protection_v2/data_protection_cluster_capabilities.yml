---
# Summary:
# This playbook will do:
# 1. Get the data protection cluster capabilities with external ID
# 2. Get all data protection cluster capabilities
# 3. Get data protection cluster capabilities with filter on cluster external ID
# 4. Get data protection cluster capabilities with limit

- name: Get Data Protection Cluster Capabilities playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        data_protection_cluster_capabilities_ext_id: "0006555e-4e63-4a5e-185b-ac1f6b6f97e2"
        cluster_ext_id: "0006555e-4e63-4a5e-185b-ac1f6b6f97e2"

    - name: Get Data Protection Cluster Capabilities with external ID
      nutanix.ncp.ntnx_data_protection_cluster_capabilities_info_v2:
        ext_id: "{{ data_protection_cluster_capabilities_ext_id }}"
      register: result

    - name: Print the result
      ansible.builtin.debug:
        var: result

    - name: Get all data protection cluster capabilities
      nutanix.ncp.ntnx_data_protection_cluster_capabilities_info_v2:
      register: result

    - name: Print the result
      ansible.builtin.debug:
        var: result

    - name: Get data protection cluster capabilities with filter on cluster external ID
      nutanix.ncp.ntnx_data_protection_cluster_capabilities_info_v2:
        filter: "clusterExtId eq '{{ cluster_ext_id }}'"
      register: result

    - name: Print the result
      ansible.builtin.debug:
        var: result

    - name: Get data protection cluster capabilities with limit
      nutanix.ncp.ntnx_data_protection_cluster_capabilities_info_v2:
        limit: 1
      register: result

    - name: Print the result
      ansible.builtin.debug:
        var: result
