---
# Summary:
# This playbook will do:
# 1. Create network controller
# 2. Update network controller
# 3. Get network controller using ext_id
# 4. List all network controllers
# 5. List network controllers with limit
# 6. Delete network controller

- name: Network Controllers playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        owner_reference_id: "00000000-0000-0000-0000-000000000000"
        owner_user_name: "admin"
        category_ids:
          - "66f4d0aa-4e77-5261-94c6-4dc19a857049"
          - "594bb16c-3498-5706-bd9d-301dea6a6bcb"

    - name: Create network controller
      nutanix.ncp.ntnx_network_controller_v2:
        state: present
        default_vlan_stack: "ADVANCED"
        vpc_global_config:
          is_overlapping_erps_enabled: false
        metadata:
          owner_reference_id: "{{ owner_reference_id }}"
          owner_user_name: "{{ owner_user_name }}"
          category_ids: "{{ category_ids }}"
      register: result
      ignore_errors: true

    - name: Set network controller ext_id
      ansible.builtin.set_fact:
        network_controller_ext_id: "{{ result.response.ext_id }}"

    - name: Update network controller
      nutanix.ncp.ntnx_network_controller_v2:
        state: present
        ext_id: "{{ network_controller_ext_id }}"
        vpc_global_config:
          is_overlapping_erps_enabled: true
      register: result
      ignore_errors: true

    - name: Get network controller using ext_id
      nutanix.ncp.ntnx_network_controllers_info_v2:
        ext_id: "{{ network_controller_ext_id }}"
      register: result
      ignore_errors: true

    - name: List all network controllers
      nutanix.ncp.ntnx_network_controllers_info_v2:
      register: result
      ignore_errors: true

    - name: List network controllers with limit
      nutanix.ncp.ntnx_network_controllers_info_v2:
        limit: 1
      register: result
      ignore_errors: true

    - name: Delete network controller
      nutanix.ncp.ntnx_network_controller_v2:
        state: absent
        ext_id: "{{ network_controller_ext_id }}"
      register: result
      ignore_errors: true
