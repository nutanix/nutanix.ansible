---
# Summary:
# This playbook will do:
# 1. Create virtual switch owned by a project and shared with projects
# 2. Create virtual switch from an existing bridge
# 3. Update virtual switch
# 4. Update virtual switch to share with specific projects
# 5. Update virtual switch to unshare from specific projects
# 6. Get virtual switch using ext_id
# 7. List all virtual switches
# 8. List virtual switches with filter
# 9. List virtual switches with limit
# 10. Delete virtual switch
# 11. Delete virtual switch from bridge

- name: Virtual Switches playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        cluster_uuid: "bde7fc02-fe9c-4ce3-9212-2ca4e4b4d258"
        host_uuid: "8300384a-56ee-4750-aeb8-3d1c42908bee"
        virtual_switch_name: "virtual_switch_ansible"
        existing_bridge_name: "br2"
        owner_reference_id: "00000000-0000-0000-0000-000000000000"
        owner_user_name: "admin"
        category_ids:
          - "66f4d0aa-4e77-5261-94c6-4dc19a857049"
          - "594bb16c-3498-5706-bd9d-301dea6a6bcb"
        shared_with_projects:
          - "12345678-1234-1234-1234-123456789012"
          - "98798798-1234-1111-2222-6788222f17b8"
        project_ext_id: "89798789-1234-1111-2222-6788222f17b8"

    - name: Create virtual switch owned by a project and shared with projects
      nutanix.ncp.ntnx_virtual_switch_v2:
        state: present
        name: "{{ virtual_switch_name }}"
        description: "Virtual switch created by Ansible"
        project_ext_id: "{{ project_ext_id }}"
        bond_mode: "NONE"
        mtu: 1500
        is_default: false
        clusters:
          - ext_id: "{{ cluster_uuid }}"
            hosts:
              - ext_id: "{{ host_uuid }}"
            vlan_identifier: 0
        igmp_spec:
          is_snooping_enabled: false
        shared_with_projects: "{{ shared_with_projects }}"
        metadata:
          owner_reference_id: "{{ owner_reference_id }}"
          owner_user_name: "{{ owner_user_name }}"
          category_ids: "{{ category_ids }}"
      register: result
      ignore_errors: true

    - name: Set virtual switch ext_id
      ansible.builtin.set_fact:
        virtual_switch_ext_id: "{{ result.response.ext_id }}"

    - name: Create a virtual switch from an existing bridge
      nutanix.ncp.ntnx_virtual_switch_v2:
        state: present
        name: "{{ virtual_switch_name }}_from_bridge"
        description: "Virtual switch created from existing bridge"
        existing_bridge_name: "{{ existing_bridge_name }}"
        cluster_reference: "{{ cluster_uuid }}"
        metadata:
          owner_reference_id: "{{ owner_reference_id }}"
          owner_user_name: "{{ owner_user_name }}"
          category_ids: "{{ category_ids }}"
      register: result
      ignore_errors: true

    - name: Set virtual switch from bridge ext_id
      ansible.builtin.set_fact:
        virtual_switch_from_bridge_ext_id: "{{ result.response.ext_id }}"

    - name: Update virtual switch
      nutanix.ncp.ntnx_virtual_switch_v2:
        state: present
        ext_id: "{{ virtual_switch_ext_id }}"
        name: "{{ virtual_switch_name }}_updated"
        description: "Updated virtual switch description"
        bond_mode: "NONE"
        mtu: 1500
        is_default: false
        clusters:
          - ext_id: "{{ cluster_uuid }}"
            hosts:
              - ext_id: "{{ host_uuid }}"
            vlan_identifier: 0
        igmp_spec:
          is_snooping_enabled: true
          snooping_timeout: 600
          querier_spec:
            is_querier_enabled: true
        metadata:
          owner_reference_id: "{{ owner_reference_id }}"
          owner_user_name: "{{ owner_user_name }}"
          category_ids:
            - "{{ category_ids[0] }}"
      register: result
      ignore_errors: true

    - name: Update virtual switch to share with specific projects
      nutanix.ncp.ntnx_virtual_switch_v2:
        state: present
        ext_id: "{{ virtual_switch_ext_id }}"
        shared_with_projects: "{{ shared_with_projects }}"
      register: result
      ignore_errors: true

    - name: Update virtual switch to unshare from specific projects
      nutanix.ncp.ntnx_virtual_switch_v2:
        state: present
        ext_id: "{{ virtual_switch_ext_id }}"
        shared_with_projects: []
      register: result
      ignore_errors: true

    - name: Get virtual switch using ext_id
      nutanix.ncp.ntnx_virtual_switches_info_v2:
        cluster_ext_id: "{{ cluster_uuid }}"
        ext_id: "{{ virtual_switch_ext_id }}"
      register: result
      ignore_errors: true

    - name: List all virtual switches
      nutanix.ncp.ntnx_virtual_switches_info_v2:
        cluster_ext_id: "{{ cluster_uuid }}"
      register: result
      ignore_errors: true

    - name: List virtual switches with filter
      nutanix.ncp.ntnx_virtual_switches_info_v2:
        cluster_ext_id: "{{ cluster_uuid }}"
        filter: "name eq '{{ virtual_switch_name }}_updated'"
      register: result
      ignore_errors: true

    - name: List virtual switches with limit
      nutanix.ncp.ntnx_virtual_switches_info_v2:
        cluster_ext_id: "{{ cluster_uuid }}"
        limit: 1
      register: result
      ignore_errors: true

    - name: Delete virtual switch
      nutanix.ncp.ntnx_virtual_switch_v2:
        state: absent
        ext_id: "{{ virtual_switch_ext_id }}"
      register: result
      ignore_errors: true

    - name: Delete virtual switch from bridge
      nutanix.ncp.ntnx_virtual_switch_v2:
        state: absent
        ext_id: "{{ virtual_switch_from_bridge_ext_id }}"
      register: result
      ignore_errors: true
