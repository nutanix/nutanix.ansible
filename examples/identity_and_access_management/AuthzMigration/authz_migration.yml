---
- name: AuthzMigration playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip }}"
      nutanix_username: "{{ username }}"
      nutanix_password: "{{ password }}"
      validate_certs: false
  tasks:
    - name: List all Authz migration flags
      nutanix.ncp.ntnx_authz_migration_flags_v2:
      register: result
      ignore_errors: true

    - name: List Authz migration flags with filter
      nutanix.ncp.ntnx_authz_migration_flags_v2:
        filter: "flagName eq 'test_flag'"
      register: result
      ignore_errors: true

    - name: List Authz migration flags with orderby
      nutanix.ncp.ntnx_authz_migration_flags_v2:
        orderby: "flagName asc"
      register: result
      ignore_errors: true

    - name: Migrate AuthZ data - remove AP tenant ID filters
      nutanix.ncp.ntnx_migrate_authz_data_v2:
        migration_type: "REMOVE_AP_TENANT_ID_FILTERS"
      register: result
      ignore_errors: true

    - name: Migrate AuthZ data with project AP migration
      nutanix.ncp.ntnx_migrate_authz_data_v2:
        migration_type: "MIGRATE_PROJECT_AP_TO_ROLE_MEMBERSHIP"
        project_ap_migration_data:
          project_ext_id: "12345678-1234-1234-1234-123456789012"
          ap_ext_ids:
            - "87654321-4321-4321-4321-210987654321"
          user_idp_mappings:
            - identity_ext_id: "11111111-1111-1111-1111-111111111111"
              idp_ext_id: "22222222-2222-2222-2222-222222222222"
          user_group_idp_mappings:
            - identity_ext_id: "33333333-3333-3333-3333-333333333333"
              idp_ext_id: "44444444-4444-4444-4444-444444444444"
      register: result
      ignore_errors: true
