---
- name: Capabilities info playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: List all user authorization policies
      nutanix.ncp.ntnx_user_authorization_policies_info_v2:
      register: result
      ignore_errors: true

    - name: List user authorization policies with limit
      nutanix.ncp.ntnx_user_authorization_policies_info_v2:
        limit: 1
      register: result
      ignore_errors: true

    - name: List all user authorization policies with fetch_all
      nutanix.ncp.ntnx_user_authorization_policies_info_v2:
        fetch_all: true
      register: result
      ignore_errors: true

    - name: List all user roles
      nutanix.ncp.ntnx_user_roles_info_v2:
      register: result
      ignore_errors: true

    - name: List user roles with limit
      nutanix.ncp.ntnx_user_roles_info_v2:
        limit: 1
      register: result
      ignore_errors: true

    - name: List all user roles with fetch_all
      nutanix.ncp.ntnx_user_roles_info_v2:
        fetch_all: true
      register: result
      ignore_errors: true
