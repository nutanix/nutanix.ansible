---
# Summary:
# This playbook demonstrates the SamlIdpSpMetadata modules by:
# 1. Optionally listing the SAML identity providers in Prism Central so the
#    playbook can auto-pick one when no C(saml_idp_ext_id) is supplied.
# 2. Downloading SP-Metadata for a specific SAML identity provider using the
#    action-style C(ntnx_saml_idp_sp_metadata_v2) module.
# 3. Fetching SP-Metadata for a specific SAML identity provider using
#    C(ntnx_saml_idp_sp_metadata_info_v2) (info variant, by ext_id).
# 4. Fetching the singleton generic SP-Metadata for Prism Central using
#    C(ntnx_saml_idp_sp_metadata_info_v2) (info variant, no ext_id).
#
# Requirements:
# - The IAM SP-Metadata endpoints are read-only. SP-Metadata is generated by
#   Prism Central and cannot be created/updated/deleted directly.
# - To download SP-Metadata for a specific IdP you need a SAML identity
#   provider configured on the cluster. See
#   `examples/iam_v2/saml_identity_provider_v2.yml` for how to create one.
# - Supply the target IdP through the environment variable
#   C(NUTANIX_SAML_IDP_EXT_ID) or override the fact C(saml_idp_ext_id) via
#   C(-e). If neither is set the playbook auto-picks the first SAML IdP
#   already configured on the cluster.

- name: SamlIdpSpMetadata playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ lookup('env', 'NUTANIX_HOST') | default('<pc_ip>', true) }}"
      nutanix_username: "{{ lookup('env', 'NUTANIX_USERNAME') | default('<user>', true) }}"
      nutanix_password: "{{ lookup('env', 'NUTANIX_PASSWORD') | default('<pass>', true) }}"
      validate_certs: false
  tasks:
    - name: Resolve SAML IdP ext_id (from env, extra vars, or auto-pick first)
      block:
        - name: List existing SAML identity providers when ext_id is not supplied
          nutanix.ncp.ntnx_saml_identity_providers_info_v2:
          register: existing_idps
          ignore_errors: true
          when: (lookup('env', 'NUTANIX_SAML_IDP_EXT_ID') | default('', true)) == ''
            and (saml_idp_ext_id | default('', true)) == ''

        - name: Set SAML IdP ext_id fact
          ansible.builtin.set_fact:
            saml_idp_ext_id: >-
              {{ (lookup('env', 'NUTANIX_SAML_IDP_EXT_ID') | default('', true))
                 or (saml_idp_ext_id | default('', true))
                 or (existing_idps.response[0].ext_id
                     if (existing_idps is defined
                         and existing_idps.response is defined
                         and existing_idps.response | length > 0)
                     else '') }}

    - name: Download SP-Metadata for the SAML identity provider (action module)
      nutanix.ncp.ntnx_saml_idp_sp_metadata_v2:
        state: present
        ext_id: "{{ saml_idp_ext_id }}"
      register: download_result
      ignore_errors: true
      when: saml_idp_ext_id | length > 0

    - name: Fetch SP-Metadata for the SAML identity provider (info module, by ext_id)
      nutanix.ncp.ntnx_saml_idp_sp_metadata_info_v2:
        ext_id: "{{ saml_idp_ext_id }}"
      register: info_by_id_result
      ignore_errors: true
      when: saml_idp_ext_id | length > 0

    - name: Fetch generic (singleton) SP-Metadata (info module, no ext_id)
      nutanix.ncp.ntnx_saml_idp_sp_metadata_info_v2:
      register: info_singleton_result
      ignore_errors: true
