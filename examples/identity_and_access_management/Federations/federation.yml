---
- name: Federation CRUD and Info playbook
  hosts: localhost
  gather_facts: false
  vars:
    ip: "10.44.76.17"
    username: "admin"
    password: "Nutanix.123"
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip }}"
      nutanix_username: "{{ username }}"
      nutanix_password: "{{ password }}"
      validate_certs: false
  tasks:
    - name: Create federation with OIDC provider
      nutanix.ncp.ntnx_federation_v2:
        state: present
        well_known_config: "https://example.okta.com/.well-known/openid-configuration"
        idp_id: "00000000-0000-0000-0000-000000000000"
        cloud_tenant: "00000000-0000-0000-0000-000000000001"
        cloud_api_key: "test-api-key-ansible"
        claim_map:
          name: "name"
          email: "email"
      register: create_result
      ignore_errors: true

    - name: Get federation info
      nutanix.ncp.ntnx_federation_info_v2:
      register: info_result
      ignore_errors: true

    - name: Print federation details
      ansible.builtin.debug:
        msg: "{{ info_result }}"

    - name: Delete federation
      nutanix.ncp.ntnx_federation_v2:
        state: absent
      register: delete_result
      ignore_errors: true
