---
# Summary:
# Collect cluster logs with local and Nutanix server upload destinations.

- name: Cluster logs collect playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Set variables
      ansible.builtin.set_fact:
        cluster_ext_id: "<cluster_ext_id>"
        tag_ext_id: "<tag_ext_id>"
        support_case_number: 1753078

    - name: Collect cluster logs to local disk
      nutanix.ncp.ntnx_cluster_logs_collect_v2:
        ext_id: "{{ cluster_ext_id }}"
        start_time: "2026-01-01T00:00:00Z"
        end_time: "2026-01-02T00:00:00Z"
        should_anonymize: true
        include_tags:
          - "{{ tag_ext_id }}"
        archive_opts:
          archive_name: "NTNX-Log"
          upload_params:
            local_upload_params:
              path: "/home/nutanix/data/logbay/bundles"
      register: local_result

    - name: Print local collect logs result
      ansible.builtin.debug:
        msg: "{{ local_result }}"

    - name: Collect cluster logs and upload to Nutanix support
      nutanix.ncp.ntnx_cluster_logs_collect_v2:
        ext_id: "{{ cluster_ext_id }}"
        start_time: "2026-01-01T00:00:00Z"
        end_time: "2026-01-02T00:00:00Z"
        archive_opts:
          upload_params:
            ntnx_server_upload_params:
              case_number: "{{ support_case_number }}"
              protocol: SFTP
      register: ntnx_result

    - name: Print Nutanix upload collect logs result
      ansible.builtin.debug:
        msg: "{{ ntnx_result }}"
