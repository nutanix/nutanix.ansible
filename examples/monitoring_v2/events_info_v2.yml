---
# Summary:
# This playbook will do:
# 1. List all events
# 2. List events with filter
# 3. List events with limit
# 4. List all events with fetch_all
# 5. Get an event using ext_id

- name: Events info playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Set variables
      ansible.builtin.set_fact:
        event_ext_id: "<event_ext_id>"

    - name: List all events
      nutanix.ncp.ntnx_events_info_v2:
      register: list_result

    - name: List events with filter
      nutanix.ncp.ntnx_events_info_v2:
        filter: "eventType eq 'MulticlusterAudit'"
      register: list_result_filter

    - name: List events with limit
      nutanix.ncp.ntnx_events_info_v2:
        limit: 1
      register: list_result_limit

    - name: List all events with fetch_all
      nutanix.ncp.ntnx_events_info_v2:
        fetch_all: true
      register: list_result_fetch_all

    - name: Get an event using ext_id
      nutanix.ncp.ntnx_events_info_v2:
        ext_id: "{{ event_ext_id }}"
      register: get_result
