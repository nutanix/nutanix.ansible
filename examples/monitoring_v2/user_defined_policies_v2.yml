---
# Summary:
# This playbook will do:
# 1. Create a User-Defined Alert policy
# 2. Find conflicting User-Defined Alert policies
# 3. Update the User-Defined Alert policy
# 4. List all User-Defined Alert policies
# 5. List User-Defined Alert policies with filter
# 6. List User-Defined Alert policies with limit
# 7. List all User-Defined Alert policies with fetch_all
# 8. Get a User-Defined Alert policy using ext_id
# 9. Delete the User-Defined Alert policy

- name: User-Defined Alert policies CRUD playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Set variables
      ansible.builtin.set_fact:
        entity_ext_id: "<entity_ext_id>"

    - name: Create a User-Defined Alert policy
      nutanix.ncp.ntnx_user_defined_policies_v2:
        state: present
        title: "ansible-uda-cpu-usage"
        description: "CPU resources utilization by a VM"
        entity_type: "vm"
        is_enabled: true
        is_auto_resolved: true
        impact_types:
          - PERFORMANCE
        filters:
          entity_filter:
            - ext_id: "{{ entity_ext_id }}"
        trigger_conditions:
          - condition_type: STATIC_THRESHOLD
            severity_level: CRITICAL
            condition:
              metric_name: hypervisor_cpu_usage_ppm
              operator: GREATER_THAN
              threshold_value:
                double_value:
                  double_value: 900000.0
      register: create_result

    - name: Set User Defined Alert Policy External ID
      ansible.builtin.set_fact:
        uda_policy_ext_id: "{{ create_result.ext_id }}"

    - name: Find conflicting User-Defined Alert policies
      nutanix.ncp.ntnx_user_defined_policies_conflicts_v2:
        state: present
        title: "ansible-uda-cpu-usage"
        description: "CPU resources utilization by a VM"
        entity_type: "vm"
        is_enabled: true
        filters:
          entity_filter:
            - ext_id: "{{ entity_ext_id }}"
        trigger_conditions:
          - condition_type: STATIC_THRESHOLD
            severity_level: CRITICAL
            condition:
              metric_name: hypervisor_cpu_usage_ppm
              operator: GREATER_THAN
              threshold_value:
                double_value:
                  double_value: 900000.0
      register: conflicts_result

    - name: Update the User-Defined Alert policy
      nutanix.ncp.ntnx_user_defined_policies_v2:
        state: present
        ext_id: "{{ uda_policy_ext_id }}"
        title: "ansible-uda-cpu-usage-updated"
        description: "Updated CPU resources utilization by a VM"
        entity_type: "vm"
        is_enabled: false
        impact_types:
          - PERFORMANCE
        filters:
          entity_filter:
            - ext_id: "{{ entity_ext_id }}"
        trigger_conditions:
          - condition_type: STATIC_THRESHOLD
            severity_level: WARNING
            condition:
              metric_name: hypervisor_cpu_usage_ppm
              operator: GREATER_THAN_OR_EQUAL_TO
              threshold_value:
                double_value:
                  double_value: 800000.0
      register: update_result

    - name: List all User-Defined Alert policies
      nutanix.ncp.ntnx_user_defined_policies_info_v2:
      register: list_result

    - name: List User-Defined Alert policies with filter
      nutanix.ncp.ntnx_user_defined_policies_info_v2:
        filter: "title eq 'VM CPU Usage'"
      register: list_result_filter

    - name: List User-Defined Alert policies with limit
      nutanix.ncp.ntnx_user_defined_policies_info_v2:
        limit: 1
      register: list_result_limit

    - name: List all User-Defined Alert policies with fetch_all
      nutanix.ncp.ntnx_user_defined_policies_info_v2:
        fetch_all: true
      register: list_result_fetch_all

    - name: Get a User-Defined Alert policy using ext_id
      nutanix.ncp.ntnx_user_defined_policies_info_v2:
        ext_id: "{{ uda_policy_ext_id }}"
      register: get_result

    - name: Delete the User-Defined Alert policy
      nutanix.ncp.ntnx_user_defined_policies_v2:
        state: absent
        ext_id: "{{ uda_policy_ext_id }}"
      register: delete_result
