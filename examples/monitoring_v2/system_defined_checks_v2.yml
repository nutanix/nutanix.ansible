---
# Summary:
# Run System-Defined Checks on a cluster.

- name: System-Defined Checks playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Set variables
      ansible.builtin.set_fact:
        cluster_ext_id: "<cluster_ext_id>"
        sda_ext_id: "<sda_ext_id>"

    - name: Run selected System-Defined Checks
      nutanix.ncp.ntnx_system_defined_checks_v2:
        cluster_ext_id: "{{ cluster_ext_id }}"
        sda_ext_ids:
          - "{{ sda_ext_id }}"
        should_anonymize: true
        should_send_report_to_configured_recipients: true
      register: selected_result

    - name: Print selected checks result
      ansible.builtin.debug:
        msg: "{{ selected_result }}"

    - name: Run all System-Defined Checks
      nutanix.ncp.ntnx_system_defined_checks_v2:
        cluster_ext_id: "{{ cluster_ext_id }}"
        should_run_all_checks: true
        additional_recipients:
          - ops@example.com
      register: all_result

    - name: Print all checks result
      ansible.builtin.debug:
        msg: "{{ all_result }}"
