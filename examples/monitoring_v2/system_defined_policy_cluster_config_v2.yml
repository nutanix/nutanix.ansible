---
# Summary:
# Update System-Defined Alert policy cluster configuration.

- name: System-Defined policy cluster configuration playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Set variables
      ansible.builtin.set_fact:
        system_defined_policy_ext_id: "<system_defined_policy_ext_id>"
        cluster_ext_id: "<cluster_ext_id>"

    - name: Update System-Defined policy cluster configuration
      nutanix.ncp.ntnx_system_defined_policy_cluster_config_v2:
        system_defined_policy_ext_id: "{{ system_defined_policy_ext_id }}"
        ext_id: "{{ cluster_ext_id }}"
        is_enabled: true
        schedule_interval_seconds: 3600
        alert_config:
          auto_resolve: ENABLED
          critical_severity:
            state: ENABLED
      register: result

    - name: Print updated cluster configuration
      ansible.builtin.debug:
        msg: "{{ result }}"
