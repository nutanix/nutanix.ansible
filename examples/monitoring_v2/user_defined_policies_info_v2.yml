---
# Summary:
# This playbook will do:
# 1. List all User-Defined Alert policies
# 2. List User-Defined Alert policies with filter
# 3. List User-Defined Alert policies with limit
# 4. List all User-Defined Alert policies with fetch_all
# 5. Get a User-Defined Alert policy using ext_id

- name: User-Defined Alert policies info playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Set variables
      ansible.builtin.set_fact:
        uda_policy_ext_id: "<uda_policy_ext_id>"

    - name: List all User-Defined Alert policies
      nutanix.ncp.ntnx_user_defined_policies_info_v2:
      register: list_result

    - name: List User-Defined Alert policies with filter
      nutanix.ncp.ntnx_user_defined_policies_info_v2:
        filter: "title eq 'VM CPU Usage'"
      register: list_result_filter

    - name: List User-Defined Alert policies with limit
      nutanix.ncp.ntnx_user_defined_policies_info_v2:
        limit: 1
      register: list_result_limit

    - name: List all User-Defined Alert policies with fetch_all
      nutanix.ncp.ntnx_user_defined_policies_info_v2:
        fetch_all: true
      register: list_result_fetch_all

    - name: Get a User-Defined Alert policy using ext_id
      nutanix.ncp.ntnx_user_defined_policies_info_v2:
        ext_id: "{{ uda_policy_ext_id }}"
      register: get_result
