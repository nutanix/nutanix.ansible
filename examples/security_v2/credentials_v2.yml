---
# Summary:
# This playbook will do:
# 1. Create a BMC credential
# 2. Create a vCenter credential
# 3. Create an Intersight credential
# 4. Fetch credential using ext_id
# 5. List all credentials
# 6. List credentials with filter
# 7. List credentials with limit
# 8. List credentials with fetch all
# 9. Update BMC credential
# 10. Delete all credentials created by this playbook

- name: Credentials v2 playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false

  tasks:
    - name: Setting Variables
      ansible.builtin.set_fact:
        credential_name: "Credential 1"
        credential_username: "admin"
        credential_password: "password"
        credential_ext_id: "2e40ff57-20aa-4d2b-b179-298db969c20d"
        credential_api_key: "api_key"
        credential_secret_key: "secret_key"
        credential_password_new: "password_new"

    - name: Create BMC credential
      nutanix.ncp.ntnx_credential_v2:
        name: "{{ credential_name }}"
        credential_details:
          bmc:
            credential:
              username: "{{ credential_username }}"
              password: "{{ credential_password }}"
      register: result
      ignore_errors: true

    - name: Create vCenter credential
      nutanix.ncp.ntnx_credential_v2:
        name: "{{ credential_name }}"
        credential_details:
          vcenter:
            credential:
              username: "{{ credential_username }}"
              password: "{{ credential_password }}"
            address:
              fqdn:
                value: "vcenter.example.com"
      register: result
      ignore_errors: true

    - name: Create Intersight credential
      nutanix.ncp.ntnx_credential_v2:
        name: "{{ credential_name }}"
        credential_details:
          intersight:
            url: "https://intersight.com/api/v1/"
            deployment_type: "INTERSIGHT_SAAS"
            credential:
              api_key: "{{ credential_api_key }}"
              secret_key: "{{ credential_secret_key }}"
      register: result
      ignore_errors: true

    - name: Fetch credential using ext_id
      nutanix.ncp.ntnx_credentials_info_v2:
        ext_id: "{{ credential_ext_id }}"
      register: result
      ignore_errors: true

    - name: List all credentials
      nutanix.ncp.ntnx_credentials_info_v2:
      register: result
      ignore_errors: true

    - name: List credentials with filter
      nutanix.ncp.ntnx_credentials_info_v2:
        filter: "name eq '{{ credential_name }}'"
      register: result
      ignore_errors: true

    - name: List credentials with limit
      nutanix.ncp.ntnx_credentials_info_v2:
        limit: 1
      register: result
      ignore_errors: true

    - name: List credentials with fetch all
      nutanix.ncp.ntnx_credentials_info_v2:
        fetch_all: true
      register: result
      ignore_errors: true

    - name: Update BMC credential
      nutanix.ncp.ntnx_credential_v2:
        ext_id: "{{ credential_ext_id }}"
        name: "{{ credential_name }}_updated"
        credential_details:
          bmc:
            credential:
              username: "{{ credential_username }}"
              password: "{{ credential_password_new }}"
      register: result
      ignore_errors: true

    - name: Delete credential
      nutanix.ncp.ntnx_credential_v2:
        ext_id: "{{ credential_ext_id }}"
        state: absent
      register: result
      ignore_errors: true
