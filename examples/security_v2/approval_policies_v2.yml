---
# Summary:
# This playbook will do:
# 1. Create an approval policy
# 2. Get approval policy by External ID
# 3. List approval policies
# 4. List with filter
# 5. Update approval policy
# 6. Associate secured policies

- name: Approval policies playbook
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: <pc_ip>
      nutanix_username: <user>
      nutanix_password: <pass>
      validate_certs: false
  tasks:
    - name: Set variables
      ansible.builtin.set_fact:
        protection_policy_ext_id: "<protection_policy_ext_id>"

    - name: Create an approval policy
      nutanix.ncp.ntnx_approval_policies_v2:
        name: "Ansible Approval Policy"
        description: "Created by Ansible example"
        approver_groups:
          - name: "Ansible Approvers"
            expiry_hours: 24
            approvers:
              - username: "admin"
                user_type: LOCAL
              - username: "approver2"
                user_type: LOCAL
              - username: "approver3"
                user_type: LOCAL
      register: create_result

    - name: Set approval policy ext_id
      ansible.builtin.set_fact:
        approval_policy_ext_id: "{{ create_result.ext_id }}"

    - name: Fetch approval policy by External ID
      nutanix.ncp.ntnx_approval_policies_info_v2:
        ext_id: "{{ approval_policy_ext_id }}"
      register: get_result

    - name: List approval policies
      nutanix.ncp.ntnx_approval_policies_info_v2:
      register: list_result

    - name: List approval policies with filter
      nutanix.ncp.ntnx_approval_policies_info_v2:
        filter: "name eq 'Ansible Approval Policy'"
      register: filter_result

    - name: Update an approval policy
      nutanix.ncp.ntnx_approval_policies_v2:
        ext_id: "{{ approval_policy_ext_id }}"
        name: "Ansible Approval Policy Updated"
        description: "Updated by Ansible example"
        approver_groups:
          - name: "Ansible Approvers"
            expiry_hours: 48
            approvers:
              - username: "admin"
                user_type: LOCAL
              - username: "approver2"
                user_type: LOCAL
              - username: "approver3"
                user_type: LOCAL
      register: update_result

    - name: Associate protection policy with approval policy
      nutanix.ncp.ntnx_approval_policies_associate_v2:
        ext_id: "{{ approval_policy_ext_id }}"
        secured_policies:
          - policy_ext_id: "{{ protection_policy_ext_id }}"
            policy_type: PROTECTION_POLICY
      register: associate_result
