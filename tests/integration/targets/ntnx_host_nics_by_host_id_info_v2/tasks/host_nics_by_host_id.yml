---
# Test plan for ntnx_host_nics_by_host_id_info_v2 (ListHostNicsByHostId)
# 1. Discover cluster + host
# 2. List NICs for host; validate attribution
# 3. limit / filter / fetch_all
# 4. Negatives: missing params, bad host

- name: Start host NICs by host id tests
  ansible.builtin.debug:
    msg: Start ntnx_host_nics_by_host_id_info_v2 tests

- name: Discover AOS cluster
  nutanix.ncp.ntnx_clusters_info_v2:
    filter: >-
      config/clusterFunction/any(t:t eq
      Clustermgmt.Config.ClusterFunctionRef'AOS')
  register: aos_clusters
  ignore_errors: true

- name: Assert AOS cluster found
  ansible.builtin.assert:
    that:
      - aos_clusters is succeeded
      - aos_clusters.response | length > 0
    fail_msg: "No AOS cluster"
    success_msg: "AOS cluster found"

- name: Set cluster_ext_id
  ansible.builtin.set_fact:
    cluster_ext_id: "{{ aos_clusters.response[0].ext_id }}"

- name: Discover hosts
  nutanix.ncp.ntnx_hosts_by_cluster_id_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
  register: hosts_info
  ignore_errors: true

- name: Assert hosts found
  ansible.builtin.assert:
    that:
      - hosts_info is succeeded
      - hosts_info.response | length > 0
    fail_msg: "No hosts on cluster"
    success_msg: "Hosts found"

- name: Set host_ext_id
  ansible.builtin.set_fact:
    host_ext_id: "{{ hosts_info.response[0].ext_id }}"

- name: List host NICs by host id
  nutanix.ncp.ntnx_host_nics_by_host_id_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "{{ host_ext_id }}"
  register: nics
  ignore_errors: true

- name: Assert NICs listed
  ansible.builtin.assert:
    that:
      - not nics.changed
      - nics is succeeded
      - nics.response is defined
      - nics.total_available_results is defined
    fail_msg: "Failed listing NICs by host"
    success_msg: "NICs listed by host"

- name: Domain - NICs belong to host when node_uuid present
  ansible.builtin.assert:
    that:
      - (item.node_uuid | default(host_ext_id)) == host_ext_id
    fail_msg: "NIC attributed to wrong host"
    success_msg: "NIC {{ item.ext_id }} on expected host"
  loop: "{{ nics.response | default([]) }}"
  loop_control:
    label: "{{ item.ext_id | default('unknown') }}"
  when: nics.response | default([]) | length > 0

- name: List with limit
  nutanix.ncp.ntnx_host_nics_by_host_id_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "{{ host_ext_id }}"
    limit: 1
  register: nics_limit
  ignore_errors: true

- name: Assert limit
  ansible.builtin.assert:
    that:
      - not nics_limit.changed
      - nics_limit is succeeded
      - nics_limit.response | length <= 1
    fail_msg: "Limit failed"
    success_msg: "Limit succeeded"

- name: List with filter
  nutanix.ncp.ntnx_host_nics_by_host_id_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "{{ host_ext_id }}"
    filter: "name eq '{{ nics.response[0].name }}'"
  register: nics_filter
  ignore_errors: true
  when:
    - nics.response | default([]) | length > 0
    - nics.response[0].name is defined

- name: Assert filter
  ansible.builtin.assert:
    that:
      - not nics_filter.changed
      - nics_filter is succeeded
    fail_msg: "Filter failed"
    success_msg: "Filter succeeded"
  when: nics_filter is not skipped

- name: List with fetch_all
  nutanix.ncp.ntnx_host_nics_by_host_id_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "{{ host_ext_id }}"
    fetch_all: true
  register: nics_fetch_all
  ignore_errors: true

- name: Assert fetch_all
  ansible.builtin.assert:
    that:
      - not nics_fetch_all.changed
      - nics_fetch_all is succeeded
      - nics_fetch_all.response | length == nics_fetch_all.total_available_results
    fail_msg: "fetch_all failed"
    success_msg: "fetch_all succeeded"

- name: Negative - missing host_ext_id
  nutanix.ncp.ntnx_host_nics_by_host_id_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
  register: missing_host
  ignore_errors: true

- name: Assert missing host fails
  ansible.builtin.assert:
    that:
      - missing_host is failed
    fail_msg: "Expected missing host failure"
    success_msg: "Missing host rejected"

- name: Negative - invalid host_ext_id
  nutanix.ncp.ntnx_host_nics_by_host_id_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "00000000-0000-0000-0000-000000000000"
  register: bad_host
  ignore_errors: true

- name: Assert invalid host fails
  ansible.builtin.assert:
    that:
      - bad_host is failed
    fail_msg: "Expected invalid host failure"
    success_msg: "Invalid host rejected"
