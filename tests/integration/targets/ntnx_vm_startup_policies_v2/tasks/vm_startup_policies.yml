---
- name: Start VM Startup Policies tests
  ansible.builtin.debug:
    msg: Start VM Startup Policies tests

- name: Generate random names
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"
    suffix_name: "ansible"
    todelete: []

- name: Set names for VM startup policy
  ansible.builtin.set_fact:
    policy_name: "policy_{{ suffix_name }}_{{ random_name }}"

########################################################################################
# Fetch categories for VM startup policy creation
########################################################################################

- name: List all categories
  nutanix.ncp.ntnx_categories_info_v2:
  register: categories_info
  ignore_errors: true

- name: List all categories status
  ansible.builtin.assert:
    that:
      - categories_info is defined
      - categories_info.changed == false
      - categories_info.failed == false
      - categories_info.response is defined
      - categories_info.response | length >= 6
    success_msg: "Categories fetched successfully"
    fail_msg: "Categories fetch failed"

- name: Set category ext_ids
  ansible.builtin.set_fact:
    category_ext_id_1: "{{ categories_info.response[0].ext_id }}"
    category_ext_id_2: "{{ categories_info.response[1].ext_id }}"
    category_ext_id_3: "{{ categories_info.response[2].ext_id }}"
    category_ext_id_4: "{{ categories_info.response[3].ext_id }}"
    category_ext_id_5: "{{ categories_info.response[4].ext_id }}"
    category_ext_id_6: "{{ categories_info.response[5].ext_id }}"

########################################################################################
# Create VM Startup Policy Tests
########################################################################################

- name: Generate spec for creating VM startup policy using check mode with all attributes
  nutanix.ncp.ntnx_vm_startup_policy_v2:
    state: present
    name: "check_mode_policy_full"
    description: "VM startup policy created in check mode with all attributes"
    groups:
      - categories:
          - ext_id: "d42b9b84-b283-5da4-aeaa-e9e0a60e421e"
      - categories:
          - ext_id: "6b1f7792-1297-4f4f-85b4-729b50333906"
    start_conditions:
      - power_state_criteria:
          guest_bootup:
            timeout_duration_secs: 300
        delay_duration_secs: 60
  check_mode: true
  register: result
  ignore_errors: true

- name: Generate spec for creating VM startup policy using check mode with all attributes status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.name == "check_mode_policy_full"
      - result.response.description == "VM startup policy created in check mode with all attributes"
      - result.response.groups | length == 2
      - result.response.groups[0].categories | length == 1
      - result.response.groups[1].categories | length == 1
      - result.response.groups[0].categories[0].ext_id == "d42b9b84-b283-5da4-aeaa-e9e0a60e421e"
      - result.response.groups[1].categories[0].ext_id == "6b1f7792-1297-4f4f-85b4-729b50333906"
      - result.response.start_conditions | length == 1
      - result.response.start_conditions[0].delay_duration_secs == 60
      - result.response.start_conditions[0].power_state_criteria.timeout_duration_secs == 300
    success_msg: "Spec for creating VM startup policy using check mode with all attributes is generated successfully"
    fail_msg: "Spec for creating VM startup policy using check mode with all attributes is not generated successfully"

- name: Create VM startup policy with minimum attributes
  nutanix.ncp.ntnx_vm_startup_policy_v2:
    name: "{{ policy_name }}_min"
    groups:
      - categories:
          - ext_id: "{{ category_ext_id_1 }}"
      - categories:
          - ext_id: "{{ category_ext_id_2 }}"
    start_conditions:
      - power_state_criteria:
          power_on: {}
  register: result
  ignore_errors: true

- name: Create VM startup policy with minimum attributes status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.task_ext_id is defined
      - result.response is defined
      - result.response.ext_id == result.ext_id
      - result.response.name == "{{ policy_name }}_min"
      - result.response.description is none
      - result.response.groups | length == 2
      - result.response.groups[0].categories | length == 1
      - result.response.groups[1].categories | length == 1
      - result.response.groups[0].categories[0].ext_id == category_ext_id_1
      - result.response.groups[1].categories[0].ext_id == category_ext_id_2
      - result.response.start_conditions | length == 1
      - result.response.start_conditions[0].delay_duration_secs == 0
      - result.response.start_conditions[0].power_state_criteria == {}
    success_msg: "VM startup policy with minimum attributes created successfully"
    fail_msg: "VM startup policy with minimum attributes creation failed"

- name: Add VM startup policy to todelete list
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [result.ext_id] }}"

- name: Create VM startup policy with all attributes
  nutanix.ncp.ntnx_vm_startup_policy_v2:
    state: present
    name: "{{ policy_name }}_all"
    description: "VM startup policy created by Ansible integration tests with all attributes"
    groups:
      - categories:
          - ext_id: "{{ category_ext_id_3 }}"
      - categories:
          - ext_id: "{{ category_ext_id_4 }}"
    start_conditions:
      - power_state_criteria:
          guest_bootup:
            timeout_duration_secs: 300
        delay_duration_secs: 60
    wait: true
  register: result
  ignore_errors: true

- name: Create VM startup policy with all attributes status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.task_ext_id is defined
      - result.response is defined
      - result.response.ext_id == result.ext_id
      - result.response.name == "{{ policy_name }}_all"
      - result.response.description == "VM startup policy created by Ansible integration tests with all attributes"
      - result.response.groups | length == 2
      - result.response.groups[0].categories | length == 1
      - result.response.groups[1].categories | length == 1
      - result.response.groups[0].categories[0].ext_id == category_ext_id_3
      - result.response.groups[1].categories[0].ext_id == category_ext_id_4
      - result.response.start_conditions | length == 1
      - result.response.start_conditions[0].delay_duration_secs == 60
      - result.response.start_conditions[0].power_state_criteria.timeout_duration_secs == 300
    success_msg: "VM startup policy with all attributes created successfully"
    fail_msg: "VM startup policy with all attributes creation failed"

- name: Add VM startup policy to todelete list
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [result.ext_id] }}"

########################################################################################
# Negative Create Tests
########################################################################################

- name: Create VM startup policy with missing name
  nutanix.ncp.ntnx_vm_startup_policy_v2:
    state: present
    description: "Missing name policy"
    groups:
      - categories:
          - ext_id: "{{ category_ext_id_1 }}"
    start_conditions:
      - power_state_criteria:
          power_on: {}
    wait: true
  register: result
  ignore_errors: true

- name: Create VM startup policy with missing name status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "state is present but any of the following are missing: name, ext_id"
    success_msg: "Create VM startup policy with missing name failed as expected"
    fail_msg: "Create VM startup policy with missing name did not fail as expected"

- name: Create VM startup policy with missing groups
  nutanix.ncp.ntnx_vm_startup_policy_v2:
    state: present
    name: "test_policy_missing_groups"
    start_conditions:
      - power_state_criteria:
          power_on: {}
    wait: true
  register: result
  ignore_errors: true

- name: Create VM startup policy with missing groups status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "Missing required parameter(s): groups"
    success_msg: "Create VM startup policy with missing groups failed as expected"
    fail_msg: "Create VM startup policy with missing groups did not fail as expected"

- name: Create VM startup policy with missing start_conditions
  nutanix.ncp.ntnx_vm_startup_policy_v2:
    state: present
    name: "test_policy_missing_start_conditions"
    groups:
      - categories:
          - ext_id: "{{ category_ext_id_1 }}"
    wait: true
  register: result
  ignore_errors: true

- name: Create VM startup policy with missing start_conditions status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "Missing required parameter(s): start_conditions"
    success_msg: "Create VM startup policy with missing start_conditions failed as expected"
    fail_msg: "Create VM startup policy with missing start_conditions did not fail as expected"

- name: Create VM startup policy with both power_on and guest_bootup (mutually exclusive)
  nutanix.ncp.ntnx_vm_startup_policy_v2:
    state: present
    name: "test_policy_mutex"
    groups:
      - categories:
          - ext_id: "{{ category_ext_id_1 }}"
    start_conditions:
      - power_state_criteria:
          power_on: {}
          guest_bootup:
            timeout_duration_secs: 300
  register: result
  ignore_errors: true

- name: Create VM startup policy with both power_on and guest_bootup status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - "'mutually exclusive' in result.msg"
    success_msg: "Create VM startup policy with both power_on and guest_bootup failed as expected"
    fail_msg: "Create VM startup policy with both power_on and guest_bootup did not fail as expected"

########################################################################################
# Update VM Startup Policy Tests
########################################################################################

- name: Generate spec for updating VM startup policy using check mode with all attributes
  nutanix.ncp.ntnx_vm_startup_policy_v2:
    state: present
    ext_id: "{{ todelete[1] }}"
    name: "check_mode_policy_full_updated"
    description: "Updated description for VM startup policy with all attributes"
    groups:
      - categories:
          - ext_id: "d803488c-011e-41a8-8d21-3513793996a4"
    start_conditions:
      - power_state_criteria:
          guest_bootup:
            timeout_duration_secs: 300
        delay_duration_secs: 120
    wait: true
  check_mode: true
  register: result
  ignore_errors: true

- name: Generate spec for updating VM startup policy using check mode with all attributes status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == false
      - result.response is defined
      - result.response.name == "check_mode_policy_full_updated"
      - result.response.description == "Updated description for VM startup policy with all attributes"
      - result.response.groups | length == 1
      - result.response.groups[0].categories | length == 1
      - result.response.groups[0].categories[0].ext_id == "d803488c-011e-41a8-8d21-3513793996a4"
      - result.response.start_conditions | length == 1
      - result.response.start_conditions[0].delay_duration_secs == 120
      - result.response.start_conditions[0].power_state_criteria.timeout_duration_secs == 300
    success_msg: "Spec for updating VM startup policy using check mode with all attributes is generated successfully"
    fail_msg: "Spec for updating VM startup policy using check mode with all attributes is not generated successfully"

- name: Update VM startup policy with all attributes
  nutanix.ncp.ntnx_vm_startup_policy_v2:
    state: present
    ext_id: "{{ todelete[1] }}"
    name: "{{ policy_name }}_updated"
    description: "Updated description for VM startup policy with all attributes"
    groups:
      - categories:
          - ext_id: "{{ category_ext_id_5 }}"
      - categories:
          - ext_id: "{{ category_ext_id_6 }}"
    start_conditions:
      - power_state_criteria:
          guest_bootup:
            timeout_duration_secs: 600
        delay_duration_secs: 120
    wait: true
  register: result
  ignore_errors: true

- name: Update VM startup policy with all attributes status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id == "{{ todelete[1] }}"
      - result.task_ext_id is defined
      - result.response is defined
      - result.response.ext_id == result.ext_id
      - result.response.name == "{{ policy_name }}_updated"
      - result.response.description == "Updated description for VM startup policy with all attributes"
      - result.response.groups | length == 2
      - result.response.groups[0].categories | length == 1
      - result.response.groups[1].categories | length == 1
      - result.response.groups[0].categories[0].ext_id == category_ext_id_5
      - result.response.groups[1].categories[0].ext_id == category_ext_id_6
      - result.response.start_conditions | length == 1
      - result.response.start_conditions[0].delay_duration_secs == 120
      - result.response.start_conditions[0].power_state_criteria.timeout_duration_secs == 600
    success_msg: "Update VM startup policy with all attributes passed"
    fail_msg: "Update VM startup policy with all attributes failed"

- name: Update VM startup policy with same values (idempotency test)
  nutanix.ncp.ntnx_vm_startup_policy_v2:
    state: present
    ext_id: "{{ todelete[1] }}"
    name: "{{ policy_name }}_updated"
    description: "Updated description for VM startup policy with all attributes"
    groups:
      - categories:
          - ext_id: "{{ category_ext_id_5 }}"
      - categories:
          - ext_id: "{{ category_ext_id_6 }}"
    start_conditions:
      - power_state_criteria:
          guest_bootup:
            timeout_duration_secs: 600
        delay_duration_secs: 120
    wait: true
  register: result
  ignore_errors: true

- name: Update VM startup policy with same values to test idempotency status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.skipped == true
      - result.ext_id == "{{ todelete[1] }}"
      - result.msg == "Nothing to change."
    success_msg: "Update VM startup policy with same values to test idempotency passed"
    fail_msg: "Update VM startup policy with same values to test idempotency failed"

- name: Update VM startup policy with wrong external ID (should fail)
  nutanix.ncp.ntnx_vm_startup_policy_v2:
    state: present
    ext_id: "04595a7b-010c-4a89-58dd-060c94e9a1f0"
    name: "test_wrong_ext_id"
    description: "test description"
    groups:
      - categories:
          - ext_id: "{{ category_ext_id_1 }}"
    start_conditions:
      - power_state_criteria:
          power_on: {}
    wait: true
  register: result
  ignore_errors: true

- name: Update VM startup policy with wrong external ID status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - >-
        result.msg == "Api Exception raised while fetching VM startup policy info using ext_id"
      - result.response is defined
      - result.response.data is defined
      - result.response.data.error | length > 0
    success_msg: "Update VM startup policy with wrong external ID failed as expected"
    fail_msg: "Update VM startup policy with wrong external ID did not fail as expected"

- name: Update VM startup policy with mismatched groups and start_conditions count
  nutanix.ncp.ntnx_vm_startup_policy_v2:
    state: present
    ext_id: "{{ todelete[0] }}"
    name: "{{ policy_name }}_min"
    groups:
      - categories:
          - ext_id: "{{ category_ext_id_1 }}"
      - categories:
          - ext_id: "{{ category_ext_id_2 }}"
    start_conditions:
      - power_state_criteria:
          power_on: {}
      - power_state_criteria:
          guest_bootup:
            timeout_duration_secs: 300
    wait: true
  register: result
  ignore_errors: true

- name: Update VM startup policy with mismatched groups and start_conditions count status (should fail)
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.status == 400
      - result.error == "BAD REQUEST"
      - result.msg == "Api Exception raised while updating VM startup policy"
      - result.response is defined
      - result.response.data is defined
      - result.response.data.error | length > 0
    success_msg: "Update VM startup policy with mismatched groups and start_conditions count failed as expected"
    fail_msg: "Update VM startup policy with mismatched groups and start_conditions count did not fail as expected"

########################################################################################
