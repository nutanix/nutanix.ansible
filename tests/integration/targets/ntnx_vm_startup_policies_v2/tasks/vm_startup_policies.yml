########################################################################################

- name: Fetch VM startup policy using external ID
  nutanix.ncp.ntnx_vm_startup_policies_info_v2:
    ext_id: "{{ todelete[1] }}"
  register: result
  ignore_errors: true

- name: Fetch VM startup policy using external ID status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.ext_id == "{{ todelete[1] }}"
      - result.response is defined
      - result.response.ext_id == result.ext_id
      - result.response.name == "{{ policy_name }}_updated"
      - result.response.description == "Updated description for VM startup policy with all attributes"
      - result.response.groups | length == 2
      - result.response.groups[0].categories | length == 1
      - result.response.groups[1].categories | length == 1
      - result.response.groups[0].categories[0].ext_id == category_ext_id_5
      - result.response.groups[1].categories[0].ext_id == category_ext_id_6
      - result.response.start_conditions | length == 1
      - result.response.start_conditions[0].delay_duration_secs == 120
      - result.response.start_conditions[0].power_state_criteria.timeout_duration_secs == 600
    success_msg: "Fetch VM startup policy using external ID passed"
    fail_msg: "Fetch VM startup policy using external ID failed"

- name: Fetch VM startup policy using wrong external ID (should fail)
  nutanix.ncp.ntnx_vm_startup_policies_info_v2:
    ext_id: "04595a7b-010c-4a89-58dd-060c94e9a1f0"
  register: result
  ignore_errors: true

- name: Fetch VM startup policy using wrong external ID status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - >-
        result.msg == "Api Exception raised while fetching VM startup policy info using ext_id"
      - result.response is defined
      - result.response.data is defined
      - result.response.data.error is defined
      - result.response.data.error | length > 0
    success_msg: "Fetch VM startup policy using wrong external ID failed as expected"
    fail_msg: "Fetch VM startup policy using wrong external ID did not fail as expected"

########################################################################################
# Info Module Tests - List VM Startup Policies
########################################################################################

- name: List all VM startup policies
  nutanix.ncp.ntnx_vm_startup_policies_info_v2:
  register: result
  ignore_errors: true

- name: List all VM startup policies status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length >= 2
      - result.total_available_results is defined
      - result.total_available_results >= 2
    success_msg: "List all VM startup policies passed"
    fail_msg: "List all VM startup policies failed"

- name: List VM startup policies with filter
  nutanix.ncp.ntnx_vm_startup_policies_info_v2:
    filter: "name eq '{{ policy_name }}_updated'"
  register: result
  ignore_errors: true

- name: List VM startup policies with filter status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
      - result.response[0].name == "{{ policy_name }}_updated"
      - result.response[0].ext_id == "{{ todelete[1] }}"
      - result.response[0].description == "Updated description for VM startup policy with all attributes"
      - result.response[0].groups | length == 2
      - result.response[0].start_conditions | length == 1
      - result.response[0].start_conditions[0].delay_duration_secs == 120
      - result.response[0].start_conditions[0].power_state_criteria.timeout_duration_secs == 600
    success_msg: "List VM startup policies with filter passed"
    fail_msg: "List VM startup policies with filter failed"

- name: List VM startup policies with limit
  nutanix.ncp.ntnx_vm_startup_policies_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: List VM startup policies with limit status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
    success_msg: "List VM startup policies with limit passed"
    fail_msg: "List VM startup policies with limit failed"

########################################################################################
# Delete VM Startup Policy Tests
########################################################################################

- name: Delete VM startup policy with check mode
  nutanix.ncp.ntnx_vm_startup_policy_v2:
    state: absent
    ext_id: "{{ todelete[0] }}"
    wait: true
  check_mode: true
  register: result
  ignore_errors: true

- name: Delete VM startup policy with check mode status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.ext_id == "{{ todelete[0] }}"
      - result.response is none
      - >-
        result.msg == "VM startup policy with ext_id:" ~ todelete[0] ~ " will be deleted."
    success_msg: "Delete VM startup policy with check mode passed"
    fail_msg: "Delete VM startup policy with check mode failed"

- name: Delete all created VM startup policies
  nutanix.ncp.ntnx_vm_startup_policy_v2:
    state: absent
    ext_id: "{{ item }}"
    wait: true
  register: result
  ignore_errors: true
  loop: "{{ todelete }}"

- name: Deletion Status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.results | length == todelete | length
      - result.msg == "All items completed"
      - item.changed == true
      - item.failed == false
      - item.ext_id in todelete
      - item.task_ext_id is defined
      - item.response is defined
      - item.response.status == "SUCCEEDED"
    fail_msg: "Unable to delete all VM startup policies"
    success_msg: "All VM startup policies are deleted successfully"
  loop: "{{ result.results }}"

- name: Delete VM startup policy with wrong external ID (should fail)
  nutanix.ncp.ntnx_vm_startup_policy_v2:
    state: absent
    ext_id: "04595a7b-010c-4a89-58dd-060c94e9a1f0"
    wait: true
  register: result
  ignore_errors: true

- name: Delete VM startup policy with wrong external ID status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - >-
        result.msg == "Api Exception raised while fetching VM startup policy info using ext_id"
      - result.response is defined
      - result.response.data is defined
      - result.response.data.error | length > 0
    success_msg: "Delete VM startup policy with wrong external ID failed as expected"
    fail_msg: "Delete VM startup policy with wrong external ID did not fail as expected"

- name: Delete VM startup policy with missing external ID (should fail)
  nutanix.ncp.ntnx_vm_startup_policy_v2:
    state: absent
    wait: true
  register: result
  ignore_errors: true

- name: Delete VM startup policy with missing external ID status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "state is absent but all of the following are missing: ext_id"
    success_msg: "Delete VM startup policy with missing external ID failed as expected"
    fail_msg: "Delete VM startup policy with missing external ID did not fail as expected"
