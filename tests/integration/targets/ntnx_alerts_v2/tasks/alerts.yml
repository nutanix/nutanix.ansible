---
###############################################################################
# Test Plan
#
# This target exercises the `ntnx_alerts_info_v2` info module and the
# `ntnx_alert_v2` action module (Acknowledge / Resolve).
#
# Alerts on Prism Central cannot be created or deleted from the outside — they
# are generated by NCC / cluster health / user-defined policies. Therefore the
# CRUD-lifecycle here is:
#     LIST -> pick a target alert -> ACKNOWLEDGE -> RESOLVE
# combined with negative + argument-validation coverage.
#
# Scenarios covered:
#   1. Info: list all alerts (no filter).
#   2. Info: list with limit=1, verify pagination shape and length.
#   3. Info: list with orderby=creationTime desc + limit=5.
#   4. Info: list with select projection (subset of fields).
#   5. Info: list with a valid OData filter (isAcknowledged eq false).
#   6. Info: filter by severity kInfo (list may be empty on a clean cluster —
#      still assert `failed == false` and `response` is a list).
#   7. Info: get-by-ID for the first non-resolved alert we found (skipped
#      cleanly when the cluster is idle).
#   8. Info: get-by-ID with a random non-existent UUID → expect failed.
#   9. Info: mutually exclusive → `ext_id` + `filter` → expect failed.
#  10. Action: check_mode ACKNOWLEDGE with all attributes (spec is generated,
#      no API call). Assert `changed == false`, `response.action_type`.
#  11. Action: check_mode RESOLVE with all attributes.
#  12. Action: check_mode DELETE — N/A (alerts don't support delete);
#      instead we assert the argument-validation path (missing required
#      `action_type` on real invocation → failed with descriptive msg).
#  13. Action: missing `ext_id` (required) → failed with `missing required
#      arguments: ext_id`.
#  14. Action: invalid `action_type` value (not in choices) → failed with
#      `value ... must be one of: ACKNOWLEDGE, RESOLVE`.
#  15. Action: non-existent alert ext_id → API exception, `failed == true`,
#      msg starts with "Api Exception raised while managing alert".
#  16. Action: REAL ACKNOWLEDGE on a live alert (when one exists) → assert
#      `changed == true`, `task_ext_id`, task status SUCCEEDED, then re-fetch
#      and assert `is_acknowledged == true`.
#  17. Action: idempotency — re-ACKNOWLEDGE the same alert → server returns
#      SUCCEEDED task with no state change (assert `failed == false`).
#  18. Action: REAL RESOLVE on the same alert → assert `changed == true`,
#      task SUCCEEDED, then re-fetch and assert `is_resolved == true`.
###############################################################################

- name: Start Alerts v4 tests
  ansible.builtin.debug:
    msg: Start Alerts v4 tests

- name: Generate random suffix
  ansible.builtin.set_fact:
    random_suffix: "{{ query('community.general.random_string', numbers=true, special=false, length=8)[0] }}"

- name: Set constants used by the negative tests
  ansible.builtin.set_fact:
    non_existent_alert_ext_id: "00000000-0000-0000-0000-{{ random_suffix }}0000"

########################################################################################
# 1. Info Module Tests — list_alerts
########################################################################################

- name: List all Alerts
  nutanix.ncp.ntnx_alerts_info_v2:
  register: result
  ignore_errors: true

- name: List all Alerts status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response is iterable
      - result.total_available_results is defined
      - result.total_available_results >= 0
    success_msg: "List all Alerts passed"
    fail_msg: "List all Alerts failed"

- name: Capture alerts count from the unfiltered list
  ansible.builtin.set_fact:
    all_alerts_count: "{{ result.response | length }}"
    all_alerts_response: "{{ result.response }}"

- name: List Alerts with limit=1
  nutanix.ncp.ntnx_alerts_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: List Alerts with limit=1 status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - (all_alerts_count | int == 0) or (result.response | length == 1)
    success_msg: "List Alerts with limit=1 passed"
    fail_msg: "List Alerts with limit=1 failed"

- name: List Alerts ordered by creationTime desc, limit=5
  nutanix.ncp.ntnx_alerts_info_v2:
    orderby: "creationTime desc"
    limit: 5
  register: result
  ignore_errors: true

- name: List Alerts ordered by creationTime desc status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length <= 5
    success_msg: "List Alerts with orderby+limit passed"
    fail_msg: "List Alerts with orderby+limit failed"

- name: List Alerts with select projection
  nutanix.ncp.ntnx_alerts_info_v2:
    select: "extId,severity,title,isResolved"
    limit: 3
  register: result
  ignore_errors: true

- name: List Alerts with select projection status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length <= 3
    success_msg: "List Alerts with select projection passed"
    fail_msg: "List Alerts with select projection failed"

- name: List Alerts with filter isAcknowledged eq false
  nutanix.ncp.ntnx_alerts_info_v2:
    filter: "isAcknowledged eq false"
  register: unacked_result
  ignore_errors: true

- name: List Alerts with filter isAcknowledged eq false status
  ansible.builtin.assert:
    that:
      - unacked_result is defined
      - unacked_result.changed == false
      - unacked_result.failed == false
      - unacked_result.response is defined
    success_msg: "List Alerts with unacknowledged filter passed"
    fail_msg: "List Alerts with unacknowledged filter failed"

- name: Assert every returned alert honours the unacked filter
  ansible.builtin.assert:
    that:
      - item.is_acknowledged == false
    success_msg: "Filtered alert {{ item.ext_id }} is unacknowledged as expected"
    fail_msg: "Filtered alert {{ item.ext_id }} was acknowledged unexpectedly"
  loop: "{{ unacked_result.response | default([]) }}"
  loop_control:
    label: "{{ item.ext_id | default('') }}"
  when: unacked_result.response | default([]) | length > 0

- name: List Alerts with isResolved eq false filter
  nutanix.ncp.ntnx_alerts_info_v2:
    filter: "isResolved eq false"
  register: unresolved_result
  ignore_errors: true

- name: List Alerts with isResolved eq false status
  ansible.builtin.assert:
    that:
      - unresolved_result is defined
      - unresolved_result.changed == false
      - unresolved_result.failed == false
      - unresolved_result.response is defined
    success_msg: "List Alerts with isResolved filter passed"
    fail_msg: "List Alerts with isResolved filter failed"

- name: Assert every returned alert honours the isResolved filter
  ansible.builtin.assert:
    that:
      - item.is_resolved == false
    success_msg: "Filtered alert {{ item.ext_id }} is unresolved as expected"
    fail_msg: "Filtered alert {{ item.ext_id }} was resolved unexpectedly"
  loop: "{{ unresolved_result.response | default([]) }}"
  loop_control:
    label: "{{ item.ext_id | default('') }}"
  when: unresolved_result.response | default([]) | length > 0

########################################################################################
# 2. Info Module Tests — get_alert_by_id
########################################################################################

- name: Pick a candidate open alert (unresolved) from the unfiltered list
  ansible.builtin.set_fact:
    open_alerts: >-
      {{
        all_alerts_response
        | selectattr('is_resolved', 'equalto', false)
        | list
      }}

- name: Set target alert ext_id when a candidate exists
  ansible.builtin.set_fact:
    target_alert_ext_id: "{{ (open_alerts | first).ext_id }}"
  when: open_alerts | length > 0

- name: Skip live acknowledge/resolve tests when no open alert is available
  ansible.builtin.debug:
    msg: "No open (non-resolved) alert available on the cluster — the LIVE acknowledge/resolve steps will be skipped."
  when: open_alerts | length == 0

- name: Fetch the target alert by ext_id
  nutanix.ncp.ntnx_alerts_info_v2:
    ext_id: "{{ target_alert_ext_id }}"
  register: get_alert_result
  when: open_alerts | length > 0
  ignore_errors: true

- name: Fetch the target alert by ext_id status
  ansible.builtin.assert:
    that:
      - get_alert_result is defined
      - get_alert_result.changed == false
      - get_alert_result.failed == false
      - get_alert_result.response is defined
      - get_alert_result.response.ext_id == target_alert_ext_id
      - get_alert_result.ext_id == target_alert_ext_id
    success_msg: "Fetch target alert by ext_id passed"
    fail_msg: "Fetch target alert by ext_id failed"
  when: open_alerts | length > 0

- name: Fetch Alert with a non-existent ext_id (should fail)
  nutanix.ncp.ntnx_alerts_info_v2:
    ext_id: "{{ non_existent_alert_ext_id }}"
  register: result
  ignore_errors: true

- name: Fetch Alert with a non-existent ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
    success_msg: "Fetch Alert with non-existent ext_id failed as expected"
    fail_msg: "Fetch Alert with non-existent ext_id did not fail as expected"

- name: Fetch Alert with mutually exclusive ext_id + filter (should fail)
  nutanix.ncp.ntnx_alerts_info_v2:
    ext_id: "{{ non_existent_alert_ext_id }}"
    filter: "severity eq 'kInfo'"
  register: result
  ignore_errors: true

- name: Fetch Alert with mutually exclusive ext_id + filter status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - "'mutually exclusive' in result.msg"
    success_msg: "Mutually exclusive ext_id+filter failed as expected"
    fail_msg: "Mutually exclusive ext_id+filter did not fail as expected"

########################################################################################
# 3. Manage Alert (Action) — check_mode + argument-validation coverage
########################################################################################

- name: Acknowledge alert in check_mode with all attributes
  nutanix.ncp.ntnx_alert_v2:
    state: present
    ext_id: "{{ target_alert_ext_id | default(non_existent_alert_ext_id) }}"
    action_type: ACKNOWLEDGE
  check_mode: true
  register: result
  ignore_errors: true

- name: Acknowledge alert in check_mode status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.action_type == "ACKNOWLEDGE"
      - result.ext_id == (target_alert_ext_id | default(non_existent_alert_ext_id))
    success_msg: "Acknowledge alert in check_mode passed"
    fail_msg: "Acknowledge alert in check_mode failed"

- name: Resolve alert in check_mode with all attributes
  nutanix.ncp.ntnx_alert_v2:
    state: present
    ext_id: "{{ target_alert_ext_id | default(non_existent_alert_ext_id) }}"
    action_type: RESOLVE
  check_mode: true
  register: result
  ignore_errors: true

- name: Resolve alert in check_mode status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.action_type == "RESOLVE"
      - result.ext_id == (target_alert_ext_id | default(non_existent_alert_ext_id))
    success_msg: "Resolve alert in check_mode passed"
    fail_msg: "Resolve alert in check_mode failed"

- name: Manage alert without ext_id (should fail argument validation)
  nutanix.ncp.ntnx_alert_v2:
    action_type: ACKNOWLEDGE
  register: result
  ignore_errors: true

- name: Manage alert without ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - "'missing required arguments: ext_id' in result.msg"
    success_msg: "Manage alert without ext_id failed as expected"
    fail_msg: "Manage alert without ext_id did not fail as expected"

- name: Manage alert without action_type (should fail argument validation)
  nutanix.ncp.ntnx_alert_v2:
    ext_id: "{{ non_existent_alert_ext_id }}"
  register: result
  ignore_errors: true

- name: Manage alert without action_type status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - "'missing required arguments: action_type' in result.msg"
    success_msg: "Manage alert without action_type failed as expected"
    fail_msg: "Manage alert without action_type did not fail as expected"

- name: Manage alert with invalid action_type (should fail choices validation)
  nutanix.ncp.ntnx_alert_v2:
    ext_id: "{{ non_existent_alert_ext_id }}"
    action_type: INVALID_ACTION
  register: result
  ignore_errors: true

- name: Manage alert with invalid action_type status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - "'value of action_type must be one of' in result.msg"
    success_msg: "Manage alert with invalid action_type failed as expected"
    fail_msg: "Manage alert with invalid action_type did not fail as expected"

- name: Manage alert with a non-existent ext_id (real API call — should fail)
  nutanix.ncp.ntnx_alert_v2:
    ext_id: "{{ non_existent_alert_ext_id }}"
    action_type: ACKNOWLEDGE
  register: result
  ignore_errors: true

- name: Manage alert with a non-existent ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - "'Api Exception raised while fetching alert info using ext_id' in result.msg"
    success_msg: "Manage alert with non-existent ext_id failed as expected"
    fail_msg: "Manage alert with non-existent ext_id did not fail as expected"

########################################################################################
# 4. Manage Alert (Action) — LIVE Acknowledge and Resolve on a real alert
#
# These blocks only execute when a non-resolved alert was found on the cluster.
########################################################################################

- name: LIVE Acknowledge and Resolve flow
  when: open_alerts | length > 0
  block:
    - name: Acknowledge the target alert (real API call)
      nutanix.ncp.ntnx_alert_v2:
        ext_id: "{{ target_alert_ext_id }}"
        action_type: ACKNOWLEDGE
      register: ack_result
      ignore_errors: true

    - name: Acknowledge the target alert status
      ansible.builtin.assert:
        that:
          - ack_result is defined
          - ack_result.failed == false
          - ack_result.changed == true
          - ack_result.ext_id == target_alert_ext_id
          - ack_result.task_ext_id is defined
          - ack_result.response is defined
          - ack_result.response.status == "SUCCEEDED"
        success_msg: "Acknowledge target alert passed"
        fail_msg: "Acknowledge target alert failed"

    - name: Fetch the alert again to confirm the acknowledgement
      nutanix.ncp.ntnx_alerts_info_v2:
        ext_id: "{{ target_alert_ext_id }}"
      register: after_ack_result
      ignore_errors: true

    - name: Fetch alert after acknowledgement status
      ansible.builtin.assert:
        that:
          - after_ack_result is defined
          - after_ack_result.failed == false
          - after_ack_result.response.ext_id == target_alert_ext_id
          - after_ack_result.response.is_acknowledged == true
          - after_ack_result.response.acknowledged_by_username | length > 0
        success_msg: "Alert acknowledgement reflected on read passed"
        fail_msg: "Alert acknowledgement not reflected on read"

    - name: Re-Acknowledge the alert (idempotency — server accepts repeat call)
      nutanix.ncp.ntnx_alert_v2:
        ext_id: "{{ target_alert_ext_id }}"
        action_type: ACKNOWLEDGE
      register: reack_result
      ignore_errors: true

    - name: Re-Acknowledge idempotency status
      ansible.builtin.assert:
        that:
          - reack_result is defined
          - reack_result.failed == false
          - reack_result.ext_id == target_alert_ext_id
          - reack_result.response is defined
          - reack_result.response.status == "SUCCEEDED"
        success_msg: "Re-Acknowledge idempotency passed"
        fail_msg: "Re-Acknowledge idempotency failed"

    - name: Resolve the target alert (real API call)
      nutanix.ncp.ntnx_alert_v2:
        ext_id: "{{ target_alert_ext_id }}"
        action_type: RESOLVE
      register: resolve_result
      ignore_errors: true

    - name: Resolve the target alert status
      ansible.builtin.assert:
        that:
          - resolve_result is defined
          - resolve_result.failed == false
          - resolve_result.changed == true
          - resolve_result.ext_id == target_alert_ext_id
          - resolve_result.task_ext_id is defined
          - resolve_result.response is defined
          - resolve_result.response.status == "SUCCEEDED"
        success_msg: "Resolve target alert passed"
        fail_msg: "Resolve target alert failed"

    - name: Fetch the alert again to confirm the resolution
      nutanix.ncp.ntnx_alerts_info_v2:
        ext_id: "{{ target_alert_ext_id }}"
      register: after_resolve_result
      ignore_errors: true

    - name: Fetch alert after resolution status
      ansible.builtin.assert:
        that:
          - after_resolve_result is defined
          - after_resolve_result.failed == false
          - after_resolve_result.response.ext_id == target_alert_ext_id
          - after_resolve_result.response.is_resolved == true
        success_msg: "Alert resolution reflected on read passed"
        fail_msg: "Alert resolution not reflected on read"

- name: End Alerts v4 tests
  ansible.builtin.debug:
    msg: End Alerts v4 tests
