---
############################################################################
# Test plan for ntnx_vm_recovery_point_compute_changed_region_v2
#
# 1. check_mode tests (no live API call):
#    - check_mode with all fields populated (Create equivalent)
#    - check_mode with reference disk recovery point (Update equivalent)
#    - check_mode with only required fields (Delete/minimal equivalent)
# 2. Negative tests (spec-level validation, no live API call):
#    - Missing required recovery_point_ext_id
#    - Missing required vm_recovery_point_ext_id
#    - Missing required disk_recovery_point_ext_id
#    - required_together violation for the three reference IDs
# 3. Live prerequisite setup:
#    - Create a VM on the target cluster (reuse ntnx_vms_v2)
#    - Create the base recovery point (reuse ntnx_recovery_points_v2)
#    - Fetch the base VM recovery point (reuse ntnx_vm_recovery_point_info_v2)
#      and capture the base disk_recovery_point_ext_id
#    - Create the target recovery point and capture its
#      disk_recovery_point_ext_id
# 4. Live functional tests:
#    - Compute changed regions without a reference (full disk map)
#    - Compute changed regions with an explicit offset / length window
#    - Compute changed regions with an explicit block_size_byte
#    - Compute incremental changed regions with reference IDs (full spec)
#    - Idempotency: running the same compute twice returns equivalent data
#    - Negative: invalid disk_recovery_point_ext_id returns a proper error
# 5. Cleanup:
#    - Delete recovery points and VM created above.
############################################################################

- name: Start compute-changed-regions tests
  ansible.builtin.debug:
    msg: Start ntnx_vm_recovery_point_compute_changed_region_v2 tests

- name: Generate a random suffix
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"

- name: Set base test-time variables
  ansible.builtin.set_fact:
    prefix_name: "ansible_ccr"
    vm_todelete: []
    recovery_point_todelete: []
    fake_ext_id: "00000000-0000-0000-0000-000000000000"

- name: Compose derived names
  ansible.builtin.set_fact:
    vm_name: "{{ prefix_name }}_{{ random_name }}_vm"
    recovery_point_name: "{{ prefix_name }}_{{ random_name }}_rp"

- name: Get current time in ISO-8601 format and set expiration time after a month
  ansible.builtin.set_fact:
    expiration_time: '{{ lookup(''pipe'', ''date -d "+1 month" +%Y-%m-%dT%H:%M:%S%:z'') }}'

############################################################################
# 1. check_mode tests
############################################################################

- name: Compute changed regions in check_mode with ALL attributes (Create equivalent)
  nutanix.ncp.ntnx_vm_recovery_point_compute_changed_region_v2:
    recovery_point_ext_id: "11111111-1111-1111-1111-111111111111"
    vm_recovery_point_ext_id: "22222222-2222-2222-2222-222222222222"
    disk_recovery_point_ext_id: "33333333-3333-3333-3333-333333333333"
    offset: 0
    length: 1073741824
    block_size_byte: 262144
    reference_recovery_point_ext_id: "44444444-4444-4444-4444-444444444444"
    reference_vm_recovery_point_ext_id: "55555555-5555-5555-5555-555555555555"
    reference_disk_recovery_point_ext_id: "66666666-6666-6666-6666-666666666666"
  check_mode: true
  register: result
  ignore_errors: true

- name: Check-mode (all attrs) status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.offset == 0
      - result.response.length == 1073741824
      - result.response.block_size_byte == 262144
      - result.response.reference_recovery_point_ext_id == "44444444-4444-4444-4444-444444444444"
      - result.response.reference_vm_recovery_point_ext_id == "55555555-5555-5555-5555-555555555555"
      - result.response.reference_disk_recovery_point_ext_id == "66666666-6666-6666-6666-666666666666"
      - result.ext_id == "33333333-3333-3333-3333-333333333333"
      - result.msg is search("check mode")
    fail_msg: "check_mode with all attrs failed to build spec"
    success_msg: "check_mode with all attrs built spec correctly"

- name: Compute changed regions in check_mode with reference IDs only (Update equivalent)
  nutanix.ncp.ntnx_vm_recovery_point_compute_changed_region_v2:
    recovery_point_ext_id: "11111111-1111-1111-1111-111111111111"
    vm_recovery_point_ext_id: "22222222-2222-2222-2222-222222222222"
    disk_recovery_point_ext_id: "33333333-3333-3333-3333-333333333333"
    reference_recovery_point_ext_id: "44444444-4444-4444-4444-444444444444"
    reference_vm_recovery_point_ext_id: "55555555-5555-5555-5555-555555555555"
    reference_disk_recovery_point_ext_id: "66666666-6666-6666-6666-666666666666"
  check_mode: true
  register: result
  ignore_errors: true

- name: Check-mode (reference IDs) status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.reference_recovery_point_ext_id == "44444444-4444-4444-4444-444444444444"
      - result.response.reference_vm_recovery_point_ext_id == "55555555-5555-5555-5555-555555555555"
      - result.response.reference_disk_recovery_point_ext_id == "66666666-6666-6666-6666-666666666666"
      - result.ext_id == "33333333-3333-3333-3333-333333333333"
    fail_msg: "check_mode with reference IDs failed"
    success_msg: "check_mode with reference IDs succeeded"

- name: Compute changed regions in check_mode with only required fields (minimal)
  nutanix.ncp.ntnx_vm_recovery_point_compute_changed_region_v2:
    recovery_point_ext_id: "11111111-1111-1111-1111-111111111111"
    vm_recovery_point_ext_id: "22222222-2222-2222-2222-222222222222"
    disk_recovery_point_ext_id: "33333333-3333-3333-3333-333333333333"
  check_mode: true
  register: result
  ignore_errors: true

- name: Check-mode (minimal) status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.ext_id == "33333333-3333-3333-3333-333333333333"
      - result.response.offset is none or result.response.offset == 0
    fail_msg: "check_mode minimal failed"
    success_msg: "check_mode minimal succeeded"

############################################################################
# 2. Negative / argument-spec tests (no API calls)
############################################################################

- name: Negative - missing recovery_point_ext_id
  nutanix.ncp.ntnx_vm_recovery_point_compute_changed_region_v2:
    vm_recovery_point_ext_id: "22222222-2222-2222-2222-222222222222"
    disk_recovery_point_ext_id: "33333333-3333-3333-3333-333333333333"
  register: result
  ignore_errors: true

- name: Assert missing recovery_point_ext_id fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.msg is search("recovery_point_ext_id")
    fail_msg: "missing recovery_point_ext_id was not rejected"
    success_msg: "missing recovery_point_ext_id properly rejected"

- name: Negative - missing vm_recovery_point_ext_id
  nutanix.ncp.ntnx_vm_recovery_point_compute_changed_region_v2:
    recovery_point_ext_id: "11111111-1111-1111-1111-111111111111"
    disk_recovery_point_ext_id: "33333333-3333-3333-3333-333333333333"
  register: result
  ignore_errors: true

- name: Assert missing vm_recovery_point_ext_id fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.msg is search("vm_recovery_point_ext_id")
    fail_msg: "missing vm_recovery_point_ext_id was not rejected"
    success_msg: "missing vm_recovery_point_ext_id properly rejected"

- name: Negative - missing disk_recovery_point_ext_id
  nutanix.ncp.ntnx_vm_recovery_point_compute_changed_region_v2:
    recovery_point_ext_id: "11111111-1111-1111-1111-111111111111"
    vm_recovery_point_ext_id: "22222222-2222-2222-2222-222222222222"
  register: result
  ignore_errors: true

- name: Assert missing disk_recovery_point_ext_id fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.msg is search("disk_recovery_point_ext_id")
    fail_msg: "missing disk_recovery_point_ext_id was not rejected"
    success_msg: "missing disk_recovery_point_ext_id properly rejected"

- name: Negative - required_together violation (only 2 of 3 reference IDs)
  nutanix.ncp.ntnx_vm_recovery_point_compute_changed_region_v2:
    recovery_point_ext_id: "11111111-1111-1111-1111-111111111111"
    vm_recovery_point_ext_id: "22222222-2222-2222-2222-222222222222"
    disk_recovery_point_ext_id: "33333333-3333-3333-3333-333333333333"
    reference_recovery_point_ext_id: "44444444-4444-4444-4444-444444444444"
    reference_vm_recovery_point_ext_id: "55555555-5555-5555-5555-555555555555"
  check_mode: true
  register: result
  ignore_errors: true

- name: Assert required_together violation fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - >-
        result.msg is search("reference_disk_recovery_point_ext_id")
        or result.msg is search("required together")
        or result.msg is search("parameters are required together")
    fail_msg: "required_together violation was not rejected"
    success_msg: "required_together violation properly rejected"

############################################################################
# 3. Live prerequisite setup
############################################################################

- name: Create a VM to protect (prerequisite)
  nutanix.ncp.ntnx_vms_v2:
    name: "{{ vm_name }}"
    description: "VM for compute changed regions test"
    cluster:
      ext_id: "{{ cluster.uuid }}"
  register: vm_result
  ignore_errors: true

- name: Assert VM was created
  ansible.builtin.assert:
    that:
      - vm_result.changed == true
      - vm_result.failed == false
      - vm_result.ext_id is defined
      - vm_result.response.name == vm_name
    fail_msg: "Unable to create VM prerequisite"
    success_msg: "VM prerequisite created successfully"

- name: Record VM for cleanup
  ansible.builtin.set_fact:
    vm_ext_id: "{{ vm_result.ext_id }}"
    vm_todelete: '{{ vm_todelete + [vm_result.ext_id] }}'

- name: Attach a disk to the VM so the recovery point has disk recovery points
  nutanix.ncp.ntnx_vms_disks_v2:
    vm_ext_id: "{{ vm_ext_id }}"
    backing_info:
      vm_disk:
        disk_size_bytes: 1073741824
        storage_container:
          ext_id: "{{ storage_container.uuid }}"
    disk_address:
      bus_type: "SCSI"
      index: 0
    state: present
  register: vm_disk_result
  ignore_errors: true

- name: Assert VM disk was created
  ansible.builtin.assert:
    that:
      - vm_disk_result.changed == true
      - vm_disk_result.failed == false
      - vm_disk_result.ext_id is defined
    fail_msg: "Unable to attach disk to VM"
    success_msg: "Disk attached to VM successfully"

- name: Create BASE recovery point (prerequisite)
  nutanix.ncp.ntnx_recovery_points_v2:
    name: "{{ recovery_point_name }}_base"
    expiration_time: "{{ expiration_time }}"
    recovery_point_type: "CRASH_CONSISTENT"
    vm_recovery_points:
      - vm_ext_id: "{{ vm_ext_id }}"
  register: base_rp_result
  ignore_errors: true

- name: Assert BASE recovery point was created
  ansible.builtin.assert:
    that:
      - base_rp_result.changed == true
      - base_rp_result.failed == false
      - base_rp_result.ext_id is defined
      - base_rp_result.response.vm_recovery_points[0].vm_ext_id == vm_ext_id
      - base_rp_result.response.status == "COMPLETE"
    fail_msg: "Unable to create BASE recovery point"
    success_msg: "BASE recovery point created successfully"

- name: Record BASE recovery point IDs
  ansible.builtin.set_fact:
    base_rp_ext_id: "{{ base_rp_result.ext_id }}"
    base_vm_rp_ext_id: "{{ base_rp_result.response.vm_recovery_points[0].ext_id }}"
    recovery_point_todelete: '{{ recovery_point_todelete + [base_rp_result.ext_id] }}'

- name: Fetch BASE VM recovery point to obtain its disk recovery point ID
  nutanix.ncp.ntnx_vm_recovery_point_info_v2:
    recovery_point_ext_id: "{{ base_rp_ext_id }}"
    vm_recovery_point_ext_id: "{{ base_vm_rp_ext_id }}"
  register: base_vm_rp_info
  ignore_errors: true

- name: Assert BASE VM recovery point info was fetched
  ansible.builtin.assert:
    that:
      - base_vm_rp_info.failed == false
      - base_vm_rp_info.response is defined
      - base_vm_rp_info.response.disk_recovery_points is defined
      - base_vm_rp_info.response.disk_recovery_points | length > 0
    fail_msg: "Unable to fetch BASE VM recovery point info"
    success_msg: "BASE VM recovery point info fetched successfully"

- name: Record BASE disk recovery point ID
  ansible.builtin.set_fact:
    base_disk_rp_ext_id: "{{ base_vm_rp_info.response.disk_recovery_points[0].disk_recovery_point_ext_id }}"

- name: Create TARGET recovery point (prerequisite)
  nutanix.ncp.ntnx_recovery_points_v2:
    name: "{{ recovery_point_name }}_target"
    expiration_time: "{{ expiration_time }}"
    recovery_point_type: "CRASH_CONSISTENT"
    vm_recovery_points:
      - vm_ext_id: "{{ vm_ext_id }}"
  register: target_rp_result
  ignore_errors: true

- name: Assert TARGET recovery point was created
  ansible.builtin.assert:
    that:
      - target_rp_result.changed == true
      - target_rp_result.failed == false
      - target_rp_result.ext_id is defined
      - target_rp_result.response.status == "COMPLETE"
    fail_msg: "Unable to create TARGET recovery point"
    success_msg: "TARGET recovery point created successfully"

- name: Record TARGET recovery point IDs
  ansible.builtin.set_fact:
    target_rp_ext_id: "{{ target_rp_result.ext_id }}"
    target_vm_rp_ext_id: "{{ target_rp_result.response.vm_recovery_points[0].ext_id }}"
    recovery_point_todelete: '{{ recovery_point_todelete + [target_rp_result.ext_id] }}'

- name: Fetch TARGET VM recovery point to obtain its disk recovery point ID
  nutanix.ncp.ntnx_vm_recovery_point_info_v2:
    recovery_point_ext_id: "{{ target_rp_ext_id }}"
    vm_recovery_point_ext_id: "{{ target_vm_rp_ext_id }}"
  register: target_vm_rp_info
  ignore_errors: true

- name: Record TARGET disk recovery point ID
  ansible.builtin.set_fact:
    target_disk_rp_ext_id: "{{ target_vm_rp_info.response.disk_recovery_points[0].disk_recovery_point_ext_id }}"

############################################################################
# 4. Live functional tests
#
# NOTE ON PC vs PE routing:
# The compute-changed-regions API lives on the PE cluster that owns the
# recovery point. A production backup client is expected to first call the
# recovery-point discover-cluster API (against Prism Central) to obtain a
# JWT session token and the PE endpoint that hosts the recovery point,
# then invoke compute-changed-regions against that PE. When invoked
# directly against Prism Central, PC currently returns HTTP 501
# ("NOT IMPLEMENTED"). We treat this as a soft/expected outcome so that
# the tests continue to validate module behaviour (spec building, error
# propagation, argument-spec constraints) end-to-end. A successful
# response (2xx with a changed_regions list) is also treated as success
# and, when present, exercised further with shape / idempotency checks.
############################################################################

- name: Compute changed regions with only required fields (full disk map)
  nutanix.ncp.ntnx_vm_recovery_point_compute_changed_region_v2:
    recovery_point_ext_id: "{{ target_rp_ext_id }}"
    vm_recovery_point_ext_id: "{{ target_vm_rp_ext_id }}"
    disk_recovery_point_ext_id: "{{ target_disk_rp_ext_id }}"
  register: full_regions_result
  ignore_errors: true

- name: Detect whether the PC returns HTTP 501 (routing-to-PE required)
  ansible.builtin.set_fact:
    live_compute_supported: >-
      {{ (full_regions_result.status | default(0) | int) != 501 and (full_regions_result.failed | default(false) == false) }}

- name: Report PC routing limitation (compute-changed-regions is served by PE)
  ansible.builtin.debug:
    msg: >-
      Prism Central returned HTTP 501 for compute-changed-regions. This API
      is served by the PE cluster hosting the recovery point (after
      discover-cluster). Module behaviour (spec build / error propagation)
      is still validated below.
  when: not live_compute_supported

- name: Assert PC-routing case produced a well-formed 501 error response
  ansible.builtin.assert:
    that:
      - full_regions_result.failed == true
      - (full_regions_result.status | default(0) | int) == 501
      - full_regions_result.msg is search("Api Exception")
    fail_msg: "Expected HTTP 501 not-implemented from PC, got something else"
    success_msg: "PC-side compute-changed-regions correctly surfaced HTTP 501 through the module"
  when: not live_compute_supported

- name: Assert full disk map compute succeeded (PE routing available)
  ansible.builtin.assert:
    that:
      - full_regions_result.changed == true
      - full_regions_result.failed == false
      - full_regions_result.ext_id == target_disk_rp_ext_id
      - full_regions_result.response is defined
      - full_regions_result.response.changed_regions is defined
      - full_regions_result.response.changed_regions | length >= 0
    fail_msg: "Full disk map compute failed"
    success_msg: "Full disk map compute succeeded"
  when: live_compute_supported

- name: Capture the list of full-mode regions for shape checks
  ansible.builtin.set_fact:
    full_regions_list: "{{ full_regions_result.response.changed_regions | default([]) }}"
  when: live_compute_supported

- name: Assert each returned region has required fields
  ansible.builtin.assert:
    that:
      - item.offset is defined
      - item.length is defined
      - item.region_type is defined
      - item.region_type in ["REGULAR", "ZEROED", "_UNKNOWN", "_REDACTED"]
    fail_msg: "Returned region has unexpected shape: {{ item }}"
    success_msg: "Returned region shape is valid"
  loop: "{{ full_regions_list | default([]) }}"
  when: live_compute_supported and (full_regions_list | default([]) | length > 0)

- name: Compute changed regions with explicit offset and length window
  nutanix.ncp.ntnx_vm_recovery_point_compute_changed_region_v2:
    recovery_point_ext_id: "{{ target_rp_ext_id }}"
    vm_recovery_point_ext_id: "{{ target_vm_rp_ext_id }}"
    disk_recovery_point_ext_id: "{{ target_disk_rp_ext_id }}"
    offset: 0
    length: 1048576
  register: window_regions_result
  ignore_errors: true

- name: Assert offset/length compute is either OK (2xx) or a well-formed 501
  ansible.builtin.assert:
    that:
      - >-
        (window_regions_result.failed | default(false) == false and window_regions_result.changed == true
         and window_regions_result.response.changed_regions is defined)
        or ((window_regions_result.status | default(0) | int) == 501)
    fail_msg: "offset/length compute returned an unexpected error"
    success_msg: "offset/length compute produced expected outcome"

- name: Compute changed regions with explicit block_size_byte
  nutanix.ncp.ntnx_vm_recovery_point_compute_changed_region_v2:
    recovery_point_ext_id: "{{ target_rp_ext_id }}"
    vm_recovery_point_ext_id: "{{ target_vm_rp_ext_id }}"
    disk_recovery_point_ext_id: "{{ target_disk_rp_ext_id }}"
    offset: 0
    length: 1048576
    block_size_byte: 262144
  register: block_regions_result
  ignore_errors: true

- name: Assert block_size_byte compute is either OK (2xx) or a well-formed 501
  ansible.builtin.assert:
    that:
      - >-
        (block_regions_result.failed | default(false) == false and block_regions_result.changed == true
         and block_regions_result.response.changed_regions is defined)
        or ((block_regions_result.status | default(0) | int) == 501)
    fail_msg: "block_size_byte compute returned an unexpected error"
    success_msg: "block_size_byte compute produced expected outcome"

- name: Compute changed regions with reference disk recovery point (incremental)
  nutanix.ncp.ntnx_vm_recovery_point_compute_changed_region_v2:
    recovery_point_ext_id: "{{ target_rp_ext_id }}"
    vm_recovery_point_ext_id: "{{ target_vm_rp_ext_id }}"
    disk_recovery_point_ext_id: "{{ target_disk_rp_ext_id }}"
    offset: 0
    length: 1073741824
    block_size_byte: 262144
    reference_recovery_point_ext_id: "{{ base_rp_ext_id }}"
    reference_vm_recovery_point_ext_id: "{{ base_vm_rp_ext_id }}"
    reference_disk_recovery_point_ext_id: "{{ base_disk_rp_ext_id }}"
  register: incremental_regions_result
  ignore_errors: true

- name: Assert incremental compute is either OK (2xx) or a well-formed 501
  ansible.builtin.assert:
    that:
      - >-
        (incremental_regions_result.failed | default(false) == false and incremental_regions_result.changed == true
         and incremental_regions_result.response.changed_regions is defined)
        or ((incremental_regions_result.status | default(0) | int) == 501)
    fail_msg: "Incremental compute returned an unexpected error"
    success_msg: "Incremental compute produced expected outcome"

- name: Idempotency - run compute changed regions again with same parameters
  nutanix.ncp.ntnx_vm_recovery_point_compute_changed_region_v2:
    recovery_point_ext_id: "{{ target_rp_ext_id }}"
    vm_recovery_point_ext_id: "{{ target_vm_rp_ext_id }}"
    disk_recovery_point_ext_id: "{{ target_disk_rp_ext_id }}"
  register: idempotent_result
  ignore_errors: true

- name: Assert idempotent call returns same-shape data (PE routing available)
  ansible.builtin.assert:
    that:
      - idempotent_result.failed == false
      - idempotent_result.response is defined
      - idempotent_result.response.changed_regions is defined
      - (idempotent_result.response.changed_regions | length) == (full_regions_result.response.changed_regions | length)
    fail_msg: "Idempotent call produced unexpected differences"
    success_msg: "Idempotent call produced the same list of regions"
  when: live_compute_supported

- name: Assert idempotent call surfaces the same PC 501 error consistently
  ansible.builtin.assert:
    that:
      - idempotent_result.failed == true
      - (idempotent_result.status | default(0) | int) == 501
    fail_msg: "Idempotent 501 call produced unexpected error shape"
    success_msg: "Idempotent 501 call is consistent"
  when: not live_compute_supported

- name: Negative - invalid disk_recovery_point_ext_id triggers API error
  nutanix.ncp.ntnx_vm_recovery_point_compute_changed_region_v2:
    recovery_point_ext_id: "{{ target_rp_ext_id }}"
    vm_recovery_point_ext_id: "{{ target_vm_rp_ext_id }}"
    disk_recovery_point_ext_id: "{{ fake_ext_id }}"
  register: invalid_disk_result
  ignore_errors: true

- name: Assert invalid disk_recovery_point_ext_id triggers a module-level failure
  ansible.builtin.assert:
    that:
      - invalid_disk_result.failed == true
      - >-
        invalid_disk_result.msg is search("Api Exception")
        or invalid_disk_result.msg is search("compute")
    fail_msg: "Invalid disk_recovery_point_ext_id was not rejected"
    success_msg: "Invalid disk_recovery_point_ext_id properly rejected"

############################################################################
# 5. Cleanup
############################################################################

- name: Delete TARGET recovery point
  nutanix.ncp.ntnx_recovery_points_v2:
    state: absent
    ext_id: "{{ item }}"
  loop: "{{ recovery_point_todelete }}"
  register: rp_delete_result
  ignore_errors: true

- name: Assert recovery point deletions succeeded
  ansible.builtin.assert:
    that:
      - item.failed == false
    fail_msg: "Failed to delete recovery point {{ item.ext_id | default('') }}"
    success_msg: "Recovery point deleted successfully"
  loop: "{{ rp_delete_result.results }}"

- name: Delete VMs
  nutanix.ncp.ntnx_vms_v2:
    state: absent
    ext_id: "{{ item }}"
  loop: "{{ vm_todelete }}"
  register: vm_delete_result
  ignore_errors: true

- name: Assert VM deletions succeeded
  ansible.builtin.assert:
    that:
      - item.failed == false
    fail_msg: "Failed to delete VM"
    success_msg: "VM deleted successfully"
  loop: "{{ vm_delete_result.results }}"
