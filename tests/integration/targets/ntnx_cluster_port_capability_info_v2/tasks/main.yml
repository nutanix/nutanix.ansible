---
- name: Set module defaults for port capability info
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip }}"
      nutanix_username: "{{ username | default(omit) }}"
      nutanix_password: "{{ password | default(omit) }}"
      validate_certs: "{{ validate_certs }}"
  block:
    - name: Get port capability
      nutanix.ncp.ntnx_cluster_port_capability_info_v2:
        cluster_ext_id: "{{ cluster_ext_id | default('00061de6-4a87-6b06-185b-ac1f6b6f97e2') }}"
      register: result
      ignore_errors: true

    - name: Assert
      ansible.builtin.assert:
        that:
          - result is defined
