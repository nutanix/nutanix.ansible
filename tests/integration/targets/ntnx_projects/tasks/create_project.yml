---
# Variables required before running this playbook:
# - cluster
# - network
# - static
# - overlay
# - vpc
# - accounts
# - users
# - user_groups
# - project
# - todelete

- name: Start ntnx_project create tests
  ansible.builtin.debug:
    msg: "Start ntnx_project create tests"

- name: Generate random project_name
  ansible.builtin.set_fact:
    random_name: "{{query('community.general.random_string',numbers=false, special=false,length=12)[0]}}"

- name: Define suffix name variable
  ansible.builtin.set_fact:
    suffix_name: "ansible-role-mapping"

- name: Define project name variables
  ansible.builtin.set_fact:
    project1_name: "{{random_name}}{{suffix_name}}1"
    project2_name: "{{random_name}}{{suffix_name}}2"

- name: Create Project with minimal spec
  nutanix.ncp.ntnx_projects:
    name: "{{project1_name}}"
  register: result
  ignore_errors: true

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.response.status.state == 'COMPLETE'
      - result.response.status.name == "{{project1_name}}"
    fail_msg: "Unable to create project with minimal spec"
    success_msg: "Project with minimal spec created successfully"

- name: Add project uuid to delete list
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [  result.project_uuid ] }}"

#################################################################

- name: Create Project with check mode
  nutanix.ncp.ntnx_projects:
    name: "{{project2_name}}"
    desc: desc-123
    subnets:
      - name: "{{ network.dhcp.name }}"
      - uuid: "{{ static.uuid }}"
    default_subnet:
      name: "{{ network.dhcp.name }}"
    users:
      - "{{ users[0] }}"
      - "{{ users[1] }}"
    external_user_groups:
      - "{{ user_groups[0] }}"
  register: result
  ignore_errors: true
  check_mode: true

- name: Check mode Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.response.spec.name == "{{project2_name}}"
      - result.response.spec.description == 'desc-123'
      - result.response.spec.resources.user_reference_list[0].uuid == "{{ users[0] }}"
      - result.response.spec.resources.user_reference_list[1].uuid == "{{ users[1] }}"
      - result.response.spec.resources.external_user_group_reference_list[0].uuid == "{{ user_groups[0] }}"
      - result.response.spec.resources.subnet_reference_list[0].uuid == "{{ network.dhcp.uuid }}"
      - result.response.spec.resources.subnet_reference_list[1].uuid == "{{ static.uuid }}"
      - result.response.spec.resources.default_subnet_reference.uuid == "{{ network.dhcp.uuid }}"

    fail_msg: "Check mode failed"
    success_msg: "Check mode operation output verified successfully"

#################################################################

- name: Create Project with all specs
  nutanix.ncp.ntnx_projects:
    name: "{{project2_name}}"
    desc: desc-123
    collaboration: true
    directory_reference_list:
      - kind: directory_service
        uuid: "{{ open_ldap_uuid }}"
      - kind: directory_service
        uuid: "{{ directory_service_uuid }}"
    clusters:
      - "{{ cluster.uuid }}"
    subnets:
      - name: "{{ network.dhcp.name }}"
      - uuid: "{{ static.uuid }}"
      - name: "{{ overlay.name }}"
    default_subnet:
      name: "{{ network.dhcp.name }}"
    accounts:
      - name: "{{accounts[0].name}}"
    vpcs:
      - name: "{{vpc.name}}"
    role_mappings:
      - role:
          name: "{{ role_mappings[0] }}"
        user:
          uuid: "{{ users[0] }}"
      - role:
          name: "{{ role_mappings[1] }}"
        user:
          uuid: "{{ users[1] }}"
      - role:
          name: "{{ role_mappings[1] }}"
        user_group:
          uuid: "{{ user_groups[0] }}"
  register: result
  ignore_errors: true

- name: Set expected subnets and users
  ansible.builtin.set_fact:
    expected_subnets:
      ["{{ network.dhcp.uuid }}", "{{ static.uuid }}", "{{ overlay.uuid }}"]
    expected_users: ["{{ users[0] }}", "{{ users[1] }}"]
    actual_subnet_uuids: "{{ result.response.status.project_status.resources.subnet_reference_list | map(attribute='uuid') | list }}"
    response_acp: "{{ result.response.status.access_control_policy_list_status[0].access_control_policy_status.resources }}"
  when:
    - result.response is defined
    - result.response.status is defined
    - result.response.status.project_status is defined

- name: Debug create project response resources
  ansible.builtin.debug:
    var: result.response.status.project_status.resources
  when:
    - result.response is defined
    - result.response.status is defined
    - result.response.status.project_status is defined

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.response.status.state == 'COMPLETE'
      - result.response.status.project_status.name == "{{project2_name}}"
      - result.response.status.project_status.description == 'desc-123'
      - result.response.status.project_status.resources.subnet_reference_list | length == 3
      - expected_subnets | difference(actual_subnet_uuids) | length == 0
      - actual_subnet_uuids | difference(expected_subnets) | length == 0
      - result.response.status.project_status.resources.default_subnet_reference.uuid == "{{ network.dhcp.uuid }}"
      - result.response.status.project_status.resources.cluster_reference_list[0].uuid == "{{ cluster.uuid }}"
      - result.response.status.project_status.resources.vpc_reference_list[0].uuid == "{{ vpc.uuid }}"
      - result.response.status.project_status.resources.account_reference_list[0].uuid == "{{ accounts[0].uuid }}"
      - result.response.status.project_status.resources.directory_reference_list[0].uuid == "{{ open_ldap_uuid }}"
      - result.response.status.access_control_policy_list_status | length >= 1
      - response_acp.user_reference_list[0].uuid in expected_users

    fail_msg: "Unable to create project with all specifications"
    success_msg: "Project with all specifications created successfully"

- name: Add project uuid to delete list
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [  result.project_uuid ] }}"

#################################################################
- name: Create Project with already existing project name
  nutanix.ncp.ntnx_projects:
    name: "{{ project.name }}"
  register: result
  ignore_errors: true

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - "'Project with given name already exists' in result.msg"
    fail_msg: "Project create didn't failed when existing project name given"
    success_msg: "Project create errored out successfully when existing project name given"

#################################################################
- name: Delete all Created Projects
  nutanix.ncp.ntnx_projects:
    state: absent
    project_uuid: "{{ item }}"
  register: result
  loop: "{{ todelete }}"
  ignore_errors: true

- name: Reset todelete list
  ansible.builtin.set_fact:
    todelete: []
