---
# Variables required before running this playbook:
# - cluster
# - network
# - static
# - vpc
# - accounts
# - users
# - user_groups
# - project
# - todelete

- name: Start ntnx_project update tests
  ansible.builtin.debug:
    msg: "Start ntnx_project update tests"

- name: Generate random project_name
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"

- name: Define suffix name variable
  ansible.builtin.set_fact:
    suffix_name: "ansible-role-mapping"

- name: Define project name variable
  ansible.builtin.set_fact:
    project1_name: "{{ random_name }}{{ suffix_name }}1"

- name: Create Project
  nutanix.ncp.ntnx_projects:
    name: "{{ project1_name }}"
    desc: desc-123
    directory_reference_list:
      - kind: directory_service
        uuid: "{{ open_ldap_uuid }}"
      - kind: directory_service
        uuid: "{{ directory_service_uuid }}"
    subnets:
      - name: "{{ network.dhcp.name }}"
    default_subnet:
      name: "{{ network.dhcp.name }}"
    users:
      - "{{ users[0] }}"
  register: result
  ignore_errors: true

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.response.status.state == 'COMPLETE'
    fail_msg: "Unable to create project"
    success_msg: "Project created successfully"

- name: Add project uuid to delete list
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [result.project_uuid] }}"
#################################################################

- name: Check check mode for update
  nutanix.ncp.ntnx_projects:
    project_uuid: "{{ result.project_uuid }}"
    desc: desc-123-updated
    collaboration: true
    directory_reference_list:
      - kind: directory_service
        uuid: "{{ open_ldap_uuid }}"
      - kind: directory_service
        uuid: "{{ directory_service_uuid }}"
    clusters:
      - "{{ cluster.uuid }}"
    subnets:
      - uuid: "{{ static.uuid }}"
    default_subnet:
      uuid: "{{ static.uuid }}"
    role_mappings:
      - role:
          name: "{{ role_mappings[0] }}"
        user:
          uuid: "{{ users[1] }}"
      - role:
          name: "{{ role_mappings[0] }}"
        user_group:
          uuid: "{{ user_groups[0] }}"
  register: result
  ignore_errors: true
  check_mode: true

- name: Check mode Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.response.spec.project_detail.description == 'desc-123-updated'
      - result.response.spec.project_detail.resources.subnet_reference_list | length == 1
      - result.response.spec.project_detail.resources.subnet_reference_list[0].uuid in ["{{ static.uuid }}"]
      - result.response.spec.project_detail.resources.default_subnet_reference.uuid == "{{ static.uuid }}"
      - result.response.spec.project_detail.resources.cluster_reference_list[0].uuid == "{{ cluster.uuid }}"
      - result.response.spec.access_control_policy_list | length >= 1
    fail_msg: "Check mode response for update is incorrect"
    success_msg: "Check mode response for update verified successfully"

#################################################################

- name: Update project, users, quotas and add vpcs
  nutanix.ncp.ntnx_projects:
    project_uuid: "{{ result.project_uuid }}"
    desc: desc-123-updated
    collaboration: true
    directory_reference_list:
      - kind: directory_service
        uuid: "{{ open_ldap_uuid }}"
      - kind: directory_service
        uuid: "{{ directory_service_uuid }}"
    clusters:
      - "{{ cluster.uuid }}"
    subnets:
      - name: "{{ network.dhcp.name }}"
    default_subnet:
      uuid: "{{ static.uuid }}"
    role_mappings:
      - role:
          name: "{{ role_mappings[0] }}"
        user:
          uuid: "{{ users[1] }}"
      - role:
          name: "{{ role_mappings[0] }}"
        user_group:
          uuid: "{{ user_groups[0] }}"
    accounts:
      - uuid: "{{ accounts[0].uuid }}"
    vpcs:
      - uuid: "{{ vpc.uuid }}"
  register: result
  ignore_errors: true

- name: Debug update project response resources
  ansible.builtin.debug:
    var: result.response.status.project_status.resources
  when:
    - result.response is defined
    - result.response is mapping
    - result.response.status is defined
    - result.response.status.project_status is defined

- name: Update Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.response is mapping
      - result.failed == false
      - result.changed == true
      - result.response.status.state == 'COMPLETE'
      - result.response.status.project_status.description == 'desc-123-updated'
      - result.response.status.project_status.resources.subnet_reference_list | length == 2
      - result.response.status.project_status.resources.subnet_reference_list[0].uuid in ["{{ static.uuid }}", "{{ network.dhcp.uuid }}"]
      - result.response.status.project_status.resources.subnet_reference_list[1].uuid in ["{{ static.uuid }}", "{{ network.dhcp.uuid }}"]
      - result.response.status.project_status.resources.default_subnet_reference.uuid == "{{ static.uuid }}"
      - result.response.status.project_status.resources.cluster_reference_list[0].uuid == "{{ cluster.uuid }}"
      - result.response.status.project_status.resources.vpc_reference_list[0].uuid == "{{ vpc.uuid }}"
      - result.response.status.project_status.resources.account_reference_list[0].uuid == "{{ accounts[0].uuid }}"
      - result.response.status.project_status.resources.user_reference_list | length > 0
      - result.response.status.project_status.resources.external_user_group_reference_list | length > 0
      - users[1] in (result.response.status.project_status.resources.user_reference_list | map(attribute='uuid') | list)
      - user_groups[0] in (result.response.status.project_status.resources.external_user_group_reference_list | map(attribute='uuid') | list)

    fail_msg: "Project update failed"
    success_msg: "Project updated successfully"

#################################################################

- name: Idempotency check
  nutanix.ncp.ntnx_projects:
    project_uuid: "{{ result.project_uuid }}"
    desc: desc-123-updated
    collaboration: true
    directory_reference_list:
      - kind: directory_service
        uuid: "{{ open_ldap_uuid }}"
      - kind: directory_service
        uuid: "{{ directory_service_uuid }}"
    clusters:
      - "{{ cluster.uuid }}"
    subnets:
      - name: "{{ network.dhcp.name }}"
      - uuid: "{{ static.uuid }}"
    default_subnet:
      uuid: "{{ static.uuid }}"
    role_mappings:
      - role:
          name: "{{ role_mappings[0] }}"
        user:
          uuid: "{{ users[1] }}"
      - role:
          name: "{{ role_mappings[0] }}"
        user_group:
          uuid: "{{ user_groups[0] }}"
    accounts:
      - name: "{{ accounts[0].name }}"
    vpcs:
      - uuid: "{{ vpc.uuid }}"
  register: result
  ignore_errors: true

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - "'Nothing to update' in result.msg"
    fail_msg: "Project update didnt got skipped for update spec same as existing project"
    success_msg: "Project got skipped successfully for no change in spec"

#################################################################

- name: Delete all Created Projects
  nutanix.ncp.ntnx_projects:
    state: absent
    project_uuid: "{{ item }}"
  register: result
  loop: "{{ todelete }}"
  ignore_errors: true

- name: Reset todelete list
  ansible.builtin.set_fact:
    todelete: []
