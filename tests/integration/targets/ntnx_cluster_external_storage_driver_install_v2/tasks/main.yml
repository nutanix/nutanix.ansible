---
- name: Set module defaults for install driver
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip }}"
      nutanix_username: "{{ username | default(omit) }}"
      nutanix_password: "{{ password | default(omit) }}"
      validate_certs: "{{ validate_certs }}"
  block:
    - name: Install external storage driver check mode
      nutanix.ncp.ntnx_cluster_external_storage_driver_install_v2:
        cluster_ext_id: "00061de6-4a87-6b06-185b-ac1f6b6f97e2"
        key: "test-key"
        version: "1.0.0"
        provider_type: "DELL_POWERFLEX"
      register: result
      check_mode: true
      ignore_errors: true

    - name: Assert check mode response
      ansible.builtin.assert:
        that:
          - result is defined
        fail_msg: "Check mode failed"
