---
# Test plan for ntnx_high_availability_config_v2
#   1. Discover AOS cluster
#   2. check_mode enable (state=present) with inline dummy
#   3. check_mode enable with dryrun
#   4. check_mode disable (state=absent) with inline dummy
#   5. Negative: missing cluster_ext_id
#   6. Negative: missing host_failures_to_tolerate_count on present
#   7. Negative: invalid cluster_ext_id (enable + disable)
#   8. Live enable with dryrun / enable / disable

- name: Start high availability config tests
  ansible.builtin.debug:
    msg: Start ntnx_high_availability_config_v2 tests

- name: Set placeholder IDs
  ansible.builtin.set_fact:
    placeholder_cluster_ext_id: "00061fa4-ef93-7dd8-185b-ac1f6b6f97e2"
    fake_cluster_ext_id: "00000000-0000-0000-0000-000000000001"

####################################################################
# 1. Prerequisite discovery
####################################################################

- name: List AOS clusters to pick target
  nutanix.ncp.ntnx_clusters_info_v2:
    filter: "config/clusterFunction/any(t:t eq Clustermgmt.Config.ClusterFunctionRef'AOS')"
  register: clusters_result
  ignore_errors: true

- name: Set target cluster ext_id
  ansible.builtin.set_fact:
    target_cluster_ext_id: "{{ clusters_result.response[0].ext_id }}"
  when:
    - clusters_result is defined
    - not clusters_result.failed
    - clusters_result.response is defined
    - clusters_result.response | length > 0

- name: Fallback target cluster ext_id
  ansible.builtin.set_fact:
    target_cluster_ext_id: "{{ placeholder_cluster_ext_id }}"
  when: target_cluster_ext_id is not defined

####################################################################
# 2. Check mode enable (present) with inline dummy
####################################################################

- name: Enable HA in check mode with all attributes (inline dummy)
  nutanix.ncp.ntnx_high_availability_config_v2:
    state: present
    cluster_ext_id: "22222222-2222-2222-2222-222222222222"
    host_failures_to_tolerate_count: 1
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify check mode enable HA with all attributes
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.host_failures_to_tolerate_count == 1
    success_msg: "Check mode enable HA with all attributes passed"
    fail_msg: "Check mode enable HA with all attributes failed"

####################################################################
# 3. Check mode enable with dryrun
####################################################################

- name: Enable HA in check mode with dryrun (inline dummy)
  nutanix.ncp.ntnx_high_availability_config_v2:
    state: present
    cluster_ext_id: "33333333-3333-3333-3333-333333333333"
    host_failures_to_tolerate_count: 2
    dryrun: true
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify check mode enable HA with dryrun
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
    success_msg: "Check mode enable HA with dryrun passed"
    fail_msg: "Check mode enable HA with dryrun failed"

####################################################################
# 4. Check mode disable (absent)
####################################################################

- name: Disable HA in check mode with inline dummy cluster_ext_id
  nutanix.ncp.ntnx_high_availability_config_v2:
    state: absent
    cluster_ext_id: "11111111-1111-1111-1111-111111111111"
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify check mode disable HA
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
    success_msg: "Check mode disable HA passed"
    fail_msg: "Check mode disable HA failed"

####################################################################
# 5 & 6. Negative: missing required fields
####################################################################

- name: Enable HA with missing cluster_ext_id (should fail)
  nutanix.ncp.ntnx_high_availability_config_v2:
    state: present
    host_failures_to_tolerate_count: 1
  register: result
  ignore_errors: true

- name: Verify missing cluster_ext_id fails
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    success_msg: "Missing cluster_ext_id correctly failed"
    fail_msg: "Missing cluster_ext_id did not fail as expected"

- name: Enable HA with missing host_failures_to_tolerate_count (should fail)
  nutanix.ncp.ntnx_high_availability_config_v2:
    state: present
    cluster_ext_id: "{{ placeholder_cluster_ext_id }}"
  register: result
  ignore_errors: true

- name: Verify missing host_failures_to_tolerate_count fails
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    success_msg: "Missing host_failures_to_tolerate_count correctly failed"
    fail_msg: "Missing host_failures_to_tolerate_count did not fail as expected"

####################################################################
# 7. Negative: invalid cluster_ext_id
####################################################################

- name: Enable HA with invalid cluster_ext_id
  nutanix.ncp.ntnx_high_availability_config_v2:
    state: present
    cluster_ext_id: "{{ fake_cluster_ext_id }}"
    host_failures_to_tolerate_count: 1
  register: result
  ignore_errors: true

- name: Verify invalid cluster_ext_id enable fails
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
    success_msg: "Invalid cluster_ext_id enable correctly failed"
    fail_msg: "Invalid cluster_ext_id enable did not fail as expected"

- name: Disable HA with invalid cluster_ext_id
  nutanix.ncp.ntnx_high_availability_config_v2:
    state: absent
    cluster_ext_id: "{{ fake_cluster_ext_id }}"
  register: result
  ignore_errors: true

- name: Verify invalid cluster_ext_id disable fails
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
    success_msg: "Invalid cluster_ext_id disable correctly failed"
    fail_msg: "Invalid cluster_ext_id disable did not fail as expected"

####################################################################
# 8. Live enable / disable
####################################################################

- name: Enable HA with dryrun validation on target cluster (live)
  nutanix.ncp.ntnx_high_availability_config_v2:
    state: present
    cluster_ext_id: "{{ target_cluster_ext_id }}"
    host_failures_to_tolerate_count: 1
    dryrun: true
  register: result
  ignore_errors: true

- name: Verify live enable HA dryrun result
  ansible.builtin.assert:
    that:
      - result is defined
    success_msg: "Live enable HA dryrun executed"
    fail_msg: "Live enable HA dryrun unexpected"

- name: Enable HA on target cluster (live)
  nutanix.ncp.ntnx_high_availability_config_v2:
    state: present
    cluster_ext_id: "{{ target_cluster_ext_id }}"
    host_failures_to_tolerate_count: 1
  register: result
  ignore_errors: true

- name: Verify live enable HA result
  ansible.builtin.assert:
    that:
      - result is defined
    success_msg: "Live enable HA executed"
    fail_msg: "Live enable HA unexpected"

- name: Verify live enable changed when succeeded
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.response is defined
      - result.task_ext_id is defined
    success_msg: "Live enable HA changed correctly"
    fail_msg: "Live enable HA did not report changed"
  when: not result.failed

- name: Disable HA on target cluster (live)
  nutanix.ncp.ntnx_high_availability_config_v2:
    state: absent
    cluster_ext_id: "{{ target_cluster_ext_id }}"
  register: result
  ignore_errors: true

- name: Verify live disable HA result
  ansible.builtin.assert:
    that:
      - result is defined
    success_msg: "Live disable HA executed"
    fail_msg: "Live disable HA unexpected"

- name: Verify live disable changed when succeeded
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.response is defined
    success_msg: "Live disable HA changed correctly"
    fail_msg: "Live disable HA did not report changed"
  when: not result.failed
