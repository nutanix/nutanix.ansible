---
- name: Start Network Gateway tests
  ansible.builtin.debug:
    msg: Start Network Gateway v2 tests

- name: Generate random names
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"
    suffix_name: "ansible"
    todelete: []

- name: Set names for gateway tests
  ansible.builtin.set_fact:
    gw_name: "gw_{{ suffix_name }}_{{ random_name }}"
    bogus_ext_id: "00000000-0000-0000-0000-000000000000"

########################################################################################
# Argument-spec / validation tests
########################################################################################

- name: Create gateway with missing name
  nutanix.ncp.ntnx_gateway_v2:
    state: present
  register: result
  ignore_errors: true

- name: Debug create gateway with missing name result
  ansible.builtin.debug:
    var: result

- name: Create gateway with missing name status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "state is present but any of the following are missing: name, ext_id"
    success_msg: "Create gateway with missing name failed as expected"
    fail_msg: "Create gateway with missing name did not fail as expected"

- name: Delete gateway with missing ext_id
  nutanix.ncp.ntnx_gateway_v2:
    state: absent
  register: result
  ignore_errors: true

- name: Debug delete gateway with missing ext_id result
  ansible.builtin.debug:
    var: result

- name: Delete gateway with missing ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "state is absent but all of the following are missing: ext_id"
    success_msg: "Delete gateway with missing ext_id failed as expected"
    fail_msg: "Delete gateway with missing ext_id did not fail as expected"

- name: Create gateway with vpc_reference and cloud_network_reference together
  nutanix.ncp.ntnx_gateway_v2:
    state: present
    name: "{{ gw_name }}_meX"
    vpc_reference: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
    cloud_network_reference: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
  register: result
  ignore_errors: true

- name: Debug create gateway with vpc/cloud mutually exclusive result
  ansible.builtin.debug:
    var: result

- name: Create gateway with vpc_reference and cloud_network_reference together status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "parameters are mutually exclusive: vpc_reference|cloud_network_reference"
    success_msg: "vpc_reference + cloud_network_reference is mutually exclusive"
    fail_msg: "vpc_reference + cloud_network_reference was NOT flagged as mutually exclusive"

- name: Create gateway with local_services and remote_services together
  nutanix.ncp.ntnx_gateway_v2:
    state: present
    name: "{{ gw_name }}_meX"
    services:
      local_services:
        local_bgp_service:
          asn: 65001
      remote_services:
        remote_bgp_service:
          asn: 65002
          address:
            ipv4:
              value: "192.0.2.10"
              prefix_length: 32
  register: result
  ignore_errors: true

- name: Debug create gateway with local/remote services mutually exclusive result
  ansible.builtin.debug:
    var: result

- name: Create gateway with local_services and remote_services together status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "parameters are mutually exclusive: local_services|remote_services found in services"
    success_msg: "local_services + remote_services is mutually exclusive"
    fail_msg: "local_services + remote_services was NOT flagged as mutually exclusive"

- name: Upgrade gateway without ext_id
  nutanix.ncp.ntnx_gateway_v2:
    state: present
    name: "{{ gw_name }}_upg"
    upgrade: true
  register: result
  ignore_errors: true

- name: Debug upgrade gateway without ext_id result
  ansible.builtin.debug:
    var: result

- name: Upgrade gateway without ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "ext_id is required when upgrade=true"
    success_msg: "upgrade=true without ext_id correctly rejected"
    fail_msg: "upgrade=true without ext_id was NOT rejected"

########################################################################################
# Create Gateway Tests
########################################################################################

- name: Generate spec for creating gateway using check mode with all attributes
  nutanix.ncp.ntnx_gateway_v2:
    state: present
    name: "{{ gw_name }}_check_full"
    description: "Gateway created in check mode with all attributes"
    gateway_device_vendor: "GENERIC"
    vpc_reference: "{{ vpc.uuid }}"
    project_ext_id: "00000000-0000-0000-0000-000000000000"
    is_active: true
    deployment:
      cluster_reference: "{{ cluster.uuid }}"
      vcenter_datastore_name: "ds1"
      should_synchronize_system_ntp_servers: true
      should_synchronize_system_dns_servers: true
      ntp_servers:
        - fqdn:
            value: "pool.ntp.org"
      dns_servers:
        - ipv4:
            value: "8.8.8.8"
            prefix_length: 32
      management_interface:
        subnet_reference: "{{ static.uuid }}"
        mtu: 1500
        address:
          ipv4:
            value: "10.44.76.230"
            prefix_length: 24
        default_gateway:
          ipv4:
            value: "10.44.76.1"
            prefix_length: 24
      interfaces:
        - subnet_reference: "{{ overlay.uuid }}"
          mtu: 1500
          ip_address:
            ipv4:
              value: "10.44.77.10"
              prefix_length: 24
          default_gateway_address:
            ipv4:
              value: "10.44.77.1"
              prefix_length: 24
    services:
      local_services:
        service_address:
          ipv4:
            value: "10.44.76.240"
            prefix_length: 32
        service_addresses:
          - ipv4:
              value: "10.44.76.241"
              prefix_length: 32
        local_vpn_service:
          ebgp_config:
            asn: 65001
            password: "s3cret"
            should_redistribute_routes: true
          peer_igp_config:
            ospf_config:
              area_id: "0.0.0.0"
              authentication_type: "PLAIN_TEXT"
              password: "ospf-pass"
        local_vtep_service:
          vxlan_port: 4789
        local_bgp_service:
          vpc_reference: "{{ vpc.uuid }}"
          asn: 65010
          is_bgp_add_path_enabled: true
    high_availability_group:
      is_ha_enabled: true
      algorithm: "ACTIVE_BACKUP"
      peered_gateways:
        - ext_id: "11111111-1111-1111-1111-111111111111"
  check_mode: true
  register: result
  ignore_errors: true

- name: Debug check mode create with all attributes result
  ansible.builtin.debug:
    var: result

- name: Generate spec for creating gateway using check mode with all attributes status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.name == "{{ gw_name }}_check_full"
      - result.response.description == "Gateway created in check mode with all attributes"
      - result.response.gateway_device_vendor == "GENERIC"
      - result.response.vpc_reference == vpc.uuid
      - result.response.project_ext_id == "00000000-0000-0000-0000-000000000000"
      - result.response.is_active == true
      - result.response.deployment.cluster_reference == cluster.uuid
      - result.response.deployment.vcenter_datastore_name == "ds1"
      - result.response.deployment.should_synchronize_system_ntp_servers == true
      - result.response.deployment.should_synchronize_system_dns_servers == true
      - result.response.deployment.ntp_servers | length == 1
      - result.response.deployment.ntp_servers[0].fqdn.value == "pool.ntp.org"
      - result.response.deployment.dns_servers | length == 1
      - result.response.deployment.dns_servers[0].ipv4.value == "8.8.8.8"
      - result.response.deployment.management_interface.subnet_reference == static.uuid
      - result.response.deployment.management_interface.mtu == 1500
      - result.response.deployment.management_interface.address.ipv4.value == "10.44.76.230"
      - result.response.deployment.management_interface.default_gateway.ipv4.value == "10.44.76.1"
      - result.response.deployment.interfaces | length == 1
      - result.response.deployment.interfaces[0].subnet_reference == overlay.uuid
      - result.response.deployment.interfaces[0].ip_address.ipv4.value == "10.44.77.10"
      - result.response.deployment.interfaces[0].default_gateway_address.ipv4.value == "10.44.77.1"
      - result.response.services.service_address.ipv4.value == "10.44.76.240"
      - result.response.services.service_addresses[0].ipv4.value == "10.44.76.241"
      - result.response.services.local_vpn_service.ebgp_config.asn == 65001
      - result.response.services.local_vpn_service.ebgp_config.should_redistribute_routes == true
      - result.response.services.local_vpn_service.peer_igp_config.ospf_config.area_id == "0.0.0.0"
      - result.response.services.local_vtep_service.vxlan_port == 4789
      - result.response.services.local_bgp_service.asn == 65010
      - result.response.services.local_bgp_service.is_bgp_add_path_enabled == true
      - result.response.high_availability_group.is_ha_enabled == true
      - result.response.high_availability_group.algorithm == "ACTIVE_BACKUP"
      - result.response.high_availability_group.peered_gateways | length == 1
      - result.response.high_availability_group.peered_gateways[0].ext_id == "11111111-1111-1111-1111-111111111111"
    success_msg: "Spec for creating gateway using check mode with all attributes is generated successfully"
    fail_msg: "Spec for creating gateway using check mode with all attributes is not generated successfully"

- name: Create gateway with minimum attributes
  nutanix.ncp.ntnx_gateway_v2:
    state: present
    name: "{{ gw_name }}_min"
    services:
      remote_services:
        remote_bgp_service:
          asn: 65001
          address:
            ipv4:
              value: "192.0.2.10"
              prefix_length: 32
  register: result
  ignore_errors: true

- name: Debug create gateway with minimum attributes result
  ansible.builtin.debug:
    var: result

- name: Create gateway with minimum attributes status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.task_ext_id is defined
      - result.response is defined
      - result.response.name == "{{ gw_name }}_min"
      - result.response.ext_id == result.ext_id
      - result.response.services.remote_bgp_service.asn == 65001
      - result.response.services.remote_bgp_service.address.ipv4.value == "192.0.2.10"
      - result.response.services.remote_bgp_service.address.ipv4.prefix_length == 32
    success_msg: "Gateway with minimum attributes created successfully"
    fail_msg: "Gateway with minimum attributes creation failed"

- name: Add gateway min to todelete list
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [result.ext_id] }}"
  when: result.ext_id is defined and result.ext_id | length > 0

- name: Create gateway with all attributes
  nutanix.ncp.ntnx_gateway_v2:
    state: present
    name: "{{ gw_name }}_all"
    description: "Gateway created by Ansible integration tests with all attributes"
    gateway_device_vendor: "GENERIC"
    vpc_reference: "{{ vpc.uuid }}"
    project_ext_id: "00000000-0000-0000-0000-000000000000"
    services:
      remote_services:
        remote_bgp_service:
          asn: 65001
          address:
            ipv4:
              value: "192.0.2.11"
              prefix_length: 32
  register: result
  ignore_errors: true

- name: Debug create gateway with all attributes result
  ansible.builtin.debug:
    var: result

- name: Create gateway with all attributes status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.task_ext_id is defined
      - result.response is defined
      - result.response.name == "{{ gw_name }}_all"
      - result.response.description == "Gateway created by Ansible integration tests with all attributes"
      - result.response.gateway_device_vendor == "GENERIC"
      - result.response.vpc_reference == vpc.uuid
      - result.response.project_ext_id == "00000000-0000-0000-0000-000000000000"
      - result.response.services.remote_bgp_service.asn == 65001
      - result.response.services.remote_bgp_service.address.ipv4.value == "192.0.2.11"
      - result.response.services.remote_bgp_service.address.ipv4.prefix_length == 32
    success_msg: "Gateway with all attributes created successfully"
    fail_msg: "Gateway with all attributes creation failed"

- name: Add gateway all to todelete list
  ansible.builtin.set_fact:
    gateway_all_ext_id: "{{ result.ext_id | default('') }}"
    todelete: "{{ todelete + ([result.ext_id] if result.ext_id | default('') | length > 0 else []) }}"

########################################################################################
# Info module tests
########################################################################################

- name: List all gateways
  nutanix.ncp.ntnx_gateways_info_v2:
  register: result
  ignore_errors: true

- name: Debug list all gateways result
  ansible.builtin.debug:
    var: result

- name: List all gateways status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response is iterable
      - result.total_available_results is defined
    success_msg: "List gateways returned a well-formed response"
    fail_msg: "List gateways did NOT return a well-formed response"

- name: List gateways with limit
  nutanix.ncp.ntnx_gateways_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: Debug list gateways with limit result
  ansible.builtin.debug:
    var: result

- name: List gateways with limit status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - (result.response | length) <= 1
    success_msg: "limit=1 correctly constrains the response"
    fail_msg: "limit=1 did NOT constrain the response"

- name: List gateways with filter
  nutanix.ncp.ntnx_gateways_info_v2:
    filter: "name eq '{{ gw_name }}_min'"
  register: result
  ignore_errors: true

- name: Debug list gateways with filter result
  ansible.builtin.debug:
    var: result

- name: List gateways with filter status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
      - result.response[0].name == "{{ gw_name }}_min"
      - result.response[0].ext_id is defined
      - result.total_available_results == 1
    success_msg: "Filter list gateways succeeded"
    fail_msg: "Filter list gateways failed"

- name: Get gateway using ext_id
  nutanix.ncp.ntnx_gateways_info_v2:
    ext_id: "{{ todelete[0] }}"
  register: result
  when: todelete | length > 0
  ignore_errors: true

- name: Debug get gateway using ext_id result
  ansible.builtin.debug:
    var: result
  when: todelete | length > 0

- name: Get gateway using ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == false
      - result.changed == false
      - result.response is defined
      - result.response.ext_id == todelete[0]
      - result.response.name == "{{ gw_name }}_min"
      - result.response.services.remote_bgp_service.asn == 65001
      - result.response.services.remote_bgp_service.address.ipv4.value == "192.0.2.10"
    success_msg: "Get by ext_id succeeded"
    fail_msg: "Get by ext_id failed"
  when: todelete | length > 0

- name: Fetch gateway by a bogus ext_id
  nutanix.ncp.ntnx_gateways_info_v2:
    ext_id: "{{ bogus_ext_id }}"
  register: result
  ignore_errors: true

- name: Debug fetch gateway by bogus ext_id result
  ansible.builtin.debug:
    var: result

- name: Fetch gateway by a bogus ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
      - result.error == "NOT FOUND"
      - result.msg == "Api Exception raised while fetching gateway info using ext_id"
    success_msg: "Fetching by bogus ext_id fails cleanly"
    fail_msg: "Fetching by bogus ext_id did NOT fail as expected"

########################################################################################
# Update Gateway Tests
########################################################################################

- name: Generate spec for updating gateway using check mode with all attributes
  nutanix.ncp.ntnx_gateway_v2:
    state: present
    ext_id: "{{ gateway_all_ext_id }}"
    name: "{{ gw_name }}_all_updated"
    description: "Updated description for gateway with all attributes"
    gateway_device_vendor: "GENERIC"
    vpc_reference: "{{ vpc.uuid }}"
    project_ext_id: "00000000-0000-0000-0000-000000000000"
    services:
      remote_services:
        remote_bgp_service:
          asn: 65001
          address:
            ipv4:
              value: "192.0.2.11"
              prefix_length: 32
  check_mode: true
  register: result
  when: gateway_all_ext_id | default('') | length > 0
  ignore_errors: true

- name: Debug update gateway check mode result
  ansible.builtin.debug:
    var: result
  when: gateway_all_ext_id | default('') | length > 0

- name: Generate spec for updating gateway using check mode with all attributes status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.name == "{{ gw_name }}_all_updated"
      - result.response.description == "Updated description for gateway with all attributes"
      - result.response.gateway_device_vendor == "GENERIC"
      - result.response.vpc_reference == vpc.uuid
      - result.response.services.remote_bgp_service.asn == 65001
      - result.response.services.remote_bgp_service.address.ipv4.value == "192.0.2.11"
    success_msg: "Spec for updating gateway using check mode with all attributes is generated successfully"
    fail_msg: "Spec for updating gateway using check mode with all attributes is not generated successfully"
  when: gateway_all_ext_id | default('') | length > 0

- name: Update gateway with all attributes
  nutanix.ncp.ntnx_gateway_v2:
    state: present
    ext_id: "{{ gateway_all_ext_id }}"
    name: "{{ gw_name }}_all_updated"
    description: "Updated description for gateway with all attributes"
    gateway_device_vendor: "GENERIC"
    vpc_reference: "{{ vpc.uuid }}"
    project_ext_id: "00000000-0000-0000-0000-000000000000"
    services:
      remote_services:
        remote_bgp_service:
          asn: 65001
          address:
            ipv4:
              value: "192.0.2.11"
              prefix_length: 32
  register: result
  when: gateway_all_ext_id | default('') | length > 0
  ignore_errors: true

- name: Debug update gateway with all attributes result
  ansible.builtin.debug:
    var: result
  when: gateway_all_ext_id | default('') | length > 0

- name: Update gateway with all attributes status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id == gateway_all_ext_id
      - result.task_ext_id is defined
      - result.response is defined
      - result.response.name == "{{ gw_name }}_all_updated"
      - result.response.description == "Updated description for gateway with all attributes"
      - result.response.gateway_device_vendor == "GENERIC"
      - result.response.vpc_reference == vpc.uuid
      - result.response.services.remote_bgp_service.asn == 65001
      - result.response.services.remote_bgp_service.address.ipv4.value == "192.0.2.11"
    success_msg: "Update gateway with all attributes passed"
    fail_msg: "Update gateway with all attributes failed"
  when: gateway_all_ext_id | default('') | length > 0

- name: Update gateway with the same fields (idempotency)
  nutanix.ncp.ntnx_gateway_v2:
    state: present
    ext_id: "{{ gateway_all_ext_id }}"
    name: "{{ gw_name }}_all_updated"
    description: "Updated description for gateway with all attributes"
    gateway_device_vendor: "GENERIC"
    vpc_reference: "{{ vpc.uuid }}"
    project_ext_id: "00000000-0000-0000-0000-000000000000"
    services:
      remote_services:
        remote_bgp_service:
          asn: 65001
          address:
            ipv4:
              value: "192.0.2.11"
              prefix_length: 32
  register: result
  when: gateway_all_ext_id | default('') | length > 0
  ignore_errors: true

- name: Debug update gateway idempotency result
  ansible.builtin.debug:
    var: result
  when: gateway_all_ext_id | default('') | length > 0

- name: Update gateway idempotency status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == false
      - result.changed == false
      - result.msg == "Nothing to change."
    success_msg: "Update was idempotent (Nothing to change.)"
    fail_msg: "Update was NOT idempotent"
  when: gateway_all_ext_id | default('') | length > 0

########################################################################################
# Upgrade Gateway Tests
########################################################################################

- name: Upgrade gateway with check mode
  nutanix.ncp.ntnx_gateway_v2:
    state: present
    ext_id: "{{ gateway_all_ext_id }}"
    upgrade: true
  check_mode: true
  register: result
  when: gateway_all_ext_id | default('') | length > 0
  ignore_errors: true

- name: Debug upgrade gateway with check mode result
  ansible.builtin.debug:
    var: result
  when: gateway_all_ext_id | default('') | length > 0

- name: Upgrade gateway with check mode status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.ext_id == gateway_all_ext_id
      - result.msg == "Gateway with ext_id:{{ gateway_all_ext_id }} will be upgraded."
    success_msg: "Upgrade gateway with check mode passed"
    fail_msg: "Upgrade gateway with check mode failed"
  when: gateway_all_ext_id | default('') | length > 0

- name: Upgrade gateway
  nutanix.ncp.ntnx_gateway_v2:
    state: present
    ext_id: "{{ gateway_all_ext_id }}"
    upgrade: true
  register: result
  when: gateway_all_ext_id | default('') | length > 0
  ignore_errors: true

- name: Debug upgrade gateway result
  ansible.builtin.debug:
    var: result
  when: gateway_all_ext_id | default('') | length > 0

