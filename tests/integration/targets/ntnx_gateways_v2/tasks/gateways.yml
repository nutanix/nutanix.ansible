########################################################################################
# Delete / negative tests
########################################################################################

- name: Delete gateway with check mode
  nutanix.ncp.ntnx_gateway_v2:
    state: absent
    ext_id: "{{ bogus_ext_id }}"
  check_mode: true
  register: result
  ignore_errors: true

- name: Debug delete gateway check mode result
  ansible.builtin.debug:
    var: result

- name: Delete gateway with check mode status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.ext_id == bogus_ext_id
      - result.msg == "Gateway with ext_id:{{ bogus_ext_id }} will be deleted."
    success_msg: "Delete gateway with check mode passed"
    fail_msg: "Delete gateway with check mode failed"

- name: Upgrade non-existent gateway
  nutanix.ncp.ntnx_gateway_v2:
    state: present
    ext_id: "{{ bogus_ext_id }}"
    upgrade: true
  register: result
  ignore_errors: true

- name: Debug upgrade non-existent gateway result
  ansible.builtin.debug:
    var: result

- name: Upgrade non-existent gateway status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
      - result.ext_id == bogus_ext_id
      - result.msg is defined
    success_msg: "Upgrading a non-existent gateway correctly failed"
    fail_msg: "Upgrading a non-existent gateway did NOT fail"

- name: Update non-existent gateway
  nutanix.ncp.ntnx_gateway_v2:
    state: present
    ext_id: "{{ bogus_ext_id }}"
    name: "does_not_exist"
    description: "should fail"
  register: result
  ignore_errors: true

- name: Debug update non-existent gateway result
  ansible.builtin.debug:
    var: result

- name: Update non-existent gateway status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
      - result.error == "NOT FOUND"
      - result.msg == "Api Exception raised while fetching gateway info using ext_id"
    success_msg: "Updating a non-existent gateway correctly failed"
    fail_msg: "Updating a non-existent gateway did NOT fail"

- name: Delete non-existent gateway
  nutanix.ncp.ntnx_gateway_v2:
    state: absent
    ext_id: "{{ bogus_ext_id }}"
  register: result
  ignore_errors: true

- name: Debug delete non-existent gateway result
  ansible.builtin.debug:
    var: result

- name: Delete non-existent gateway status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
      - result.error == "NOT FOUND"
      - result.msg == "Api Exception raised while fetching gateway info using ext_id"
    success_msg: "Deleting a non-existent gateway correctly failed"
    fail_msg: "Deleting a non-existent gateway did NOT fail"

########################################################################################
# Cleanup
########################################################################################

- name: Delete all created gateways
  nutanix.ncp.ntnx_gateway_v2:
    state: absent
    ext_id: "{{ item }}"
  loop: "{{ todelete }}"
  register: result
  ignore_errors: true

- name: Debug delete all created gateways result
  ansible.builtin.debug:
    var: result

- name: Delete all created gateways status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.results is defined
      - result.results | length == todelete | length
      - result.results | map(attribute='failed') | list | unique == [false]
      - result.results | map(attribute='changed') | list | unique == [true]
    success_msg: "All test gateways cleaned up"
    fail_msg: "Not all test gateways were cleaned up"
  when: todelete | length > 0
