########################################################################################
# Cleanup
########################################################################################

- name: Delete all created gateways
  nutanix.ncp.ntnx_gateway_v2:
    state: absent
    ext_id: "{{ item }}"
  loop: "{{ todelete }}"
  register: result
  ignore_errors: true

- name: Debug delete all created gateways result
  ansible.builtin.debug:
    var: result

- name: Delete all created gateways status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.results is defined
      - result.results | length == todelete | length
      - result.changed == true
      - result.msg == "All items completed"
    success_msg: "All test gateways cleaned up"
    fail_msg: "Not all test gateways were cleaned up"
  when: todelete | length > 0

- name: Check which floating ips still exist before cleanup
  nutanix.ncp.ntnx_floating_ips_info_v2:
    ext_id: "{{ item }}"
  register: fip_exists_check
  loop: "{{ todelete_fips }}"
  ignore_errors: true
  when: todelete_fips | length > 0

- name: Set existing floating ips to delete
  ansible.builtin.set_fact:
    existing_fips_to_delete: >-
      {{
        fip_exists_check.results
        | default([])
        | selectattr('failed', 'equalto', false)
        | map(attribute='item')
        | list
      }}
  when: todelete_fips | length > 0

- name: Delete existing floating ips
  nutanix.ncp.ntnx_floating_ips_v2:
    state: absent
    ext_id: "{{ item }}"
  register: result
  loop: "{{ existing_fips_to_delete }}"
  ignore_errors: true
  when: existing_fips_to_delete | default([]) | length > 0

- name: Delete existing floating ips status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.results is defined
      - result.results | length == existing_fips_to_delete | length
      - result.results | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
    fail_msg: "Unable to delete floating ips"
    success_msg: "Floating ips deleted successfully"
  when: existing_fips_to_delete | default([]) | length > 0

- name: Clear floating ips todelete list
  ansible.builtin.set_fact:
    todelete_fips: []
    existing_fips_to_delete: []
  when: todelete_fips | length > 0

- name: Delete gateway overlay subnet
  nutanix.ncp.ntnx_subnets_v2:
