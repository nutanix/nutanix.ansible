---
- name: Set module defaults
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip }}"
      nutanix_username: "{{ username | default(omit) }}"
      nutanix_password: "{{ password | default(omit) }}"
      nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
      validate_certs: "{{ validate_certs }}"
      nutanix_debug: "{{ nutanix_debug | default(omit) }}"
      nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
  block:
    - name: Import all_operations test tasks
      ansible.builtin.import_tasks: "all_operations.yml"
  # always:
  #   # Safety net: a run that fails partway would otherwise leave debris that
  #   # blocks every subsequent run. See teardown.yml for why.
  #   - name: Import teardown tasks
  #     ansible.builtin.import_tasks: "teardown.yml"
