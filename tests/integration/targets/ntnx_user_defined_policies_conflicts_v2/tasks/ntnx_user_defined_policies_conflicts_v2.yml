  register: result
  ignore_errors: true

- name: Verify cluster entity_type
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.response is defined
    fail_msg: "Cluster entity_type conflicts failed"
    success_msg: "Cluster entity_type conflicts passed"

