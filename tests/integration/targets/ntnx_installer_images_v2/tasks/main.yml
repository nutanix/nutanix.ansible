---
# NOTE: The LCM installer images APIs are served by Foundation Central (FCVM),
# NOT by Prism Central. Prefer foundation_* vars when set; fall back to PC ip.
- name: Set module defaults
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ foundation_host | default(ip) }}"
      nutanix_username: "{{ foundation_username | default(username) | default(omit) }}"
      nutanix_password: "{{ foundation_password | default(password) | default(omit) }}"
      nutanix_port: "{{ foundation_port | default(omit) }}"
      validate_certs: "{{ validate_certs | default(false) }}"
      nutanix_debug: "{{ nutanix_debug | default(omit) }}"
      nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
  block:
    - name: Import installer_images.yml
      ansible.builtin.import_tasks: installer_images.yml
