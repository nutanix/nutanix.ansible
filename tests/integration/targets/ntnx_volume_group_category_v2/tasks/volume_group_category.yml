---
- name: Start Volume Group category association tests
  ansible.builtin.debug:
    msg: "Start Volume Group category association tests"

- name: Generate random names
  ansible.builtin.set_fact:
    random_name: >-
      {{ query('community.general.random_string',
      numbers=false, special=false, length=12)[0] }}
    suffix_name: "ansible-vgcat"

- name: Set VG and category names
  ansible.builtin.set_fact:
    vg_name: "{{ suffix_name }}-{{ random_name }}-vg"
    cat_key: "{{ random_name }}_{{ suffix_name }}_key"
    cat_value: "{{ random_name }}_{{ suffix_name }}_val"
    wrong_ext_id: "00000000-0000-0000-0000-000000000000"

######################################## Test Setup ########################################

- name: Create Volume Group for category tests
  nutanix.ncp.ntnx_volume_groups_v2:
    name: "{{ vg_name }}"
    description: "VG for category association tests"
    target_prefix: "vgcat"
    cluster_reference: "{{ cluster.uuid }}"
    usage_type: "USER"
    sharing_status: "SHARED"
    should_load_balance_vm_attachments: true
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: vg_result

- name: Verify VG creation
  ansible.builtin.assert:
    that:
      - vg_result is defined
      - vg_result.changed == true
      - vg_result.failed == false
      - vg_result.ext_id is defined
      - vg_result.response is defined
    fail_msg: "Unable to create VG for category tests"
    success_msg: "VG created successfully for category tests"

- name: Set VG ext_id fact
  ansible.builtin.set_fact:
    vg_ext_id: "{{ vg_result.ext_id }}"

- name: Create category for VG association
  nutanix.ncp.ntnx_categories_v2:
    key: "{{ cat_key }}"
    value: "{{ cat_value }}"
    description: "category for VG association"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: cat_result

- name: Verify category creation
  ansible.builtin.assert:
    that:
      - cat_result is defined
      - cat_result.changed == true
      - cat_result.failed == false
      - cat_result.response.ext_id is defined
    fail_msg: "Unable to create category for VG tests"
    success_msg: "Category created successfully for VG tests"

- name: Set category ext_id fact
  ansible.builtin.set_fact:
    cat_ext_id: "{{ cat_result.response.ext_id }}"

############################## Check mode - associate ##############################

- name: Associate category with VG in check mode
  nutanix.ncp.ntnx_volume_group_category_v2:
    state: present
    ext_id: "11111111-1111-1111-1111-111111111111"
    categories:
      - ext_id: "22222222-2222-2222-2222-222222222222"
        entity_type: "CATEGORY"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify check mode associate response
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.categories is defined
    fail_msg: "Check mode associate failed"
    success_msg: "Check mode associate passed"

############################## Negative tests ####################################

- name: Associate category with missing ext_id
  nutanix.ncp.ntnx_volume_group_category_v2:
    state: present
    categories:
      - ext_id: "{{ cat_ext_id }}"
        entity_type: "CATEGORY"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true

- name: Verify missing ext_id failure
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    fail_msg: "Missing ext_id did not fail as expected"
    success_msg: "Missing ext_id correctly failed"

- name: Associate category with missing categories
  nutanix.ncp.ntnx_volume_group_category_v2:
    state: present
    ext_id: "{{ vg_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true

- name: Verify missing categories failure
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    fail_msg: "Missing categories did not fail"
    success_msg: "Missing categories correctly failed"

############################## Associate - real ##################################

- name: Associate category with VG
  nutanix.ncp.ntnx_volume_group_category_v2:
    state: present
    ext_id: "{{ vg_ext_id }}"
    categories:
      - ext_id: "{{ cat_ext_id }}"
        entity_type: "CATEGORY"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result

- name: Verify associate success
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.task_ext_id is defined
      - result.response.status == "SUCCEEDED"
    fail_msg: "Unable to associate category with VG"
    success_msg: "Category associated with VG successfully"

- name: Associate category with wrong VG ext_id
  nutanix.ncp.ntnx_volume_group_category_v2:
    state: present
    ext_id: "{{ wrong_ext_id }}"
    categories:
      - ext_id: "{{ cat_ext_id }}"
        entity_type: "CATEGORY"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true

- name: Verify wrong VG ext_id failure
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    fail_msg: "Wrong VG ext_id did not fail"
    success_msg: "Wrong VG ext_id correctly failed"

############################## Disassociate - check mode #########################

- name: Disassociate category with VG in check mode
  nutanix.ncp.ntnx_volume_group_category_v2:
    state: absent
    ext_id: "11111111-1111-1111-1111-111111111111"
    categories:
      - ext_id: "22222222-2222-2222-2222-222222222222"
        entity_type: "CATEGORY"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify check mode disassociate
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
    fail_msg: "Check mode disassociate failed"
    success_msg: "Check mode disassociate passed"

############################## Disassociate - real ###############################

- name: Disassociate category from VG
  nutanix.ncp.ntnx_volume_group_category_v2:
    state: absent
    ext_id: "{{ vg_ext_id }}"
    categories:
      - ext_id: "{{ cat_ext_id }}"
        entity_type: "CATEGORY"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result

- name: Verify disassociate success
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.task_ext_id is defined
      - result.response.status == "SUCCEEDED"
    fail_msg: "Unable to disassociate category from VG"
    success_msg: "Category disassociated from VG successfully"

############################## Cleanup ###########################################

- name: Delete Volume Group
  nutanix.ncp.ntnx_volume_groups_v2:
    state: absent
    ext_id: "{{ vg_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true
  retries: 3
  delay: 5
  until: result is succeeded

- name: Verify VG deletion
  ansible.builtin.assert:
    that:
      - result is defined
      - (result.failed == false and result.changed == true) or ("Backend server error" in (result | string))
    fail_msg: "Unable to delete VG"
    success_msg: "VG deletion handled"

- name: Delete category
  nutanix.ncp.ntnx_categories_v2:
    state: absent
    ext_id: "{{ cat_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true

- name: Verify category deletion
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
    fail_msg: "Unable to delete category"
    success_msg: "Category deleted successfully"
