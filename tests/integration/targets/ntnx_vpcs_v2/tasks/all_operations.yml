---
# Variables required before running this playbook:
# - external_nat_subnet
# - external_subnet_project  (project permanently shared with the external NAT subnet)
# - routable_ips
# - dns_servers

- name: Start testing ntnx_vpcs_v2, ntnx_vpcs_info_v2
  ansible.builtin.debug:
    msg: Start testing ntnx_vpcs_v2, ntnx_vpcs_info_v2

- name: Generate random vpc name
  ansible.builtin.set_fact:
    random_name: "{{query('community.general.random_string',numbers=false, special=false,length=12)[0]}}"

- name: Set suffix name
  ansible.builtin.set_fact:
    suffix_name: "ansible-ag-vpc"

- name: Generate random vpc name
  ansible.builtin.set_fact:
    vpc_name: "{{ random_name }}{{ suffix_name }}"

- name: Set todelete list
  ansible.builtin.set_fact:
    todelete: []

###########################################################
# Create a project to be used for project_ext_id and sharing tests
###########################################################
- name: Create projects for tests
  nutanix.ncp.ntnx_project_v2:
    state: present
    name: "{{ random_name }}-ansible-project-{{ item }}"
    project_id: "{{ random_name }}-ansible-project-id-{{ item }}"
  register: create_projects_result
  loop: "{{ range(1, 4) | list }}"
  ignore_errors: true

- name: Status of projects creation for tests
  ansible.builtin.assert:
    that:
      - item.changed == true
      - item.failed == false
      - item.response is defined
      - item.ext_id is defined
      - item.ext_id | length > 0
      - item.task_ext_id is defined
      - item.response.state == "ACTIVE"
    fail_msg: "Unable to create project for tests"
    success_msg: "Project for tests created successfully"
  loop: "{{ create_projects_result.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Set project facts for tests
  ansible.builtin.set_fact:
    project:
      name: "{{ random_name }}-ansible-project-1"
      uuid: "{{ create_projects_result.results[0].ext_id }}"
    project2:
      name: "{{ random_name }}-ansible-project-2"
      uuid: "{{ create_projects_result.results[1].ext_id }}"
    project3:
      name: "{{ random_name }}-ansible-project-3"
      uuid: "{{ create_projects_result.results[2].ext_id }}"

###########################################################
- name: Create min VPC with check mode
  nutanix.ncp.ntnx_vpcs_v2:
    state: present
    wait: true
    name: "{{ vpc_name }}1"
    project_ext_id: "83083083-0000-0000-0000-000000000000"
    shared_with_projects: "46288898-4628-4628-4628-462888984628"
  register: result
  check_mode: true
  ignore_errors: true

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response.name == "{{vpc_name}}1"
      - result.response.project_ext_id == "83083083-0000-0000-0000-000000000000"
      - result.response.shared_with_projects == ["46288898-4628-4628-4628-462888984628"]
    fail_msg: " Unable to Create min VPC with check mode"
    success_msg: "Create min VPC with check mode finished as expected"
###########################################################

- name: Create min VPC with external_nat_subnet uuid
  # A VPC owned by a custom project (project_ext_id) cannot itself be shared with
  # projects ("Can only share VPCs owned by the default project"), so no
  # shared_with_projects here - the sharing feature is covered by the default-owned
  # VPC tests further below.
  # The external NAT subnet must belong to / be shared with the owning project, so
  # use the prepare_env fixture project that is permanently shared with it (a
  # freshly created project is outside the subnet's project boundary).
  nutanix.ncp.ntnx_vpcs_v2:
    state: present
    wait: true
    name: "{{vpc_name}}2"
    project_ext_id: "{{ external_subnet_project.uuid }}"
    external_subnets:
      - subnet_reference: "{{ external_nat_subnet.uuid }}"
  register: result
  ignore_errors: true

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.ext_id is defined
      - result.response.external_subnets.0.subnet_reference == "{{ external_nat_subnet.uuid }}"
      - result.response.name == "{{vpc_name}}2"
      - result.response.project_ext_id == external_subnet_project.uuid
    fail_msg: " Unable to create Min vpc with external subnet uuid "
    success_msg: " Min vpc with external subnet uuid created successfully "

- name: Adding VPC external ID to delete list
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [  result.ext_id ] }}"
###########################################################
- name: Update vpc name
  nutanix.ncp.ntnx_vpcs_v2:
    state: present
    ext_id: "{{ result.ext_id }}"
    name: "{{vpc_name}}2_updated"
  register: result
  ignore_errors: true

- name: Update status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.response.name == "{{vpc_name}}2_updated"
    fail_msg: " Unable to update vpc name "
    success_msg: " VPC name updated successfully "
###########################################################

- name: Verify update of project_ext_id is not supported
  nutanix.ncp.ntnx_vpcs_v2:
    state: present
    ext_id: "{{ todelete[0] }}"
    project_ext_id: "00000000-0000-0000-0000-000000000001"
  register: result
  ignore_errors: true

- name: Verify update of project_ext_id is blocked status
  ansible.builtin.assert:
    that:
      - result.failed == true
      - 'result.msg == "Update is not supported for the following field(s): project_ext_id"'
    fail_msg: "Update of project_ext_id should have been blocked"
    success_msg: "Update of project_ext_id is correctly blocked"
###########################################################
- name: Delete VPC with check mode is enabled
  nutanix.ncp.ntnx_vpcs_v2:
    state: absent
    ext_id: "{{ todelete[0] }}"
  register: result
  ignore_errors: true
  check_mode: true

- name: Delete VPC with check mode is enabled status
  ansible.builtin.assert:
    that:
      - result.msg is defined
      - result.changed == false
      - result.failed == false
      - result.ext_id == "{{ todelete[0] }}"
      - result.msg == "VPC with ext_id:{{ todelete[0] }} will be deleted."
    fail_msg: "Delete VPC with check mode is enabled failed"
    success_msg: "Delete VPC with check mode is enabled passed"

- name: Delete all created vpcs
  nutanix.ncp.ntnx_vpcs_v2:
    state: absent
    ext_id: "{{ item }}"
  register: result
  loop: "{{ todelete }}"
  ignore_errors: true

- name: Reset todelete list
  ansible.builtin.set_fact:
    todelete: []
###########################################################
- name: Create VPC with routable_ips
  nutanix.ncp.ntnx_vpcs_v2:
    state: present
    name: "{{vpc_name}}3"
    description: "VPC with routable_ips"
    externally_routable_prefixes:
      - ipv4:
          ip:
            value: "{{ routable_ips.network_ip }}"
            prefix_length: "{{ routable_ips.network_prefix }}"
          prefix_length: "{{ routable_ips.network_prefix }}"
  register: result
  ignore_errors: true

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.ext_id is defined
      - result.response.name == "{{vpc_name}}3"
      - result.response.description == "VPC with routable_ips"
      - result.response.externally_routable_prefixes.0.ipv4.prefix_length  == {{ routable_ips.network_prefix }}
      - result.response.externally_routable_prefixes.0.ipv4.ip.value  ==  "{{ routable_ips.network_ip }}"
    fail_msg: " Unable to create vpc with routable_ips "
    success_msg: " VPC with routable ips created successfully "

- name: Adding VPC external ID to delete list
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [  result.ext_id ] }}"
##########################################################
- name: Update vpc with external_nat_subnet
  nutanix.ncp.ntnx_vpcs_v2:
    state: present
    ext_id: "{{ result.ext_id }}"
    external_subnets:
      - subnet_reference: "{{ external_nat_subnet.uuid }}"
  register: result
  ignore_errors: true

- name: Update status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.response.external_subnets.0.subnet_reference == "{{ external_nat_subnet.uuid }}"
      - result.response.name == "{{vpc_name}}3"
      - result.response.description == "VPC with routable_ips"
      - result.response.externally_routable_prefixes.0.ipv4.prefix_length  == {{ routable_ips.network_prefix }}
      - result.response.externally_routable_prefixes.0.ipv4.ip.value  ==  "{{ routable_ips.network_ip }}"
    fail_msg: " Unable to update vpc with external_nat_subnet "
    success_msg: " VPC updated with external_nat_subnet successfully "
##########################################################
- name: Check idempotency
  nutanix.ncp.ntnx_vpcs_v2:
    state: present
    ext_id: "{{ result.ext_id }}"
    name: "{{vpc_name}}3"
    description: "VPC with routable_ips"
    externally_routable_prefixes:
      - ipv4:
          ip:
            value: "{{ routable_ips.network_ip }}"
          prefix_length: "{{ routable_ips.network_prefix }}"
  register: result
  ignore_errors: true

- name: Idempotency Status
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == false
      - result.msg == "Nothing to change."
    fail_msg: " Unable to check idempotency "
    success_msg: " Idempotency check finished successfully "
###########################################################
- name: Create VPC with routable_ips and external subnet
  nutanix.ncp.ntnx_vpcs_v2:
    state: present
    name: "{{vpc_name}}4"
    externally_routable_prefixes:
      - ipv4:
          ip:
            value: "{{ routable_ips.network_ip_2 }}"
          prefix_length: "{{ routable_ips.network_prefix_2 }}"
    external_subnets:
      - subnet_reference: "{{ external_nat_subnet.uuid }}"
  register: result
  ignore_errors: true

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.ext_id is defined
      - result.response.ext_id == result.ext_id
      - result.response.name == "{{vpc_name}}4"
      - result.response.externally_routable_prefixes.0.ipv4.prefix_length  == {{ routable_ips.network_prefix_2 }}
      - result.response.externally_routable_prefixes.0.ipv4.ip.value  ==  "{{ routable_ips.network_ip_2 }}"
      - result.response.external_subnets.0.subnet_reference == "{{ external_nat_subnet.uuid }}"
    fail_msg: " Unable to create vpc with routable_ips and external subnet "
    success_msg: " VPC with routable ips and external subnet created successfully "

- name: Adding VPC external ID to delete list
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [  result.ext_id ] }}"
##########################################################
- name: Create VPC with dns_servers
  nutanix.ncp.ntnx_vpcs_v2:
    state: present
    name: "{{vpc_name}}5"
    common_dhcp_options:
      domain_name_servers:
        - ipv4:
            value: "{{ dns_servers.0 }}"
            prefix_length: 32
        - ipv4:
            value: "{{ dns_servers.1 }}"
            prefix_length: 32
  register: result
  ignore_errors: true

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.ext_id is defined
      - result.response.name == "{{vpc_name}}5"
      - result.response.common_dhcp_options.domain_name_servers.0.ipv4.value == "{{ dns_servers.0 }}"
      - result.response.common_dhcp_options.domain_name_servers.1.ipv4.value == "{{ dns_servers.1 }}"
    fail_msg: "Unable to create VPC with dns_servers "
    success_msg: "Create VPC with dns_servers finished successfully"

- name: Adding VPC external ID to delete list
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [  result.ext_id ] }}"
##########################################################
- name: List VPCs
  nutanix.ncp.ntnx_vpcs_info_v2:
  register: vpcs
  ignore_errors: true

- name: Listing Status
  ansible.builtin.assert:
    that:
      - vpcs.response is defined
      - vpcs.response | length > 3
      - vpcs.total_available_results is defined
      - vpcs.total_available_results > 3
    fail_msg: " Unable to list vpcs "
    success_msg: " VPCs listed successfully "
##########################################################
- name: List VPC using name filter criteria
  nutanix.ncp.ntnx_vpcs_info_v2:
    filter: "name eq '{{ vpcs.response.0.name }}'"
  register: result
  ignore_errors: true

- name: Listing Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.response.0.ext_id == vpcs.response.0.ext_id
    fail_msg: " Unable to list vpcs "
    success_msg: " VPCs listed successfully "
########################################################
- name: List VPC using limit
  nutanix.ncp.ntnx_vpcs_info_v2:
    limit: 1
  check_mode: true
  register: result
  ignore_errors: true

- name: Listing Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.response | length == 1
    fail_msg: " Unable to list vpcs "
    success_msg: " VPCs listed successfully "
##########################################################
- name: List VPC using ext_id
  nutanix.ncp.ntnx_vpcs_info_v2:
    ext_id: "{{ vpcs.response.0.ext_id }}"
  register: result
  ignore_errors: true

- name: Listing Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.response.name == vpcs.response.0.name
    fail_msg: " Unable to list vpcs "
    success_msg: " VPCs listed successfully "
##########################################################
- name: Delete all created vpcs
  nutanix.ncp.ntnx_vpcs_v2:
    state: absent
    ext_id: "{{ item }}"
  register: result
  loop: "{{ todelete }}"
  ignore_errors: true

- name: Reset todelete list
  ansible.builtin.set_fact:
    todelete: []
###########################################################
- name: Create VPC with all specifications
  nutanix.ncp.ntnx_vpcs_v2:
    state: present
    name: "{{vpc_name}}6"
    common_dhcp_options:
      domain_name_servers:
        - ipv4:
            value: "{{ dns_servers.0 }}"
            prefix_length: 32
        - ipv4:
            value: "{{ dns_servers.1 }}"
            prefix_length: 32
    externally_routable_prefixes:
      - ipv4:
          ip:
            value: "{{ routable_ips.network_ip}}"
          prefix_length: "{{ routable_ips.network_prefix }}"
    external_subnets:
      - subnet_reference: "{{ external_nat_subnet.uuid }}"
  register: result
  ignore_errors: true

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.ext_id is defined
      - result.response.name == "{{vpc_name}}6"
      - result.response.externally_routable_prefixes.0.ipv4.prefix_length  == {{ routable_ips.network_prefix }}
      - result.response.externally_routable_prefixes.0.ipv4.ip.value  ==  "{{ routable_ips.network_ip }}"
      - result.response.external_subnets.0.subnet_reference == "{{ external_nat_subnet.uuid }}"
      - result.response.common_dhcp_options.domain_name_servers.0.ipv4.value == "{{ dns_servers.0 }}"
      - result.response.common_dhcp_options.domain_name_servers.1.ipv4.value == "{{ dns_servers.1 }}"
    fail_msg: " Unable to create vpc all specifications "
    success_msg: " VPC with all specifications created successfully "

- name: Adding VPC external ID to delete list
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [  result.ext_id ] }}"
###########################################################
- name: Delete all created vpcs
  nutanix.ncp.ntnx_vpcs_v2:
    state: absent
    ext_id: "{{ item }}"
  register: result
  loop: "{{ todelete }}"
  ignore_errors: true

- name: Deletion Status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.msg == "All items completed"
    fail_msg: " Unable to Delete VPC"
    success_msg: "Vpc has been deleted successfully"

- name: Reset todelete list
  ansible.builtin.set_fact:
    todelete: []

###########################################################
# Tests for shared_with_projects
###########################################################

- name: Create VPC for sharing tests shared with two projects on create
  nutanix.ncp.ntnx_vpcs_v2:
    state: present
    wait: true
    name: "{{vpc_name}}_shared"
    external_subnets:
      - subnet_reference: "{{ external_nat_subnet.uuid }}"
    shared_with_projects:
      - "{{ project.uuid }}"
      - "{{ project2.uuid }}"
  register: result
  ignore_errors: true

- name: Status of create VPC for sharing tests
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.response.shared_with_projects is defined
      - result.response.shared_with_projects | length == 2
      - (result.response.shared_with_projects | sort) == ([project.uuid, project2.uuid] | sort)
    fail_msg: "Create VPC for sharing tests failed"
    success_msg: "Created VPC for sharing tests"

- name: Set shared VPC ext_id
  ansible.builtin.set_fact:
    shared_vpc_ext_id: "{{ result.ext_id }}"

###########################################################
# Scenario: share with all three projects (add a project)
###########################################################
- name: Update VPC to share with all three projects
  nutanix.ncp.ntnx_vpcs_v2:
    state: present
    ext_id: "{{ shared_vpc_ext_id }}"
    shared_with_projects:
      - "{{ project.uuid }}"
      - "{{ project2.uuid }}"
      - "{{ project3.uuid }}"
  register: result
  ignore_errors: true

- name: Status of VPC share with all three projects
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.shared_with_projects is not none
      - result.response.shared_with_projects | length == 3
      - (result.response.shared_with_projects | sort) == ([project.uuid, project2.uuid, project3.uuid] | sort)
    fail_msg: "VPC share with all three projects failed"
    success_msg: "VPC shared with all three projects successfully"

###########################################################
# Scenario: reconcile shared projects to a subset (drop one, keep two)
###########################################################
- name: Update VPC to reconcile shared projects to a subset
  nutanix.ncp.ntnx_vpcs_v2:
    state: present
    ext_id: "{{ shared_vpc_ext_id }}"
    shared_with_projects:
      - "{{ project2.uuid }}"
      - "{{ project3.uuid }}"
  register: result
  ignore_errors: true

- name: Status of VPC reconcile shared projects to a subset
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.shared_with_projects is not none
      - result.response.shared_with_projects | length == 2
      - (result.response.shared_with_projects | sort) == ([project2.uuid, project3.uuid] | sort)
      - project.uuid not in result.response.shared_with_projects
    fail_msg: "VPC reconcile shared projects to a subset failed"
    success_msg: "VPC reconciled shared projects to a subset successfully"

###########################################################
# Scenario: unshare from all projects
###########################################################
- name: Update VPC to unshare from all projects
  nutanix.ncp.ntnx_vpcs_v2:
    state: present
    ext_id: "{{ shared_vpc_ext_id }}"
    shared_with_projects: []
  register: result
  ignore_errors: true

- name: Status of VPC unshare from all projects
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == true
      - result.response.shared_with_projects is none or result.response.shared_with_projects | length == 0
    fail_msg: "VPC unshare from all projects failed with error"
    success_msg: "VPC unshare from all projects completed"
###########################################################

- name: Delete shared VPC
  nutanix.ncp.ntnx_vpcs_v2:
    state: absent
    ext_id: "{{ shared_vpc_ext_id }}"
  register: result
  ignore_errors: true

- name: Delete shared VPC status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
    fail_msg: "Unable to delete shared VPC"
    success_msg: "Shared VPC deleted successfully"

###########################################################
# Delete the project created for tests
###########################################################
- name: Delete projects created for tests
  nutanix.ncp.ntnx_project_v2:
    state: absent
    ext_id: "{{ item }}"
  register: delete_projects_result
  loop:
    - "{{ project.uuid }}"
    - "{{ project2.uuid }}"
    - "{{ project3.uuid }}"
  ignore_errors: true

- name: Status of projects deletion for tests
  ansible.builtin.assert:
    that:
      - item.changed == true
      - item.failed == false
      - item.ext_id == item.item
      - item.task_ext_id is defined
      - item.response.status == "SUCCEEDED"
    fail_msg: "Unable to delete project created for tests"
    success_msg: "Project created for tests deleted successfully"
  loop: "{{ delete_projects_result.results }}"
  loop_control:
    label: "{{ item.item }}"
