---
# Integration tests for ntnx_esxi_vm_revert_v2.
# Check mode only generates the revert spec (no API call), so dummy ext_ids are
# used inline.

- name: Start testing ntnx_esxi_vm_revert_v2 module
  ansible.builtin.debug:
    msg: Start testing ntnx_esxi_vm_revert_v2 module

- name: Revert ESXi VM without ext_id
  nutanix.ncp.ntnx_esxi_vm_revert_v2:
    vm_recovery_point_ext_id: "00000000-0000-0000-0000-000000000002"
  register: result
  ignore_errors: true

- name: Assert missing ext_id fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
      - result.msg is defined
      - "'ext_id' in (result.msg | string)"
    fail_msg: Missing ext_id was not rejected
    success_msg: Missing ext_id correctly rejected

- name: Revert ESXi VM without vm_recovery_point_ext_id
  nutanix.ncp.ntnx_esxi_vm_revert_v2:
    ext_id: "00000000-0000-0000-0000-000000000001"
  register: result
  ignore_errors: true

- name: Assert missing vm_recovery_point_ext_id fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
      - result.msg is defined
      - "'vm_recovery_point_ext_id' in (result.msg | string)"
    fail_msg: Missing vm_recovery_point_ext_id was not rejected
    success_msg: Missing vm_recovery_point_ext_id correctly rejected

- name: Revert ESXi VM with invalid state
  nutanix.ncp.ntnx_esxi_vm_revert_v2:
    state: absent
    ext_id: "00000000-0000-0000-0000-000000000001"
    vm_recovery_point_ext_id: "00000000-0000-0000-0000-000000000002"
  register: result
  ignore_errors: true

- name: Assert invalid state fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
      - result.msg is defined
      - "'state' in (result.msg | string)"
    fail_msg: Invalid state was not rejected
    success_msg: Invalid state correctly rejected

- name: Revert ESXi VM from recovery point - check mode is enabled
  nutanix.ncp.ntnx_esxi_vm_revert_v2:
    ext_id: "00000000-0000-0000-0000-000000000001"
    vm_recovery_point_ext_id: "00000000-0000-0000-0000-000000000002"
  register: result
  ignore_errors: true
  check_mode: true

- name: Assert revert check mode generates spec
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.ext_id == "00000000-0000-0000-0000-000000000001"
      - result.response.vm_recovery_point_ext_id == "00000000-0000-0000-0000-000000000002"
    fail_msg: Revert check mode failed
    success_msg: Revert check mode passed

- name: Revert non-existent ESXi VM from recovery point
  nutanix.ncp.ntnx_esxi_vm_revert_v2:
    ext_id: "00000000-0000-0000-0000-000000000001"
    vm_recovery_point_ext_id: "00000000-0000-0000-0000-000000000002"
  register: result
  ignore_errors: true

- name: Assert revert of non-existent ESXi VM fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
      - result.msg is defined
    fail_msg: Revert of non-existent ESXi VM did not fail
    success_msg: Revert of non-existent ESXi VM failed as expected
