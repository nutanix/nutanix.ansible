---
- name: Start ntnx_ext_id lookup plugin tests
  ansible.builtin.debug:
    msg: Start ntnx_ext_id lookup plugin tests

- name: Generate a suffix for the entities created by this target
  ansible.builtin.set_fact:
    lookup_test_suffix: "{{ 99999999 | random }}"

############################################################################
# Name based resolution for every top level entity that exposes a list API.
# Each entity is listed with its *_info_v2 module, then the first entity's
# name is resolved back to its ext_id via the lookup and compared.
