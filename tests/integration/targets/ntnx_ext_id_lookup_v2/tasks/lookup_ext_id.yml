  nutanix.ncp.ntnx_clusters_info_v2:
  register: cluster_info
  ignore_errors: true

- name: Verify lookup for cluster
  ansible.builtin.include_tasks: resolve_and_assert.yml
  vars:
    res_resource: cluster
