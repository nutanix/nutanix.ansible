############################################################################
# Categories are keyed on key/value rather than a unique name. The lookup
# defaults to matching the category 'key', which can map to several
# categories, so fail_on_multiple is disabled and membership is asserted.
############################################################################

- name: List categories
  nutanix.ncp.ntnx_categories_info_v2:
  register: category_info
  ignore_errors: true

- name: Verify lookup for category by key
  when:
    - not (category_info.failed | default(false))
    - category_info.response is defined
    - category_info.response | length > 0
  block:
    - name: Capture a reference category
      ansible.builtin.set_fact:
        category_ref_key: "{{ category_info.response[0].key | default('', true) }}"
        category_ref_value: "{{ category_info.response[0].value | default('', true) }}"
        category_ref_ext_id: "{{ category_info.response[0].ext_id }}"

    - name: Resolve category by key (returns all matching ext_ids)
      ansible.builtin.set_fact:
        category_resolved_ext_ids: >-
          {{ query('nutanix.ncp.ntnx_ext_id', category_ref_key, resource='category',
                   fail_on_multiple=false,
                   nutanix_host=ip, nutanix_username=username,
                   nutanix_password=password, validate_certs=validate_certs) }}
      when: category_ref_key | length > 0

    - name: Assert category resolved correctly
      ansible.builtin.assert:
        that:
          - category_ref_ext_id in category_resolved_ext_ids
        success_msg: "ntnx_ext_id resolved category key '{{ category_ref_key }}' including ext_id {{ category_ref_ext_id }}"
        fail_msg: "ntnx_ext_id failed to resolve category key '{{ category_ref_key }}'"
      when: category_ref_key | length > 0

############################################################################
# Option and error handling tests, anchored on cluster which always exists.
############################################################################

- name: Capture a reference cluster for option tests
  ansible.builtin.set_fact:
    cluster_ref_name: "{{ cluster_info.response[0].name }}"
    cluster_ref_ext_id: "{{ cluster_info.response[0].ext_id }}"
  when:
    - cluster_info.response is defined
    - cluster_info.response | length > 0

- name: Option and error handling tests
  when: cluster_ref_name is defined
  block:
    - name: Resolve a non existent name with fail_on_missing=false
      ansible.builtin.set_fact:
        missing_resolved: >-
          {{ query('nutanix.ncp.ntnx_ext_id',
                   'ntnx_ext_id_lookup_does_not_exist_xyz', resource='cluster',
                   fail_on_missing=false,
                   nutanix_host=ip, nutanix_username=username,
                   nutanix_password=password, validate_certs=validate_certs) }}

    - name: Assert fail_on_missing=false returns a single None entry
      ansible.builtin.assert:
        that:
          - missing_resolved | length == 1
          - missing_resolved[0] is none
        success_msg: "ntnx_ext_id returned None for a missing entity when fail_on_missing=false"
        fail_msg: "ntnx_ext_id did not return None for a missing entity when fail_on_missing=false"

    - name: Resolve a non existent name with default fail_on_missing (should fail)
      ansible.builtin.set_fact:
        should_not_be_set: >-
          {{ query('nutanix.ncp.ntnx_ext_id',
                   'ntnx_ext_id_lookup_does_not_exist_xyz', resource='cluster',
                   nutanix_host=ip, nutanix_username=username,
                   nutanix_password=password, validate_certs=validate_certs) }}
      register: missing_default_result
      ignore_errors: true

    - name: Assert default fail_on_missing raises an error
      ansible.builtin.assert:
        that:
          - missing_default_result is failed
        success_msg: "ntnx_ext_id raised an error for a missing entity by default"
        fail_msg: "ntnx_ext_id did not raise an error for a missing entity by default"

    - name: Use an unsupported resource (should fail)
      ansible.builtin.set_fact:
        unsupported_result: >-
          {{ query('nutanix.ncp.ntnx_ext_id', cluster_ref_name, resource='not_a_real_resource',
                   nutanix_host=ip, nutanix_username=username,
                   nutanix_password=password, validate_certs=validate_certs) }}
      register: unsupported_resource_result
      ignore_errors: true

    - name: Assert unsupported resource raises an error
      ansible.builtin.assert:
        that:
          - unsupported_resource_result is failed
        success_msg: "ntnx_ext_id raised an error for an unsupported resource"
        fail_msg: "ntnx_ext_id did not raise an error for an unsupported resource"

############################################################################
# End to end: use the lookup inline to resolve references by name and create
# a real subnet, exactly the workflow requested in issue #979. Cleaned up
# afterwards. Only runs when a cluster and a virtual switch are available.
############################################################################

- name: End to end subnet creation using name based lookups
  when:
    - cluster_ref_name is defined
    - vs_info.response is defined
    - vs_info.response | length > 0
    - (vs_info.response[0].name | default('', true)) | length > 0
  block:
    - name: Set end to end inputs
      ansible.builtin.set_fact:
        e2e_vs_name: "{{ vs_info.response[0].name }}"
        e2e_subnet_name: "ntnx_ext_id_e2e_{{ query('community.general.random_string', numbers=false, special=false, length=8)[0] }}"
        e2e_network_id: "{{ 200 + (3000 | random) }}"

    - name: Create a VLAN subnet using lookup resolved references
      nutanix.ncp.ntnx_subnets_v2:
        state: present
        name: "{{ e2e_subnet_name }}"
        subnet_type: VLAN
        network_id: "{{ e2e_network_id | int }}"
        cluster_reference: >-
          {{ lookup('nutanix.ncp.ntnx_ext_id', cluster_ref_name, resource='cluster',
                    nutanix_host=ip, nutanix_username=username,
                    nutanix_password=password, validate_certs=validate_certs) }}
        virtual_switch_reference: >-
          {{ lookup('nutanix.ncp.ntnx_ext_id', e2e_vs_name, resource='virtual_switch',
                    fail_on_multiple=false,
                    nutanix_host=ip, nutanix_username=username,
                    nutanix_password=password, validate_certs=validate_certs) }}
      register: e2e_subnet_result
      ignore_errors: true

    - name: Assert subnet created with lookup resolved cluster reference
      ansible.builtin.assert:
        that:
          - e2e_subnet_result.changed == true
          - e2e_subnet_result.failed == false
          - e2e_subnet_result.response is defined
          - e2e_subnet_result.response.name == e2e_subnet_name
          - e2e_subnet_result.response.cluster_reference == cluster_ref_ext_id
        success_msg: "Subnet created successfully using ntnx_ext_id resolved references"
        fail_msg: "Subnet creation using ntnx_ext_id resolved references failed"

    - name: Delete the end to end subnet
      nutanix.ncp.ntnx_subnets_v2:
        state: absent
        ext_id: "{{ e2e_subnet_result.ext_id }}"
      when:
        - e2e_subnet_result.ext_id is defined
      register: e2e_subnet_delete
      ignore_errors: true

    - name: Assert end to end subnet deleted
      ansible.builtin.assert:
        that:
          - e2e_subnet_delete.changed == true
          - e2e_subnet_delete.failed == false
        success_msg: "End to end subnet deleted successfully"
        fail_msg: "End to end subnet deletion failed"
      when:
        - e2e_subnet_result.ext_id is defined

- name: Ntnx_ext_id lookup plugin tests completed
  ansible.builtin.debug:
    msg: ntnx_ext_id lookup plugin tests completed
