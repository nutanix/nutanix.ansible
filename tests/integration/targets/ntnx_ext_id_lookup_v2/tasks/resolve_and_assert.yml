---
# Reusable assertion: given a registered *_info_v2 result in `res_info` and the
# `res_resource` keyword, resolve the first entity's reference attribute (default:
# name) back to its ext_id via the ntnx_ext_id lookup and assert the lookup
# returned the expected ext_id.
- name: Verify ntnx_ext_id lookup for resource
  when:
    - res_info is defined
    - not (res_info.failed | default(false))
    - res_info.response is defined
    - res_info.response is not none
    - res_info.response | length > 0
  block:
    - name: Capture reference value and ext_id
      ansible.builtin.set_fact:
        res_ref_value: "{{ res_info.response[0][res_ref_attr | default('name')] | default('', true) }}"
        res_expected_ext_id: "{{ res_info.response[0].ext_id }}"

    - name: Use container_ext_id fallback for storage_container
      when:
        - res_resource == 'storage_container'
        - (res_expected_ext_id | default('', true) | length) == 0
      ansible.builtin.set_fact:
        res_expected_ext_id: "{{ res_info.response[0].container_ext_id | default('', true) }}"

    - name: Resolve by reference value and assert ext_id
      when: res_ref_value | length > 0
      block:
        - name: Resolve value via ntnx_ext_id lookup (term mode)
          ansible.builtin.set_fact:
            res_resolved_ext_ids: >-
              {{ query('nutanix.ncp.ntnx_ext_id', res_ref_value,
                       resource=res_resource, fail_on_multiple=false,
                       **lookup_auth) }}

        - name: Assert ntnx_ext_id resolved expected ext_id (term mode)
          ansible.builtin.assert:
            that:
              - res_expected_ext_id in res_resolved_ext_ids
            success_msg: "ntnx_ext_id resolved {{ res_resource }} '{{ res_ref_value }}' to {{ res_expected_ext_id }}"
            fail_msg: >-
              ntnx_ext_id failed to resolve {{ res_resource }} '{{ res_ref_value }}'
              (got {{ res_resolved_ext_ids }}, expected {{ res_expected_ext_id }})

        - name: Resolve via explicit filter_attribute override
          ansible.builtin.set_fact:
            res_resolved_ext_ids_with_attr: >-
              {{ query('nutanix.ncp.ntnx_ext_id', res_ref_value,
                       resource=res_resource, filter_attribute=(res_filter_attr | default('name')),
                       fail_on_multiple=false,
                       **lookup_auth) }}

        - name: Assert ntnx_ext_id resolved with filter_attribute override
          ansible.builtin.assert:
            that:
              - res_expected_ext_id in res_resolved_ext_ids_with_attr
            success_msg: "ntnx_ext_id resolved {{ res_resource }} with filter_attribute override"
            fail_msg: >-
              ntnx_ext_id failed with filter_attribute override for {{ res_resource }}
              (got {{ res_resolved_ext_ids_with_attr }}, expected {{ res_expected_ext_id }})

        - name: Resolve via raw filter without positional terms
          ansible.builtin.set_fact:
            res_resolved_ext_ids_raw_filter: >-
              {{ query('nutanix.ncp.ntnx_ext_id',
                       resource=res_resource,
                       filter=(res_filter_attr | default('name')) ~ " eq '" ~ (res_ref_value | replace("'", "''")) ~ "'",
                       fail_on_multiple=false,
                       **lookup_auth) }}

        - name: Assert ntnx_ext_id resolved with raw filter
          ansible.builtin.assert:
            that:
              - res_expected_ext_id in res_resolved_ext_ids_raw_filter
            success_msg: "ntnx_ext_id resolved {{ res_resource }} with raw filter"
            fail_msg: >-
              ntnx_ext_id failed with raw filter for {{ res_resource }}
              (got {{ res_resolved_ext_ids_raw_filter }}, expected {{ res_expected_ext_id }})
