---
# The ntnx_ext_id lookup plugin runs on the controller and does not honor the
# module_defaults group, so it receives credentials explicitly as arguments.
# The module_defaults group below is only used by the *_info_v2 modules that
# provide the reference data the lookup results are checked against.
- name: Set module defaults
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip }}"
      nutanix_username: "{{ username | default(omit) }}"
      nutanix_password: "{{ password | default(omit) }}"
      nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
      validate_certs: "{{ validate_certs }}"
      nutanix_debug: "{{ nutanix_debug | default(omit) }}"
      nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
  block:
    - name: Import lookup_ext_id.yml
      ansible.builtin.import_tasks: lookup_ext_id.yml
