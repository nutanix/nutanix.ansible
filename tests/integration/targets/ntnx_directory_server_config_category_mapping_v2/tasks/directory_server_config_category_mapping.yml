      - create_result.changed == true
      - create_result.failed == false
      - create_result.response is defined
      - create_result.response.name == "{{ category_mapping_name }}"
      - create_result.response.category_name == selected_category_name
      - create_result.response.category_value == selected_category_value
      - create_result.response.ad_info.directory_service_reference == "{{ directory_service_ref_first }}"
      - create_result.response.ad_info.object_identifier == "{{ active_directory_object_ext_id }}"
      - create_result.response.ad_info.object_path is defined
      - create_result.response.ad_info.object_path | length > 0
