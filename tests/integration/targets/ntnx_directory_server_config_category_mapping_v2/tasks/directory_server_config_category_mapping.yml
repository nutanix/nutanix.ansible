---
- name: Start ntnx_directory_server_config_v2 tests
  ansible.builtin.debug:
    msg: start ntnx_directory_server_config_v2 tests

- name: Set suffix_name
  ansible.builtin.set_fact:
    suffix_name: ansible-dsc

- name: Generate random suffix for directory service names
  ansible.builtin.set_fact:
    ds_random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"

- name: Set test variables
  ansible.builtin.set_fact:
    invalid_ext_id: "83cbf00d-782f-4efc-87c8-4129f5942aaa"
    dsc_first_criteria: "{{ suffix_name }}-first-criteria"
    dsc_second_criteria: "{{ suffix_name }}-second-criteria"
    category_mapping_name: "{{ suffix_name }}-category-mapping"
    selected_category_name: "ADGroup"

- name: Create primary ACTIVE_DIRECTORY service
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    name: "{{ ds_random_name }}-{{ suffix_name }}-primary"
    url: "{{ active_directory.url }}"
    directory_type: ACTIVE_DIRECTORY
    domain_name: "{{ active_directory.domain_name }}"
    service_account:
      username: "{{ active_directory.username }}"
      password: "{{ active_directory.password }}"
    white_listed_groups:
      - "{{ white_listed_groups[0] }}"
  register: primary_directory_service
  ignore_errors: true

- name: Assert primary ACTIVE_DIRECTORY service creation status
  ansible.builtin.assert:
    that:
      - primary_directory_service.response is defined
      - primary_directory_service.changed == true
      - primary_directory_service.failed == false
      - primary_directory_service.response.name == "{{ ds_random_name }}-{{ suffix_name }}-primary"
      - primary_directory_service.response.directory_type == "ACTIVE_DIRECTORY"
      - primary_directory_service.response.url == "{{ active_directory.url }}"
      - primary_directory_service.response.domain_name == "{{ active_directory.domain_name }}"
      - primary_directory_service.ext_id is defined
      - primary_directory_service.response.ext_id == primary_directory_service.ext_id
    fail_msg: Unable to create primary ACTIVE_DIRECTORY service
    success_msg: Primary ACTIVE_DIRECTORY service created successfully

- name: Create secondary ACTIVE_DIRECTORY service
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    name: "{{ ds_random_name }}-{{ suffix_name }}-secondary"
    url: "{{ active_directory_secondary.url }}"
    directory_type: ACTIVE_DIRECTORY
    domain_name: "{{ active_directory_secondary.domain_name }}"
    service_account:
      username: "{{ active_directory_secondary.username }}"
      password: "{{ active_directory_secondary.password }}"
    white_listed_groups:
      - "{{ white_listed_groups[0] }}"
  register: secondary_directory_service
  ignore_errors: true

- name: Assert secondary ACTIVE_DIRECTORY service creation status
  ansible.builtin.assert:
    that:
      - secondary_directory_service.response is defined
      - secondary_directory_service.changed == true
      - secondary_directory_service.failed == false
      - secondary_directory_service.response.name == "{{ ds_random_name }}-{{ suffix_name }}-secondary"
      - secondary_directory_service.response.directory_type == "ACTIVE_DIRECTORY"
      - secondary_directory_service.response.url == "{{ active_directory_secondary.url }}"
      - secondary_directory_service.response.domain_name == "{{ active_directory_secondary.domain_name }}"
      - secondary_directory_service.ext_id is defined
      - secondary_directory_service.response.ext_id == secondary_directory_service.ext_id
    fail_msg: Unable to create secondary ACTIVE_DIRECTORY service
    success_msg: Secondary ACTIVE_DIRECTORY service created successfully

- name: Capture created directory service ext_ids
  ansible.builtin.set_fact:
    directory_service_ref_first: "{{ primary_directory_service.response.ext_id }}"
    directory_service_ref_second: "{{ secondary_directory_service.response.ext_id }}"

- name: Generate random category value suffix
  ansible.builtin.set_fact:
    category_value_suffix: "{{ query('community.general.random_string', numbers=true, special=false, upper=false, length=8)[0] }}"

- name: Set ADGroup category value
  ansible.builtin.set_fact:
    selected_category_value: "ad-group-{{ category_value_suffix }}"

###################################################################################################
# Resolve the AD group object GUID dynamically using the directory service search module
###################################################################################################
- name: Search directory service for AD group object
  nutanix.ncp.ntnx_directory_service_search_v2:
    ext_id: "{{ directory_service_ref_first }}"
    query: "{{ active_directory_object_name }}"
    searched_attributes:
      - name
      - sAMAccountName
      - cn
    returned_attributes:
      - name
      - objectGUID
  register: ad_object_search_result

- name: Assert AD object search returned a matching group
  ansible.builtin.assert:
    that:
      - ad_object_search_result.changed == false
      - ad_object_search_result.failed == false
      - ad_object_search_result.ext_id == directory_service_ref_first
      - ad_object_search_result.response is defined
      - ad_object_search_result.response.domain_name is defined
      - ad_object_search_result.response.search_results is defined
      - ad_object_search_result.response.search_results | length > 0
      - >-
        ad_object_search_result.response.search_results
        | selectattr('entity_type', 'equalto', 'Group')
        | list | length > 0
      - >-
        (ad_object_search_result.response.search_results
         | selectattr('entity_type', 'equalto', 'Group')
         | first).attributes
         | selectattr('name', 'equalto', 'objectGUID')
         | list | length > 0
    fail_msg: "Directory service search did not return a matching group object for '{{ active_directory_object_name }}'"
    success_msg: "Directory service search returned a matching group object for '{{ active_directory_object_name }}'"

- name: Set AD object ext_id from directory service search result
  ansible.builtin.set_fact:
    active_directory_object_ext_id: >-
      {{ ((ad_object_search_result.response.search_results
           | selectattr('entity_type', 'equalto', 'Group')
           | first).attributes
           | selectattr('name', 'equalto', 'objectGUID')
           | map(attribute='values') | first | first) }}

- name: Assert AD object ext_id was resolved from search
  ansible.builtin.assert:
    that:
      - active_directory_object_ext_id is defined
      - active_directory_object_ext_id | length > 0
    fail_msg: "Failed to resolve AD group object ext_id from directory service search"
    success_msg: "Resolved AD group object ext_id from directory service search: {{ active_directory_object_ext_id }}"

