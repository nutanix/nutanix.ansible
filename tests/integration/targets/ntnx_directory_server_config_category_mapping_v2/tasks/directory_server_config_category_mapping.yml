    fail_msg: List all directory server configs failed
    success_msg: List all directory server configs passed

- name: Get Directory Server category mapping using ext_id
  nutanix.ncp.ntnx_category_mappings_info_v2:
    ext_id: "{{ category_mapping_ext_id }}"
  register: get_result
  ignore_errors: true

- name: Assert get Directory Server category mapping using ext_id status
  ansible.builtin.assert:
    that:
      - get_result.changed == false
      - get_result.failed == false
      - get_result.response is defined
