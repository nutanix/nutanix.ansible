# IDEMPOTENCY TEST
###################################################################################################
- name: Update directory server config with identical payload for idempotency
  nutanix.ncp.ntnx_directory_server_config_v2:
    ext_id: "{{ directory_server_config.ext_id }}"
    directory_service_reference: "{{ directory_service_ref_second }}"
    matching_criterias:
      - match_entity: VM
        match_field: NAME
        match_type: ALL
    is_default_category_enabled: false
    should_keep_default_category_on_login: false
  register: idempotency_result
  ignore_errors: true

- name: Assert idempotency for directory server config update
  ansible.builtin.debug:
    var: idempotency_result

- name: Assert idempotency for directory server config update status
  ansible.builtin.assert:
    that:
      - idempotency_result.changed == false
      - idempotency_result.failed == false
      - idempotency_result.skipped == true
      - idempotency_result.msg == "Nothing to change."
    fail_msg: Idempotency check for directory server config update failed
    success_msg: Idempotency check for directory server config update passed

- name: Update DS category mapping with identical payload for idempotency
  nutanix.ncp.ntnx_category_mapping_v2:
    state: present
    ext_id: "{{ category_mapping_ext_id }}"
    name: "{{ category_mapping_name }}_updated"
    category_name: "{{ selected_category_name }}"
    category_value: "{{ selected_category_value }}_updated"
    ad_info:
      directory_service_reference: "{{ directory_service_ref_second }}"
      object_identifier: "{{ active_directory_object_ext_id }}"
  register: idempotency_result
  ignore_errors: true

- name: Assert idempotency for DS category mapping update
  ansible.builtin.debug:
    var: idempotency_result

- name: Assert idempotency for DS category mapping update status
  ansible.builtin.assert:
    that:
      - idempotency_result.changed == false
      - idempotency_result.failed == false
      - idempotency_result.skipped == true
      - idempotency_result.msg == "Nothing to change."
    fail_msg: Idempotency check for DS category mapping update failed
    success_msg: Idempotency check for DS category mapping update passed

