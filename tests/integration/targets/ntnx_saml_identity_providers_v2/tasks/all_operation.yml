---
# Variables required before running this playbook:
# - xml_content

- name: Start ntnx_saml_identity_providers_v2 and ntnx_saml_identity_providers_info_v2 tests
  ansible.builtin.debug:
    msg: start ntnx_saml_identity_providers_v2 and ntnx_saml_identity_providers_info_v2 tests

- name: Generate random category  key & value
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"

- name: Set suffix name
  ansible.builtin.set_fact:
    suffix_name: ansible-ag

- name: Set variables
  ansible.builtin.set_fact:
    todelete: []
    user_name: "{{ random_name }}{{ suffix_name }}user"
    full_name: "{{ random_name }}{{ suffix_name }}saml"

########################################################################
# Get the default project
########################################################################
- name: Get the default project
  nutanix.ncp.ntnx_projects_info_v2:
  register: default_project_result
  ignore_errors: true

- name: Status of fetching the default project
  ansible.builtin.assert:
    that:
      - default_project_result.changed == false
      - default_project_result.failed == false
      - default_project_result.response is defined
      - default_project_result.response | selectattr('is_default', 'equalto', true) | list | length > 0
    fail_msg: "Unable to fetch the default project"
    success_msg: "Default project fetched successfully"

- name: Set default project fact
  ansible.builtin.set_fact:
    default_project:
      uuid: "{{ (default_project_result.response | selectattr('is_default', 'equalto', true) | first).ext_id }}"

########################################################################
# Create a project to be used for project_ext_id and sharing tests
########################################################################
- name: Create projects for tests
  nutanix.ncp.ntnx_project_v2:
    state: present
    name: "{{ random_name }}-ansible-project-{{ item }}"
    project_id: "{{ random_name }}-ansible-project-id-{{ item }}"
  register: create_projects_result
  loop: "{{ range(1, 4) | list }}"
  ignore_errors: true

- name: Status of projects creation for tests
  ansible.builtin.assert:
    that:
      - item.changed == true
      - item.failed == false
      - item.response is defined
      - item.ext_id is defined
      - item.ext_id | length > 0
      - item.task_ext_id is defined
      - item.response.state == "ACTIVE"
    fail_msg: "Unable to create project for tests"
    success_msg: "Project for tests created successfully"
  loop: "{{ create_projects_result.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Set project facts for tests
  ansible.builtin.set_fact:
    project1:
      name: "{{ random_name }}-ansible-project-1"
      uuid: "{{ create_projects_result.results[0].ext_id }}"
    project2:
      name: "{{ random_name }}-ansible-project-2"
      uuid: "{{ create_projects_result.results[1].ext_id }}"
    project3:
      name: "{{ random_name }}-ansible-project-3"
      uuid: "{{ create_projects_result.results[2].ext_id }}"

- name: Verify spec generation for identity providers with check_mode
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    name: "{{ full_name }}1"
    username_attribute: "{{ user_name }}1"
    email_attribute: email
    groups_attribute: groups
    groups_delim: ","
    idp_metadata_url: https://samltest.id/saml/idp
    idp_metadata_xml: idp_xml_value
    entity_issuer: entity_issuer_test
    is_signed_authn_req_enabled: true
    project_ext_id: "83083083-0000-0000-0000-000000000000"
    is_shared_with_all_projects: true
    custom_attributes:
      - custom1
      - custom2
    state: present
  register: result
  ignore_errors: true
  check_mode: true

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == False
      - result.failed == False
      - result.response.name == "{{ full_name }}1"
      - result.response.username_attribute == "{{ user_name }}1"
      - result.response.email_attribute == "email"
      - result.response.groups_attribute == "groups"
      - result.response.groups_delim == ","
      - result.response.idp_metadata_url == "https://samltest.id/saml/idp"
      - result.response.idp_metadata_xml == "idp_xml_value"
      - result.response.entity_issuer == "entity_issuer_test"
      - result.response.is_signed_authn_req_enabled == true
      - result.response.project_ext_id == "83083083-0000-0000-0000-000000000000"
      - result.response.is_shared_with_all_projects == true
      - result.response.custom_attributes[0] == "custom1"
      - result.response.custom_attributes[1] == "custom2"
    fail_msg: " Unable to Verify spec generation for identity providers with check_mode "
    success_msg: " Verify spec generation for identity providers with check_mode finished successfully "

- name: Read content from file
  ansible.builtin.set_fact:
    xml_file_content: "{{ lookup('file', saml_xml_dir.path + '/content.txt') }}"

- name: Create saml
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    name: "{{ full_name }}1"
    username_attribute: "{{ user_name }}1"
    email_attribute: email
    groups_attribute: groups
    groups_delim: ","
    idp_metadata_xml: "{{ xml_file_content }}"
    project_ext_id: "{{ default_project.uuid }}"
    is_shared_with_all_projects: true
    state: present
  register: result
  ignore_errors: true

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == True
      - result.failed == False
      - result.response.name == "{{ full_name }}1"
      - result.response.username_attribute == "{{ user_name }}1"
      - result.response.email_attribute == "email"
      - result.response.groups_attribute == "groups"
      - result.response.groups_delim == ","
      - result.response.project_ext_id == "00000000-0000-0000-0000-000000000000"
      - result.response.is_shared_with_all_projects == true
    fail_msg: " Unable to create saml "
    success_msg: " saml created successfully "

- name: Adding saml external ID to delete list
  ansible.builtin.set_fact:
    todelete: '{{ todelete + [result["ext_id"]] }}'

- name: Get saml using filter name
  nutanix.ncp.ntnx_saml_identity_providers_info_v2:
    filter: name eq '{{ full_name }}1'
  register: result
  ignore_errors: true

- name: Status of saml
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == False
      - result.failed == False
      - result.response[0].name == "{{ full_name }}1"
      - result.response[0].username_attribute == "{{ user_name }}1"
      - result.response[0].email_attribute == "email"
      - result.response[0].groups_attribute == "groups"
      - result.response[0].groups_delim == ","
      - result.response[0].ext_id == "{{ todelete[-1] }}"
      - result.response | length == 1
    fail_msg: " Unable to fetch saml using filter name "
    success_msg: " saml fetched using filter name successfully "

- name: Create identity provider that already exists
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    name: "{{ full_name }}1"
    username_attribute: "{{ user_name }}1"
    email_attribute: email
    groups_attribute: groups
    groups_delim: ","
    idp_metadata_xml: "{{ xml_file_content }}"
    project_ext_id: "{{ default_project.uuid }}"
    state: present
  register: result
  ignore_errors: true

- name: Status of creating identity provider that already exists
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == true
      - result.response.data.error | length > 0
      - result.status == 409
    fail_msg: " Creating identity provider with an existing name should have failed "
    success_msg: " Creating identity provider with an existing name failed as expected "

- name: Verify spec generation for update identity providers with check_mode
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    state: present
    ext_id: "{{ todelete[-1] }}"
    name: "{{ full_name }}2"
    username_attribute: "{{ user_name }}2"
    email_attribute: new_email
    groups_attribute: group_list
    groups_delim: ;
    is_signed_authn_req_enabled: true
    # Dummy sharing values to verify check mode reflects the requested sharing.
    shared_with_projects:
      - "11111111-1111-1111-1111-111111111111"
      - "22222222-2222-2222-2222-222222222222"
  register: result
  ignore_errors: true
  check_mode: true

- name: Update status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == False
      - result.failed == False
      - result.response.name == "{{ full_name }}2"
      - result.response.username_attribute == "{{ user_name }}2"
      - result.response.email_attribute == "new_email"
      - result.response.groups_attribute == "group_list"
      - result.response.groups_delim == ";"
      - result.response.ext_id == "{{ todelete[-1] }}"
      - result.response.is_signed_authn_req_enabled == true
      - result.response.shared_with_projects == ["11111111-1111-1111-1111-111111111111", "22222222-2222-2222-2222-222222222222"]
    fail_msg: " Unable to Verify spec generation for update identity providers with check_mode  "
    success_msg: " Verify spec generation for update identity providers with check_mode  finished successfully"

- name: Update saml
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    state: present
    ext_id: "{{ todelete[-1] }}"
    name: "{{ full_name }}2"
    username_attribute: "{{ user_name }}2"
    email_attribute: new_email
    groups_attribute: group_list
    groups_delim: ;
    is_signed_authn_req_enabled: true
    request_signing_credential:
      public_certificate: "{{ lookup('file', sp_tmpdir.path + '/sp.crt') }}"
      private_key: "{{ lookup('file', sp_tmpdir.path + '/sp.key') }}"
  register: result
  ignore_errors: true

- name: Update status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == True
      - result.failed == False
      - result.response.name == "{{ full_name }}2"
      - result.response.username_attribute == "{{ user_name }}2"
      - result.response.email_attribute == "new_email"
      - result.response.groups_attribute == "group_list"
      - result.response.groups_delim == ";"
      - result.response.ext_id == "{{ todelete[-1] }}"
      - result.response.is_signed_authn_req_enabled == true
    fail_msg: " Unable to update saml "
    success_msg: " saml updated successfully "

- name: Check idempotency
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    state: present
    ext_id: "{{ todelete[-1] }}"
    name: "{{ full_name }}2"
    username_attribute: "{{ user_name }}2"
    is_signed_authn_req_enabled: true
  register: result
  ignore_errors: true

- name: Idempotency status
  ansible.builtin.assert:
    that:
      - result.msg == "Nothing to change."
      - result.changed == False
      - result.failed == False
    fail_msg: " Unable to check idempotency "
    success_msg: " Idempotency check successfully "

- name: Get saml using ext_id
  nutanix.ncp.ntnx_saml_identity_providers_info_v2:
    ext_id: "{{ todelete[-1] }}"
  register: result
  ignore_errors: true

- name: Status of saml
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == False
      - result.failed == False
      - result.response.name == "{{ full_name }}2"
      - result.response.username_attribute == "{{ user_name }}2"
      - result.response.email_attribute == "new_email"
      - result.response.groups_attribute == "group_list"
      - result.response.groups_delim == ";"
      - result.response.ext_id == "{{ todelete[-1] }}"
      - result.response.is_signed_authn_req_enabled == true
    fail_msg: " Unable to fetch saml using ext_id "
    success_msg: " saml fetched using ext_id successfully "

- name: List all identity providers
  nutanix.ncp.ntnx_saml_identity_providers_info_v2:
  register: result
  ignore_errors: true

- name: List status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == False
      - result.failed == False
      - result.response | length > 0
      - result.total_available_results is defined
      - result.total_available_results > 0
    fail_msg: " Unable to list all identity providers "
    success_msg: " list all identity providers successfully "

- name: List all identity providers with limit
  nutanix.ncp.ntnx_saml_identity_providers_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: List all identity providers with limit status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == False
      - result.failed == False
      - result.response | length == 1
    fail_msg: " Unable to list all identity providers with limit "
    success_msg: " list all identity providers with limit successfully "

- name: Verify update of project_ext_id is not supported
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    state: present
    ext_id: "{{ todelete[0] }}"
    project_ext_id: "00000000-0000-0000-0000-000000000001"
  register: result
  ignore_errors: true

- name: Verify update of project_ext_id is blocked status
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
      - 'result.msg == "Update is not supported for the following field(s): project_ext_id"'
    fail_msg: "Update of project_ext_id should have been blocked"
    success_msg: "Update of project_ext_id is correctly blocked"

- name: Delete SAML identity provider with check mode enabled
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    state: absent
    ext_id: "{{ todelete[0] }}"
  register: result
  ignore_errors: true
  check_mode: true

- name: Delete SAML identity provider with check mode status
  ansible.builtin.assert:
    that:
      - result.msg is defined
      - result.changed == false
      - result.failed == false
      - result.ext_id == "{{ todelete[0] }}"
      - result.msg == "Identity provider with ext_id:{{ todelete[0] }} will be deleted."
    fail_msg: " Delete SAML identity provider with check mode enabled failed "
    success_msg: " Delete SAML identity provider with check mode enabled successfully "

- name: Delete the created SAML identity providers
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    state: absent
    ext_id: "{{ item }}"
  register: result
  loop: "{{ todelete }}"
  ignore_errors: true

- name: Deletion Status
  ansible.builtin.assert:
    that:
      - result.changed == True
      - result.msg == "All items completed"
      - result.skipped == False
    fail_msg: " Unable to delete saml "
    success_msg: " saml deleted successfully "

- name: Reset todelete list
  ansible.builtin.set_fact:
    todelete: []

########################################################################
# Tests for is_shared_with_all_projects and shared_with_projects
########################################################################

- name: Create SAML identity provider for sharing tests
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    name: "{{ full_name }}_shared"
    username_attribute: "{{ user_name }}_shared"
    email_attribute: email
    groups_attribute: groups
    groups_delim: ","
    idp_metadata_xml: "{{ xml_file_content }}"
    project_ext_id: "{{ default_project.uuid }}"
    state: present
  register: result
  ignore_errors: true

- name: Status of create SAML for sharing tests
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.response.project_ext_id == "00000000-0000-0000-0000-000000000000"
      - result.response.is_shared_with_all_projects == false
      - result.response.name == "{{ full_name }}_shared"
      - result.response.username_attribute == "{{ user_name }}_shared"
      - result.response.email_attribute == "email"
      - result.response.groups_attribute == "groups"
      - result.response.groups_delim == ","
    fail_msg: "Create SAML for sharing tests failed"
    success_msg: "Created SAML for sharing tests"

- name: Set shared SAML ext_id
  ansible.builtin.set_fact:
    shared_saml_ext_id: "{{ result.ext_id }}"

########################################################################

- name: Update SAML to share with all projects
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    state: present
    ext_id: "{{ shared_saml_ext_id }}"
    is_shared_with_all_projects: true
  register: result
  ignore_errors: true

- name: Status of SAML share with all projects
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.is_shared_with_all_projects == true
    fail_msg: "SAML share with all projects failed"
    success_msg: "SAML shared with all projects successfully"

########################################################################
# Scenario: shared_with_projects is ignored when already shared with all projects
########################################################################
- name: Update SAML with shared_with_projects while already shared with all projects
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    state: present
    ext_id: "{{ shared_saml_ext_id }}"
    shared_with_projects:
      - "{{ project1.uuid }}"
      - "{{ project2.uuid }}"
  register: result
  ignore_errors: true

- name: Status of shared_with_projects being ignored when already shared with all projects
  ansible.builtin.assert:
    that:
      - result.failed == false
      # The identity provider is already shared with all projects, so the requested
      # per-project sharing is ignored and the module reports no change.
      - result.changed == false
      # The user is warned that their shared_with_projects input was dropped.
      - result.warnings is defined
      - result.warnings | select('search', 'shared_with_projects was ignored') | list | length > 0
    fail_msg: "shared_with_projects should be ignored when identity provider is already shared with all projects"
    success_msg: "shared_with_projects correctly ignored when identity provider is already shared with all projects"

- name: Fetch SAML after ignored shared_with_projects update
  nutanix.ncp.ntnx_saml_identity_providers_info_v2:
    ext_id: "{{ shared_saml_ext_id }}"
  register: result
  ignore_errors: true

- name: Verify SAML is still shared with all projects and no specific projects added
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.failed == false
      - result.response.is_shared_with_all_projects == true
      - (result.response.shared_with_projects | default([], true)) | length == 0
      - project1.uuid not in (result.response.shared_with_projects | default([], true))
      - project2.uuid not in (result.response.shared_with_projects | default([], true))
    fail_msg: "shared_with_projects should be ignored when identity provider is already shared with all projects"
    success_msg: "shared_with_projects correctly ignored when identity provider is already shared with all projects"

########################################################################

- name: Update SAML to unshare from all projects
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    state: present
    ext_id: "{{ shared_saml_ext_id }}"
    is_shared_with_all_projects: false
  register: result
  ignore_errors: true

- name: Status of SAML unshare from all projects
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.is_shared_with_all_projects == false
    fail_msg: "SAML unshare from all projects failed"
    success_msg: "SAML unshared from all projects successfully"

########################################################################

- name: Update SAML to share with two specific projects
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    state: present
    ext_id: "{{ shared_saml_ext_id }}"
    shared_with_projects:
      - "{{ project1.uuid }}"
      - "{{ project2.uuid }}"
  register: result
  ignore_errors: true

- name: Status of SAML share with two specific projects
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.shared_with_projects is defined
      - result.response.shared_with_projects | length == 2
      - project1.uuid in result.response.shared_with_projects
      - project2.uuid in result.response.shared_with_projects
    fail_msg: "SAML share with two specific projects failed"
    success_msg: "SAML shared with two specific projects successfully"

########################################################################
# Scenario: share with all three projects (add a project)
########################################################################
- name: Update SAML to share with all three projects
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    state: present
    ext_id: "{{ shared_saml_ext_id }}"
    shared_with_projects:
      - "{{ project1.uuid }}"
      - "{{ project2.uuid }}"
      - "{{ project3.uuid }}"
  register: result
  ignore_errors: true

- name: Status of SAML share with all three projects
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.shared_with_projects | length == 3
      - project1.uuid in result.response.shared_with_projects
      - project2.uuid in result.response.shared_with_projects
      - project3.uuid in result.response.shared_with_projects
    fail_msg: "SAML share with all three projects failed"
    success_msg: "SAML shared with all three projects successfully"

########################################################################
# Scenario: sharing idempotency (share with the same three projects again)
########################################################################
- name: Update SAML sharing with the same projects (idempotency)
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    state: present
    ext_id: "{{ shared_saml_ext_id }}"
    shared_with_projects:
      - "{{ project1.uuid }}"
      - "{{ project2.uuid }}"
      - "{{ project3.uuid }}"
  register: result
  ignore_errors: true

- name: Status of SAML sharing idempotency
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == false
      - result.skipped == true
      - result.msg == "Nothing to change."
    fail_msg: "SAML sharing idempotency failed"
    success_msg: "SAML sharing idempotency passed"

########################################################################
# Scenario: reconcile shared projects to a subset (drop one, keep two)
########################################################################
- name: Update SAML to reconcile shared projects to a subset
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    state: present
    ext_id: "{{ shared_saml_ext_id }}"
    shared_with_projects:
      - "{{ project2.uuid }}"
      - "{{ project3.uuid }}"
  register: result
  ignore_errors: true

- name: Status of SAML reconcile shared projects to a subset
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.shared_with_projects | length == 2
      - project1.uuid not in result.response.shared_with_projects
      - project2.uuid in result.response.shared_with_projects
      - project3.uuid in result.response.shared_with_projects
    fail_msg: "SAML reconcile shared projects to a subset failed"
    success_msg: "SAML reconciled shared projects to a subset successfully"

########################################################################
# Scenario: unshare from all specific projects
########################################################################
- name: Update SAML to unshare from all specific projects
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    state: present
    ext_id: "{{ shared_saml_ext_id }}"
    shared_with_projects: []
  register: result
  ignore_errors: true

- name: Status of SAML unshare from all specific projects
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.failed == false
      - (result.response.shared_with_projects | default([], true)) | length == 0
    fail_msg: "SAML unshare from all specific projects failed with error"
    success_msg: "SAML unshare from all specific projects completed"
########################################################################

- name: Delete shared SAML identity provider
  nutanix.ncp.ntnx_saml_identity_providers_v2:
    state: absent
    ext_id: "{{ shared_saml_ext_id }}"
  register: result
  ignore_errors: true

- name: Delete shared SAML status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.ext_id == "{{ shared_saml_ext_id }}"
      - result.task_ext_id is defined
      - result.response.status == "SUCCEEDED"
    fail_msg: "Unable to delete shared SAML identity provider"
    success_msg: "Shared SAML identity provider deleted successfully"

########################################################################
# Delete the project created for tests
########################################################################
- name: Delete projects created for tests
  nutanix.ncp.ntnx_project_v2:
    state: absent
    ext_id: "{{ item }}"
  register: delete_projects_result
  loop:
    - "{{ project1.uuid }}"
    - "{{ project2.uuid }}"
    - "{{ project3.uuid }}"
  ignore_errors: true

- name: Status of projects deletion for tests
  ansible.builtin.assert:
    that:
      - item.changed == true
      - item.failed == false
      - item.ext_id == item.item
      - item.task_ext_id is defined
      - item.response.status == "SUCCEEDED"
    fail_msg: "Unable to delete project created for tests"
    success_msg: "Project created for tests deleted successfully"
  loop: "{{ delete_projects_result.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Verify all test projects were deleted
  ansible.builtin.assert:
    that:
      - delete_projects_result.results | length == 3
      - delete_projects_result.results | selectattr('changed', 'equalto', true) | list | length == 3
      - delete_projects_result.results | selectattr('failed', 'equalto', false) | list | length == 3
    fail_msg: "Not all test projects were deleted successfully"
    success_msg: "All test projects deleted successfully"
