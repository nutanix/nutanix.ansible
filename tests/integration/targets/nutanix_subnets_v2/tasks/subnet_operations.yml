      - result.failed == false
      - result.response.shared_with_projects is not none
      - result.response.shared_with_projects | length == 3
      - (result.response.shared_with_projects | sort) == ([project1.uuid, project2.uuid, project3.uuid] | sort)
    fail_msg: "Subnet share with all three projects failed"
    success_msg: "Subnet shared with all three projects successfully"

#################################################################
# Scenario: sharing idempotency (share with the same three projects again)
#################################################################
- name: Update subnet sharing with the same projects (idempotency)
  nutanix.ncp.ntnx_subnets_v2:
    state: present
    ext_id: "{{ shared_subnet_ext_id }}"
    shared_with_projects:
      - "{{ project1.uuid }}"
      - "{{ project2.uuid }}"
      - "{{ project3.uuid }}"
  register: result
  ignore_errors: true

- name: Status of subnet sharing idempotency
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == false
      - result.skipped == true
      - result.msg == "Nothing to change."
    fail_msg: "Subnet sharing idempotency failed"
    success_msg: "Subnet sharing idempotency passed"

#################################################################
# Scenario: reconcile shared projects to a subset (drop one, keep two)
#################################################################
- name: Update subnet to reconcile shared projects to a subset
  nutanix.ncp.ntnx_subnets_v2:
    state: present
    ext_id: "{{ shared_subnet_ext_id }}"
    shared_with_projects:
      - "{{ project2.uuid }}"
      - "{{ project3.uuid }}"
  register: result
  ignore_errors: true

- name: Status of subnet reconcile shared projects to a subset
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.shared_with_projects is not none
      - result.response.shared_with_projects | length == 2
      - (result.response.shared_with_projects | sort) == ([project2.uuid, project3.uuid] | sort)
      - project1.uuid not in result.response.shared_with_projects
    fail_msg: "Subnet reconcile shared projects to a subset failed"
    success_msg: "Subnet reconciled shared projects to a subset successfully"

#################################################################
# Scenario: unshare from all projects
#################################################################
- name: Update subnet to unshare from all projects
  nutanix.ncp.ntnx_subnets_v2:
    state: present
    ext_id: "{{ shared_subnet_ext_id }}"
    shared_with_projects: []
  register: result
  ignore_errors: true

- name: Status of subnet unshare from all projects
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == true
      - result.response.shared_with_projects is none or result.response.shared_with_projects | length == 0
    fail_msg: "Subnet unshare from all projects failed with error"
    success_msg: "Subnet unshare from all projects completed"

- name: Delete shared subnet
  nutanix.ncp.ntnx_subnets_v2:
    state: absent
    ext_id: "{{ shared_subnet_ext_id }}"
  register: result
  ignore_errors: true

- name: Delete shared subnet status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.response.status == "SUCCEEDED"
      - result.ext_id == shared_subnet_ext_id
    fail_msg: "Unable to delete shared subnet"
    success_msg: "Shared subnet deleted successfully"

#################################################################

- name: Delete vpc
  nutanix.ncp.ntnx_vpcs_v2:
    state: absent
    ext_id: "{{ vpc_uuid }}"
  register: result
  ignore_errors: true

- name: Delete Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id == "{{ vpc_uuid }}"
      - result.task_ext_id is defined
      - result.response.status == "SUCCEEDED"
    fail_msg: " Unable to Delete  VPC"
    success_msg: "Vpc has been deleted successfully"
#################################################################
# Delete the project created for tests
#################################################################
- name: Delete projects created for tests
  nutanix.ncp.ntnx_project_v2:
    state: absent
    ext_id: "{{ item }}"
  register: delete_projects_result
  loop:
    - "{{ project1.uuid }}"
    - "{{ project2.uuid }}"
    - "{{ project3.uuid }}"
    - "{{ subnet_project.uuid }}"
  ignore_errors: true

- name: Status of projects deletion for tests
  ansible.builtin.assert:
    that:
      - item.changed == true
      - item.failed == false
      - item.ext_id == item.item
      - item.task_ext_id is defined
      - item.response.status == "SUCCEEDED"
    fail_msg: "Unable to delete project created for tests"
    success_msg: "Project created for tests deleted successfully"
  loop: "{{ delete_projects_result.results }}"
  loop_control:
    label: "{{ item.item }}"
#################################################################
