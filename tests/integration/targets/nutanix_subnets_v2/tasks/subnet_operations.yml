            ip:
              value: "10.20.20.0"
            prefix_length: 24
          default_gateway_ip:
            value: "10.20.20.1"
    shared_with_projects:
      - "{{ project1.uuid }}"
      - "{{ project2.uuid }}"
  register: result
  ignore_errors: true

