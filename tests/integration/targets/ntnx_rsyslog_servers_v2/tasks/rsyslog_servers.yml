---
- name: Start RSYSLOG server tests
  ansible.builtin.debug:
    msg: Start RSYSLOG server tests

- name: Generate random name suffix
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false,
      special=false, length=12)[0] }}"
    suffix_name: "ansible"

- name: Set RSYSLOG server name prefix
  ansible.builtin.set_fact:
    rsyslog_name: "rsyslog_ansible_{{ suffix_name }}_{{ random_name }}"

########################################################################################
# Cleanup any existing RSYSLOG server (only one allowed per cluster)
########################################################################################

- name: List existing RSYSLOG servers before tests
  nutanix.ncp.ntnx_rsyslog_servers_info_v2:
    cluster_ext_id: "{{ cluster.uuid }}"
  register: existing_rsyslog
  ignore_errors: true

- name: Delete existing RSYSLOG server if present
  nutanix.ncp.ntnx_rsyslog_server_v2:
    state: absent
    cluster_ext_id: "{{ cluster.uuid }}"
    ext_id: "{{ existing_rsyslog.response[0].ext_id }}"
  when:
    - existing_rsyslog.failed is false
    - existing_rsyslog.response is defined
    - existing_rsyslog.response | length > 0
  register: result
  ignore_errors: true

########################################################################################
# Create RSYSLOG Server Tests
########################################################################################

- name: Generate spec for creating RSYSLOG server using check mode
  nutanix.ncp.ntnx_rsyslog_server_v2:
    cluster_ext_id: "{{ cluster.uuid }}"
    server_name: "check_mode_rsyslog_full"
    ip_address:
      ipv4:
        value: "192.168.1.100"
        prefix_length: 32
    port: 514
    network_protocol: "UDP"
    modules:
      - name: "PRISM"
        log_severity_level: "INFO"
        should_log_monitor_files: false
      - name: "CASSANDRA"
        log_severity_level: "WARNING"
        should_log_monitor_files: true
  check_mode: true
  register: result
  ignore_errors: true

- name: Generate spec for creating RSYSLOG server using check mode status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.cluster_ext_id == "{{ cluster.uuid }}"
      - result.response is defined
      - result.response.server_name == "check_mode_rsyslog_full"
      - result.response.ip_address.ipv4.value == "192.168.1.100"
      - result.response.ip_address.ipv4.prefix_length == 32
      - result.response.port == 514
      - result.response.network_protocol == "UDP"
      - result.response.modules | length == 2
      - result.response.modules[0].name == "PRISM"
      - result.response.modules[0].log_severity_level == "INFO"
      - result.response.modules[0].should_log_monitor_files == false
      - result.response.modules[1].name == "CASSANDRA"
      - result.response.modules[1].log_severity_level == "WARNING"
      - result.response.modules[1].should_log_monitor_files == true
    success_msg: "Spec for creating RSYSLOG server using check mode is generated successfully"
    fail_msg: "Spec for creating RSYSLOG server using check mode is not generated successfully"

- name: Create RSYSLOG server with all attributes
  nutanix.ncp.ntnx_rsyslog_server_v2:
    cluster_ext_id: "{{ cluster.uuid }}"
    server_name: "{{ rsyslog_name }}"
    ip_address:
      ipv4:
        value: "192.168.1.101"
        prefix_length: 32
    port: 6514
    network_protocol: "TCP"
    modules:
      - name: "PRISM"
        log_severity_level: "INFO"
        should_log_monitor_files: false
      - name: "CASSANDRA"
        log_severity_level: "EMERGENCY"
        should_log_monitor_files: true
      - name: "GENESIS"
        log_severity_level: "DEBUG"
  register: result
  ignore_errors: true

- name: Create RSYSLOG server with all attributes status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.cluster_ext_id == "{{ cluster.uuid }}"
      - result.ext_id is defined
      - result.ext_id | length > 0
      - result.task_ext_id is defined
      - result.response is defined
      - result.response.ext_id == result.ext_id
      - result.response.server_name == "{{ rsyslog_name }}"
      - result.response.ip_address.ipv4.value == "192.168.1.101"
      - result.response.ip_address.ipv4.prefix_length == 32
      - result.response.port == 6514
      - result.response.network_protocol == "TCP"
      - result.response.modules | length == 3
      - result.response.modules[0].name == "PRISM"
      - result.response.modules[0].log_severity_level == "INFO"
      - result.response.modules[0].should_log_monitor_files == false
      - result.response.modules[1].name == "CASSANDRA"
      - result.response.modules[1].log_severity_level == "EMERGENCY"
      - result.response.modules[1].should_log_monitor_files == true
      - result.response.modules[2].name == "GENESIS"
      - result.response.modules[2].log_severity_level == "DEBUG"
      - result.response.modules[2].should_log_monitor_files == true
    success_msg: "RSYSLOG server with all attributes created successfully"
    fail_msg: "RSYSLOG server with all attributes creation failed"

- name: Set RSYSLOG server external ID from create result
  ansible.builtin.set_fact:
    rsyslog_ext_id: "{{ result.ext_id }}"

- name: List all RSYSLOG servers for cluster
  nutanix.ncp.ntnx_rsyslog_servers_info_v2:
    cluster_ext_id: "{{ cluster.uuid }}"
  register: result
  ignore_errors: true

- name: List all RSYSLOG servers for cluster status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
      - result.total_available_results == 1
      - result.response[0].ext_id == "{{ rsyslog_ext_id }}"
      - result.response[0].server_name == "{{ rsyslog_name }}"
      - result.response[0].ip_address.ipv4.value == "192.168.1.101"
      - result.response[0].ip_address.ipv4.prefix_length == 32
      - result.response[0].port == 6514
      - result.response[0].network_protocol == "TCP"
      - result.response[0].modules | length == 3
      - result.response[0].modules[0].name == "PRISM"
      - result.response[0].modules[0].log_severity_level == "INFO"
      - result.response[0].modules[0].should_log_monitor_files == false
      - result.response[0].modules[1].name == "CASSANDRA"
      - result.response[0].modules[1].log_severity_level == "EMERGENCY"
      - result.response[0].modules[1].should_log_monitor_files == true
      - result.response[0].modules[2].name == "GENESIS"
      - result.response[0].modules[2].log_severity_level == "DEBUG"
      - result.response[0].modules[2].should_log_monitor_files == true
    success_msg: "List all RSYSLOG servers passed"
    fail_msg: "List all RSYSLOG servers failed"

- name: Fetch RSYSLOG server by external ID
  nutanix.ncp.ntnx_rsyslog_servers_info_v2:
    cluster_ext_id: "{{ cluster.uuid }}"
    ext_id: "{{ rsyslog_ext_id }}"
  register: result
  ignore_errors: true

- name: Fetch RSYSLOG server by external ID status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.ext_id == "{{ rsyslog_ext_id }}"
      - result.response.server_name == "{{ rsyslog_name }}"
      - result.response.ip_address.ipv4.value == "192.168.1.101"
      - result.response.ip_address.ipv4.prefix_length == 32
      - result.response.port == 6514
      - result.response.network_protocol == "TCP"
      - result.response.modules | length == 3
      - result.response.modules[0].name == "PRISM"
      - result.response.modules[0].log_severity_level == "INFO"
      - result.response.modules[0].should_log_monitor_files == false
      - result.response.modules[1].name == "CASSANDRA"
      - result.response.modules[1].log_severity_level == "EMERGENCY"
      - result.response.modules[1].should_log_monitor_files == true
      - result.response.modules[2].name == "GENESIS"
      - result.response.modules[2].log_severity_level == "DEBUG"
      - result.response.modules[2].should_log_monitor_files == true
    success_msg: "Fetch RSYSLOG server by external ID passed"
    fail_msg: "Fetch RSYSLOG server by external ID failed"

########################################################################################
# Create RSYSLOG Server - Negative Tests
########################################################################################

- name: Create RSYSLOG server with all required parameters missing (should fail)
  nutanix.ncp.ntnx_rsyslog_server_v2:
    state: present
    cluster_ext_id: "{{ cluster.uuid }}"
  register: result
  ignore_errors: true

- name: Create RSYSLOG server with all required parameters missing status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - >-
        result.msg == "Missing required parameter(s): server_name, ip_address, port, network_protocol"
    success_msg: "Create RSYSLOG server with all required parameters missing failed as expected"
    fail_msg: "Create RSYSLOG server with all required parameters missing did not fail as expected"

- name: Create second RSYSLOG server when one already exists (should fail)
  nutanix.ncp.ntnx_rsyslog_server_v2:
    cluster_ext_id: "{{ cluster.uuid }}"
    server_name: "{{ rsyslog_name }}_second"
    ip_address:
      ipv4:
        value: "192.168.1.100"
    port: 514
    network_protocol: "UDP"
  register: result
  ignore_errors: true

- name: Create second RSYSLOG server when one already exists status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.response is defined
      - result.response.status == "FAILED"
      - result.response.error_messages | length > 0
    success_msg: "Create second RSYSLOG server when one already exists failed as expected"
    fail_msg: "Create second RSYSLOG server when one already exists did not fail as expected"

########################################################################################
# Update RSYSLOG Server Tests
########################################################################################

- name: Generate spec for updating RSYSLOG server using check mode with all attributes
  nutanix.ncp.ntnx_rsyslog_server_v2:
    cluster_ext_id: "{{ cluster.uuid }}"
    ext_id: "{{ rsyslog_ext_id }}"
    server_name: "test_update_server_name"
    ip_address:
      ipv4:
        value: "192.168.1.200"
        prefix_length: 32
    port: 515
    network_protocol: "TCP"
    modules:
      - name: "ZOOKEEPER"
        log_severity_level: "CRITICAL"
        should_log_monitor_files: false
      - name: "AUDIT"
        log_severity_level: "ALERT"
        should_log_monitor_files: true
      - name: "CALM"
        log_severity_level: "WARNING"
        should_log_monitor_files: false
  check_mode: true
  register: result
  ignore_errors: true

- name: Generate spec for updating RSYSLOG server using check mode status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.server_name == "test_update_server_name"
      - result.response.ip_address.ipv4.value == "192.168.1.200"
      - result.response.port == 515
      - result.response.network_protocol == "TCP"
      - result.response.modules | length == 3
      - result.response.modules[0].name == "ZOOKEEPER"
      - result.response.modules[0].log_severity_level == "CRITICAL"
      - result.response.modules[0].should_log_monitor_files == false
      - result.response.modules[1].name == "AUDIT"
      - result.response.modules[1].log_severity_level == "ALERT"
      - result.response.modules[1].should_log_monitor_files == true
      - result.response.modules[2].name == "CALM"
      - result.response.modules[2].log_severity_level == "WARNING"
      - result.response.modules[2].should_log_monitor_files == false
    success_msg: "Spec for updating RSYSLOG server using check mode with all attributes is generated successfully"
    fail_msg: "Spec for updating RSYSLOG server using check mode with all attributes is not generated successfully"

- name: Update RSYSLOG server with all attributes
  nutanix.ncp.ntnx_rsyslog_server_v2:
    cluster_ext_id: "{{ cluster.uuid }}"
    ext_id: "{{ rsyslog_ext_id }}"
    server_name: "{{ rsyslog_name }}"
    ip_address:
      ipv4:
        value: "192.168.1.201"
        prefix_length: 32
    port: 616
    network_protocol: "TCP"
    modules:
      - name: "FLOW"
        log_severity_level: "CRITICAL"
        should_log_monitor_files: false
      - name: "ACROPOLIS"
        log_severity_level: "ALERT"
        should_log_monitor_files: true
      - name: "LCM"
        log_severity_level: "WARNING"
        should_log_monitor_files: false
  register: result
  ignore_errors: true

- name: Update RSYSLOG server with all attributes status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id == "{{ rsyslog_ext_id }}"
      - result.response is defined
      - result.response.server_name == "{{ rsyslog_name }}"
      - result.response.ip_address.ipv4.value == "192.168.1.201"
      - result.response.port == 616
      - result.response.network_protocol == "TCP"
      - result.response.modules | length == 3
      - result.response.modules[0].name == "FLOW"
      - result.response.modules[0].log_severity_level == "CRITICAL"
      - result.response.modules[0].should_log_monitor_files == false
      - result.response.modules[1].name == "ACROPOLIS"
      - result.response.modules[1].log_severity_level == "ALERT"
      - result.response.modules[1].should_log_monitor_files == true
      - result.response.modules[2].name == "LCM"
      - result.response.modules[2].log_severity_level == "WARNING"
      - result.response.modules[2].should_log_monitor_files == false
    success_msg: "Update RSYSLOG server with all attributes is successful"
    fail_msg: "Update RSYSLOG server with all attributes failed"

- name: Update RSYSLOG server with same values (idempotency test)
  nutanix.ncp.ntnx_rsyslog_server_v2:
    cluster_ext_id: "{{ cluster.uuid }}"
    ext_id: "{{ rsyslog_ext_id }}"
    server_name: "{{ rsyslog_name }}"
    ip_address:
      ipv4:
        value: "192.168.1.201"
        prefix_length: 32
    port: 616
    network_protocol: "TCP"
    modules:
      - name: "FLOW"
        log_severity_level: "CRITICAL"
        should_log_monitor_files: false
      - name: "ACROPOLIS"
        log_severity_level: "ALERT"
        should_log_monitor_files: true
      - name: "LCM"
        log_severity_level: "WARNING"
        should_log_monitor_files: false
  register: result
  ignore_errors: true

- name: Update RSYSLOG server with same values to test idempotency status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.msg == "Nothing to change."
    success_msg: "Update RSYSLOG server with same values to test idempotency passed"
    fail_msg: "Update RSYSLOG server with same values to test idempotency failed"

########################################################################################
# Update RSYSLOG Server - Negative Tests
########################################################################################

- name: Update RSYSLOG server with wrong external ID (should fail)
  nutanix.ncp.ntnx_rsyslog_server_v2:
    cluster_ext_id: "{{ cluster.uuid }}"
    ext_id: "04595a7b-010c-4a89-58dd-060c94e9a1f0"
    server_name: "{{ rsyslog_name }}"
    ip_address:
      ipv4:
        value: "192.168.1.201"
        prefix_length: 32
  register: result
  ignore_errors: true

- name: Update RSYSLOG server with wrong external ID status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "Api Exception raised while fetching rsyslog server info using ext_id"
      - result.response is defined
      - result.response.data.error | length > 0
    success_msg: "Update RSYSLOG server with wrong external ID failed as expected"
    fail_msg: "Update RSYSLOG server with wrong external ID did not fail as expected"

########################################################################################
# Delete RSYSLOG Server Tests
########################################################################################

- name: Delete RSYSLOG server with check mode
  nutanix.ncp.ntnx_rsyslog_server_v2:
    state: absent
    cluster_ext_id: "{{ cluster.uuid }}"
    ext_id: "{{ rsyslog_ext_id }}"
  check_mode: true
  register: result
  ignore_errors: true

- name: Delete RSYSLOG server with check mode status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - >-
        result.msg == "RSYSLOG server with ext_id:" ~ rsyslog_ext_id ~ " will be deleted."
    success_msg: "Delete RSYSLOG server with check mode passed"
    fail_msg: "Delete RSYSLOG server with check mode failed"

- name: Delete created RSYSLOG server
  nutanix.ncp.ntnx_rsyslog_server_v2:
    state: absent
    cluster_ext_id: "{{ cluster.uuid }}"
    ext_id: "{{ rsyslog_ext_id }}"
  register: result
  ignore_errors: true

- name: Delete created RSYSLOG server status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id == "{{ rsyslog_ext_id }}"
      - result.response is defined
      - result.response.status == "SUCCEEDED"
    success_msg: "RSYSLOG server is deleted successfully"
    fail_msg: "Unable to delete RSYSLOG server"

- name: Delete RSYSLOG server with wrong external ID (should fail)
  nutanix.ncp.ntnx_rsyslog_server_v2:
    state: absent
    cluster_ext_id: "{{ cluster.uuid }}"
    ext_id: "04595a7b-010c-4a89-58dd-060c94e9a1f0"
  register: result
  ignore_errors: true

- name: Delete RSYSLOG server with wrong external ID status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "Task Failed"
      - result.response.status == "FAILED"
      - result.response.error_messages is defined
      - result.response.error_messages | length > 0
    success_msg: "Delete RSYSLOG server with wrong external ID failed as expected"
    fail_msg: "Delete RSYSLOG server with wrong external ID did not fail as expected"

- name: Delete RSYSLOG server with missing external ID (should fail)
  nutanix.ncp.ntnx_rsyslog_server_v2:
    state: absent
    cluster_ext_id: "{{ cluster.uuid }}"
  register: result
  ignore_errors: true

- name: Delete RSYSLOG server with missing external ID status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - >-
        result.msg == "state is absent but all of the following are missing: ext_id"
    success_msg: "Delete RSYSLOG server with missing external ID failed as expected"
    fail_msg: "Delete RSYSLOG server with missing external ID did not fail as expected"
