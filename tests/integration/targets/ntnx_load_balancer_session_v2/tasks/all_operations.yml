  ignore_errors: true

- name: Creation status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.task_ext_id is defined
      - result.response is defined
      - result.response.name == "{{ lbs_name }}_2"
      - result.response.description == "ansible test full spec"
      - result.response.type == "NETWORK_LOAD_BALANCER"
      - result.response.vpc_reference == "{{ vpc_uuid }}"
      - result.response.algorithm == "FIVE_TUPLE_HASH"
      - result.response.listener.protocol == "TCP"
      - result.response.listener.port_ranges[0].start_port == 80
      - result.response.listener.port_ranges[0].end_port == 80
      - result.response.listener.virtual_ip.subnet_reference == "{{ subnet_uuid }}"
      - result.response.listener.virtual_ip.assignment_type == "STATIC"
      - result.response.listener.virtual_ip.ip_address.ipv4.value == "192.168.1.100"
      - result.response.targets_config.nic_targets[0].virtual_nic_reference == "{{ nic_ext_id }}"
      - result.response.targets_config.nic_targets[0].port == 80
