      - result.response.health_check_config.interval_secs == 13
      - result.response.health_check_config.timeout_secs == 14
      - result.response.health_check_config.success_threshold == 10
      - result.response.health_check_config.failure_threshold == 12
    fail_msg: "Unable to update load balancer session"
    success_msg: "Load balancer session updated successfully"

