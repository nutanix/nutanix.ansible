    success_msg: "Load balancer session created successfully"

- name: Set load balancer session ext_id
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [result.ext_id] }}"

- name: Create load balancer session with name only (should fail)
  nutanix.ncp.ntnx_load_balancer_session_v2:
    name: "{{ lbs_name }}_3"
  register: result
  ignore_errors: true

- name: Create load balancer session with name only status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == true
      - >-
        result.msg == "Missing required parameter(s): description,
        vpc_reference, listener, targets_config, health_check_config"
    fail_msg: "Create load balancer session with name only did not fail as expected"
    success_msg: "Create load balancer session with name only failed as expected"

- name: Create load balancer session with missing all required attributes (should fail)
  nutanix.ncp.ntnx_load_balancer_session_v2:
    type: "NETWORK_LOAD_BALANCER"
    algorithm: "FIVE_TUPLE_HASH"
  register: result
  ignore_errors: true

- name: Create load balancer session with missing all required attributes status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == true
      - >-
        result.msg == "state is present but any of the following are
        missing: name, ext_id"
    fail_msg: "Create load balancer session with missing all required attributes did not fail as expected"
    success_msg: "Create load balancer session with missing all required attributes failed as expected"

############################## Update with check mode ##############################

- name: Generate spec for updating load balancer session using check mode
  nutanix.ncp.ntnx_load_balancer_session_v2:
    ext_id: "{{ todelete[1] }}"
    name: "load_balancer_session_ansible_updated"
