    success_msg: "Generate spec for updating load balancer session using check mode passed"

############################## Update ##############################

- name: Update load balancer session
  nutanix.ncp.ntnx_load_balancer_session_v2:
    state: present
    ext_id: "{{ todelete[1] }}"
    name: "{{ lbs_name }}_updated"
    description: "ansible test updated"
    listener:
      protocol: "TCP"
      port_ranges:
        - start_port: 100
          end_port: 105
      virtual_ip:
        subnet_reference: "{{ subnet_uuid }}"
        assignment_type: "DYNAMIC"
    targets_config:
      nic_targets:
        - virtual_nic_reference: "{{ nic_ext_id }}"
          port: 1080
    health_check_config:
      interval_secs: 13
      timeout_secs: 14
      success_threshold: 10
      failure_threshold: 12
  register: result
  ignore_errors: true

- name: Update status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.name == "{{ lbs_name }}_updated"
      - result.response.description == "ansible test updated"
      - result.response.listener.protocol == "TCP"
      - result.response.listener.port_ranges[0].start_port == 100
      - result.response.listener.port_ranges[0].end_port == 105
      - result.response.listener.virtual_ip.subnet_reference == "{{ subnet_uuid }}"
      - result.response.listener.virtual_ip.assignment_type == "DYNAMIC"
      - result.response.targets_config.nic_targets[0].virtual_nic_reference == "{{ nic_ext_id }}"
