---
- name: Start ntnx_load_balancer_session_v2 tests
  ansible.builtin.debug:
    msg: Start ntnx_load_balancer_session_v2 tests

- name: Generate random name
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"

- name: Set names
  ansible.builtin.set_fact:
    suffix_name: "ansible-lbs"
    todelete: []

- name: Set load balancer session name
  ansible.builtin.set_fact:
    lbs_name: "{{ random_name }}{{ suffix_name }}"
    vpc_name: "{{ random_name }}{{ suffix_name }}_vpc"
    subnet_name: "{{ random_name }}{{ suffix_name }}_subnet"
    vm_name: "{{ random_name }}{{ suffix_name }}_vm"

############################## Setup prerequisites ##############################

- name: Set external subnet uuid from prepared environment
  ansible.builtin.set_fact:
    external_subnet_uuid: "{{ external_nat_subnet.uuid }}"

- name: Create VPC for load balancer session
  nutanix.ncp.ntnx_vpcs_v2:
    state: present
    name: "{{ vpc_name }}"
    external_subnets:
      - subnet_reference: "{{ external_subnet_uuid }}"
  register: vpc_result
  ignore_errors: true

- name: Creation VPC status
  ansible.builtin.assert:
    that:
      - vpc_result.response is defined
      - vpc_result.changed == true
      - vpc_result.failed == false
      - vpc_result.response.name == "{{ vpc_name }}"
      - vpc_result.response.external_subnets[0].subnet_reference == "{{ external_subnet_uuid }}"
    fail_msg: " Unable to Create VPC for load balancer session"
    success_msg: "VPC for load balancer session created successfully"

- name: Set VPC uuid
  ansible.builtin.set_fact:
    vpc_uuid: "{{ vpc_result.ext_id }}"

- name: Create overlay subnet inside the VPC
  nutanix.ncp.ntnx_subnets_v2:
    state: present
    name: "{{ subnet_name }}"
    subnet_type: OVERLAY
    vpc_reference: "{{ vpc_uuid }}"
    ip_config:
      - ipv4:
          ip_subnet:
            ip:
              value: "{{ overlay_subnet.network_ip }}"
            prefix_length: "{{ overlay_subnet.network_prefix }}"
          default_gateway_ip:
            value: "{{ overlay_subnet.gateway_ip }}"
          pool_list:
            - start_ip:
                value: "192.168.1.10"
              end_ip:
                value: "192.168.1.100"
  register: subnet_result
  ignore_errors: true

- name: Creation overlay subnet inside the VPC status
  ansible.builtin.assert:
    that:
      - subnet_result.changed == true
      - subnet_result.failed == false
      - subnet_result.response is defined
      - subnet_result.response.ext_id is defined
      - subnet_result.response.name == "{{ subnet_name }}"
      - subnet_result.response.subnet_type == "OVERLAY"
      - subnet_result.response.vpc_reference == "{{ vpc_uuid }}"
      - subnet_result.response.ip_config[0].ipv4.ip_subnet.ip.value == "{{ overlay_subnet.network_ip }}"
      - subnet_result.response.ip_config[0].ipv4.ip_subnet.prefix_length == (overlay_subnet.network_prefix | int)
      - subnet_result.response.ip_config[0].ipv4.default_gateway_ip.value == "{{ overlay_subnet.gateway_ip }}"
      - subnet_result.response.ip_config[0].ipv4.pool_list[0].start_ip.value == "192.168.1.10"
      - subnet_result.response.ip_config[0].ipv4.pool_list[0].end_ip.value == "192.168.1.100"
    fail_msg: " Unable to Create overlay subnet inside the VPC for load balancer session"
    success_msg: "Overlay subnet inside the VPC for load balancer session created successfully"

- name: Set subnet uuid
  ansible.builtin.set_fact:
    subnet_uuid: "{{ subnet_result.ext_id }}"

- name: Create VM to attach as load balancer target
  nutanix.ncp.ntnx_vms_v2:
    state: present
    name: "{{ vm_name }}"
    cluster:
      ext_id: "{{ cluster.uuid }}"
  register: vm_result
  ignore_errors: true

- name: Creation VM status
  ansible.builtin.assert:
    that:
      - vm_result.changed == true
      - vm_result.failed == false
      - vm_result.response is defined
      - vm_result.response.name == "{{ vm_name }}"
      - vm_result.response.cluster.ext_id == "{{ cluster.uuid }}"
    fail_msg: " Unable to Create VM for load balancer session"
    success_msg: "VM for load balancer session created successfully"

- name: Set VM uuid
  ansible.builtin.set_fact:
    vm_uuid: "{{ vm_result.ext_id }}"

- name: Create NIC on the VM attached to the overlay subnet
  nutanix.ncp.ntnx_vms_nics_v2:
    state: present
    vm_ext_id: "{{ vm_uuid }}"
    network_info:
      subnet:
        ext_id: "{{ subnet_uuid }}"
  register: nic_result
  ignore_errors: true

- name: Creation NIC status
  ansible.builtin.assert:
    that:
      - nic_result.changed == true
      - nic_result.failed == false
      - nic_result.response is defined
      - nic_result.ext_id is defined
      - nic_result.response.network_info.subnet.ext_id == "{{ subnet_uuid }}"
    fail_msg: " Unable to Create NIC on the VM attached to the overlay subnet for load balancer session"
    success_msg: "NIC on the VM attached to the overlay subnet for load balancer session created successfully"

- name: Set NIC uuid
  ansible.builtin.set_fact:
    nic_ext_id: "{{ nic_result.ext_id }}"

############################## Create with check mode ##############################

- name: Generate spec for creating load balancer session using check mode
  nutanix.ncp.ntnx_load_balancer_session_v2:
    name: "load_balancer_session_ansible"
    description: "Load balancer session created by Ansible"
    type: "NETWORK_LOAD_BALANCER"
    vpc_reference: "c0d37cbe-7631-4093-9a6d-17e9c85c074e"
    algorithm: "FIVE_TUPLE_HASH"
    listener:
      protocol: "TCP"
      port_ranges:
        - start_port: 80
          end_port: 90
      virtual_ip:
        subnet_reference: "cb468f7e-01d7-48a7-b414-aa13104a89f6"
        assignment_type: "DYNAMIC"
    targets_config:
      nic_targets:
        - virtual_nic_reference: "f28e7475-f835-42ef-ac35-ecbc48d5421e"
          port: 8888
    health_check_config:
      interval_secs: 10
      timeout_secs: 5
      success_threshold: 3
      failure_threshold: 3
  register: result
  ignore_errors: true
  check_mode: true

- name: Generate spec for creating load balancer session using check mode status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.name == "load_balancer_session_ansible"
      - result.response.description == "Load balancer session created by Ansible"
      - result.response.vpc_reference == "c0d37cbe-7631-4093-9a6d-17e9c85c074e"
      - result.response.listener.protocol == "TCP"
      - result.response.listener.port_ranges[0].start_port == 80
      - result.response.listener.port_ranges[0].end_port == 90
      - result.response.listener.virtual_ip.subnet_reference == "cb468f7e-01d7-48a7-b414-aa13104a89f6"
      - result.response.listener.virtual_ip.assignment_type == "DYNAMIC"
      - result.response.targets_config.nic_targets[0].virtual_nic_reference == "f28e7475-f835-42ef-ac35-ecbc48d5421e"
      - result.response.targets_config.nic_targets[0].port == 8888
      - result.response.health_check_config.interval_secs == 10
      - result.response.health_check_config.timeout_secs == 5
      - result.response.health_check_config.success_threshold == 3
      - result.response.health_check_config.failure_threshold == 3
    fail_msg: "Generate spec for creating load balancer session using check mode failed"
    success_msg: "Generate spec for creating load balancer session using check mode passed"

############################## Create ##############################

- name: Create load balancer session with minimum spec
  nutanix.ncp.ntnx_load_balancer_session_v2:
    name: "{{ lbs_name }}_1"
    description: "ansible test minimum spec"
    vpc_reference: "{{ vpc_uuid }}"
    listener:
      protocol: "UDP"
      port_ranges:
        - start_port: 53
          end_port: 53
      virtual_ip:
        subnet_reference: "{{ subnet_uuid }}"
        assignment_type: "DYNAMIC"
    targets_config:
      nic_targets:
        - virtual_nic_reference: "{{ nic_ext_id }}"
          port: 853
    health_check_config:
      interval_secs: 8
      timeout_secs: 6
      success_threshold: 1
      failure_threshold: 2
  register: result
  ignore_errors: true

- name: Create load balancer session with minimum spec status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.task_ext_id is defined
      - result.response is defined
      - result.response.name == "{{ lbs_name }}_1"
      - result.response.description == "ansible test minimum spec"
      - result.response.vpc_reference == "{{ vpc_uuid }}"
      - result.response.listener.protocol == "UDP"
      - result.response.listener.port_ranges[0].start_port == 53
      - result.response.listener.port_ranges[0].end_port == 53
      - result.response.listener.virtual_ip.subnet_reference == "{{ subnet_uuid }}"
      - result.response.listener.virtual_ip.assignment_type == "DYNAMIC"
      - result.response.targets_config.nic_targets[0].virtual_nic_reference == "{{ nic_ext_id }}"
      - result.response.targets_config.nic_targets[0].port == 853
      - result.response.health_check_config.interval_secs == 8
      - result.response.health_check_config.timeout_secs == 6
      - result.response.health_check_config.success_threshold == 1
      - result.response.health_check_config.failure_threshold == 2
    fail_msg: "Unable to create load balancer session with minimum spec"
    success_msg: "Load balancer session with minimum spec created successfully"

- name: Set load balancer session ext_id
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [result.ext_id] }}"

############################## Create with full spec ##############################

