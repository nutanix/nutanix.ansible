        subnet_reference: "{{ subnet_uuid }}"
        assignment_type: "STATIC"
        ip_address:
          ipv4:
            value: "192.168.1.100"
    targets_config:
      nic_targets:
        - virtual_nic_reference: "{{ nic_ext_id }}"
          port: 80
    health_check_config:
      interval_secs: 10
