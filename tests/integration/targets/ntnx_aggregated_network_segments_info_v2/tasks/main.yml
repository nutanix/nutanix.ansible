---
- name: Set module defaults for aggregated network segments
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip }}"
      nutanix_username: "{{ username | default(omit) }}"
      nutanix_password: "{{ password | default(omit) }}"
      validate_certs: "{{ validate_certs }}"
  block:
    - name: List aggregated network segments
      nutanix.ncp.ntnx_aggregated_network_segments_info_v2:
      register: result
      ignore_errors: true

    - name: Assert list
      ansible.builtin.assert:
        that:
          - result is defined
          - result.failed == false or result.failed == true

    - name: List with limit
      nutanix.ncp.ntnx_aggregated_network_segments_info_v2:
        limit: 1
      register: limited
      ignore_errors: true

    - name: List with fetch_all
      nutanix.ncp.ntnx_aggregated_network_segments_info_v2:
        fetch_all: true
      register: fetchall
      ignore_errors: true

    - name: Assert fetch_all
      ansible.builtin.assert:
        that:
          - fetchall is defined
