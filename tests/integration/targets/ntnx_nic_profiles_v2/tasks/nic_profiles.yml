---
- name: Start NIC profiles tests
  ansible.builtin.debug:
    msg: Start NIC profiles tests

- name: Generate random names
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"
    suffix_name: "ansible"
    todelete: []

- name: Set NIC profile name
  ansible.builtin.set_fact:
    nic_profile_name: "nic_profile_{{ suffix_name }}_{{ random_name }}"

########################################################################################
# Fetch host NIC information for NIC profile creation and association
########################################################################################

- name: Fetch hosts in cluster
  nutanix.ncp.ntnx_hosts_info_v2:
    cluster_ext_id: "{{ cluster.uuid }}"
  register: hosts_info
  ignore_errors: true

- name: Fetch hosts in cluster status
  ansible.builtin.assert:
    that:
      - hosts_info is defined
      - hosts_info.failed == false
      - hosts_info.response is defined
      - hosts_info.response | length > 0
    success_msg: "Hosts info fetched successfully"
    fail_msg: "Hosts info fetch failed"

- name: Set host ext_id
  ansible.builtin.set_fact:
    host_ext_id: "{{ hosts_info.response[0].ext_id }}"

########################################################################################
# Create NIC profile
########################################################################################

- name: Generate spec for creating NIC profile using check mode
  nutanix.ncp.ntnx_nic_profiles_v2:
    name: "nic_profile_check_mode"
    description: "NIC profile created in check mode"
    capability_config:
      capability_type: "SRIOV"
    nic_family: "15b3:101d"
    metadata:
      owner_reference_id: "11111111-1111-1111-1111-111111111111"
      owner_user_name: "admin"
      project_reference_id: "22222222-2222-2222-2222-222222222222"
      project_name: "test_project"
      category_ids:
        - "33333333-3333-3333-3333-333333333333"
  check_mode: true
  register: result
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: result

- name: Generate spec for creating NIC profile using check mode status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.name == "nic_profile_check_mode"
      - result.response.description == "NIC profile created in check mode"
      - result.response.nic_family == "15b3:101d"
      - result.response.capability_config.capability_type == "SRIOV"
      - result.response.metadata.owner_reference_id == "11111111-1111-1111-1111-111111111111"
      - result.response.metadata.owner_user_name == "admin"
      - result.response.metadata.project_reference_id == "22222222-2222-2222-2222-222222222222"
      - result.response.metadata.project_name == "test_project"
      - result.response.metadata.category_ids == ["33333333-3333-3333-3333-333333333333"]
    success_msg: "Spec for creating NIC profile using check mode is generated successfully"
    fail_msg: "Failed to generate spec for creating NIC profile using check mode"

- name: Create first NIC profile
  nutanix.ncp.ntnx_nic_profiles_v2:
    name: "{{ nic_profile_name }}_first"
    description: "First NIC profile created by ansible"
    capability_config:
      capability_type: "SRIOV"
    nic_family: "{{ nic_profile.first_nic_profile_family }}"
  register: result
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: result

- name: Create first NIC profile status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.response.name == "{{ nic_profile_name }}_first"
      - result.response.description == "First NIC profile created by ansible"
      - result.response.nic_family == "{{ nic_profile.first_nic_profile_family }}"
      - result.response.capability_config.capability_type == "SRIOV"
    success_msg: "First NIC profile is created successfully"
    fail_msg: "Failed to create first NIC profile"

- name: Add NIC profile to todelete list
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [result.response.ext_id] }}"

- name: Create second NIC profile
  nutanix.ncp.ntnx_nic_profiles_v2:
    name: "{{ nic_profile_name }}_second"
    description: "Second NIC profile created by ansible"
    capability_config:
      capability_type: "DP_OFFLOAD"
    nic_family: "{{ nic_profile.second_nic_profile_family }}"
  register: result
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: result

- name: Create second NIC profile status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.response.name == "{{ nic_profile_name }}_second"
      - result.response.description == "Second NIC profile created by ansible"
      - result.response.nic_family == "{{ nic_profile.second_nic_profile_family }}"
      - result.response.capability_config.capability_type == "DP_OFFLOAD"
    success_msg: "Second NIC profile is created successfully"
    fail_msg: "Failed to create second NIC profile"

- name: Add NIC profile to todelete list
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [result.response.ext_id] }}"

- name: Create NIC profile with missing name
  nutanix.ncp.ntnx_nic_profiles_v2:
    capability_config:
      capability_type: "SRIOV"
    nic_family: "{{ nic_profile.first_nic_profile_family }}"
  register: result
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: result

- name: Create NIC profile with missing name status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.response is not defined
      - "'state is present but any of the following are missing: ext_id, name' in result.msg"
    success_msg: "NIC profile with missing name is not created"
    fail_msg: "Failed to create NIC profile with missing name"

- name: Create NIC profile with missing capability_config
  nutanix.ncp.ntnx_nic_profiles_v2:
    name: "{{ nic_profile_name }}"
    nic_family: "{{ nic_profile.first_nic_profile_family }}"
  register: result
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: result

- name: Create NIC profile with missing capability_config status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.response is not defined
      - "'state is present but any of the following are missing: ext_id, capability_config' in result.msg"
    success_msg: "NIC profile with missing capability_config is not created"
    fail_msg: "Failed to create NIC profile with missing capability_config"

- name: Create NIC profile with missing nic_family
  nutanix.ncp.ntnx_nic_profiles_v2:
    name: "{{ nic_profile_name }}"
    capability_config:
      capability_type: "SRIOV"
  register: result
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: result

- name: Create NIC profile with missing nic_family status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.response is not defined
      - "'state is present but any of the following are missing: ext_id, nic_family' in result.msg"
    success_msg: "NIC profile with missing nic_family is not created"
    fail_msg: "Failed to create NIC profile with missing nic_family"

########################################################################################
# Update NIC profile
########################################################################################

- name: Generate spec for updating NIC profile using check mode
  nutanix.ncp.ntnx_nic_profiles_v2:
    ext_id: "{{ todelete[0] }}"
    name: "nic_profile_check_mode_updated"
    description: "NIC profile updated in check mode"
  check_mode: true
  register: result
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: result

- name: Generate spec for updating NIC profile using check mode status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.name == "nic_profile_check_mode_updated"
      - result.response.description == "NIC profile updated in check mode"
    success_msg: "Spec for updating NIC profile using check mode is generated successfully"
    fail_msg: "Failed to generate spec for updating NIC profile using check mode"

- name: Update NIC profile
  nutanix.ncp.ntnx_nic_profiles_v2:
    ext_id: "{{ todelete[0] }}"
    name: "{{ nic_profile_name }}_updated"
    description: "NIC profile updated"
  register: result
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: result

- name: Update NIC profile status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.response.name == "{{ nic_profile_name }}_updated"
      - result.response.description == "NIC profile updated"
    success_msg: "NIC profile is updated successfully"
    fail_msg: "Failed to update NIC profile"

- name: Test idempotency by updating NIC profile with same values
  nutanix.ncp.ntnx_nic_profiles_v2:
    ext_id: "{{ todelete[0] }}"
    name: "{{ nic_profile_name }}_updated"
    description: "NIC profile updated"
  register: result
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: result

- name: Test idempotency by updating NIC profile with same values status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.msg == "Nothing to change."
    success_msg: "Test idempotency by updating NIC profile with same values passed"
    fail_msg: "Test idempotency by updating NIC profile with same values failed"

- name: Update NIC profile with wrong ext_id
  nutanix.ncp.ntnx_nic_profiles_v2:
    ext_id: "a8b187ac-d859-441b-b54e-344bf5b6812a"
    name: "{{ nic_profile_name }}_updated"
    description: "NIC profile updated"
  register: result
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: result

- name: Update NIC profile with wrong ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "Api Exception raised while fetching NIC profile info using ext_id"
      - result.response is defined
      - result.response.data.error | length > 0
    success_msg: "Update NIC profile with wrong ext_id passed"
    fail_msg: "Update NIC profile with wrong ext_id failed"

########################################################################################
# Fetch NIC profile
########################################################################################

- name: Fetch NIC profile
  nutanix.ncp.ntnx_nic_profiles_info_v2:
    ext_id: "{{ todelete[0] }}"
  register: result
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: result

- name: Fetch NIC profile status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.name == "{{ nic_profile_name }}_updated"
      - result.response.description == "NIC profile updated"
      - result.response.capability_config.capability_type == "SRIOV"
      - result.response.nic_family == "{{ nic_profile.first_nic_profile_family }}"
    success_msg: "NIC profile is fetched successfully"
    fail_msg: "Failed to fetch NIC profile"

- name: Fetch NIC profile with wrong ext_id
  nutanix.ncp.ntnx_nic_profiles_info_v2:
    ext_id: "47f1d017-20c3-4641-a7b1-619c9ace0068"
  register: result
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: result

- name: Fetch NIC profile with wrong ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "Api Exception raised while fetching NIC profile info using ext_id"
      - result.response.data.error | length > 0
    success_msg: "Fetch NIC profile with wrong ext_id passed"
    fail_msg: "Fetch NIC profile with wrong ext_id failed"

########################################################################################
# List NIC profiles
########################################################################################

- name: List NIC profiles
  nutanix.ncp.ntnx_nic_profiles_info_v2:
  register: result
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: result

- name: List NIC profiles status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length >= 2
    success_msg: "NIC profiles are listed successfully"
    fail_msg: "Failed to list NIC profiles"

- name: List NIC profiles with filter
  nutanix.ncp.ntnx_nic_profiles_info_v2:
    filter: "name eq '{{ nic_profile_name }}_second'"
  register: result
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: result

- name: List NIC profiles with filter status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
      - result.response[0].name == "{{ nic_profile_name }}_second"
      - result.response[0].description == "Second NIC profile created by ansible"
      - result.response[0].capability_config.capability_type == "DP_OFFLOAD"
      - result.response[0].nic_family == "{{ nic_profile.second_nic_profile_family }}"
    success_msg: "NIC profiles with filter are listed successfully"
    fail_msg: "Failed to list NIC profiles with filter"

- name: List NIC profiles with limit
  nutanix.ncp.ntnx_nic_profiles_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: result

- name: List NIC profiles with limit status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
    success_msg: "NIC profiles with limit are listed successfully"
    fail_msg: "Failed to list NIC profiles with limit"

- name: List all NIC profiles with fetch_all
  nutanix.ncp.ntnx_nic_profiles_info_v2:
    fetch_all: true
  register: fetch_all_ntnx_nic_profiles_info_v2
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: fetch_all_ntnx_nic_profiles_info_v2

- name: List all NIC profiles with fetch_all status
  ansible.builtin.assert:
    that:
      - fetch_all_ntnx_nic_profiles_info_v2 is defined
      - fetch_all_ntnx_nic_profiles_info_v2.changed == false
      - fetch_all_ntnx_nic_profiles_info_v2.failed == false
      - fetch_all_ntnx_nic_profiles_info_v2.response is defined
      - fetch_all_ntnx_nic_profiles_info_v2.total_available_results is defined
      - (fetch_all_ntnx_nic_profiles_info_v2.response | default([]) | length) == (fetch_all_ntnx_nic_profiles_info_v2.total_available_results | int)
    success_msg: "Listed all NIC profiles with fetch_all successfully"
    fail_msg: "Unable to list all NIC profiles with fetch_all"

###########################################################
# Tests for shared_with_projects
###########################################################

- name: Create projects for sharing tests
  nutanix.ncp.ntnx_project_v2:
    state: present
    name: "{{ nic_profile_name }}-ansible-project-{{ item }}"
    project_id: "{{ nic_profile_name }}-ansible-project-id-{{ item }}"
  register: create_projects_result
  loop: "{{ range(1, 4) | list }}"
  ignore_errors: true

- name: Status of projects creation for sharing tests
  ansible.builtin.assert:
    that:
      - item.changed == true
      - item.failed == false
      - item.response is defined
      - item.ext_id is defined
      - item.ext_id | length > 0
      - item.task_ext_id is defined
      - item.response.state == "ACTIVE"
    fail_msg: "Unable to create project for sharing tests"
    success_msg: "Project for sharing tests created successfully"
  loop: "{{ create_projects_result.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Set project facts for sharing tests
  ansible.builtin.set_fact:
    share_project1:
      uuid: "{{ create_projects_result.results[0].ext_id }}"
    share_project2:
      uuid: "{{ create_projects_result.results[1].ext_id }}"
    share_project3:
      uuid: "{{ create_projects_result.results[2].ext_id }}"

###########################################################
# Check mode: sharing reflected in response
###########################################################
- name: Create NIC profile with sharing in check mode
  nutanix.ncp.ntnx_nic_profiles_v2:
    name: "{{ nic_profile_name }}_shared_check"
    description: "NIC profile sharing check mode"
    capability_config:
      capability_type: "SRIOV"
    nic_family: "{{ nic_profile.first_nic_profile_family }}"
    shared_with_projects:
      - "{{ share_project1.uuid }}"
  register: result
  check_mode: true
  ignore_errors: true

- name: Status of NIC profile sharing check mode
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response.name == "{{ nic_profile_name }}_shared_check"
      - result.response.shared_with_projects == [share_project1.uuid]
    fail_msg: "NIC profile sharing check mode failed"
    success_msg: "NIC profile sharing check mode passed"

###########################################################
# Create NIC profile shared with two projects
###########################################################
- name: Create NIC profile shared with two projects
  nutanix.ncp.ntnx_nic_profiles_v2:
    name: "{{ nic_profile_name }}_shared"
    description: "NIC profile shared with two projects"
    capability_config:
      capability_type: "SRIOV"
    nic_family: "{{ nic_profile.first_nic_profile_family }}"
    shared_with_projects:
      - "{{ share_project1.uuid }}"
      - "{{ share_project2.uuid }}"
  register: result
  ignore_errors: true

- name: Status of create NIC profile shared with two projects
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.response.shared_with_projects is defined
      - result.response.shared_with_projects | length == 2
      - (result.response.shared_with_projects | sort) == ([share_project1.uuid, share_project2.uuid] | sort)
    fail_msg: "Create NIC profile shared with two projects failed"
    success_msg: "Created NIC profile shared with two projects"

- name: Set shared NIC profile ext_id
  ansible.builtin.set_fact:
    shared_nic_profile_ext_id: "{{ result.ext_id }}"

- name: Add shared NIC profile to todelete
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [shared_nic_profile_ext_id] }}"

###########################################################
# Scenario: share with all three projects (add a project)
###########################################################
- name: Update NIC profile to share with all three projects
  nutanix.ncp.ntnx_nic_profiles_v2:
    state: present
    ext_id: "{{ shared_nic_profile_ext_id }}"
    shared_with_projects:
      - "{{ share_project1.uuid }}"
      - "{{ share_project2.uuid }}"
      - "{{ share_project3.uuid }}"
  register: result
  ignore_errors: true

- name: Status of NIC profile share with all three projects
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.shared_with_projects is not none
      - result.response.shared_with_projects | length == 3
      - (result.response.shared_with_projects | sort) == ([share_project1.uuid, share_project2.uuid, share_project3.uuid] | sort)
    fail_msg: "NIC profile share with all three projects failed"
    success_msg: "NIC profile shared with all three projects successfully"

###########################################################
# Scenario: sharing idempotency (same three projects again)
###########################################################
- name: Update NIC profile sharing with same projects (idempotency)
  nutanix.ncp.ntnx_nic_profiles_v2:
    state: present
    ext_id: "{{ shared_nic_profile_ext_id }}"
    shared_with_projects:
      - "{{ share_project1.uuid }}"
      - "{{ share_project2.uuid }}"
      - "{{ share_project3.uuid }}"
  register: result
  ignore_errors: true

- name: Status of NIC profile sharing idempotency
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == false
      - result.skipped == true
      - result.msg == "Nothing to change."
    fail_msg: "NIC profile sharing idempotency failed"
    success_msg: "NIC profile sharing idempotency passed"

###########################################################
# Scenario: reconcile to a subset (drop one, keep two)
###########################################################
- name: Update NIC profile to reconcile shared projects to a subset
  nutanix.ncp.ntnx_nic_profiles_v2:
    state: present
    ext_id: "{{ shared_nic_profile_ext_id }}"
    shared_with_projects:
      - "{{ share_project2.uuid }}"
      - "{{ share_project3.uuid }}"
  register: result
  ignore_errors: true

- name: Status of NIC profile reconcile to a subset
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.shared_with_projects is not none
      - result.response.shared_with_projects | length == 2
      - (result.response.shared_with_projects | sort) == ([share_project2.uuid, share_project3.uuid] | sort)
      - share_project1.uuid not in result.response.shared_with_projects
    fail_msg: "NIC profile reconcile to a subset failed"
    success_msg: "NIC profile reconciled to a subset successfully"

###########################################################
# Scenario: update sharing via check_mode
###########################################################
- name: Update NIC profile sharing via check_mode
  nutanix.ncp.ntnx_nic_profiles_v2:
    state: present
    ext_id: "{{ shared_nic_profile_ext_id }}"
    shared_with_projects:
      - "{{ share_project1.uuid }}"
  register: result
  check_mode: true
  ignore_errors: true

- name: Status of NIC profile sharing update check_mode
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response.shared_with_projects == [share_project1.uuid]
    fail_msg: "NIC profile sharing update check_mode failed"
    success_msg: "NIC profile sharing update check_mode passed"

###########################################################
# Scenario: unshare from all projects
###########################################################
- name: Update NIC profile to unshare from all projects
  nutanix.ncp.ntnx_nic_profiles_v2:
    state: present
    ext_id: "{{ shared_nic_profile_ext_id }}"
    shared_with_projects: []
  register: result
  ignore_errors: true

- name: Status of NIC profile unshare from all projects
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == true
      - result.response.shared_with_projects is none or result.response.shared_with_projects | length == 0
    fail_msg: "NIC profile unshare from all projects failed"
    success_msg: "NIC profile unshared from all projects"

###########################################################
# Cleanup shared NIC profile and projects
###########################################################
- name: Delete shared NIC profile
  nutanix.ncp.ntnx_nic_profiles_v2:
    state: absent
    ext_id: "{{ shared_nic_profile_ext_id }}"
  register: result
  ignore_errors: true

- name: Status of shared NIC profile deletion
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
    fail_msg: "Unable to delete shared NIC profile"
    success_msg: "Shared NIC profile deleted successfully"

- name: Remove shared NIC profile from todelete
  ansible.builtin.set_fact:
    todelete: "{{ todelete | reject('equalto', shared_nic_profile_ext_id) | list }}"

- name: Delete projects created for sharing tests
  nutanix.ncp.ntnx_project_v2:
    state: absent
    ext_id: "{{ item }}"
  register: delete_projects_result
  loop:
    - "{{ share_project1.uuid }}"
    - "{{ share_project2.uuid }}"
    - "{{ share_project3.uuid }}"
  ignore_errors: true

- name: Status of sharing projects deletion
  ansible.builtin.assert:
    that:
      - item.changed == true
      - item.failed == false
      - item.ext_id == item.item
      - item.task_ext_id is defined
      - item.response.status == "SUCCEEDED"
    fail_msg: "Unable to delete sharing project"
    success_msg: "Sharing project deleted successfully"
  loop: "{{ delete_projects_result.results }}"
  loop_control:
    label: "{{ item.item }}"

########################################################################################
# Delete NIC profiles
########################################################################################

- name: Delete NIC profile with check mode
  nutanix.ncp.ntnx_nic_profiles_v2:
    ext_id: "{{ todelete[0] }}"
    state: absent
  check_mode: true
  register: result
  ignore_errors: true

- name: Debug result
  ansible.builtin.debug:
    var: result

- name: Delete NIC profile with check mode status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.msg == "NIC profile with ext_id:{{ todelete[0] }} will be deleted."
    success_msg: "Delete NIC profile with check mode passed"
    fail_msg: "Delete NIC profile with check mode failed"

- name: Delete NIC profiles
  nutanix.ncp.ntnx_nic_profiles_v2:
    ext_id: "{{ item }}"
    state: absent
  register: result
  ignore_errors: true
  loop: "{{ todelete }}"

- name: Delete NIC profiles status
  ansible.builtin.assert:
    that:
      - item.response is defined
      - item.changed == true
      - item.failed == false
      - item.response.status == 'SUCCEEDED'
      - item.item in todelete
      - result.results | length == todelete | length
      - result.msg == "All items completed"
    fail_msg: "Delete NIC profiles failed"
    success_msg: "Delete NIC profiles passed"
  loop: "{{ result.results }}"
