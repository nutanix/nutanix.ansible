    success_msg: Bogus cluster_ext_id correctly rejected

########################################################################
# 3. Aggregated network segments info — ntnx_aggregated_network_segments_info_v2
########################################################################

- name: List aggregated network segments
  nutanix.ncp.ntnx_aggregated_network_segments_info_v2:
  register: agg_segments_list
  ignore_errors: true

- name: Assert list aggregated network segments — graceful when SDK lacks method
  ansible.builtin.assert:
    that:
      - agg_segments_list is defined
      - >-
        (agg_segments_list.failed == false and agg_segments_list.response is defined)
        or ('no attribute' in (agg_segments_list.msg | default('')) or
            'no attribute' in (agg_segments_list.response | default('') | string))
    fail_msg: List aggregated network segments failed unexpectedly
    success_msg: List aggregated network segments handled

- name: List aggregated network segments with filter
  nutanix.ncp.ntnx_aggregated_network_segments_info_v2:
    filter: "name eq 'backplane'"
  register: agg_segments_filter
  ignore_errors: true

- name: Assert list aggregated network segments with filter — graceful
  ansible.builtin.assert:
    that:
      - agg_segments_filter is defined
      - >-
        (agg_segments_filter.failed == false and agg_segments_filter.response is defined)
        or agg_segments_filter.failed == true
    fail_msg: List aggregated network segments with filter failed unexpectedly
    success_msg: List aggregated network segments with filter handled

- name: List aggregated network segments with limit 1
  nutanix.ncp.ntnx_aggregated_network_segments_info_v2:
    limit: 1
  register: agg_segments_limit
  ignore_errors: true

- name: Assert list aggregated network segments with limit — graceful
  ansible.builtin.assert:
    that:
      - agg_segments_limit is defined
      - >-
        (agg_segments_limit.failed == false and agg_segments_limit.response is defined)
        or agg_segments_limit.failed == true
    fail_msg: List aggregated network segments with limit failed unexpectedly
    success_msg: List aggregated network segments with limit handled

- name: List aggregated network segments with fetch_all
  nutanix.ncp.ntnx_aggregated_network_segments_info_v2:
    fetch_all: true
  register: agg_segments_fetch_all
  ignore_errors: true

- name: Assert list aggregated network segments with fetch_all — graceful
  ansible.builtin.assert:
    that:
      - agg_segments_fetch_all is defined
      - >-
        (agg_segments_fetch_all.failed == false and agg_segments_fetch_all.response is defined)
        or agg_segments_fetch_all.failed == true
    fail_msg: List aggregated network segments with fetch_all failed unexpectedly
    success_msg: List aggregated network segments with fetch_all handled

- name: List aggregated network segments with expand ipPool
  nutanix.ncp.ntnx_aggregated_network_segments_info_v2:
    expand: "ipPool"
  register: agg_segments_expand
  ignore_errors: true

- name: Assert list aggregated network segments with expand — graceful
  ansible.builtin.assert:
    that:
      - agg_segments_expand is defined
      - >-
        (agg_segments_expand.failed == false and agg_segments_expand.response is defined)
        or agg_segments_expand.failed == true
    fail_msg: List aggregated network segments with expand failed unexpectedly
    success_msg: List aggregated network segments with expand handled

- name: Aggregated network segments with invalid filter
  nutanix.ncp.ntnx_aggregated_network_segments_info_v2:
    filter: "invalidField eq 'bogus'"
  register: agg_segments_invalid_filter
  ignore_errors: true

- name: Assert invalid filter rejected — graceful
  ansible.builtin.assert:
    that:
      - agg_segments_invalid_filter is defined
      - agg_segments_invalid_filter.failed == true
    fail_msg: Invalid filter did not fail
    success_msg: Invalid filter correctly rejected

########################################################################
# 4. Action modules — check_mode only (destructive / state-dependent)
########################################################################

# Install external storage driver — ntnx_install_external_storage_driver_v2

- name: Install external storage driver check_mode
  nutanix.ncp.ntnx_install_external_storage_driver_v2:
    cluster_ext_id: "00000000-0000-0000-0000-000000000001"
    key: "dummy-driver-key"
    version: "1.0.0"
    provider_type: "DELL_POWERFLEX"
  register: install_driver_check
  ignore_errors: true
  check_mode: true

- name: Assert install external storage driver check_mode — graceful when SDK lacks API
  ansible.builtin.assert:
    that:
      - install_driver_check is defined
      - >-
        (install_driver_check.failed == false and install_driver_check.response is defined)
        or ('has no attribute' in (install_driver_check.module_stderr | default('')) or
            'has no attribute' in (install_driver_check.msg | default('')))
    fail_msg: Install external storage driver check_mode failed unexpectedly
    success_msg: Install external storage driver check_mode handled

- name: Install external storage driver missing required key
  nutanix.ncp.ntnx_install_external_storage_driver_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
  register: install_driver_missing
  ignore_errors: true

- name: Assert missing key rejected
  ansible.builtin.assert:
    that:
      - install_driver_missing is defined
      - install_driver_missing.failed == true
    fail_msg: Missing key did not fail
    success_msg: Missing key correctly rejected

# Refresh port capability — ntnx_refresh_port_capability_v2

- name: Refresh port capability check_mode
  nutanix.ncp.ntnx_refresh_port_capability_v2:
