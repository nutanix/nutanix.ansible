        or ('has no attribute' in (refresh_port_check.module_stderr | default('')) or
            'has no attribute' in (refresh_port_check.msg | default('')))
    fail_msg: Refresh port capability check_mode failed unexpectedly
    success_msg: Refresh port capability check_mode handled

- name: Refresh port capability missing cluster_ext_id
  nutanix.ncp.ntnx_refresh_port_capability_v2:
  register: refresh_port_missing
  ignore_errors: true

- name: Assert refresh port capability missing id rejected
  ansible.builtin.assert:
    that:
      - refresh_port_missing is defined
      - refresh_port_missing.failed == true
    fail_msg: Missing cluster_ext_id did not fail
    success_msg: Missing cluster_ext_id correctly rejected

# Shutdown host — ntnx_shutdown_host_v2 (check_mode only, never live)

- name: Shutdown host check_mode
  nutanix.ncp.ntnx_shutdown_host_v2:
    cluster_ext_id: "00000000-0000-0000-0000-000000000001"
    host_ext_id: "00000000-0000-0000-0000-000000000002"
  register: shutdown_host_check
  ignore_errors: true
  check_mode: true

- name: Assert shutdown host check_mode — graceful when SDK lacks API
  ansible.builtin.assert:
    that:
      - shutdown_host_check is defined
      - >-
        (shutdown_host_check.failed == false and shutdown_host_check.response is defined)
        or ('has no attribute' in (shutdown_host_check.module_stderr | default('')) or
            'has no attribute' in (shutdown_host_check.msg | default('')))
    fail_msg: Shutdown host check_mode failed unexpectedly
    success_msg: Shutdown host check_mode handled

- name: Shutdown host missing required host_ext_id
  nutanix.ncp.ntnx_shutdown_host_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
  register: shutdown_host_missing
  ignore_errors: true

- name: Assert missing host_ext_id rejected
  ansible.builtin.assert:
    that:
      - shutdown_host_missing is defined
      - shutdown_host_missing.failed == true
    fail_msg: Missing host_ext_id did not fail
    success_msg: Missing host_ext_id correctly rejected
