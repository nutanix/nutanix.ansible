---
# Test plan for ntnx_cluster_management_extended_v2
# Covers 6 modules in clustermgmt namespace:
#   1. ntnx_cluster_host_nic_stats_info_v2
#   2. ntnx_cluster_port_capability_info_v2
#   3. ntnx_aggregated_network_segments_info_v2
#   4. ntnx_install_external_storage_driver_v2 (check_mode only)
#   5. ntnx_refresh_port_capability_v2 (check_mode only)
#   6. ntnx_shutdown_host_v2 (check_mode only)

- name: Start cluster management extended tests
  ansible.builtin.debug:
    msg: Start cluster management extended tests

########################################################################
# Prerequisites — discover cluster, host, host NIC, compute time window
########################################################################

- name: Discover clusters via filter AOS
  nutanix.ncp.ntnx_clusters_info_v2:
    filter: "config/clusterFunction/any(t:t eq Clustermgmt.Config.ClusterFunctionRef'AOS')"
  register: clusters_result
  ignore_errors: true

- name: Assert clusters discovered
  ansible.builtin.assert:
    that:
      - clusters_result.failed == false
      - clusters_result.response is defined
      - clusters_result.response | length > 0
    fail_msg: Failed to discover clusters for extended tests
    success_msg: Clusters discovered for extended tests

- name: Set cluster_ext_id from first AOS cluster
  ansible.builtin.set_fact:
    cluster_ext_id: "{{ clusters_result.response[0].ext_id }}"

- name: Discover hosts in the cluster
  nutanix.ncp.ntnx_hosts_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
  register: hosts_result
  ignore_errors: true

- name: Assert hosts discovered
  ansible.builtin.assert:
    that:
      - hosts_result.failed == false
      - hosts_result.response is defined
      - hosts_result.response | length > 0
    fail_msg: Failed to discover hosts for extended tests
    success_msg: Hosts discovered for extended tests

- name: Set host_ext_id from first host
  ansible.builtin.set_fact:
    host_ext_id: "{{ hosts_result.response[0].ext_id }}"

- name: Discover host NICs to get sample NIC ext_id
  nutanix.ncp.ntnx_cluster_host_nics_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "{{ host_ext_id }}"
  register: host_nics_result
  ignore_errors: true

- name: Set sample NIC ext_id when NICs exist
  ansible.builtin.set_fact:
    sample_nic_ext_id: "{{ host_nics_result.response[0].ext_id }}"
    sample_nic_name: "{{ host_nics_result.response[0].name | default('') }}"
    has_host_nics: true
  when:
    - host_nics_result is defined
    - not host_nics_result.failed
    - host_nics_result.response is defined
    - host_nics_result.response | length > 0

- name: Set has_host_nics false when no NICs
  ansible.builtin.set_fact:
    has_host_nics: false
  when: has_host_nics is not defined

- name: Debug skip notice when no host NICs found
  ansible.builtin.debug:
    msg: No host NICs found — skipping host NIC stats dependent tests
  when: not has_host_nics | bool

- name: Compute stats window start time (5 min ago UTC)
  ansible.builtin.set_fact:
    stats_start_time: "{{ lookup('pipe', 'date -u -d \"5 minutes ago\" +%Y-%m-%dT%H:%M:%SZ') }}"
    stats_end_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

########################################################################
# 1. Host NIC stats info — ntnx_cluster_host_nic_stats_info_v2
########################################################################

- name: Get host NIC stats by ext_id
  nutanix.ncp.ntnx_cluster_host_nic_stats_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "{{ host_ext_id }}"
    ext_id: "{{ sample_nic_ext_id }}"
    start_time: "{{ stats_start_time }}"
    end_time: "{{ stats_end_time }}"
  register: nic_stats_by_id
  ignore_errors: true
  when: has_host_nics | bool

- name: Assert get host NIC stats by ext_id — graceful when SDK lacks method
  ansible.builtin.assert:
    that:
      - nic_stats_by_id is defined
      - >-
        (nic_stats_by_id.failed == false and nic_stats_by_id.response is defined)
        or ('no attribute' in (nic_stats_by_id.msg | default('')) or
            'no attribute' in (nic_stats_by_id.response | default('') | string))
    fail_msg: Get host NIC stats by ext_id failed unexpectedly
    success_msg: Get host NIC stats by ext_id handled
  when: has_host_nics | bool

- name: List host NIC stats by host
  nutanix.ncp.ntnx_cluster_host_nic_stats_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "{{ host_ext_id }}"
    start_time: "{{ stats_start_time }}"
    end_time: "{{ stats_end_time }}"
  register: nic_stats_list
  ignore_errors: true

- name: Assert list host NIC stats by host — graceful when SDK lacks method
  ansible.builtin.assert:
    that:
      - nic_stats_list is defined
      - >-
        (nic_stats_list.failed == false and nic_stats_list.response is defined)
        or ('no attribute' in (nic_stats_list.msg | default('')) or
            'no attribute' in (nic_stats_list.response | default('') | string))
    fail_msg: List host NIC stats by host failed unexpectedly
    success_msg: List host NIC stats by host handled

- name: List host NIC stats with select
  nutanix.ncp.ntnx_cluster_host_nic_stats_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "{{ host_ext_id }}"
    start_time: "{{ stats_start_time }}"
    end_time: "{{ stats_end_time }}"
    select: "extId"
  register: nic_stats_select
  ignore_errors: true

- name: Assert list host NIC stats with select — graceful when SDK lacks method
  ansible.builtin.assert:
    that:
      - nic_stats_select is defined
      - >-
        (nic_stats_select.failed == false and nic_stats_select.response is defined)
        or ('no attribute' in (nic_stats_select.msg | default('')) or
            'no attribute' in (nic_stats_select.response | default('') | string))
    fail_msg: List host NIC stats with select failed unexpectedly
    success_msg: List host NIC stats with select handled

- name: Host NIC stats missing required start_time and end_time with ext_id
  nutanix.ncp.ntnx_cluster_host_nic_stats_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "{{ host_ext_id }}"
    ext_id: "{{ sample_nic_ext_id | default('00000000-0000-0000-0000-000000000001') }}"
  register: nic_stats_missing_time
  ignore_errors: true

- name: Assert host NIC stats missing required time fails
  ansible.builtin.assert:
    that:
      - nic_stats_missing_time is defined
      - nic_stats_missing_time.failed == true
    fail_msg: Missing required time did not fail
    success_msg: Missing required time correctly rejected

- name: Host NIC stats with invalid stat_type
  nutanix.ncp.ntnx_cluster_host_nic_stats_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "{{ host_ext_id }}"
    start_time: "{{ stats_start_time }}"
    end_time: "{{ stats_end_time }}"
    stat_type: "INVALID_TYPE"
  register: nic_stats_invalid_type
  ignore_errors: true

- name: Assert invalid stat_type rejected
  ansible.builtin.assert:
    that:
      - nic_stats_invalid_type is defined
      - nic_stats_invalid_type.failed == true
    fail_msg: Invalid stat_type was not rejected
    success_msg: Invalid stat_type correctly rejected

- name: Host NIC stats with bogus ext_id
  nutanix.ncp.ntnx_cluster_host_nic_stats_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "{{ host_ext_id }}"
    ext_id: "00000000-0000-0000-0000-000000000099"
    start_time: "{{ stats_start_time }}"
    end_time: "{{ stats_end_time }}"
  register: nic_stats_bogus
  ignore_errors: true

- name: Assert bogus ext_id rejected
  ansible.builtin.assert:
    that:
      - nic_stats_bogus is defined
      - nic_stats_bogus.failed == true
    fail_msg: Bogus ext_id did not fail
    success_msg: Bogus ext_id correctly rejected

########################################################################
# 2. Port capability info — ntnx_cluster_port_capability_info_v2
########################################################################

- name: Get port capability by cluster_ext_id
  nutanix.ncp.ntnx_cluster_port_capability_info_v2:
