        (port_cap_result.failed == false and port_cap_result.response is defined)
        or ('no attribute' in (port_cap_result.msg | default('')) or
            'no attribute' in (port_cap_result.response | default('') | string))
    fail_msg: Get port capability failed unexpectedly
    success_msg: Get port capability handled

- name: Port capability missing required cluster_ext_id
  nutanix.ncp.ntnx_cluster_port_capability_info_v2:
  register: port_cap_missing
  ignore_errors: true

- name: Assert missing cluster_ext_id rejected
  ansible.builtin.assert:
    that:
      - port_cap_missing is defined
      - port_cap_missing.failed == true
    fail_msg: Missing cluster_ext_id did not fail
    success_msg: Missing cluster_ext_id correctly rejected

- name: Port capability with bogus cluster_ext_id
  nutanix.ncp.ntnx_cluster_port_capability_info_v2:
    cluster_ext_id: "00000000-0000-0000-0000-000000000099"
  register: port_cap_bogus
  ignore_errors: true

- name: Assert bogus cluster_ext_id rejected
  ansible.builtin.assert:
    that:
      - port_cap_bogus is defined
      - port_cap_bogus.failed == true
