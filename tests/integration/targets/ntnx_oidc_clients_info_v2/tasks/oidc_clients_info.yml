---
# yamllint disable rule:line-length
- name: Start ntnx_oidc_clients_info_v2 tests
  ansible.builtin.debug:
    msg: start ntnx_oidc_clients_info_v2 tests

- name: Generate random name
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"

- name: Set variables
  ansible.builtin.set_fact:
    oidc_name: "{{ random_name }}-ansible-oidc-info"
    oidc_ext_id_created: ""

########################################################################
# Setup: Create OIDC client for info tests
########################################################################
- name: Create OIDC client for info tests
  nutanix.ncp.ntnx_oidc_clients_v2:
    state: present
    client_name: "{{ oidc_name }}"
    application_type: "Backend application"
    redirect_uris:
      - "https://example.com/callback"
    sha256_thumbprint_list:
      - "3BCbFA2eeDF0F6bf9E8Fc41ccA8eFAafBF1dCe1B3cEAB51De4fF0E2EB7B52E4d"
  register: create_result
  ignore_errors: true

- name: Set created ext_id
  ansible.builtin.set_fact:
    oidc_ext_id_created: "{{ create_result.ext_id }}"
  when:
    - create_result.ext_id is defined
    - create_result.changed

- name: Assert creation for info tests
  ansible.builtin.assert:
    that:
      - create_result.changed == true
      - create_result.failed == false
      - create_result.response is defined
      - create_result.ext_id is defined
    fail_msg: Unable to create OIDC client for info tests
    success_msg: OIDC client for info tests created

########################################################################
# GET by ext_id
########################################################################
- name: Get OIDC client using ext_id
  nutanix.ncp.ntnx_oidc_clients_info_v2:
    ext_id: "{{ oidc_ext_id_created }}"
  register: result
  ignore_errors: true

- name: Verify get OIDC client using ext_id
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response.client_name == "{{ oidc_name }}"
      - result.ext_id == "{{ oidc_ext_id_created }}"
    fail_msg: Unable to fetch OIDC client using ext_id
    success_msg: Fetched OIDC client using ext_id successfully

########################################################################
# List all
########################################################################
- name: List all OIDC clients
  nutanix.ncp.ntnx_oidc_clients_info_v2:
  register: result
  ignore_errors: true

- name: Verify list all OIDC clients
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response | length > 0
    fail_msg: Unable to list all OIDC clients
    success_msg: Listed all OIDC clients successfully

########################################################################
# List with limit
########################################################################
- name: List OIDC clients with limit
  nutanix.ncp.ntnx_oidc_clients_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: Verify list OIDC clients with limit
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response | length == 1
    fail_msg: Unable to list OIDC clients with limit
    success_msg: Listed OIDC clients with limit successfully

########################################################################
# List with page
########################################################################
- name: List OIDC clients with page
  nutanix.ncp.ntnx_oidc_clients_info_v2:
    page: 0
    limit: 1
  register: result
  ignore_errors: true

- name: Verify list OIDC clients with page
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
    fail_msg: Unable to list OIDC clients with page
    success_msg: Listed OIDC clients with page successfully

########################################################################
# List with fetch_all
########################################################################
- name: List all OIDC clients with fetch_all
  nutanix.ncp.ntnx_oidc_clients_info_v2:
    fetch_all: true
  register: fetch_all_result
  ignore_errors: true

- name: Verify list OIDC clients with fetch_all
  ansible.builtin.assert:
    that:
      - fetch_all_result.changed == false
      - fetch_all_result.failed == false
      - fetch_all_result.response is defined
    fail_msg: Unable to list OIDC clients with fetch_all
    success_msg: Listed OIDC clients with fetch_all successfully

- name: Verify fetch_all length matches total when available
  ansible.builtin.assert:
    that:
      - (fetch_all_result.response | default([]) | length) == (fetch_all_result.total_available_results | int)
    fail_msg: fetch_all length mismatch
    success_msg: fetch_all length matches total_available_results
  when: fetch_all_result.total_available_results is defined

########################################################################
# Negative: Get with invalid ext_id
########################################################################
- name: Get OIDC client with invalid ext_id
  nutanix.ncp.ntnx_oidc_clients_info_v2:
    ext_id: "00000000-0000-0000-0000-000000000000"
  register: result
  ignore_errors: true

- name: Verify get with invalid ext_id fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: Get with invalid ext_id should fail
    success_msg: Get with invalid ext_id failed as expected

########################################################################
# Cleanup
########################################################################
- name: Delete OIDC client created for info tests
  nutanix.ncp.ntnx_oidc_clients_v2:
    state: absent
    ext_id: "{{ oidc_ext_id_created }}"
  register: result
  ignore_errors: true
  when: oidc_ext_id_created | length > 0

- name: Verify deletion of OIDC client for info tests
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
    fail_msg: Unable to delete OIDC client created for info tests
    success_msg: Deleted OIDC client created for info tests
  when: oidc_ext_id_created | length > 0
# yamllint enable rule:line-length
