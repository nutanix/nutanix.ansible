---
# Test plan for ntnx_disable_high_availability_config_v2
#   1. Discover AOS cluster ext_id for live tests
#   2. check_mode with inline dummy cluster_ext_id
#   3. Negative: missing required cluster_ext_id
#   4. Negative: invalid cluster_ext_id (non-existent)
#   5. Live disable (if cluster available) - may fail if HA already disabled, but we assert handling

- name: Start disable high availability config tests
  ansible.builtin.debug:
    msg: Start ntnx_disable_high_availability_config_v2 tests

- name: Set placeholder IDs
  ansible.builtin.set_fact:
    placeholder_cluster_ext_id: "00061fa4-ef93-7dd8-185b-ac1f6b6f97e2"
    fake_cluster_ext_id: "00000000-0000-0000-0000-000000000001"

####################################################################
# 1. Prerequisite discovery
####################################################################

- name: List AOS clusters to pick target
  nutanix.ncp.ntnx_clusters_info_v2:
    filter: "config/clusterFunction/any(t:t eq Clustermgmt.Config.ClusterFunctionRef'AOS')"
  register: clusters_result
  ignore_errors: true

- name: Set target cluster ext_id if available
  ansible.builtin.set_fact:
    target_cluster_ext_id: "{{ clusters_result.response[0].ext_id }}"
  when:
    - clusters_result is defined
    - not clusters_result.failed
    - clusters_result.response is defined
    - clusters_result.response | length > 0

- name: Fallback target cluster ext_id
  ansible.builtin.set_fact:
    target_cluster_ext_id: "{{ placeholder_cluster_ext_id }}"
  when: target_cluster_ext_id is not defined

####################################################################
# 2. Check mode with inline dummy
####################################################################

- name: Disable HA in check mode with inline dummy cluster_ext_id
  nutanix.ncp.ntnx_disable_high_availability_config_v2:
    cluster_ext_id: "11111111-1111-1111-1111-111111111111"
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify check mode disable HA
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
    success_msg: "Check mode disable HA passed"
    fail_msg: "Check mode disable HA failed"

####################################################################
# 3. Negative: missing required field
####################################################################

- name: Disable HA with missing cluster_ext_id (should fail)
  nutanix.ncp.ntnx_disable_high_availability_config_v2:
  register: result
  ignore_errors: true

- name: Verify missing required field fails
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    success_msg: "Missing required field correctly failed"
    fail_msg: "Missing required field did not fail as expected"

####################################################################
# 4. Negative: invalid cluster_ext_id
####################################################################

- name: Disable HA with invalid cluster_ext_id
  nutanix.ncp.ntnx_disable_high_availability_config_v2:
    cluster_ext_id: "{{ fake_cluster_ext_id }}"
  register: result
  ignore_errors: true

- name: Verify invalid cluster_ext_id fails
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
    success_msg: "Invalid cluster_ext_id correctly failed"
    fail_msg: "Invalid cluster_ext_id did not fail as expected"

####################################################################
# 5. Live disable (if possible)
####################################################################

- name: Disable HA on target cluster (live)
  nutanix.ncp.ntnx_disable_high_availability_config_v2:
    cluster_ext_id: "{{ target_cluster_ext_id }}"
  register: result
  ignore_errors: true

- name: Verify live disable HA result
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == false or result.failed == true
    success_msg: "Live disable HA executed (success or handled failure)"
    fail_msg: "Live disable HA unexpected state"

- name: Verify live disable changed when succeeded
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.response is defined
    success_msg: "Live disable HA changed correctly"
    fail_msg: "Live disable HA did not report changed"
  when: not result.failed
