---
- name: Start ntnx_user_defined_policies_info_v2 tests
  ansible.builtin.debug:
    msg: "Starting ntnx_user_defined_policies_info_v2 tests"

- name: List all user defined policies
  nutanix.ncp.ntnx_user_defined_policies_info_v2:
  register: result
  ignore_errors: true

- name: Verify list all policies
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.total_available_results is defined
    fail_msg: "Failed to list user defined policies"
    success_msg: "Listed user defined policies successfully"

- name: List with fetch_all
  nutanix.ncp.ntnx_user_defined_policies_info_v2:
    fetch_all: true
  register: fetch_all_result
  ignore_errors: true

- name: Verify fetch_all
  ansible.builtin.assert:
    that:
      - fetch_all_result.changed == false
      - fetch_all_result.failed == false
      - fetch_all_result.response is defined
      - fetch_all_result.total_available_results is defined
      - (fetch_all_result.response | default([]) | length) == (fetch_all_result.total_available_results | int)
    fail_msg: "fetch_all failed"
    success_msg: "fetch_all passed"

- name: List with limit
  nutanix.ncp.ntnx_user_defined_policies_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: Verify list with limit
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length <= 1
    fail_msg: "List with limit failed"
    success_msg: "List with limit passed"

- name: Fetch policies to get ext_id for filter tests
  nutanix.ncp.ntnx_user_defined_policies_info_v2:
    limit: 1
  register: list_one
  ignore_errors: true

- name: Set policy ext_id fact
  ansible.builtin.set_fact:
    uda_policy_ext_id: "{{ list_one.response[0].ext_id }}"
    uda_policy_title: "{{ list_one.response[0].title }}"
  when:
    - list_one.response is defined
    - list_one.response | length > 0
    - list_one.response[0].ext_id is defined

- name: List with filter by title
  nutanix.ncp.ntnx_user_defined_policies_info_v2:
    filter: "title eq '{{ uda_policy_title }}'"
  register: result
  ignore_errors: true
  when: uda_policy_title is defined

- name: Verify list with filter
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length >= 1
    fail_msg: "List with filter failed"
    success_msg: "List with filter passed"
  when: uda_policy_title is defined

- name: Get policy by ext_id
  nutanix.ncp.ntnx_user_defined_policies_info_v2:
    ext_id: "{{ uda_policy_ext_id }}"
  register: result
  ignore_errors: true
  when: uda_policy_ext_id is defined

- name: Verify get by ext_id
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.ext_id == uda_policy_ext_id
      - result.ext_id == uda_policy_ext_id
    fail_msg: "Get by ext_id failed"
    success_msg: "Get by ext_id passed"
  when: uda_policy_ext_id is defined

- name: Invalid ext_id negative
  nutanix.ncp.ntnx_user_defined_policies_info_v2:
    ext_id: "00000000-0000-0000-0000-000000000000"
  register: result
  ignore_errors: true

- name: Verify invalid ext_id fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Invalid ext_id should fail"
    success_msg: "Invalid ext_id correctly failed"

- name: Invalid filter negative
  nutanix.ncp.ntnx_user_defined_policies_info_v2:
    filter: "invalidField eq 'test'"
  register: result
  ignore_errors: true

- name: Verify invalid filter fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Invalid filter should fail"
    success_msg: "Invalid filter correctly failed"
