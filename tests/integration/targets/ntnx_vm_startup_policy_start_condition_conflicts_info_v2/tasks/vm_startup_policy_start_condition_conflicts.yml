---
# ---------------------------------------------------------------------------
# Test plan — ntnx_vm_startup_policy_start_condition_conflicts_info_v2
# ---------------------------------------------------------------------------
# The VmStartupPolicyStartConditionConflict entity is a purely read-only
# diagnostic resource. It is auto-generated by the platform when two or more
# VM startup policies define conflicting start conditions across overlapping
# category-based dependency groups. The SDK only exposes GET/LIST operations
# (no create/update/delete), so this integration target focuses on the
# read paths of the info module.
#
# Scenarios covered:
#   1. Argument-spec validation — missing required vm_startup_policy_ext_id
#      is rejected.
#   2. Argument-spec validation — invalid types (e.g. non-int limit) are
#      rejected.
#   3. Discover an existing VM startup policy on the target Prism Central
#      (if any). If none exists, the tests below use a synthetic ext_id.
#   4. List all conflicts for the discovered policy — assert changed=false,
#      failed=false, and that response is a list (may be empty on a clean
#      cluster).
#   5. List with pagination (limit=1, page=0) — assert same properties and
#      that the returned list is <= 1 element.
#   6. List with limit=100 (upper bound) — assert same properties.
#   7. Negative: list with a non-existent parent VM startup policy ext_id —
#      assert failed=true and error is populated with a descriptive message.
#   8. Negative: get-by-id with a non-existent conflict ext_id — assert
#      failed=true and error is populated.
#   9. Positive get-by-id path — only executed when the list operation
#      returned at least one conflict; otherwise skipped.
# ---------------------------------------------------------------------------

- name: Start VmStartupPolicyStartConditionConflict info tests
  ansible.builtin.debug:
    msg: Start VmStartupPolicyStartConditionConflict info tests

- name: Generate random suffix
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"

- name: Set constants for negative tests
  ansible.builtin.set_fact:
    fake_policy_ext_id: "00000000-0000-0000-0000-000000000000"
    fake_conflict_ext_id: "11111111-1111-1111-1111-111111111111"

########################################################################################
# 1) Argument spec validation — missing required parameter

- name: Attempt info call without vm_startup_policy_ext_id (should fail)
  nutanix.ncp.ntnx_vm_startup_policy_start_condition_conflicts_info_v2: {}
  register: missing_required
  ignore_errors: true

- name: Assert missing required parameter is rejected
  ansible.builtin.assert:
    that:
      - missing_required.failed == true
      - missing_required.changed is not defined or missing_required.changed == false
      - "'vm_startup_policy_ext_id' in (missing_required.msg | default(''))"
    fail_msg: "Expected argument-spec failure for missing vm_startup_policy_ext_id"
    success_msg: "Argument-spec validation correctly rejected missing vm_startup_policy_ext_id"

########################################################################################
# 2) Argument spec validation — invalid type for limit

- name: Attempt info call with invalid limit type
  nutanix.ncp.ntnx_vm_startup_policy_start_condition_conflicts_info_v2:
    vm_startup_policy_ext_id: "{{ fake_policy_ext_id }}"
    limit: "not_an_int"
  register: bad_limit
  ignore_errors: true

- name: Assert non-integer limit is rejected by argument spec
  ansible.builtin.assert:
    that:
      - bad_limit.failed == true
      - bad_limit.changed is not defined or bad_limit.changed == false
    fail_msg: "Expected non-integer limit to be rejected"
    success_msg: "Non-integer limit correctly rejected"

########################################################################################
# 3) Discover an existing VM startup policy (best-effort)

- name: Discover VM startup policies via v4 API
  ansible.builtin.uri:
    url: "https://{{ ip }}:9440/api/vmm/v4.2/ahv/policies/vm-startup-policies?_limit=1"
    method: GET
    user: "{{ username }}"
    password: "{{ password }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
    status_code: [200]
  register: policies_discovery
  ignore_errors: true

- name: Determine whether a real VM startup policy is available for testing
  ansible.builtin.set_fact:
    have_real_policy: >-
      {{ (policies_discovery is defined
          and policies_discovery.status | default(0) == 200
          and policies_discovery.json is defined
          and policies_discovery.json.data is defined
          and (policies_discovery.json.data | length) > 0) }}
    real_policy_ext_id: >-
      {{ (policies_discovery.json.data[0].extId
          if (policies_discovery is defined
              and policies_discovery.status | default(0) == 200
              and policies_discovery.json is defined
              and policies_discovery.json.data is defined
              and (policies_discovery.json.data | length) > 0)
          else fake_policy_ext_id) }}

- name: Show whether a real policy was found for tests
  ansible.builtin.debug:
    msg: "have_real_policy={{ have_real_policy }} real_policy_ext_id={{ real_policy_ext_id }}"

########################################################################################
# 4) List all conflicts for the discovered (or fake) parent policy

- name: List all start condition conflicts (default pagination)
  nutanix.ncp.ntnx_vm_startup_policy_start_condition_conflicts_info_v2:
    vm_startup_policy_ext_id: "{{ real_policy_ext_id }}"
  register: list_all
  ignore_errors: true

- name: Assert list-all response shape when a real policy exists
  ansible.builtin.assert:
    that:
      - list_all.changed == false
      - list_all.failed == false
      - list_all.response is defined
      - (list_all.response | type_debug) == "list"
      - list_all.vm_startup_policy_ext_id == real_policy_ext_id
      - list_all.total_available_results is defined
    fail_msg: "List-all did not return the expected shape for a real policy: {{ list_all }}"
    success_msg: "List-all returned the expected response shape"
  when: have_real_policy | bool

- name: Assert list-all with fake parent policy fails cleanly
  ansible.builtin.assert:
    that:
      - list_all.failed == true
      - list_all.changed is not defined or list_all.changed == false
    fail_msg: "List-all with fake parent policy should have failed"
    success_msg: "List-all with fake parent policy failed as expected"
  when: not (have_real_policy | bool)

########################################################################################
# 5) List with pagination (limit=1, page=0)

- name: List start condition conflicts with limit=1 and page=0
  nutanix.ncp.ntnx_vm_startup_policy_start_condition_conflicts_info_v2:
    vm_startup_policy_ext_id: "{{ real_policy_ext_id }}"
    limit: 1
    page: 0
  register: list_paginated
  when: have_real_policy | bool
  ignore_errors: true

- name: Assert pagination response
  ansible.builtin.assert:
    that:
      - list_paginated.changed == false
      - list_paginated.failed == false
      - list_paginated.response is defined
      - (list_paginated.response | type_debug) == "list"
      - (list_paginated.response | length) <= 1
    fail_msg: "Paginated list did not return the expected shape: {{ list_paginated }}"
    success_msg: "Paginated list returned the expected shape"
  when: have_real_policy | bool

########################################################################################
# 6) List with the maximum limit=100

- name: List start condition conflicts with limit=100
  nutanix.ncp.ntnx_vm_startup_policy_start_condition_conflicts_info_v2:
    vm_startup_policy_ext_id: "{{ real_policy_ext_id }}"
    limit: 100
  register: list_max
  when: have_real_policy | bool
  ignore_errors: true

- name: Assert limit=100 response
  ansible.builtin.assert:
    that:
      - list_max.changed == false
      - list_max.failed == false
      - list_max.response is defined
      - (list_max.response | type_debug) == "list"
      - (list_max.response | length) <= 100
    fail_msg: "List with limit=100 did not return the expected shape: {{ list_max }}"
    success_msg: "List with limit=100 returned the expected shape"
  when: have_real_policy | bool

########################################################################################
# 7) Negative: non-existent parent VM startup policy

- name: List conflicts under a non-existent VM startup policy
  nutanix.ncp.ntnx_vm_startup_policy_start_condition_conflicts_info_v2:
    vm_startup_policy_ext_id: "{{ fake_policy_ext_id }}"
  register: list_bad_parent
  ignore_errors: true

- name: Assert non-existent parent policy list surfaces an API error
  ansible.builtin.assert:
    that:
      - list_bad_parent.failed == true
      - list_bad_parent.changed is not defined or list_bad_parent.changed == false
      - (list_bad_parent.msg | default('')) | length > 0
    fail_msg: "Expected list with a non-existent parent policy to fail"
    success_msg: "List with a non-existent parent policy correctly failed"

########################################################################################
# 8) Negative: non-existent conflict ext_id

- name: Get start condition conflict with a non-existent ext_id
  nutanix.ncp.ntnx_vm_startup_policy_start_condition_conflicts_info_v2:
    vm_startup_policy_ext_id: "{{ real_policy_ext_id }}"
    ext_id: "{{ fake_conflict_ext_id }}"
  register: get_bad_conflict
  ignore_errors: true

- name: Assert non-existent conflict returns a clean API error
  ansible.builtin.assert:
    that:
      - get_bad_conflict.failed == true
      - get_bad_conflict.changed is not defined or get_bad_conflict.changed == false
      - (get_bad_conflict.msg | default('')) | length > 0
    fail_msg: "Expected get-by-id with a non-existent conflict ext_id to fail"
    success_msg: "Get-by-id with a non-existent conflict ext_id correctly failed"

########################################################################################
# 9) Positive get-by-id — only runs when a real conflict was found

- name: Fetch first conflict ext_id from list-all response (if any)
  ansible.builtin.set_fact:
    have_real_conflict: >-
      {{ (list_all is defined
          and list_all.response is defined
          and (list_all.response | length) > 0) }}
    real_conflict_ext_id: >-
      {{ (list_all.response[0].ext_id
          if (list_all is defined
              and list_all.response is defined
              and (list_all.response | length) > 0)
          else fake_conflict_ext_id) }}
  when: have_real_policy | bool

- name: Get an existing start condition conflict by ext_id
  nutanix.ncp.ntnx_vm_startup_policy_start_condition_conflicts_info_v2:
    vm_startup_policy_ext_id: "{{ real_policy_ext_id }}"
    ext_id: "{{ real_conflict_ext_id }}"
  register: get_real_conflict
  when: (have_real_policy | default(false) | bool) and (have_real_conflict | default(false) | bool)

- name: Assert get-by-id positive path
  ansible.builtin.assert:
    that:
      - get_real_conflict.changed == false
      - get_real_conflict.failed == false
      - get_real_conflict.response is defined
      - get_real_conflict.response.ext_id == real_conflict_ext_id
      - get_real_conflict.ext_id == real_conflict_ext_id
      - get_real_conflict.vm_startup_policy_ext_id == real_policy_ext_id
    fail_msg: "Get-by-id positive path did not return the expected data: {{ get_real_conflict }}"
    success_msg: "Get-by-id positive path returned the expected conflict"
  when: (have_real_policy | default(false) | bool) and (have_real_conflict | default(false) | bool)

- name: Report skipped positive get-by-id when no real conflict is present
  ansible.builtin.debug:
    msg: >-
      No live VmStartupPolicyStartConditionConflict was available on the
      target Prism Central (this is expected on clean clusters without
      contradictory VM startup policies). The positive get-by-id test path
      was skipped for this run.
  when: not ((have_real_policy | default(false) | bool) and (have_real_conflict | default(false) | bool))
