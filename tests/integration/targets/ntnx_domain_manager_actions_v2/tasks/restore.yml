    restorable_domain_manager_ext_id: "54678987-1222-5678-9090-ac1f6b6f97e2"
    domain_manager:
      config:
        build_info:
          version: "pc.2024.3"
        name: "PC_10.0.0.2"
        size: "SMALL"
      network:
        name_servers:
          - ipv4:
              value: "10.0.0.5"
        ntp_servers:
          - fqdn:
              value: "1.example.org"
        external_networks:
          - network_ext_id: "54678987-1764-3478-8050-ac1f6b6f97e2"
            default_gateway:
              ipv4:
                value: "10.0.0.0"
            subnet_mask:
              ipv4:
                value: "255.255.252.0"
            ip_ranges:
              - begin:
                  ipv4:
                    value: "10.1.1.1"
                end:
                  ipv4:
                    value: "10.1.1.1"
  register: result
  ignore_errors: true

- name: Restore without ext_id - negative status
  ansible.builtin.assert:
    that:
      - result.failed == true
      - "'ext_id' in result.msg"
    fail_msg: "Restore without ext_id should have failed"
    success_msg: "Restore without ext_id failed as expected"

