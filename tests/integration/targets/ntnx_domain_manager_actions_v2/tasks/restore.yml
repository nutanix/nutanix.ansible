- name: Restore domain manager (destructive, guarded)
  nutanix.ncp.ntnx_restore_v2:
    nutanix_host: "{{ pe_ip }}"
    nutanix_username: "{{ pe_username }}"
    nutanix_password: "{{ pe_password }}"
    validate_certs: false
    ext_id: "{{ restore_point_ext_id }}"
    restore_source_ext_id: "{{ restore_source_ext_id }}"
    restorable_domain_manager_ext_id: "{{ restorable_domain_manager_ext_id }}"
    domain_manager: "{{ restore_domain_manager_spec }}"
  register: result
  ignore_errors: true
  when: run_destructive_restore | default(false) | bool

- name: Restore domain manager status (destructive, guarded)
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.response.status == "SUCCEEDED"
      - result.task_ext_id is defined
    fail_msg: "Restore domain manager failed"
    success_msg: "Restore domain manager passed"
  when: run_destructive_restore | default(false) | bool
