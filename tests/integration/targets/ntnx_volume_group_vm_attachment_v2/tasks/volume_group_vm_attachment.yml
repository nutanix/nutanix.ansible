---
- name: Start Volume Group VM attachment tests
  ansible.builtin.debug:
    msg: "Start Volume Group VM attachment tests"

- name: Generate random names
  ansible.builtin.set_fact:
    random_name: >-
      {{ query('community.general.random_string',
      numbers=false, special=false, length=12)[0] }}
    suffix_name: "ansible-vgvm"

- name: Set VG and VM names
  ansible.builtin.set_fact:
    vg_name: "{{ suffix_name }}-{{ random_name }}-vg"
    vm_name: "{{ suffix_name }}-{{ random_name }}-vm"
    wrong_ext_id: "00000000-0000-0000-0000-000000000000"

######################################## Test Setup ########################################

- name: Create Volume Group for VM attachment tests
  nutanix.ncp.ntnx_volume_groups_v2:
    name: "{{ vg_name }}"
    description: "VG for VM attachment tests"
    target_prefix: "vgvm"
    cluster_reference: "{{ cluster.uuid }}"
    usage_type: "USER"
    sharing_status: "SHARED"
    should_load_balance_vm_attachments: true
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: vg_result

- name: Verify VG creation
  ansible.builtin.assert:
    that:
      - vg_result is defined
      - vg_result.changed == true
      - vg_result.failed == false
      - vg_result.ext_id is defined
    fail_msg: "Unable to create VG for VM attachment tests"
    success_msg: "VG created successfully"

- name: Set VG ext_id fact
  ansible.builtin.set_fact:
    vg_ext_id: "{{ vg_result.ext_id }}"

- name: Create VM for VG attachment
  nutanix.ncp.ntnx_vms_v2:
    name: "{{ vm_name }}"
    num_sockets: 1
    num_cores_per_socket: 1
    memory_size_bytes: 4294967296
    cluster:
      ext_id: "{{ cluster.uuid }}"
    nics:
      - network_info:
          nic_type: "NORMAL_NIC"
          vlan_mode: "ACCESS"
          subnet:
            ext_id: "{{ network.dhcp.uuid }}"
          ipv4_config:
            should_assign_ip: true
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: vm_result

- name: Verify VM creation
  ansible.builtin.assert:
    that:
      - vm_result is defined
      - vm_result.changed == true
      - vm_result.failed == false
      - vm_result.ext_id is defined
    fail_msg: "Unable to create VM for VG tests"
    success_msg: "VM created successfully"

- name: Set VM ext_id fact
  ansible.builtin.set_fact:
    vm_ext_id: "{{ vm_result.ext_id }}"

############################## Check mode - attach ##############################

- name: Attach VM to VG in check mode with dummy IDs
  nutanix.ncp.ntnx_volume_group_vm_attachment_v2:
    state: present
    volume_group_ext_id: "11111111-1111-1111-1111-111111111111"
    ext_id: "22222222-2222-2222-2222-222222222222"
    index: 1
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify check mode attach response
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
    fail_msg: "Check mode attach failed"
    success_msg: "Check mode attach passed"

############################## Negative tests ####################################

- name: Attach VM with missing volume_group_ext_id # noqa args[module]
  nutanix.ncp.ntnx_volume_group_vm_attachment_v2:
    state: present
    ext_id: "{{ vm_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true

- name: Verify missing volume_group_ext_id failure
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    fail_msg: "Missing volume_group_ext_id did not fail"
    success_msg: "Missing volume_group_ext_id correctly failed"

- name: Attach VM with missing ext_id # noqa args[module]
  nutanix.ncp.ntnx_volume_group_vm_attachment_v2:
    state: present
    volume_group_ext_id: "{{ vg_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true

- name: Verify missing ext_id failure
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    fail_msg: "Missing ext_id did not fail"
    success_msg: "Missing ext_id correctly failed"

############################## Attach - real #####################################

- name: Attach VM to VG
  nutanix.ncp.ntnx_volume_group_vm_attachment_v2:
    state: present
    volume_group_ext_id: "{{ vg_ext_id }}"
    ext_id: "{{ vm_ext_id }}"
    index: 1
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result

- name: Verify attach success
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.task_ext_id is defined
      - result.response.status == "SUCCEEDED"
      - result.ext_id == vm_ext_id
      - result.volume_group_ext_id == vg_ext_id
    fail_msg: "Unable to attach VM to VG"
    success_msg: "VM attached to VG successfully"

- name: Fetch VM info to verify VG attachment
  nutanix.ncp.ntnx_vms_info_v2:
    ext_id: "{{ vm_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: vm_info
  ignore_errors: true

- name: Verify VM has VG backing
  ansible.builtin.assert:
    that:
      - vm_info is defined
      - vm_info.failed == false
      - vm_info.response.disks[0].backing_info.volume_group_ext_id == vg_ext_id
    fail_msg: "VM attachment not reflected in VM info"
    success_msg: "VM attachment verified via VM info"

- name: Attach VM with wrong VG ext_id
  nutanix.ncp.ntnx_volume_group_vm_attachment_v2:
    state: present
    volume_group_ext_id: "{{ wrong_ext_id }}"
    ext_id: "{{ vm_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true

- name: Verify wrong VG ext_id failure
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    fail_msg: "Wrong VG ext_id did not fail"
    success_msg: "Wrong VG ext_id correctly failed"

############################## Detach - check mode ###############################

- name: Detach VM from VG in check mode with dummy IDs
  nutanix.ncp.ntnx_volume_group_vm_attachment_v2:
    state: absent
    volume_group_ext_id: "11111111-1111-1111-1111-111111111111"
    ext_id: "22222222-2222-2222-2222-222222222222"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify check mode detach
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.msg is defined
    fail_msg: "Check mode detach failed"
    success_msg: "Check mode detach passed"

############################## Detach - real #####################################

- name: Detach VM from VG
  nutanix.ncp.ntnx_volume_group_vm_attachment_v2:
    state: absent
    volume_group_ext_id: "{{ vg_ext_id }}"
    ext_id: "{{ vm_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result

- name: Verify detach success
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.task_ext_id is defined
      - result.response.status == "SUCCEEDED"
    fail_msg: "Unable to detach VM from VG"
    success_msg: "VM detached from VG successfully"

############################## Cleanup ###########################################

- name: Delete VM
  nutanix.ncp.ntnx_vms_v2:
    state: absent
    ext_id: "{{ vm_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true

- name: Verify VM deletion
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.response.status == "SUCCEEDED"
    fail_msg: "Unable to delete VM"
    success_msg: "VM deleted successfully"

- name: Delete Volume Group
  nutanix.ncp.ntnx_volume_groups_v2:
    state: absent
    ext_id: "{{ vg_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true
  retries: 3
  delay: 5
  until: result is succeeded

- name: Verify VG deletion
  ansible.builtin.assert:
    that:
      - result is defined
      - (result.failed == false and result.changed == true) or ("Backend server error" in (result | string))
    fail_msg: "Unable to delete VG"
    success_msg: "VG deletion handled"
