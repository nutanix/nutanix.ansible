---
- name: Start testing ntnx_vm_disk_hydration_v2
  ansible.builtin.debug:
    msg: Start testing ntnx_vm_disk_hydration_v2

- name: Generate random name suffix
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"

- name: Set VM name
  ansible.builtin.set_fact:
    vm_name: "{{ random_name }}_disk_hydration_vm"

- name: Enable hydration with check mode enabled
  nutanix.ncp.ntnx_vm_disk_hydration_v2:
    state: present
    vm_ext_id: "83083083-0000-0000-0000-000000000001"
    ext_id: "83083083-0000-0000-0000-000000000002"
  register: result
  ignore_errors: true
  check_mode: true

- name: Enable hydration with check mode enabled status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.msg is defined
      - >-
        result.msg ==
        'Hydration will be enabled for VM disk with
        ext_id:83083083-0000-0000-0000-000000000002.'
    fail_msg: Enable hydration with check mode enabled failed
    success_msg: Enable hydration with check mode enabled passed

- name: Disable hydration with check mode enabled
  nutanix.ncp.ntnx_vm_disk_hydration_v2:
    state: absent
    vm_ext_id: "83083083-0000-0000-0000-000000000001"
    ext_id: "83083083-0000-0000-0000-000000000002"
  register: result
  ignore_errors: true
  check_mode: true

- name: Disable hydration with check mode enabled status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.msg is defined
      - >-
        result.msg ==
        'Hydration will be disabled for VM disk with
        ext_id:83083083-0000-0000-0000-000000000002.'
    fail_msg: Disable hydration with check mode enabled failed
    success_msg: Disable hydration with check mode enabled passed

- name: Create a VM with a disk
  nutanix.ncp.ntnx_vms_v2:
    state: present
    name: "{{ vm_name }}"
    cluster:
      ext_id: "{{ cluster.uuid }}"
    disks:
      - backing_info:
          vm_disk:
            disk_size_bytes: 1073741824
            storage_container:
              ext_id: "{{ storage_container.uuid }}"
        disk_address:
          bus_type: SCSI
          index: 0
  register: result
  ignore_errors: true

- name: Create VM status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.response.disks is defined
      - result.response.disks | length >= 1
      - result.response.disks[0].ext_id is defined
    fail_msg: Unable to create VM with a disk
    success_msg: VM with a disk created successfully

- name: Capture the VM and disk ext_ids
  ansible.builtin.set_fact:
    vm_uuid: "{{ result.ext_id }}"
    disk_uuid: "{{ result.response.disks[0].ext_id }}"

- name: Enable hydration for the VM disk
  nutanix.ncp.ntnx_vm_disk_hydration_v2:
    state: present
    vm_ext_id: "{{ vm_uuid }}"
    ext_id: "{{ disk_uuid }}"
  register: result
  ignore_errors: true

- name: Enable hydration status
  ansible.builtin.assert:
    that:
      - result.ext_id == disk_uuid
      - result.vm_ext_id == vm_uuid
      - result.failed == false
      - result.changed == true
      - result.task_ext_id is defined
      - result.response is defined
    fail_msg: Enable hydration failed
    success_msg: Enable hydration passed

- name: Disable hydration for the VM disk
  nutanix.ncp.ntnx_vm_disk_hydration_v2:
    state: absent
    vm_ext_id: "{{ vm_uuid }}"
    ext_id: "{{ disk_uuid }}"
  register: result
  ignore_errors: true

- name: Disable hydration status
  ansible.builtin.assert:
    that:
      - result.ext_id == disk_uuid
      - result.vm_ext_id == vm_uuid
      - result.failed == false
      - result.changed == true
      - result.task_ext_id is defined
      - result.response is defined
    fail_msg: Disable hydration failed
    success_msg: Disable hydration passed

- name: Delete the VM
  nutanix.ncp.ntnx_vms_v2:
    state: absent
    ext_id: "{{ vm_uuid }}"
  register: result
  ignore_errors: true

- name: Delete VM status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
    fail_msg: Unable to delete the VM
    success_msg: VM deleted successfully
