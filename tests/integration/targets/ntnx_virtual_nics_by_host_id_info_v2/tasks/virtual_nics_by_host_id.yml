---
# Test plan for ntnx_virtual_nics_by_host_id_info_v2 (ListVirtualNicsByHostId)
# 1. Discover cluster + host
# 2. List virtual NICs; validate shape
# 3. limit / filter / fetch_all
# 4. Negatives: missing / invalid ids

- name: Start virtual NICs by host id tests
  ansible.builtin.debug:
    msg: Start ntnx_virtual_nics_by_host_id_info_v2 tests

- name: Discover AOS cluster
  nutanix.ncp.ntnx_clusters_info_v2:
    filter: >-
      config/clusterFunction/any(t:t eq
      Clustermgmt.Config.ClusterFunctionRef'AOS')
  register: aos_clusters
  ignore_errors: true

- name: Assert AOS cluster found
  ansible.builtin.assert:
    that:
      - aos_clusters is succeeded
      - aos_clusters.response | length > 0
    fail_msg: "No AOS cluster"
    success_msg: "AOS cluster found"

- name: Set cluster_ext_id
  ansible.builtin.set_fact:
    cluster_ext_id: "{{ aos_clusters.response[0].ext_id }}"

- name: Discover hosts
  nutanix.ncp.ntnx_hosts_by_cluster_id_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
  register: hosts_info
  ignore_errors: true

- name: Assert hosts found
  ansible.builtin.assert:
    that:
      - hosts_info is succeeded
      - hosts_info.response | length > 0
    fail_msg: "No hosts"
    success_msg: "Hosts found"

- name: Set host_ext_id
  ansible.builtin.set_fact:
    host_ext_id: "{{ hosts_info.response[0].ext_id }}"

- name: List virtual NICs by host id
  nutanix.ncp.ntnx_virtual_nics_by_host_id_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "{{ host_ext_id }}"
  register: vnics
  ignore_errors: true

- name: Assert virtual NICs listed
  ansible.builtin.assert:
    that:
      - not vnics.changed
      - vnics is succeeded
      - vnics.response is defined
      - vnics.total_available_results is defined
    fail_msg: "Failed listing virtual NICs"
    success_msg: "Virtual NICs listed"

- name: List with limit
  nutanix.ncp.ntnx_virtual_nics_by_host_id_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "{{ host_ext_id }}"
    limit: 1
  register: vnics_limit
  ignore_errors: true

- name: Assert limit
  ansible.builtin.assert:
    that:
      - not vnics_limit.changed
      - vnics_limit is succeeded
      - vnics_limit.response | length <= 1
    fail_msg: "Limit failed"
    success_msg: "Limit succeeded"

- name: List with filter
  nutanix.ncp.ntnx_virtual_nics_by_host_id_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "{{ host_ext_id }}"
    filter: "name eq '{{ vnics.response[0].name }}'"
  register: vnics_filter
  ignore_errors: true
  when:
    - vnics.response | default([]) | length > 0
    - vnics.response[0].name is defined

- name: Assert filter
  ansible.builtin.assert:
    that:
      - not vnics_filter.changed
      - vnics_filter is succeeded
    fail_msg: "Filter failed"
    success_msg: "Filter succeeded"
  when: vnics_filter is not skipped

- name: List with fetch_all
  nutanix.ncp.ntnx_virtual_nics_by_host_id_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "{{ host_ext_id }}"
    fetch_all: true
  register: vnics_fetch_all
  ignore_errors: true

- name: Assert fetch_all
  ansible.builtin.assert:
    that:
      - not vnics_fetch_all.changed
      - vnics_fetch_all is succeeded
      - vnics_fetch_all.response | length == vnics_fetch_all.total_available_results
    fail_msg: "fetch_all failed"
    success_msg: "fetch_all succeeded"

- name: Negative - missing host_ext_id
  nutanix.ncp.ntnx_virtual_nics_by_host_id_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
  register: missing_host
  ignore_errors: true

- name: Assert missing host fails
  ansible.builtin.assert:
    that:
      - missing_host is failed
    fail_msg: "Expected missing host failure"
    success_msg: "Missing host rejected"

- name: Negative - invalid host_ext_id
  nutanix.ncp.ntnx_virtual_nics_by_host_id_info_v2:
    cluster_ext_id: "{{ cluster_ext_id }}"
    host_ext_id: "00000000-0000-0000-0000-000000000000"
  register: bad_host
  ignore_errors: true

- name: Assert invalid host fails
  ansible.builtin.assert:
    that:
      - bad_host is failed
    fail_msg: "Expected invalid host failure"
    success_msg: "Invalid host rejected"
