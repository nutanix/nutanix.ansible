########################################################################

- name: Verify update of project_ext_id is not supported
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    ext_id: "{{ todelete }}"
    project_ext_id: "{{ project2.uuid }}"
    service_account:
      username: "{{ active_directory.username }}"
      password: "{{ active_directory.password }}"
  register: result
  ignore_errors: true

- name: Verify update of project_ext_id is blocked status
  ansible.builtin.assert:
    that:
      - result.failed == true
      - 'result.msg == "Update is not supported for the following field(s): project_ext_id"'
    fail_msg: "Update of project_ext_id should have been blocked"
    success_msg: "Update of project_ext_id is correctly blocked"

########################################################################

- name: Delete shared directory service
  nutanix.ncp.ntnx_directory_services_v2:
    state: absent
    ext_id: "{{ todelete }}"
  register: result
  ignore_errors: true

- name: Output of delete shared directory service
  ansible.builtin.set_fact:
    msg: "Directory Service with ext_id: {{ todelete }} deleted successfully"

- name: Delete shared directory service status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.ext_id == "{{ todelete }}"
      - result.msg == "{{ msg }}"
    fail_msg: "Unable to delete shared directory service"
    success_msg: "Shared directory service deleted successfully"

- name: Reset todelete list
  ansible.builtin.set_fact:
    todelete: []

########################################################################
# Delete the project created for tests
########################################################################
- name: Delete projects created for tests
  nutanix.ncp.ntnx_project_v2:
    state: absent
    ext_id: "{{ item }}"
  register: delete_projects_result
  loop:
    - "{{ project.uuid }}"
    - "{{ project2.uuid }}"
    - "{{ project3.uuid }}"
  ignore_errors: true

- name: Status of projects deletion for tests
  ansible.builtin.assert:
    that:
      - item.changed == true
      - item.failed == false
      - item.ext_id == item.item
      - item.task_ext_id is defined
      - item.response.status == "SUCCEEDED"
    fail_msg: "Unable to delete project {{ item.item }} created for tests"
    success_msg: "Project {{ item.item }} created for tests deleted successfully"
  loop: "{{ delete_projects_result.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Verify all test projects were deleted
  ansible.builtin.assert:
    that:
      - delete_projects_result.results | length == 3
      - delete_projects_result.results | selectattr('changed', 'equalto', true) | list | length == 3
      - delete_projects_result.results | selectattr('failed', 'equalto', false) | list | length == 3
    fail_msg: "Not all test projects were deleted successfully"
    success_msg: "All test projects deleted successfully"
