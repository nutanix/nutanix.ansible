---
# Variables required before running this playbook:
# - active_directory
# - white_listed_groups

- name: Start ntnx_directory_services_v2 tests
  ansible.builtin.debug:
    msg: start ntnx_directory_services_v2 tests

- name: Generate random category key & value
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"

- name: Set variables
  ansible.builtin.set_fact:
    directory_service: "{{ random_name }}ansible-ag"
    todelete: ""

########################################################################
# Create a project to be used for project_ext_id and sharing tests
########################################################################
- name: Create projects for tests
  nutanix.ncp.ntnx_project_v2:
    state: present
    name: "{{ random_name }}-ansible-project-{{ item }}"
    project_id: "{{ random_name }}-ansible-project-id-{{ item }}"
  register: create_projects_result
  loop: "{{ range(1, 4) | list }}"
  ignore_errors: true

- name: Status of projects creation for tests
  ansible.builtin.assert:
    that:
      - item.changed == true
      - item.failed == false
      - item.response is defined
      - item.ext_id is defined
      - item.ext_id | length > 0
      - item.task_ext_id is defined
      - item.response.state == "ACTIVE"
    fail_msg: "Unable to create project for tests"
    success_msg: "Project for tests created successfully"
  loop: "{{ create_projects_result.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Set project facts for tests
  ansible.builtin.set_fact:
    project:
      name: "{{ random_name }}-ansible-project-1"
      uuid: "{{ create_projects_result.results[0].ext_id }}"
    project2:
      name: "{{ random_name }}-ansible-project-2"
      uuid: "{{ create_projects_result.results[1].ext_id }}"
    project3:
      name: "{{ random_name }}-ansible-project-3"
      uuid: "{{ create_projects_result.results[2].ext_id }}"

- name: Create ACTIVE_DIRECTORY service with check_mode
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    name: "{{ directory_service }}"
    url: "{{ active_directory.url }}"
    directory_type: ACTIVE_DIRECTORY
    domain_name: "{{ active_directory.domain_name }}"
    service_account:
      username: "{{ active_directory.username }}"
      password: "{{ active_directory.password }}"
    # Dummy sharing values to verify check mode reflects the requested sharing.
    shared_with_projects:
      - "11111111-1111-1111-1111-111111111111"
      - "22222222-2222-2222-2222-222222222222"
  register: result
  ignore_errors: true
  check_mode: true

- name: Status of ACTIVE_DIRECTORY service creation in check mode
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response.name == "{{ directory_service }}"
      - result.response.domain_name == "{{ active_directory.domain_name }}"
      - result.response.directory_type == "ACTIVE_DIRECTORY"
      - result.response.url == "{{ active_directory.url }}"
      - result.response.service_account.username == "{{ active_directory.username }}"
      - result.response.service_account.password is defined
      - result.response.shared_with_projects == ["11111111-1111-1111-1111-111111111111", "22222222-2222-2222-2222-222222222222"]
    fail_msg: Unable to create ACTIVE_DIRECTORY service in check mode
    success_msg: ACTIVE_DIRECTORY service created successfully in check mode

########################################################################

- name: Create OpenLDAP service with check_mode
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    name: "{{ directory_service }}_name"
    url: "{{ directory_service }}_url"
    directory_type: OPEN_LDAP
    domain_name: "{{ directory_service }}_domain_name"
    service_account:
      username: "{{ directory_service }}_username"
      password: "{{ directory_service }}_password"
    open_ldap_configuration:
      user_configuration:
        user_object_class: inetOrgPerson
        user_search_base: ou=users,dc=example,dc=com
        username_attribute: uid
      user_group_configuration:
        group_object_class: groupOfNames
        group_search_base: ou=groups,dc=example,dc=com
        group_member_attribute: member
        group_member_attribute_value: uid
    # Dummy value to verify check mode reflects the requested shared-with-all state.
    is_shared_with_all_projects: true
  register: result
  ignore_errors: true
  check_mode: true

- name: Create OpenLDAP service with check_mode status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response.is_shared_with_all_projects == true
      - result.response.name == "{{ directory_service }}_name"
      - result.response.domain_name == "{{ directory_service }}_domain_name"
      - result.response.directory_type == "OPEN_LDAP"
      - result.response.url == "{{ directory_service }}_url"
      - result.response.service_account.username == "{{ directory_service }}_username"
      - result.response.service_account.password is defined
      - result.response.open_ldap_configuration.user_configuration.user_object_class == "inetOrgPerson"
      - result.response.open_ldap_configuration.user_configuration.user_search_base == "ou=users,dc=example,dc=com"
      - result.response.open_ldap_configuration.user_configuration.username_attribute == "uid"
      - result.response.open_ldap_configuration.user_group_configuration.group_object_class == "groupOfNames"
      - result.response.open_ldap_configuration.user_group_configuration.group_search_base == "ou=groups,dc=example,dc=com"
      - result.response.open_ldap_configuration.user_group_configuration.group_member_attribute == "member"
      - result.response.open_ldap_configuration.user_group_configuration.group_member_attribute_value == "uid"
    fail_msg: Unable to create OPEN_LDAP service in check mode
    success_msg: OPEN_LDAP service created successfully in check mode

########################################################################

- name: Create ACTIVE_DIRECTORY service
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    name: "{{ directory_service }}"
    url: "{{ active_directory.url }}"
    directory_type: ACTIVE_DIRECTORY
    domain_name: "{{ active_directory.domain_name }}"
    project_ext_id: "{{ project.uuid }}"
    service_account:
      username: "{{ active_directory.username }}"
      password: "{{ active_directory.password }}"
    white_listed_groups:
      - "{{ white_listed_groups[0] }}"
  register: result
  ignore_errors: true

- name: Status of ACTIVE_DIRECTORY service creation
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.name == "{{ directory_service }}"
      - result.response.directory_type == "ACTIVE_DIRECTORY"
      - result.response.url == "{{ active_directory.url }}"
      - result.response.domain_name == "{{ active_directory.domain_name }}"
      - result.response.service_account.username == "{{ active_directory.username }}"
      - result.response.service_account.password is defined
      - result.response.ext_id is defined
      - result.ext_id is defined
      - result.response.ext_id == result.ext_id
      - result.response.project_ext_id == "{{ project.uuid }}"
    fail_msg: "Unable to create ACTIVE_DIRECTORY service "
    success_msg: "ACTIVE_DIRECTORY service created successfully  "

- name: Adding directory_service external ID to delete list
  ansible.builtin.set_fact:
    todelete: "{{ result.response.ext_id }}"

########################################################################

- name: Create directory service that already exists
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    name: "{{ directory_service }}"
    url: "{{ active_directory.url }}"
    directory_type: ACTIVE_DIRECTORY
    domain_name: "{{ active_directory.domain_name }}"
    service_account:
      username: "{{ active_directory.username }}"
      password: "{{ active_directory.password }}"
    white_listed_groups:
      - "{{ white_listed_groups[1] }}"
  register: result
  ignore_errors: true

- name: Status of ACTIVE_DIRECTORY service creation
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == true
      - result.response.data.error | length > 0
      - result.status == 409
    fail_msg: "Unable to create ACTIVE_DIRECTORY service "
    success_msg: "ACTIVE_DIRECTORY service created successfully "

########################################################################

- name: Update directory service with all attributes
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    ext_id: "{{ todelete }}"
    name: "{{ directory_service }}"
    url: "{{ active_directory.url }}"
    directory_type: ACTIVE_DIRECTORY
    domain_name: "{{ active_directory.domain_name }}"
    service_account:
      username: "{{ active_directory.username }}"
      password: "{{ active_directory.password }}"
    group_search_type: RECURSIVE
    white_listed_groups:
      - "{{ white_listed_groups[1] }}"
  register: result
  ignore_errors: true

- name: Status of updating ACTIVE_DIRECTORY service with all attributes
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id == "{{ todelete }}"
      - result.response.name == "{{ directory_service }}"
      - result.response.directory_type == "ACTIVE_DIRECTORY"
      - result.response.url == "{{ active_directory.url }}"
      - result.response.service_account.username == "{{ active_directory.username }}"
      - result.response.service_account.password is defined
      - result.response.group_search_type == "RECURSIVE"
      - result.response.white_listed_groups[0] == "{{ white_listed_groups[1] }}"
    fail_msg: Unable to update ACTIVE_DIRECTORY service with all attributes
    success_msg: "ACTIVE_DIRECTORY service with all attributes is updated successfully "

########################################################################

- name: Update group search type and white listed groups in directory service
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    ext_id: "{{ todelete }}"
    service_account:
      username: "{{ active_directory.username }}"
      password: "{{ active_directory.password }}"
    group_search_type: NON_RECURSIVE
    white_listed_groups:
      - "{{ white_listed_groups[0] }}"
  register: result
  ignore_errors: true

- name: Update group search type and white listed groups in directory service status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id == "{{ todelete }}"
      - result.response.group_search_type == "NON_RECURSIVE"
      - result.response.white_listed_groups[0] == "{{ white_listed_groups[0] }}"
    fail_msg: "update group search type and white listed groups in directory service failed "
    success_msg: "update group search type and white listed groups in directory service passed "

########################################################################

- name: Verify if idempotency checks are skipped if password is provided
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    ext_id: "{{ todelete }}"
    name: "{{ directory_service }}"
    url: "{{ active_directory.url }}"
    directory_type: ACTIVE_DIRECTORY
    domain_name: "{{ active_directory.domain_name }}"
    service_account:
      username: "{{ active_directory.username }}"
      password: "{{ active_directory.password }}"
    group_search_type: NON_RECURSIVE
    white_listed_groups:
      - "{{ white_listed_groups[1] }}"
  register: result
  ignore_errors: true

- name: Test idempotency status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.name == "{{ directory_service }}"
      - result.response.directory_type == "ACTIVE_DIRECTORY"
      - result.response.url == "{{ active_directory.url }}"
      - result.response.service_account.username == "{{ active_directory.username }}"
      - result.response.service_account.password is defined
      - result.response.group_search_type == "NON_RECURSIVE"
      - result.response.white_listed_groups[0] == "{{ white_listed_groups[1] }}"
    fail_msg: "Verify if idempotency checks are skipped if password is provided failed "
    success_msg: "Verify if idempotency checks are skipped if password is provided passed "

########################################################################

- name: Verify if module is idempotent if same config is provided
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    ext_id: "{{ todelete }}"
    name: "{{ directory_service }}"
    url: "{{ active_directory.url }}"
    directory_type: ACTIVE_DIRECTORY
    domain_name: "{{ active_directory.domain_name }}"
    service_account:
      username: "{{ active_directory.username }}"
    group_search_type: NON_RECURSIVE
    white_listed_groups:
      - "{{ white_listed_groups[1] }}"
  register: result
  ignore_errors: true

- name: Test idempotency status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.ext_id == "{{ todelete }}"
      - result.msg == "Nothing to change."
    fail_msg: "Verify if module is idempotent if same config is provided failed "
    success_msg: "Verify if module is idempotent if same config is provided passed "

########################################################################

- name: Fetch directory service info using ext id
  nutanix.ncp.ntnx_directory_services_info_v2:
    ext_id: "{{ todelete }}"
  register: result
  ignore_errors: true

- name: Fetch directory service info using ext id status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response.ext_id == "{{ todelete }}"
      - result.response.name == "{{ directory_service }}"
      - result.response.directory_type == "ACTIVE_DIRECTORY"
      - result.response.url == "{{ active_directory.url }}"
      - result.response.domain_name == "{{ active_directory.domain_name }}"
      - result.response.service_account.username == "{{ active_directory.username }}"
      - result.response.service_account.password is defined
      - result.response.group_search_type == "NON_RECURSIVE"
      - result.response.white_listed_groups[0] == "{{ white_listed_groups[1] }}"
    fail_msg: Unable to fetch directory service using ext id
    success_msg: directory service fetched using ext id successfully

########################################################################

- name: List all directory services
  nutanix.ncp.ntnx_directory_services_info_v2:
  register: result
  ignore_errors: true

- name: List all directory services status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response | length > 0
      - result.total_available_results is defined
      - result.total_available_results > 0
    fail_msg: Unable to list all directory services
    success_msg: All directory services listed successfully

########################################################################

- name: List all directory services with filter
  nutanix.ncp.ntnx_directory_services_info_v2:
    filter: name eq '{{ directory_service }}'
  register: result
  ignore_errors: true

- name: List all directory services with filter status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response | length == 1
      - result.response[0].name == "{{ directory_service }}"
    fail_msg: Unable to list all directory services with filter
    success_msg: All directory services listed with filter successfully

########################################################################

- name: List all directory services with limit
  nutanix.ncp.ntnx_directory_services_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: List all directory services with limit status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response | length == 1
    fail_msg: Unable to list all directory services with limit
    success_msg: All directory services listed with limit successfully

########################################################################

- name: Generate spec for verifying directory service connection using check mode
  nutanix.ncp.ntnx_directory_services_connection_v2:
    ext_id: "{{ todelete }}"
    username: "username"
    password: "password"
  register: result
  ignore_errors: true
  check_mode: true

- name: Generate spec for verifying directory service connection using check mode status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.ext_id == "{{ todelete }}"
      - result.response.username == "username"
    fail_msg: Generate spec for verifying directory service connection using check mode failed
    success_msg: Generate spec for verifying directory service connection using check mode passed

########################################################################

- name: Check directory service connection
  nutanix.ncp.ntnx_directory_services_connection_v2:
    ext_id: "{{ todelete }}"
    username: "{{ active_directory.username }}"
    password: "{{ active_directory.password }}"
  register: result
  ignore_errors: true

- name: Status of directory service connection check
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.ext_id == "{{ todelete }}"
      - result.response.message == "Directory Service connection check successful."
    fail_msg: Directory service connection check failed
    success_msg: Directory service connection check passed

########################################################################

- name: Check directory service connection with missing required attributes
  nutanix.ncp.ntnx_directory_services_connection_v2:
    ext_id: "{{ todelete }}"
  register: result
  ignore_errors: true

- name: Status of directory service connection check with missing attributes
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == true
      - '"missing required arguments: password, username" in result.msg'
    fail_msg: Directory service connection check should fail when required attributes are missing
    success_msg: Directory service connection check failed as expected with missing attributes

########################################################################

- name: Check directory service connection with wrong external ID
  nutanix.ncp.ntnx_directory_services_connection_v2:
    ext_id: "54681525-3227-5144-b1b3-155057984061"
    username: "{{ active_directory.username }}"
    password: "{{ active_directory.password }}"
  register: result
  ignore_errors: true

- name: Status of directory service connection check with wrong external ID
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == true
      - result.msg == "Api Exception raised while checking directory service connection"
      - result.response.data.error | length > 0
    fail_msg: Directory service connection check should fail when wrong external ID is provided
    success_msg: Directory service connection check failed as expected with wrong external ID

########################################################################

- name: Check directory service connection with wrong username and password
  nutanix.ncp.ntnx_directory_services_connection_v2:
    ext_id: "{{ todelete }}"
    username: "wrong_username"
    password: "wrong_password"
  register: result
  ignore_errors: true

- name: Status of directory service connection check with wrong username and password
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == true
      - result.msg == "Api Exception raised while checking directory service connection"
      - result.response.data.message == "Directory Service connection check failed."
    fail_msg: Directory service connection check should fail when wrong username and password are provided
    success_msg: Directory service connection check failed as expected with wrong username and password

########################################################################

- name: Delete directory service with check mode enabled
  nutanix.ncp.ntnx_directory_services_v2:
    state: absent
    ext_id: "{{ todelete }}"
  register: result
  ignore_errors: true
  check_mode: true

- name: Delete directory service with check mode status
  ansible.builtin.assert:
    that:
      - result.msg is defined
      - result.changed == false
      - result.failed == false
      - result.ext_id == "{{ todelete }}"
      - result.msg == "Directory service with ext_id:{{ todelete }} will be deleted."
    fail_msg: Delete directory service with check mode failed
    success_msg: Delete directory service with check mode passed

########################################################################

- name: Delete directory service
  nutanix.ncp.ntnx_directory_services_v2:
    state: absent
    ext_id: "{{ todelete }}"
  register: result
  ignore_errors: true

- name: Output of delete directory service
  ansible.builtin.set_fact:
    msg: "Directory Service with ext_id: {{ todelete }} deleted successfully"

- name: Deletion Status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.ext_id == "{{ todelete }}"
      - result.msg == "{{ msg }}"
    fail_msg: Unable to delete directory service
    success_msg: directory service is deleted successfully

- name: Reset todelete list
  ansible.builtin.set_fact:
    todelete: []

########################################################################
# Tests for is_shared_with_all_projects and shared_with_projects
########################################################################

- name: Create ACTIVE_DIRECTORY service with is_shared_with_all_projects
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    name: "{{ directory_service }}_shared"
    url: "{{ active_directory.url }}"
    directory_type: ACTIVE_DIRECTORY
    domain_name: "{{ active_directory.domain_name }}"
    project_ext_id: "00000000-0000-0000-0000-000000000000"
    service_account:
      username: "{{ active_directory.username }}"
      password: "{{ active_directory.password }}"
    is_shared_with_all_projects: true
  register: result
  ignore_errors: true

- name: Status of create with is_shared_with_all_projects
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.name == "{{ directory_service }}_shared"
      - result.response.directory_type == "ACTIVE_DIRECTORY"
      - result.response.url == "{{ active_directory.url }}"
      - result.response.domain_name == "{{ active_directory.domain_name }}"
      - result.response.ext_id is defined
      - result.ext_id is defined
      - result.response.project_ext_id == "00000000-0000-0000-0000-000000000000"
      - result.response.is_shared_with_all_projects == true
      - result.response.service_account.username == "{{ active_directory.username }}"
      - result.response.service_account.password is defined
    fail_msg: "Create directory service with is_shared_with_all_projects failed"
    success_msg: "Created directory service with is_shared_with_all_projects"

- name: Set shared directory service ext_id
  ansible.builtin.set_fact:
    todelete: "{{ result.ext_id }}"

########################################################################
# Scenario: is_shared_with_all_projects is already true -> shared_with_projects
# is ignored (an all-projects share cannot be narrowed to specific projects)
########################################################################
- name: Update directory service with shared_with_projects while already shared with all projects
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    ext_id: "{{ todelete }}"
    service_account:
      username: "{{ active_directory.username }}"
      password: "{{ active_directory.password }}"
    shared_with_projects:
      - "{{ project.uuid }}"
      - "{{ project2.uuid }}"
  register: result
  ignore_errors: true

- name: Status of shared_with_projects being ignored when already shared with all projects
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.failed == false
      # The directory service stays shared with all projects; the requested
      # per-project sharing is ignored, so no specific projects are added.
      - result.response.is_shared_with_all_projects == true
      - (result.response.shared_with_projects | default([], true)) | length == 0
      - project.uuid not in (result.response.shared_with_projects | default([], true))
      - project2.uuid not in (result.response.shared_with_projects | default([], true))
      # The user is warned that their shared_with_projects input was dropped.
      - result.warnings is defined
      - result.warnings | select('search', 'shared_with_projects was ignored') | list | length > 0
    fail_msg: "shared_with_projects should be ignored when directory service is already shared with all projects"
    success_msg: "shared_with_projects correctly ignored when directory service is already shared with all projects"

########################################################################

- name: Update directory service to unshare from all projects
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    ext_id: "{{ todelete }}"
    service_account:
      username: "{{ active_directory.username }}"
      password: "{{ active_directory.password }}"
    is_shared_with_all_projects: false
  register: result
  ignore_errors: true

- name: Status of unshare from all projects
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.ext_id == "{{ todelete }}"
      - result.response.is_shared_with_all_projects == false
      - result.response.service_account.username == "{{ active_directory.username }}"
      - result.response.service_account.password is defined
    fail_msg: "Unshare from all projects failed"
    success_msg: "Unshared from all projects successfully"

########################################################################

- name: Update directory service to share with two specific projects
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    ext_id: "{{ todelete }}"
    service_account:
      username: "{{ active_directory.username }}"
      password: "{{ active_directory.password }}"
    shared_with_projects:
      - "{{ project.uuid }}"
      - "{{ project2.uuid }}"
  register: result
  ignore_errors: true

- name: Status of share with two specific projects
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.shared_with_projects is defined
      - result.response.shared_with_projects | length == 2
      - project.uuid in result.response.shared_with_projects
      - project2.uuid in result.response.shared_with_projects
      - result.response.service_account.username == "{{ active_directory.username }}"
      - result.response.service_account.password is defined
      - result.ext_id is defined
      - result.ext_id == "{{ todelete }}"
    fail_msg: "Share with two specific projects failed"
    success_msg: "Shared with two specific projects successfully"

########################################################################
# Scenario: share with all three projects (add a project)
########################################################################
- name: Update directory service to share with all three projects
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    ext_id: "{{ todelete }}"
    service_account:
      username: "{{ active_directory.username }}"
      password: "{{ active_directory.password }}"
    shared_with_projects:
      - "{{ project.uuid }}"
      - "{{ project2.uuid }}"
      - "{{ project3.uuid }}"
  register: result
  ignore_errors: true

- name: Status of share with all three projects
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.shared_with_projects | length == 3
      - project.uuid in result.response.shared_with_projects
      - project2.uuid in result.response.shared_with_projects
      - project3.uuid in result.response.shared_with_projects
      - result.response.service_account.username == "{{ active_directory.username }}"
      - result.response.service_account.password is defined
      - result.ext_id is defined
      - result.ext_id == "{{ todelete }}"
    fail_msg: "Share with all three projects failed"
    success_msg: "Shared with all three projects successfully"

########################################################################
# Scenario: reconcile shared projects to a subset (drop one, keep two)
########################################################################
- name: Update directory service to reconcile shared projects to a subset
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    ext_id: "{{ todelete }}"
    service_account:
      username: "{{ active_directory.username }}"
