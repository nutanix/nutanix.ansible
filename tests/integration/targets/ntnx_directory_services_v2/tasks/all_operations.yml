      - "{{ project3.uuid }}"
  register: result
  ignore_errors: true

- name: Status of reconcile shared projects to a subset
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.shared_with_projects | length == 2
      - project.uuid not in result.response.shared_with_projects
      - project2.uuid in result.response.shared_with_projects
      - project3.uuid in result.response.shared_with_projects
      - result.response.service_account.username == "{{ active_directory.username }}"
      - result.response.service_account.password is defined
      - result.ext_id is defined
      - result.ext_id == "{{ todelete }}"
    fail_msg: "Reconcile shared projects to a subset failed"
    success_msg: "Reconciled shared projects to a subset successfully"

########################################################################
# Scenario: unshare from all specific projects
########################################################################
- name: Update directory service to unshare from all specific projects
  nutanix.ncp.ntnx_directory_services_v2:
    state: present
    ext_id: "{{ todelete }}"
    service_account:
