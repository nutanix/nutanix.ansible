---
- name: Start ntnx_system_defined_policies_info_v2 tests
  ansible.builtin.debug:
    msg: "Starting ntnx_system_defined_policies_info_v2 tests"

- name: List all system defined policies
  nutanix.ncp.ntnx_system_defined_policies_info_v2:
  register: result
  ignore_errors: true

- name: Verify list all policies
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.total_available_results is defined
    fail_msg: "Failed to list system defined policies"
    success_msg: "Listed system defined policies successfully"

- name: List with fetch_all
  nutanix.ncp.ntnx_system_defined_policies_info_v2:
    fetch_all: true
  register: fetch_all_result
  ignore_errors: true

- name: Verify fetch_all
  ansible.builtin.assert:
    that:
      - fetch_all_result.changed == false
      - fetch_all_result.failed == false
      - fetch_all_result.response is defined
      - fetch_all_result.total_available_results is defined
    fail_msg: "fetch_all failed"
    success_msg: "fetch_all passed"

- name: List with limit
  nutanix.ncp.ntnx_system_defined_policies_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: Verify list with limit
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
    fail_msg: "List with limit failed"
    success_msg: "List with limit passed"

- name: List with filter
  nutanix.ncp.ntnx_system_defined_policies_info_v2:
    filter: "name eq 'AHV Crash File Check'"
  register: result
  ignore_errors: true

- name: Verify list with filter
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
    fail_msg: "List with filter failed"
    success_msg: "List with filter passed"

- name: Fetch policies to get ext_id
  nutanix.ncp.ntnx_system_defined_policies_info_v2:
    limit: 1
  register: list_one
  ignore_errors: true

- name: Set policy ext_id
  ansible.builtin.set_fact:
    sda_policy_ext_id: "{{ list_one.response[0].ext_id }}"
  when:
    - list_one.response is defined
    - list_one.response | length > 0
    - list_one.response[0].ext_id is defined

- name: Get policy by ext_id
  nutanix.ncp.ntnx_system_defined_policies_info_v2:
    ext_id: "{{ sda_policy_ext_id }}"
  register: result
  ignore_errors: true
  when: sda_policy_ext_id is defined

- name: Verify get by ext_id
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.ext_id == sda_policy_ext_id
    fail_msg: "Get by ext_id failed"
    success_msg: "Get by ext_id passed"
  when: sda_policy_ext_id is defined

- name: List cluster configs for policy
  nutanix.ncp.ntnx_system_defined_policy_cluster_configs_info_v2:
    system_defined_policy_ext_id: "{{ sda_policy_ext_id }}"
  register: result
  ignore_errors: true
  when: sda_policy_ext_id is defined

- name: Verify list cluster configs
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
    fail_msg: "List cluster configs failed"
    success_msg: "List cluster configs passed"
  when: sda_policy_ext_id is defined

- name: List cluster configs with fetch_all
  nutanix.ncp.ntnx_system_defined_policy_cluster_configs_info_v2:
    system_defined_policy_ext_id: "{{ sda_policy_ext_id }}"
    fetch_all: true
  register: result
  ignore_errors: true
  when: sda_policy_ext_id is defined

- name: Verify fetch_all cluster configs
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
    fail_msg: "fetch_all cluster configs failed"
    success_msg: "fetch_all cluster configs passed"
  when: sda_policy_ext_id is defined

- name: List cluster configs with limit
  nutanix.ncp.ntnx_system_defined_policy_cluster_configs_info_v2:
    system_defined_policy_ext_id: "{{ sda_policy_ext_id }}"
    limit: 1
  register: result
  ignore_errors: true
  when: sda_policy_ext_id is defined

- name: Verify list cluster configs with limit
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
    fail_msg: "List cluster configs with limit failed"
    success_msg: "List cluster configs with limit passed"
  when: sda_policy_ext_id is defined

- name: Invalid ext_id for policy
  nutanix.ncp.ntnx_system_defined_policies_info_v2:
    ext_id: "00000000-0000-0000-0000-000000000000"
  register: result
  ignore_errors: true

- name: Verify invalid ext_id fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Invalid ext_id should fail"
    success_msg: "Invalid ext_id correctly failed"

- name: Invalid filter
  nutanix.ncp.ntnx_system_defined_policies_info_v2:
    filter: "invalidField eq 'test'"
  register: result
  ignore_errors: true

- name: Verify invalid filter fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Invalid filter should fail"
    success_msg: "Invalid filter correctly failed"
