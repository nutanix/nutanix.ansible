---
- name: Start unshare NIC profile tests
  ansible.builtin.debug:
    msg: "Start unshare NIC profile tests"

- name: Generate random names
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"
    suffix_name: "ansible"
    wrong_ext_id: "00000000-0000-0000-0000-000000000000"
    invalid_project_id: "11111111-1111-1111-1111-111111111111"

- name: Set NIC profile name
  ansible.builtin.set_fact:
    nic_profile_name: "nic_unshare_{{ suffix_name }}_{{ random_name }}"

- name: Fetch hosts in cluster
  nutanix.ncp.ntnx_hosts_info_v2:
    cluster_ext_id: "{{ cluster.uuid }}"
  register: hosts_info
  ignore_errors: true

- name: Verify hosts fetch
  ansible.builtin.assert:
    that:
      - hosts_info is defined
      - hosts_info.failed == false
      - hosts_info.response is defined
      - hosts_info.response | length > 0
    success_msg: "Hosts fetched successfully"
    fail_msg: "Unable to fetch hosts"

- name: Set host ext_id
  ansible.builtin.set_fact:
    host_ext_id: "{{ hosts_info.response[0].ext_id }}"

- name: Fetch host NICs for NIC family
  nutanix.ncp.ntnx_cluster_host_nics_info_v2:
    cluster_ext_id: "{{ cluster.uuid }}"
    host_ext_id: "{{ host_ext_id }}"
  register: host_nics_info
  ignore_errors: true

- name: Set NIC family
  ansible.builtin.set_fact:
    sriov_nics: "{{ host_nics_info.response | selectattr('supported_capabilities', 'defined') | selectattr('supported_capabilities', 'contains', 'SRIOV') | list }}"
  when: host_nics_info.response is defined

- name: Set target NIC family when SRIOV available
  ansible.builtin.set_fact:
    target_nic_family: "{{ sriov_nics[0].pci_model_id }}"
    target_capability: "SRIOV"
  when: sriov_nics is defined and sriov_nics | length > 0

- name: Set target NIC family fallback
  ansible.builtin.set_fact:
    target_nic_family: "15b3:101d"
    target_capability: "SRIOV"
  when: sriov_nics is not defined or sriov_nics | length == 0

- name: Discover valid project for sharing
  nutanix.ncp.ntnx_projects_info_v2:
  register: projects_info
  ignore_errors: true

- name: Set project ext_id from discovered projects
  ansible.builtin.set_fact:
    project_id: "{{ projects_info.response | selectattr('is_default', 'equalto', false) | map(attribute='ext_id') | first | default(project.uuid) if projects_info.response is defined and projects_info.response | length > 0 else project.uuid }}"

- name: Create NIC profile for unshare tests
  nutanix.ncp.ntnx_nic_profiles_v2:
    name: "{{ nic_profile_name }}"
    description: "NIC profile for unshare tests"
    capability_config:
      capability_type: "{{ target_capability }}"
    nic_family: "{{ target_nic_family }}"
  register: nic_profile_result
  ignore_errors: true

- name: Verify NIC profile creation
  ansible.builtin.assert:
    that:
      - nic_profile_result is defined
      - nic_profile_result.changed == true
      - nic_profile_result.failed == false
      - nic_profile_result.response.ext_id is defined
    success_msg: "NIC profile created successfully"
    fail_msg: "Unable to create NIC profile"

- name: Set NIC profile ext_id
  ansible.builtin.set_fact:
    nic_profile_ext_id: "{{ nic_profile_result.response.ext_id }}"

- name: Share NIC profile as setup for unshare test
  nutanix.ncp.ntnx_share_nic_profile_by_id_v2:
    ext_id: "{{ nic_profile_ext_id }}"
    project_ext_id: "{{ project_id }}"
  register: share_result
  ignore_errors: true

- name: Verify share setup
  ansible.builtin.assert:
    that:
      - share_result is defined
      - share_result.changed == true
      - share_result.failed == false
    success_msg: "Share setup passed"
    fail_msg: "Share setup failed"

- name: Unshare NIC profile with check mode
  nutanix.ncp.ntnx_unshare_nic_profile_by_id_v2:
    ext_id: "11111111-1111-1111-1111-111111111111"
    project_ext_id: "22222222-2222-2222-2222-222222222222"
  register: result
  check_mode: true
  ignore_errors: true

- name: Unshare check mode status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.project_ext_id == "22222222-2222-2222-2222-222222222222"
    success_msg: "Unshare check mode passed"
    fail_msg: "Unshare check mode failed"

- name: Unshare NIC profile from project
  nutanix.ncp.ntnx_unshare_nic_profile_by_id_v2:
    ext_id: "{{ nic_profile_ext_id }}"
    project_ext_id: "{{ project_id }}"
  register: result
  ignore_errors: true

- name: Unshare status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.task_ext_id is defined
      - result.ext_id == nic_profile_ext_id
    success_msg: "Unshare NIC profile passed"
    fail_msg: "Unshare NIC profile failed"

- name: Fetch unshared NIC profile
  nutanix.ncp.ntnx_nic_profiles_info_v2:
    ext_id: "{{ nic_profile_ext_id }}"
  register: fetch_result
  ignore_errors: true

- name: Fetch unshared status
  ansible.builtin.assert:
    that:
      - fetch_result is defined
      - fetch_result.failed == false
      - fetch_result.response is defined
      - project_id not in (fetch_result.response.shared_with_projects | default([]))
    success_msg: "Unshared verification passed"
    fail_msg: "Unshared verification failed"

- name: Unshare with missing ext_id
  nutanix.ncp.ntnx_unshare_nic_profile_by_id_v2:
    project_ext_id: "{{ project_id }}"
  register: result
  ignore_errors: true

- name: Missing ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    success_msg: "Missing ext_id correctly failed"
    fail_msg: "Missing ext_id did not fail"

- name: Unshare with missing project_ext_id
  nutanix.ncp.ntnx_unshare_nic_profile_by_id_v2:
    ext_id: "{{ nic_profile_ext_id }}"
  register: result
  ignore_errors: true

- name: Missing project_ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    success_msg: "Missing project_ext_id correctly failed"
    fail_msg: "Missing project_ext_id did not fail"

- name: Unshare with invalid ext_id
  nutanix.ncp.ntnx_unshare_nic_profile_by_id_v2:
    ext_id: "{{ wrong_ext_id }}"
    project_ext_id: "{{ project_id }}"
  register: result
  ignore_errors: true

- name: Invalid ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    success_msg: "Invalid ext_id correctly failed"
    fail_msg: "Invalid ext_id did not fail"

- name: Delete NIC profile after unshare test
  nutanix.ncp.ntnx_nic_profiles_v2:
    state: absent
    ext_id: "{{ nic_profile_ext_id }}"
  register: delete_result
  ignore_errors: true

- name: Verify NIC profile deletion
  ansible.builtin.assert:
    that:
      - delete_result is defined
      - delete_result.changed == true
      - delete_result.failed == false
    success_msg: "NIC profile deleted successfully"
    fail_msg: "Unable to delete NIC profile"
