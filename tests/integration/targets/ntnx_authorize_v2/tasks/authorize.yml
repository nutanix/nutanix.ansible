---
- name: Start testing ntnx_authorize_v2
  ansible.builtin.debug:
    msg: Start testing ntnx_authorize_v2

- name: Generate random string for request id
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=8)[0] }}"

- name: Set request ids
  ansible.builtin.set_fact:
    req_id_1: "req-{{ random_name }}-1"
    req_id_2: "req-{{ random_name }}-2"

# Fetch a valid user to use as identity
- name: List users to get valid user UUID
  nutanix.ncp.ntnx_users_info_v2:
    limit: 1
  register: users_list
  ignore_errors: true

- name: Set user fact if available
  ansible.builtin.set_fact:
    test_user_uuid: "{{ users_list.response[0].ext_id }}"
  when: users_list.response is defined and users_list.response | length > 0

- name: Set fallback user uuid if list failed
  ansible.builtin.set_fact:
    test_user_uuid: "00000000-0000-0000-0000-000000000001"
  when: test_user_uuid is not defined

# Check mode test - single file, inline dummy values
- name: Authorize with check mode enabled
  nutanix.ncp.ntnx_authorize_v2:
    state: present
    identity:
      identity_type: User
      attributes:
        user_uuid: "83083083-0000-0000-0000-000000000001"
    request_list:
      - request_id: "req-check-mode-1"
        response_type: BooleanResponse
        entity:
          type: "vm"
          operation: "view"
          attributes:
            cluster_uuid: "83083083-0000-0000-0000-000000000002"
  register: result
  check_mode: true
  ignore_errors: true

- name: Authorize with check mode enabled status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.request_list is defined
      - result.response.request_list[0].request_id == "req-check-mode-1"
      - result.response.request_list[0].entity.type == "vm"
      - result.response.request_list[0].entity.operation == "view"
    fail_msg: Authorize check mode failed
    success_msg: Authorize check mode passed

# Test with required fields only - minimal (tolerant for mTLS-only endpoint)
- name: Authorize with minimal fields
  nutanix.ncp.ntnx_authorize_v2:
    state: present
    request_list:
      - request_id: "{{ req_id_1 }}"
        entity:
          type: "vm"
          operation: "view"
  register: result
  ignore_errors: true

- name: Authorize with minimal fields status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed is defined
      - (result.failed == false and result.changed == true and result.response is defined) or (result.failed == true and result.msg is defined)
    fail_msg: Authorize minimal handling failed
    success_msg: Authorize minimal handled

# Test with all fields populated (tolerant)
- name: Authorize with all fields
  nutanix.ncp.ntnx_authorize_v2:
    state: present
    identity:
      identity_type: User
      attributes:
        user_uuid: "{{ test_user_uuid }}"
    request_list:
      - request_id: "{{ req_id_1 }}"
        response_type: BooleanResponse
        entity:
          type: "vm"
          operation: "view"
          attributes:
            cluster_uuid: "00000000-0000-0000-0000-000000000002"
            name: "test-vm"
      - request_id: "{{ req_id_2 }}"
        response_type: FilterResponse
        entity:
          type: "image"
          operation: "create"
  register: result
  ignore_errors: true

- name: Authorize with all fields status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed is defined
      - (result.failed == false and result.changed == true and result.response is defined) or (result.failed == true and result.msg is defined)
    fail_msg: Authorize with all fields handling failed
    success_msg: Authorize with all fields handled

# Test with user_token (tolerant)
- name: Authorize using user token
  nutanix.ncp.ntnx_authorize_v2:
    state: present
    user_token: "eyJhbGciOiJSUzI1NiJ9.dummy.token"
    request_list:
      - request_id: "{{ req_id_1 }}"
        response_type: BooleanResponse
        entity:
          type: "vm"
          operation: "delete"
  register: result
  ignore_errors: true

- name: Authorize using user token status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed is defined
      - (result.failed == false and result.changed == true and result.response is defined) or (result.failed == true and result.msg is defined)
    fail_msg: Authorize with user token handling failed
    success_msg: Authorize with user token handled

