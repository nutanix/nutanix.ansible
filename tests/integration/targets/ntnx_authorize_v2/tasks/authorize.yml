    success_msg: Authorize with project header handled

# Test response fields validation - check every spec attribute (tolerant)
- name: Authorize and validate response structure
  nutanix.ncp.ntnx_authorize_v2:
    state: present
    identity:
      identity_type: User
      attributes:
        user_uuid: "{{ test_user_uuid }}"
        extra_attr: "extra_value"
    request_list:
      - request_id: "{{ req_id_1 }}"
        response_type: BooleanResponse
        entity:
          type: "category"
          operation: "create"
          attributes:
            name: "test-category"
  register: result
  ignore_errors: true

- name: Validate response structure
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed is defined
      - (result.failed == false and result.changed == true and result.response is defined) or (result.failed == true and result.msg is defined)
    fail_msg: Response structure validation handling failed
    success_msg: Response structure validation handled

# Negative - missing required field request_list
- name: Authorize missing required request_list
  nutanix.ncp.ntnx_authorize_v2:
    state: present
    identity:
      identity_type: User
      attributes:
        user_uuid: "{{ test_user_uuid }}"
  register: result
  ignore_errors: true

- name: Missing required field status
  ansible.builtin.assert:
    that:
      - result.failed == true
    fail_msg: Should have failed for missing request_list
    success_msg: Correctly failed for missing request_list

