---
- name: Start testing ntnx_template_placement_policies_v2
  ansible.builtin.debug:
    msg: Start testing ntnx_template_placement_policies_v2

- name: Generate random name
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"

- name: Set policy name prefix
  ansible.builtin.set_fact:
    policy_name: "ansible_test_tpp_{{ random_name }}"

- name: List all categories and choose the first five
  nutanix.ncp.ntnx_categories_info_v2:
  register: result
  ignore_errors: true

- name: Print categories result
  ansible.builtin.debug:
    var: result

- name: Status of all categories
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length >= 5
    fail_msg: "Unable to list categories"
    success_msg: "Categories listed successfully"

- name: Set category ext_ids
  ansible.builtin.set_fact:
    category_ext_ids: '{{ (result["response"] | map(attribute="ext_id") | list)[:5] }}'

##################################################################################
# Create tests
##################################################################################

- name: Generate spec for creating template placement policy using check mode
  nutanix.ncp.ntnx_template_placement_policy_v2:
    state: present
    name: "ansible_test_tpp_1"
    description: "ansible_test_tpp_1_description"
    placement_type: SOFT
    content_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "d596161e-1622-495f-805a-b86865559663"
    cluster_filter:
      type: CATEGORIES_MATCH_ANY
      category_ext_ids:
        - "d596161e-1622-495f-805a-b86865559664"
  register: result
  ignore_errors: true
  check_mode: true

- name: Print create check mode result
  ansible.builtin.debug:
    var: result

- name: Generate spec for creating template placement policy using check mode status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response.name == "ansible_test_tpp_1"
      - result.response.description == "ansible_test_tpp_1_description"
      - result.response.placement_type == "SOFT"
      - result.response.content_filter.type == "CATEGORIES_MATCH_ALL"
      - result.response.content_filter.category_ext_ids[0] == "d596161e-1622-495f-805a-b86865559663"
      - result.response.cluster_filter.type == "CATEGORIES_MATCH_ANY"
      - result.response.cluster_filter.category_ext_ids[0] == "d596161e-1622-495f-805a-b86865559664"
    fail_msg: "Failed to generate spec for creating template placement policy using check mode"
    success_msg: "Generated spec for creating template placement policy using check mode passed"

###########################################################################################

- name: Create a template placement policy with all attributes
  nutanix.ncp.ntnx_template_placement_policy_v2:
    state: present
    name: "{{ policy_name }}1"
    description: "{{ policy_name }}1_description"
    placement_type: SOFT
    content_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "{{ category_ext_ids[0] }}"
    cluster_filter:
      type: CATEGORIES_MATCH_ANY
      category_ext_ids:
        - "{{ category_ext_ids[1] }}"
  register: result
  ignore_errors: true

- name: Print create with all attributes result
  ansible.builtin.debug:
    var: result

- name: Create template placement policy with all attributes status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.task_ext_id is defined
      - result.response is defined
      - result.response.name == "{{ policy_name }}1"
      - result.response.description == "{{ policy_name }}1_description"
      - result.response.placement_type == "SOFT"
      - result.response.content_filter.type == "CATEGORIES_MATCH_ALL"
      - result.response.content_filter.category_ext_ids[0] == "{{ category_ext_ids[0] }}"
      - result.response.cluster_filter.type == "CATEGORIES_MATCH_ANY"
      - result.response.cluster_filter.category_ext_ids[0] == "{{ category_ext_ids[1] }}"
    fail_msg: "Failed to create template placement policy with all attributes"
    success_msg: "Created template placement policy with all attributes passed"

- name: Set template policy ext_id
  ansible.builtin.set_fact:
    template_policy_ext_id: "{{ result['ext_id'] }}"

###########################################################################################

- name: Create a template placement policy with missing name (should fail)
  nutanix.ncp.ntnx_template_placement_policy_v2:
    state: present
    description: "policy without name"
    placement_type: SOFT
    content_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "{{ category_ext_ids[0] }}"
    cluster_filter:
      type: CATEGORIES_MATCH_ANY
      category_ext_ids:
        - "{{ category_ext_ids[1] }}"
  register: result
  ignore_errors: true

- name: Print create with missing name result
  ansible.builtin.debug:
    var: result

- name: Create with missing name status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "state is present but any of the following are missing: name, ext_id"
    fail_msg: "Create template placement policy with missing name did not fail as expected"
    success_msg: "Create template placement policy with missing name failed as expected"

##########################################################################################
# Update tests
##########################################################################################

- name: Generate spec for updating template placement policy using check mode
  nutanix.ncp.ntnx_template_placement_policy_v2:
    state: present
    ext_id: "{{ template_policy_ext_id }}"
    name: "ansible_test_tpp_updated"
    description: "ansible_test_tpp_updated_description"
    placement_type: SOFT
    content_filter:
      type: CATEGORIES_MATCH_ANY
      category_ext_ids:
        - "d896161e-1622-495f-805a-b86865559663"
    cluster_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "d896161e-1622-495f-805a-b86865559664"
  register: result
  ignore_errors: true
  check_mode: true

- name: Print update check mode result
  ansible.builtin.debug:
    var: result

- name: Generate spec for updating template placement policy using check mode status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.name == "ansible_test_tpp_updated"
      - result.response.description == "ansible_test_tpp_updated_description"
      - result.response.placement_type == "SOFT"
      - result.response.content_filter.type == "CATEGORIES_MATCH_ANY"
      - result.response.content_filter.category_ext_ids[0] == "d896161e-1622-495f-805a-b86865559663"
      - result.response.cluster_filter.type == "CATEGORIES_MATCH_ALL"
      - result.response.cluster_filter.category_ext_ids[0] == "d896161e-1622-495f-805a-b86865559664"
    fail_msg: "Failed to generate spec for updating template placement policy using check mode"
    success_msg: "Generated spec for updating template placement policy using check mode passed"

##########################################################################################

- name: Update an existing template placement policy
  nutanix.ncp.ntnx_template_placement_policy_v2:
    state: present
    ext_id: "{{ template_policy_ext_id }}"
    name: "{{ policy_name }}_updated"
    description: "{{ policy_name }}_updated_description"
    placement_type: SOFT
    content_filter:
      type: CATEGORIES_MATCH_ANY
      category_ext_ids:
        - "{{ category_ext_ids[2] }}"
    cluster_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "{{ category_ext_ids[3] }}"
        - "{{ category_ext_ids[4] }}"
  register: result
  ignore_errors: true

- name: Print update result
  ansible.builtin.debug:
    var: result

- name: Update template placement policy with all attributes status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.ext_id == "{{ template_policy_ext_id }}"
      - result.response.name == "{{ policy_name }}_updated"
      - result.response.description == "{{ policy_name }}_updated_description"
      - result.response.placement_type == "SOFT"
      - result.response.content_filter.type == "CATEGORIES_MATCH_ANY"
      - result.response.content_filter.category_ext_ids[0] == "{{ category_ext_ids[2] }}"
      - result.response.cluster_filter.type == "CATEGORIES_MATCH_ALL"
      - result.response.cluster_filter.category_ext_ids[0] == "{{ category_ext_ids[3] }}"
      - result.response.cluster_filter.category_ext_ids[1] == "{{ category_ext_ids[4] }}"
    fail_msg: "Failed to update template placement policy with all attributes"
    success_msg: "Updated template placement policy with all attributes passed"

###########################################################################################

- name: Check for idempotency by updating the same policy with the same values
  nutanix.ncp.ntnx_template_placement_policy_v2:
    state: present
    ext_id: "{{ template_policy_ext_id }}"
    name: "{{ policy_name }}_updated"
    description: "{{ policy_name }}_updated_description"
    placement_type: SOFT
    content_filter:
      type: CATEGORIES_MATCH_ANY
      category_ext_ids:
        - "{{ category_ext_ids[2] }}"
    cluster_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "{{ category_ext_ids[3] }}"
        - "{{ category_ext_ids[4] }}"
  register: result
  ignore_errors: true

- name: Print idempotency result
  ansible.builtin.debug:
    var: result

- name: Check for idempotency by updating the same policy status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.skipped == true
      - result.msg == "Nothing to change."
    fail_msg: "Failed to check for idempotency by updating the same policy"
    success_msg: "Check for idempotency by updating the same policy passed"

###########################################################################################

- name: Update a template placement policy that does not exist (should fail)
  nutanix.ncp.ntnx_template_placement_policy_v2:
    state: present
    ext_id: "00000000-0000-0000-0000-000000000000"
    name: "non_existent_policy"
    description: "non_existent_policy_description"
    placement_type: SOFT
    content_filter:
      type: CATEGORIES_MATCH_ANY
      category_ext_ids:
        - "{{ category_ext_ids[2] }}"
    cluster_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "{{ category_ext_ids[3] }}"
        - "{{ category_ext_ids[4] }}"
  register: result
  ignore_errors: true

- name: Print update non-existent policy result
  ansible.builtin.debug:
    var: result

- name: Update non-existent policy status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.error == "NOT FOUND"
      - result.status == 404
      - result.msg == "Api Exception raised while fetching template placement policy info using ext_id"
      - result.response.data.error
    fail_msg: "Update non-existent template placement policy did not fail as expected"
    success_msg: "Update non-existent template placement policy failed as expected"

###############################################################################
# Info module tests
###############################################################################

- name: Get an existing template placement policy by ext_id
  nutanix.ncp.ntnx_template_placement_policies_info_v2:
    ext_id: "{{ template_policy_ext_id }}"
  register: result
  ignore_errors: true

- name: Print get by ext_id result
  ansible.builtin.debug:
    var: result

- name: Get an existing template placement policy by ext_id status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.ext_id == "{{ template_policy_ext_id }}"
      - result.response.ext_id == "{{ template_policy_ext_id }}"
      - result.response.name == "{{ policy_name }}_updated"
      - result.response.description == "{{ policy_name }}_updated_description"
      - result.response.placement_type == "SOFT"
      - result.response.content_filter.type == "CATEGORIES_MATCH_ANY"
      - result.response.content_filter.category_ext_ids[0] == "{{ category_ext_ids[2] }}"
      - result.response.cluster_filter.type == "CATEGORIES_MATCH_ALL"
      - result.response.cluster_filter.category_ext_ids[0] == "{{ category_ext_ids[3] }}"
      - result.response.cluster_filter.category_ext_ids[1] == "{{ category_ext_ids[4] }}"
    fail_msg: "Failed to get an existing template placement policy by ext_id"
    success_msg: "Get an existing template placement policy by ext_id passed"

################################################################################

- name: Get template placement policy with invalid ext_id (should fail)
  nutanix.ncp.ntnx_template_placement_policies_info_v2:
    ext_id: "00000000-0000-0000-0000-000000000000"
  register: result
  ignore_errors: true

- name: Print get with invalid ext_id result
  ansible.builtin.debug:
    var: result

- name: Get with invalid ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.error == "NOT FOUND"
      - result.status == 404
      - result.msg == "Api Exception raised while fetching template placement policy info using ext_id"
      - result.response.data.error is defined
      - result.response.data.error | length > 0
    fail_msg: "Failed to get template placement policy with invalid ext_id"
    success_msg: "Get template placement policy with invalid ext_id passed"

################################################################################

- name: Retrieve all template placement policies
  nutanix.ncp.ntnx_template_placement_policies_info_v2:
  register: result
  ignore_errors: true

- name: Print list all result
  ansible.builtin.debug:
    var: result

- name: List all template placement policies status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response | length > 0
      - result.total_available_results is defined
      - result.total_available_results > 0
    fail_msg: "Failed to list all template placement policies"
    success_msg: "List all template placement policies passed"

################################################################################

- name: Retrieve all template placement policies and filter by name
  nutanix.ncp.ntnx_template_placement_policies_info_v2:
    filter: "name eq '{{ policy_name }}_updated'"
  register: result
  ignore_errors: true

- name: Print list with filter result
  ansible.builtin.debug:
    var: result

- name: List with filter status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response | length == 1
      - result.response[0].name == "{{ policy_name }}_updated"
      - result.response[0].ext_id == "{{ template_policy_ext_id }}"
      - result.response[0].description == "{{ policy_name }}_updated_description"
      - result.response[0].placement_type == "SOFT"
      - result.response[0].content_filter.type == "CATEGORIES_MATCH_ANY"
      - result.response[0].content_filter.category_ext_ids[0] == "{{ category_ext_ids[2] }}"
      - result.response[0].cluster_filter.type == "CATEGORIES_MATCH_ALL"
      - result.response[0].cluster_filter.category_ext_ids[0] == "{{ category_ext_ids[3] }}"
      - result.response[0].cluster_filter.category_ext_ids[1] == "{{ category_ext_ids[4] }}"
    fail_msg: "Failed to list all template placement policies with filter"
    success_msg: "List all template placement policies with filter passed"

################################################################################

- name: List all template placement policies with limit 1
  nutanix.ncp.ntnx_template_placement_policies_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: Print list with limit 1 result
  ansible.builtin.debug:
    var: result

- name: List with limit 1 status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response | length == 1
    fail_msg: "Failed to list all template placement policies with limit 1"
    success_msg: "List all template placement policies with limit 1 passed"

################################################################################
# Delete tests
################################################################################

- name: Delete a template placement policy with check mode enabled
  nutanix.ncp.ntnx_template_placement_policy_v2:
    state: absent
    ext_id: "{{ template_policy_ext_id }}"
  register: result
  ignore_errors: true
  check_mode: true

- name: Print delete check mode result
  ansible.builtin.debug:
    var: result

- name: Delete with check mode status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.ext_id == "{{ template_policy_ext_id }}"
      - result.msg is defined
      - result.msg == "Policy with ext_id:{{ template_policy_ext_id }} will be deleted."
    fail_msg: "Failed to delete template placement policy with check mode enabled"
    success_msg: "Delete with check mode passed"

################################################################################

- name: Delete a template placement policy that does not exist (should fail)
  nutanix.ncp.ntnx_template_placement_policy_v2:
    state: absent
    ext_id: "00000000-0000-0000-0000-000000000000"
  register: result
  ignore_errors: true

- name: Print delete non-existent policy result
  ansible.builtin.debug:
    var: result

- name: Delete non-existent policy status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.error == "NOT FOUND"
      - result.status == 404
      - result.msg == "Api Exception raised while deleting Template Placement Policy"
      - result.response.data.error is defined
      - result.response.data.error | length > 0
    fail_msg: "Failed to delete non-existent template placement policy"
    success_msg: "Delete non-existent template placement policy passed"

################################################################################

- name: Delete a template placement policy with missing ext_id (should fail)
  nutanix.ncp.ntnx_template_placement_policy_v2:
    state: absent
  register: result
  ignore_errors: true

- name: Print delete with missing ext_id result
  ansible.builtin.debug:
    var: result

- name: Delete with missing ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - "'state is absent but all of the following are missing: ext_id' in result.msg"
    fail_msg: "Failed to delete template placement policy with missing ext_id"
    success_msg: "Delete with missing ext_id passed"

################################################################################

- name: Delete a template placement policy
  nutanix.ncp.ntnx_template_placement_policy_v2:
    state: absent
    ext_id: "{{ template_policy_ext_id }}"
  register: result
  ignore_errors: true

- name: Print delete result
  ansible.builtin.debug:
    var: result

- name: Delete template placement policy status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.ext_id == "{{ template_policy_ext_id }}"
      - result.response is defined
      - result.response.status == 'SUCCEEDED'
    fail_msg: "Failed to delete template placement policy"
    success_msg: "Delete template placement policy passed"
