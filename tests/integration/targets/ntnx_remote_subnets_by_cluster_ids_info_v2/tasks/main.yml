---
- name: Set module defaults for RemoteSubnetsByClusterId info tests
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip }}"
      nutanix_username: "{{ username | default(omit) }}"
      nutanix_password: "{{ password | default(omit) }}"
      nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
      validate_certs: "{{ validate_certs }}"
      nutanix_debug: "{{ nutanix_debug | default(omit) }}"
      nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
      # remote-subnets backend can take >30s (NETWORKING-10055 timing);
      # give the SDK 120s so real API errors surface as clean 5xx responses
      # instead of urllib3 ReadTimeoutErrors.
      read_timeout: 120000
  block:
    - name: Import remote_subnets_by_cluster_ids_info.yml
      ansible.builtin.import_tasks: remote_subnets_by_cluster_ids_info.yml
