---
# Integration tests for ntnx_seed_config_v2
# QA engineer coverage: check_mode, required fields, enums, invalid refs, live action

- name: Start testing ntnx_seed_config_v2 module
  ansible.builtin.debug:
    msg: Start testing ntnx_seed_config_v2 module

# Check mode with all required fields including nested config_list
- name: Seed entity config with check_mode enabled
  nutanix.ncp.ntnx_seed_config_v2:
    config_type: ENTITY
    client_name: test_client_check_mode
    operation_type: CREATE
    config_list:
      entity_list:
        entities:
          - name: test_entity_check_mode
            display_name: Test Entity Check Mode
            client_name: test_client_check_mode
  register: result
  check_mode: true
  ignore_errors: true

- name: Assert seed check_mode success
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.config_type == "ENTITY"
      - result.response.client_name == "test_client_check_mode"
    fail_msg: Seed check_mode failed
    success_msg: Seed check_mode passed

# Negative - missing required config_type
- name: Seed config missing config_type
  nutanix.ncp.ntnx_seed_config_v2:
    client_name: test_client
    operation_type: CREATE
    config_list:
      entity_list:
        entities:
          - name: test
  register: result
  ignore_errors: true

- name: Assert missing config_type fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
      - result.msg is defined
      - "'config_type' in (result.msg | string)"
    fail_msg: Missing config_type not rejected
    success_msg: Missing config_type correctly rejected

# Missing client_name
- name: Seed config missing client_name
  nutanix.ncp.ntnx_seed_config_v2:
    config_type: ENTITY
    operation_type: CREATE
    config_list:
      entity_list:
        entities:
          - name: test
  register: result
  ignore_errors: true

- name: Assert missing client_name fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: Missing client_name not rejected
    success_msg: Missing client_name correctly rejected

