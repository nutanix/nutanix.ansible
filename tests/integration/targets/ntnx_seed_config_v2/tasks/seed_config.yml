# Live test - seed entity with minimal fields
- name: Seed entity configuration live
  nutanix.ncp.ntnx_seed_config_v2:
    config_type: ENTITY
    client_name: ansible_test_client_seed
    operation_type: CREATE
    config_list:
      entity_list:
        entities:
          - name: ansible_test_entity_seed
            display_name: Ansible Test Entity Seed
            description: Created via Ansible integration test
            client_name: ansible_test_client_seed
            is_internal: false
  register: result
  ignore_errors: true

- name: Assert seed entity live
  ansible.builtin.assert:
    that:
      - result.failed == false or (result.failed == true and result.error is defined and result.error == "FORBIDDEN")
      - result.response is defined or (result.failed == true and result.msg is defined)
    fail_msg: Seed entity live failed
    success_msg: Seed entity live passed

# Live with all fields for entity
- name: Seed entity with all fields
  nutanix.ncp.ntnx_seed_config_v2:
    config_type: ENTITY
    client_name: ansible_test_client_seed
    operation_type: CREATE
    tenant_id: "00000000-0000-0000-0000-000000000000"
    config_list:
      entity_list:
        entities:
          - legacy_object_list:
              - legacy_entity_old
            is_internal: false
            name: ansible_test_entity_full
            description: Full entity test via Ansible
            display_name: Ansible Full Entity
            client_name: ansible_test_client_seed
            search_url: /api/test/search
            attribute_list:
              - display_name: Test Attr
                name: test_attr
                search_endpoint: /api/test
                version: v1
                search_field: name
                operator: eq
                id_field: extId
            is_logical_and_supported_for_attributes: true
            products:
              - PC
  register: result
  ignore_errors: true

- name: Assert seed entity full
  ansible.builtin.assert:
    that:
      - result.failed == false or (result.failed == true and result.error == "FORBIDDEN")
      - result.response is defined or result.failed == true
    fail_msg: Seed entity full failed
    success_msg: Seed entity full passed

