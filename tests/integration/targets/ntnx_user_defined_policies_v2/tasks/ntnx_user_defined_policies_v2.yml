---
- name: Start ntnx_user_defined_policies_v2 tests
  ansible.builtin.debug:
    msg: "Starting ntnx_user_defined_policies_v2 tests"

- name: Generate random name
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"
    suffix_name: "ansible-udp"

- name: Set variables
  ansible.builtin.set_fact:
    policy_name1: "{{ random_name }}{{ suffix_name }}1"
    policy_name2: "{{ random_name }}{{ suffix_name }}2"
    todelete: []

- name: Create user defined policy with check mode enabled
  nutanix.ncp.ntnx_user_defined_policies_v2:
    state: present
    title: "{{ policy_name1 }}"
    description: "Test ansible policy check mode"
    entity_type: "vm"
    trigger_conditions:
      - condition_type: "STATIC_THRESHOLD"
        severity_level: "WARNING"
        condition:
          metric_name: "hypervisor_cpu_usage_ppm"
          operator: "GREATER_THAN"
          threshold_value:
            int_value:
              int_value: 80
    is_enabled: true
  register: result
  ignore_errors: true
  check_mode: true

- name: Verify create with check mode
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.title == "{{ policy_name1 }}"
    fail_msg: "Create with check mode failed"
    success_msg: "Create with check mode passed"

- name: Create user defined policy
  nutanix.ncp.ntnx_user_defined_policies_v2:
    state: present
    title: "{{ policy_name1 }}"
    description: "Test ansible policy"
    entity_type: "vm"
    trigger_conditions:
      - condition_type: "STATIC_THRESHOLD"
        severity_level: "WARNING"
        condition:
          metric_name: "hypervisor_cpu_usage_ppm"
          operator: "GREATER_THAN"
          threshold_value:
            int_value:
              int_value: 80
    is_enabled: true
  register: result
  ignore_errors: true

- name: Verify create policy
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.ext_id is defined
      - result.response.title == "{{ policy_name1 }}"
    fail_msg: "Failed to create user defined policy"
    success_msg: "Created user defined policy successfully"

- name: Set ext_id fact
  ansible.builtin.set_fact:
    policy_ext_id: "{{ result.ext_id }}"
    todelete: "{{ result.ext_id }}"

- name: Update user defined policy with check mode enabled
  nutanix.ncp.ntnx_user_defined_policies_v2:
    state: present
    ext_id: "{{ policy_ext_id }}"
    title: "{{ policy_name2 }}"
    description: "Updated test ansible policy"
    entity_type: "vm"
    trigger_conditions:
      - condition_type: "STATIC_THRESHOLD"
        severity_level: "WARNING"
        condition:
          metric_name: "hypervisor_cpu_usage_ppm"
          operator: "GREATER_THAN"
          threshold_value:
            int_value:
              int_value: 80
    is_enabled: true
  register: result
  ignore_errors: true
  check_mode: true

- name: Verify update with check mode
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.title == "{{ policy_name2 }}"
    fail_msg: "Update with check mode failed"
    success_msg: "Update with check mode passed"

- name: Update user defined policy
  nutanix.ncp.ntnx_user_defined_policies_v2:
    state: present
    ext_id: "{{ policy_ext_id }}"
    title: "{{ policy_name2 }}"
    description: "Updated test ansible policy"
    entity_type: "vm"
    trigger_conditions:
      - condition_type: "STATIC_THRESHOLD"
        severity_level: "WARNING"
        condition:
          metric_name: "hypervisor_cpu_usage_ppm"
          operator: "GREATER_THAN"
          threshold_value:
            int_value:
              int_value: 80
    is_enabled: true
  register: result
  ignore_errors: true

- name: Verify update policy
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.response.title == "{{ policy_name2 }}"
    fail_msg: "Failed to update user defined policy"
    success_msg: "Updated user defined policy successfully"

- name: Idempotency check with same values
  nutanix.ncp.ntnx_user_defined_policies_v2:
    state: present
    ext_id: "{{ policy_ext_id }}"
    title: "{{ policy_name2 }}"
    description: "Updated test ansible policy"
    entity_type: "vm"
    trigger_conditions:
      - condition_type: "STATIC_THRESHOLD"
        severity_level: "WARNING"
        condition:
          metric_name: "hypervisor_cpu_usage_ppm"
          operator: "GREATER_THAN"
          threshold_value:
            int_value:
              int_value: 80
    is_enabled: true
  register: result
  ignore_errors: true

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.msg == "Nothing to change."
    fail_msg: "Idempotency check failed"
    success_msg: "Idempotency check passed"

- name: Create policy missing required title negative  # noqa: args[module]
  nutanix.ncp.ntnx_user_defined_policies_v2:
    state: present
    entity_type: "vm"
    trigger_conditions:
      - condition_type: "STATIC_THRESHOLD"
        severity_level: "WARNING"
        condition:
          metric_name: "hypervisor_cpu_usage_ppm"
          operator: "GREATER_THAN"
          threshold_value:
            int_value:
              int_value: 80
  register: result
  ignore_errors: true

- name: Verify missing title fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Missing title should fail"
    success_msg: "Missing title correctly failed"

- name: List all user defined policies
  nutanix.ncp.ntnx_user_defined_policies_info_v2:
  register: result
  ignore_errors: true

- name: Verify list all policies
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.total_available_results is defined
    fail_msg: "Failed to list user defined policies"
    success_msg: "Listed user defined policies successfully"

- name: List with fetch_all
  nutanix.ncp.ntnx_user_defined_policies_info_v2:
    fetch_all: true
  register: fetch_all_result
  ignore_errors: true

- name: Verify fetch_all
  ansible.builtin.assert:
    that:
      - fetch_all_result.changed == false
      - fetch_all_result.failed == false
      - fetch_all_result.response is defined
      - fetch_all_result.total_available_results is defined
      - (fetch_all_result.response | default([]) | length) == (fetch_all_result.total_available_results | int)
    fail_msg: "fetch_all failed"
    success_msg: "fetch_all passed"

- name: List with limit
  nutanix.ncp.ntnx_user_defined_policies_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: Verify list with limit
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
    fail_msg: "List with limit failed"
    success_msg: "List with limit passed"

- name: List with filter
  nutanix.ncp.ntnx_user_defined_policies_info_v2:
    filter: "title eq '{{ policy_name2 }}'"
  register: result
  ignore_errors: true

- name: Verify list with filter
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
      - result.response[0].title == "{{ policy_name2 }}"
    fail_msg: "List with filter failed"
    success_msg: "List with filter passed"

- name: Get policy by ext_id
  nutanix.ncp.ntnx_user_defined_policies_info_v2:
    ext_id: "{{ policy_ext_id }}"
  register: result
  ignore_errors: true

- name: Verify get by ext_id
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.ext_id == "{{ policy_ext_id }}"
      - result.response.title == "{{ policy_name2 }}"
    fail_msg: "Get by ext_id failed"
    success_msg: "Get by ext_id passed"

- name: Invalid ext_id negative
  nutanix.ncp.ntnx_user_defined_policies_info_v2:
    ext_id: "00000000-0000-0000-0000-000000000000"
  register: result
  ignore_errors: true

- name: Verify invalid ext_id fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Invalid ext_id should fail"
    success_msg: "Invalid ext_id correctly failed"

- name: Check conflicts with check mode
  nutanix.ncp.ntnx_user_defined_policies_conflicts_v2:
    state: present
    title: "conflict-test-policy"
    entity_type: "vm"
    trigger_conditions:
      - condition_type: "STATIC_THRESHOLD"
        severity_level: "WARNING"
        condition:
          metric_name: "hypervisor_cpu_usage_ppm"
          operator: "GREATER_THAN"
          threshold_value:
            int_value:
              int_value: 80
  register: result
  ignore_errors: true
  check_mode: true

- name: Verify conflicts check mode
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
    fail_msg: "Conflicts check mode failed"
    success_msg: "Conflicts check mode passed"

- name: Check conflicting policies
  nutanix.ncp.ntnx_user_defined_policies_conflicts_v2:
    state: present
    title: "conflict-test-policy"
    entity_type: "vm"
    trigger_conditions:
      - condition_type: "STATIC_THRESHOLD"
        severity_level: "WARNING"
        condition:
          metric_name: "hypervisor_cpu_usage_ppm"
          operator: "GREATER_THAN"
          threshold_value:
            int_value:
              int_value: 80
  register: result
  ignore_errors: true

- name: Verify check conflicts
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.response is defined
    fail_msg: "Check conflicts failed"
    success_msg: "Check conflicts passed"

- name: Conflicts missing title negative  # noqa: args[module]
  nutanix.ncp.ntnx_user_defined_policies_conflicts_v2:
    state: present
    entity_type: "vm"
    trigger_conditions:
      - condition_type: "STATIC_THRESHOLD"
        severity_level: "WARNING"
        condition:
          metric_name: "hypervisor_cpu_usage_ppm"
          operator: "GREATER_THAN"
          threshold_value:
            int_value:
              int_value: 80
  register: result
  ignore_errors: true

- name: Verify missing title fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Missing title should fail"
    success_msg: "Missing title correctly failed"

- name: Delete with check mode enabled
  nutanix.ncp.ntnx_user_defined_policies_v2:
    state: absent
    ext_id: "{{ policy_ext_id }}"
  register: result
  ignore_errors: true
  check_mode: true

- name: Verify delete check mode
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
    fail_msg: "Delete check mode failed"
    success_msg: "Delete check mode passed"

- name: Delete user defined policy
  nutanix.ncp.ntnx_user_defined_policies_v2:
    state: absent
    ext_id: "{{ todelete }}"
  register: result
  ignore_errors: true

- name: Verify delete policy
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
    fail_msg: "Failed to delete user defined policy"
    success_msg: "Deleted user defined policy successfully"

- name: Reset todelete
  ansible.builtin.set_fact:
    todelete: []

- name: Delete with missing ext_id negative  # noqa: args[module]
  nutanix.ncp.ntnx_user_defined_policies_v2:
    state: absent
  register: result
  ignore_errors: true

- name: Verify missing ext_id fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Missing ext_id should fail"
    success_msg: "Missing ext_id correctly failed"

- name: Delete with invalid ext_id
  nutanix.ncp.ntnx_user_defined_policies_v2:
    state: absent
    ext_id: "00000000-0000-0000-0000-000000000000"
  register: result
  ignore_errors: true

- name: Verify invalid ext_id delete fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Invalid ext_id delete should fail"
    success_msg: "Invalid ext_id delete correctly failed"
