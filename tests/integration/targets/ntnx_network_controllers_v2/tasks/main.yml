---
# We include, rather than import, so module_defaults from the parent block reliably
# apply to every included task across ansible-core versions.
- name: Set module defaults and run tests
  vars:
    module_defaults_group:
      group/nutanix.ncp.ntnx:
        nutanix_host: "{{ ip }}"
        nutanix_username: "{{ username | default(omit) }}"
        nutanix_password: "{{ password | default(omit) }}"
        nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
        validate_certs: "{{ validate_certs }}"
        nutanix_debug: "{{ nutanix_debug | default(omit) }}"
        nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip }}"
      nutanix_username: "{{ username | default(omit) }}"
      nutanix_password: "{{ password | default(omit) }}"
      nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
      validate_certs: "{{ validate_certs }}"
      nutanix_debug: "{{ nutanix_debug | default(omit) }}"
      nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
  block:
    - name: Run network_controllers.yml
      ansible.builtin.include_tasks: network_controllers.yml
