---
# Test plan for ntnx_effective_rate_limit_policies_info_v2:
#   1. List all effective rate limit policies
#   2. List with limit=1
#   3. List with OData filter on clusterExtId (inline dummy; may return empty)
#   4. List with fetch_all and assert response length == total_available_results

- name: Start testing ntnx_effective_rate_limit_policies_info_v2
  ansible.builtin.debug:
    msg: Start testing ntnx_effective_rate_limit_policies_info_v2

- name: List all effective rate limit policies
  nutanix.ncp.ntnx_effective_rate_limit_policies_info_v2:
  register: result
  ignore_errors: true

- name: List all effective rate limit policies status
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == false
      - result.response is defined
      - result.total_available_results is defined
    success_msg: "List all effective rate limit policies passed"
    fail_msg: "List all effective rate limit policies failed"

- name: List effective rate limit policies with limit 1
  nutanix.ncp.ntnx_effective_rate_limit_policies_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: List with limit status
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == false
      - result.response is defined
      - result.response | length <= 1
    success_msg: "List effective rate limit policies with limit passed"
    fail_msg: "List effective rate limit policies with limit failed"

- name: List effective rate limit policies with clusterExtId filter
  nutanix.ncp.ntnx_effective_rate_limit_policies_info_v2:
    filter: "clusterExtId eq '00000000-0000-0000-0000-000000000001'"
  register: result
  ignore_errors: true

- name: List with filter status
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == false
      - result.response is defined
    success_msg: "List effective rate limit policies with filter passed"
    fail_msg: "List effective rate limit policies with filter failed"

- name: List all effective rate limit policies with fetch_all
  nutanix.ncp.ntnx_effective_rate_limit_policies_info_v2:
    fetch_all: true
  register: result
  ignore_errors: true

- name: Fetch_all status
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == false
      - result.response is defined
      - result.total_available_results is defined
      - result.response | length == result.total_available_results
    success_msg: "List effective rate limit policies with fetch_all passed"
    fail_msg: "List effective rate limit policies with fetch_all failed"
