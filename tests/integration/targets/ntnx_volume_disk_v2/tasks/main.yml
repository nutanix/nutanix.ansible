---
- name: Set module defaults
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip }}"
      nutanix_username: "{{ username | default(omit) }}"
      nutanix_password: "{{ password | default(omit) }}"
      nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
      validate_certs: "{{ validate_certs }}"
      nutanix_debug: "{{ nutanix_debug | default(omit) }}"
      nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
  block:
    - name: Start Volume Disk v2 tests
      ansible.builtin.debug:
        msg: "Starting integration tests for ntnx_volume_disk_v2 / ntnx_volume_disks_info_v2"

    - name: Probe availability of the storage v4 namespace on the target Prism Central
      ansible.builtin.uri:
        url: "https://{{ ip }}:{{ port | default(9440) }}/api/storage/v4.0.a4/config/volume-groups?%24limit=1"
        method: GET
        user: "{{ username }}"
        password: "{{ password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 401, 403, 404]
      register: vd_storage_probe

    - name: Record whether the storage v4 namespace is available
      ansible.builtin.set_fact:
        vd_storage_available: "{{ vd_storage_probe.status == 200 }}"

    - name: Warn when storage v4 namespace is not deployed on the target PC
      when: not vd_storage_available
      ansible.builtin.debug:
        msg: >-
          NOTE: The target Prism Central ({{ ip }}) does NOT expose
          /api/storage/v4.0.a4/ (probe returned HTTP {{ vd_storage_probe.status }}).
          Only argument-spec / negative tests will run against the module; real
          Create/Update/Delete operations require the storage v4 namespace which
          is the endpoint the SDK targets. Upgrade the PC to enable full coverage.

    - name: Run argument-spec / negative tests (no API required)
      ansible.builtin.import_tasks: "argspec_negatives.yml"

    - name: Run full lifecycle tests when the storage namespace is available
      when: vd_storage_available
      ansible.builtin.import_tasks: "volume_disks.yml"
