---
# Variables required before running this playbook:
# - cluster

- name: "Start Volume groups tests"
  ansible.builtin.debug:
    msg: "Start Volume groups tests"

- name: Generate random names
  ansible.builtin.set_fact:
    random_name: "{{query('community.general.random_string',numbers=false, special=false,length=12)[0]}}"

- name: Set suffix name
  ansible.builtin.set_fact:
    suffix_name: "ansible-vgs"

- name: Set VG names
  ansible.builtin.set_fact:
    vg1_name: "{{suffix_name}}-{{random_name}}1"
    vg2_name: "{{suffix_name}}-{{random_name}}2"

- name: Create project for tests
  nutanix.ncp.ntnx_project_v2:
    state: present
    name: "{{ random_name }}-ansible-project"
    project_id: "{{ random_name }}-ansible-project-id"
  register: create_project_result
  ignore_errors: true

- name: Status of project creation for tests
  ansible.builtin.assert:
    that:
      - create_project_result.changed == true
      - create_project_result.failed == false
      - create_project_result.response is defined
      - create_project_result.ext_id is defined
      - create_project_result.ext_id | length > 0
      - create_project_result.task_ext_id is defined
      - create_project_result.response.state == "ACTIVE"
    fail_msg: "Unable to create project for tests"
    success_msg: "Project for tests created successfully"

- name: Set project fact for tests
  ansible.builtin.set_fact:
    project1:
      name: "{{ random_name }}-ansible-project"
      uuid: "{{ create_project_result.ext_id }}"

# A project needs a Resource Group (placement targets) before volume groups can
# be created in it; without one, VolumeGroupCreate fails with "No Resource Group
# Objects found for Project". Create the resource group so project-scoped volume
# groups below succeed.
- name: Create resource group for the test project
  nutanix.ncp.ntnx_resource_group_v2:
    state: present
    name: "{{ random_name }}-ansible-rg"
    project_ext_id: "{{ project1.uuid }}"
    placement_targets:
      - cluster_ext_id: "{{ cluster.uuid }}"
        storage_containers:
          - ext_id: "{{ storage_container.uuid }}"
  register: create_rg_result
  ignore_errors: true

- name: Status of resource group creation for tests
  ansible.builtin.assert:
    that:
      - create_rg_result.changed == true
      - create_rg_result.failed == false
      - create_rg_result.response is defined
      - create_rg_result.ext_id is defined
      - create_rg_result.ext_id | length > 0
      - create_rg_result.response.project_ext_id == project1.uuid
      - create_rg_result.response.name == "{{ random_name }}-ansible-rg"
      - create_rg_result.response.placement_targets | length == 1
      - create_rg_result.response.placement_targets[0].cluster_ext_id == "{{ cluster.uuid }}"
      - create_rg_result.response.placement_targets[0].storage_containers | length == 1
      - create_rg_result.response.placement_targets[0].storage_containers[0].ext_id == "{{ storage_container.uuid }}"
    fail_msg: "Unable to create resource group for tests"
    success_msg: "Resource group for tests created successfully"

- name: Set resource group fact for tests
  ansible.builtin.set_fact:
    resource_group_ext_id: "{{ create_rg_result.ext_id }}"

- name: Create Volume group with check mode
  nutanix.ncp.ntnx_volume_groups_v2:
    name: "{{vg1_name}}"
    description: "Volume group 1"
    should_load_balance_vm_attachments: true
    sharing_status: "SHARED"
    target_prefix: "vg1"
    cluster_reference: "{{ cluster.uuid }}"
    usage_type: "USER"
    is_hidden: true
    project_ext_id: "83083083-0000-0000-0000-000000000000"
    storage_features:
      flash_mode:
        is_enabled: true
    iscsi_features:
      target_secret: "Secret1234567"
      enabled_authentications: "CHAP"
  register: result
  ignore_errors: true
  check_mode: true

- name: Verify spec of VG
  ansible.builtin.assert:
    that:
      - result.error == None
      - result.response is defined
      - result.changed == false
      - result.response.cluster_reference == "{{cluster.uuid}}"
      - result.response.name == "{{vg1_name}}"
      - result.response.description == "Volume group 1"
      - result.response.should_load_balance_vm_attachments == true
      - result.response.sharing_status == "SHARED"
      - result.response.target_prefix == "vg1"
      - result.response.usage_type == "USER"
      - result.response.is_hidden == true
      - result.response.storage_features.flash_mode.is_enabled == true
      - result.response.iscsi_features.enabled_authentications == "CHAP"
      - result.response.project_ext_id == "83083083-0000-0000-0000-000000000000"

    fail_msg: "Unable to create spec for VG create"
    success_msg: "Spec generated successfully for VG create"

- name: Create Volume group with min spec and no Auth
  nutanix.ncp.ntnx_volume_groups_v2:
    name: "{{vg1_name}}"
    description: "Volume group 1"
    cluster_reference: "{{ cluster.uuid }}"
    project_ext_id: "{{ project1.uuid }}"
  register: result
  ignore_errors: true

- name: Verify creation of VG
  ansible.builtin.assert:
    that:
      - result.error == None
      - result.ext_id is defined
      - result.task_ext_id is defined
      - result.response is defined
      - result.changed == true
      - result.ext_id == result.response.ext_id
      - result.response.cluster_reference == "{{cluster.uuid}}"
      - result.response.name == "{{vg1_name}}"
      - result.response.description == "Volume group 1"
      - result.response.should_load_balance_vm_attachments == false
      - result.response.sharing_status == None
      - result.response.project_ext_id == project1.uuid
    fail_msg: "Unable to create VG"
    success_msg: "VG created successfully"

- name: Set VG UUID
  ansible.builtin.set_fact:
    vg1_uuid: "{{ result.ext_id }}"

- name: Create Volume group with all config and enabled chap auth
  nutanix.ncp.ntnx_volume_groups_v2:
    name: "{{vg2_name}}"
    description: "Volume group 2"
    should_load_balance_vm_attachments: true
    sharing_status: "SHARED"
    target_prefix: "vg1"
    cluster_reference: "{{ cluster.uuid }}"
    usage_type: "USER"
    project_ext_id: "{{ project1.uuid }}"
    storage_features:
      flash_mode:
        is_enabled: true
    iscsi_features:
      target_secret: "Secret1234567"
      enabled_authentications: "CHAP"
  register: result
  ignore_errors: true

- name: Verify creation of VG
  ansible.builtin.assert:
    that:
      - result.error == None
      - result.ext_id is defined
      - result.task_ext_id is defined
      - result.response is defined
      - result.changed == true
      - result.response.cluster_reference == "{{cluster.uuid}}"
      - result.response.name == "{{vg2_name}}"
      - result.response.description == "Volume group 2"
      - result.response.should_load_balance_vm_attachments == true
      - result.response.sharing_status == "SHARED"
      - "'vg1' in result.response.target_name"
      - result.response.usage_type == "USER"
      - result.response.storage_features.flash_mode.is_enabled == true
      - result.response.iscsi_features.target_secret == None
      - result.response.iscsi_features.enabled_authentications == "CHAP"
      - result.response.project_ext_id == project1.uuid
    fail_msg: "Unable to create VG"
    success_msg: "VG created successfully"

- name: Set VG UUID
  ansible.builtin.set_fact:
    vg2_uuid: "{{ result.ext_id }}"

- name: Update Volume group with check mode
  ntnx_volume_groups_v2:
    ext_id: "{{ vg1_uuid }}"
    name: "{{ vg1_name }}-updated"
    description: "Volume group 1 updated"
    should_load_balance_vm_attachments: false
    sharing_status: "NOT_SHARED"
    target_prefix: "vg1-updated"
    is_hidden: false
    storage_features:
      flash_mode:
        is_enabled: false
    iscsi_features:
      target_secret: "Secret123456"
  register: result
  ignore_errors: true
  check_mode: true

- name: Verify spec of Volume group update
  ansible.builtin.assert:
    that:
      - result.error == None
      - result.response is defined
      - result.changed == false
      - result.ext_id == "{{ vg1_uuid }}"
      - result.response.name == "{{ vg1_name }}-updated"
      - result.response.description == "Volume group 1 updated"
      - result.response.should_load_balance_vm_attachments == false
      - result.response.sharing_status == "NOT_SHARED"
      - result.response.target_prefix == "vg1-updated"
      - result.response.is_hidden == false
      - result.response.storage_features.flash_mode.is_enabled == false
    fail_msg: "Unable to create spec for VG update"
    success_msg: "Spec generated successfully for VG update"

- name: Update Volume group
  ntnx_volume_groups_v2:
    ext_id: "{{ vg1_uuid }}"
    name: "{{ vg1_name }}-updated"
    description: "Volume group 1 updated"
    should_load_balance_vm_attachments: false
    sharing_status: "NOT_SHARED"
    is_hidden: false
  register: result
  ignore_errors: true

- name: Verify update of Volume group
  ansible.builtin.assert:
    that:
      - result.error == None
      - result.ext_id == "{{ vg1_uuid }}"
      - result.task_ext_id is defined
      - result.response is defined
      - result.changed == true
      - result.response.ext_id == "{{ vg1_uuid }}"
      - result.response.cluster_reference == "{{ cluster.uuid }}"
      - result.response.name == "{{vg1_name}}-updated"
      - result.response.description == "Volume group 1 updated"
      - result.response.should_load_balance_vm_attachments == false
      - result.response.sharing_status == "NOT_SHARED"
      - result.response.is_hidden == false
    fail_msg: "Unable to update VG"
    success_msg: "VG updated successfully"

- name: Idempotency check for Volume group update
  ntnx_volume_groups_v2:
    ext_id: "{{ vg1_uuid }}"
    name: "{{ vg1_name }}-updated"
    description: "Volume group 1 updated"
    should_load_balance_vm_attachments: false
    sharing_status: "NOT_SHARED"
    is_hidden: false
  register: result
  ignore_errors: true

- name: Verify idempotency of Volume group update
  ansible.builtin.assert:
    that:
      - result.error == None
      - result.ext_id == "{{ vg1_uuid }}"
      - result.msg is defined
      - result.changed == false
      - result.msg == "Nothing to change."
    fail_msg: "Idempotency check for Volume group update failed"
    success_msg: "Idempotency check for Volume group update passed"

- name: Update Volume group back to original state
  ntnx_volume_groups_v2:
    ext_id: "{{ vg1_uuid }}"
    name: "{{ vg1_name }}"
    description: "Volume group 1"
    should_load_balance_vm_attachments: true
    sharing_status: "SHARED"
    is_hidden: true
  register: result
  ignore_errors: true

- name: Verify update of Volume group back to original state
  ansible.builtin.assert:
    that:
      - result.error == None
      - result.ext_id == "{{ vg1_uuid }}"
      - result.task_ext_id is defined
      - result.response is defined
      - result.changed == true
      - result.response.ext_id == "{{ vg1_uuid }}"
      - result.response.name == "{{vg1_name}}"
      - result.response.description == "Volume group 1"
      - result.response.should_load_balance_vm_attachments == true
      - result.response.sharing_status == "SHARED"
      - result.response.is_hidden == true
    fail_msg: "Unable to update VG back to original state"
    success_msg: "VG updated back to original state successfully"

- name: Fetch above created VG
  nutanix.ncp.ntnx_volume_groups_info_v2:
    ext_id: "{{ vg1_uuid }}"
  register: result
  ignore_errors: true

- name: Fetch above created VG
  ansible.builtin.assert:
    that:
      - result.error == None
      - result.changed == False
      - result.response is defined
      - result.ext_id == "{{vg1_uuid}}"
      - result.response.ext_id == "{{vg1_uuid}}"
      - result.response.cluster_reference == "{{cluster.uuid}}"
      - result.response.name == "{{vg1_name}}"
    fail_msg: "Unable to fetch VG"
    success_msg: "VG fetched successfully"

- name: Fetch all VGs created above using filters
  nutanix.ncp.ntnx_volume_groups_info_v2:
    filter: "startswith(name, '{{suffix_name}}-{{random_name}}')"
  register: result
  ignore_errors: true

- name: Set expected VGs
  ansible.builtin.set_fact:
    expected_vgs: ["{{vg1_uuid}}", "{{vg2_uuid}}"]

- name: Fetch above created VG
  ansible.builtin.assert:
    that:
      - result.error == None
      - result.changed == False
      - result.response is defined
      - result.response | length == 2
      - result.total_available_results is defined
      - result.total_available_results == 2
      - result.response[0].ext_id in expected_vgs
      - result.response[1].ext_id in expected_vgs
    fail_msg: "Unable to fetch VGs using filters"
    success_msg: "VGs fetched successfully"

- name: Apply limits on VG response from list
  nutanix.ncp.ntnx_volume_groups_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: Fetch above created VG
  ansible.builtin.assert:
    that:
      - result.error == None
      - result.changed == False
      - result.response is defined
      - result.response | length == 1
    fail_msg: "Unable to fetch VGs using limits"
    success_msg: "VGs fetched successfully"

- name: Verify update of project_ext_id is not supported
  nutanix.ncp.ntnx_volume_groups_v2:
    state: present
    ext_id: "{{ vg1_uuid }}"
    project_ext_id: "00000000-0000-0000-0000-000000000001"
  register: result
  ignore_errors: true

- name: Verify update of project_ext_id is blocked status
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
      - 'result.msg == "Update is not supported for the following field(s): project_ext_id"'
    fail_msg: "Update of project_ext_id should have been blocked"
    success_msg: "Update of project_ext_id is correctly blocked"

- name: Delete volume group with check mode is enabled
  nutanix.ncp.ntnx_volume_groups_v2:
    state: absent
    ext_id: "{{ vg1_uuid }}"
  register: result
  ignore_errors: true
  check_mode: true

- name: Delete volume group with check mode is enabled status
  ansible.builtin.assert:
    that:
      - result.msg is defined
      - result.changed == false
      - result.failed == false
      - result.ext_id == "{{ vg1_uuid }}"
      - result.msg == "VG with ext_id:{{ vg1_uuid }} will be deleted."
    fail_msg: "Delete volume group with check mode is enabled failed"
    success_msg: "Delete volume group with check mode is enabled passed"

- name: Delete Volume groups
  nutanix.ncp.ntnx_volume_groups_v2:
    state: absent
    ext_id: "{{ vg1_uuid }}"
  register: result
  ignore_errors: true

- name: Verify delete of VGs
  ansible.builtin.assert:
    that:
      - result.error == None
      - result.changed == true
      - result.ext_id == "{{vg1_uuid}}"
      - result.task_ext_id is defined
      - result.response.status == "SUCCEEDED"
    fail_msg: "Unable to delete VG"
    success_msg: "VG deleted successfully"

- name: Delete Volume groups
  nutanix.ncp.ntnx_volume_groups_v2:
    state: absent
    ext_id: "{{ vg2_uuid }}"
  register: result
  ignore_errors: true

- name: Verify delete of VGs
  ansible.builtin.assert:
    that:
      - result.error == None
      - result.changed == true
      - result.ext_id == "{{vg2_uuid}}"
      - result.task_ext_id is defined
      - result.response.status == "SUCCEEDED"
    fail_msg: "Unable to delete VG"
    success_msg: "VG deleted successfully"

- name: Delete resource group created for tests
  nutanix.ncp.ntnx_resource_group_v2:
    state: absent
    ext_id: "{{ resource_group_ext_id }}"
  register: delete_rg_result
  ignore_errors: true

- name: Status of resource group deletion for tests
  ansible.builtin.assert:
    that:
      - delete_rg_result.changed == true
      - delete_rg_result.failed == false
      - delete_rg_result.ext_id == resource_group_ext_id
      - delete_rg_result.response.status == "SUCCEEDED"
    fail_msg: "Unable to delete resource group created for tests"
    success_msg: "Resource group created for tests deleted successfully"

- name: Delete project created for tests
  nutanix.ncp.ntnx_project_v2:
    state: absent
    ext_id: "{{ project1.uuid }}"
  register: delete_project_result
  ignore_errors: true

- name: Status of project deletion for tests
  ansible.builtin.assert:
    that:
      - delete_project_result.changed == true
      - delete_project_result.failed == false
      - delete_project_result.ext_id == project1.uuid
      - delete_project_result.response is defined
      - delete_project_result.response.status == "SUCCEEDED"
      - delete_project_result.task_ext_id is defined
    fail_msg: "Unable to delete project created for tests"
    success_msg: "Project created for tests deleted successfully"
