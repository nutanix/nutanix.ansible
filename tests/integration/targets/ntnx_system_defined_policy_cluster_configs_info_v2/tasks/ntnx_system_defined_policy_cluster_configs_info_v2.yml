---
- name: Start ntnx_system_defined_policy_cluster_configs_info_v2 tests
  ansible.builtin.debug:
    msg: "Starting ntnx_system_defined_policy_cluster_configs_info_v2 tests"

- name: Fetch system defined policies to get policy ext_id
  nutanix.ncp.ntnx_system_defined_policies_info_v2:
    limit: 5
  register: policies_info
  ignore_errors: true

- name: Verify policies list
  ansible.builtin.assert:
    that:
      - policies_info.failed == false
      - policies_info.response is defined
      - policies_info.response | length > 0
    fail_msg: "Failed to fetch policies for cluster configs info tests"
    success_msg: "Fetched policies for cluster configs info tests"

- name: Set sda policy ext_id
  ansible.builtin.set_fact:
    sda_policy_ext_id: "{{ policies_info.response[0].ext_id }}"

- name: List all cluster configs for policy
  nutanix.ncp.ntnx_system_defined_policy_cluster_configs_info_v2:
    system_defined_policy_ext_id: "{{ sda_policy_ext_id }}"
  register: result
  ignore_errors: true

- name: Verify list all cluster configs
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.total_available_results is defined
      - result.system_defined_policy_ext_id == sda_policy_ext_id
    fail_msg: "Failed to list cluster configs"
    success_msg: "Listed cluster configs successfully"

- name: List cluster configs with fetch_all
  nutanix.ncp.ntnx_system_defined_policy_cluster_configs_info_v2:
    system_defined_policy_ext_id: "{{ sda_policy_ext_id }}"
    fetch_all: true
  register: fetch_all_result
  ignore_errors: true

- name: Verify fetch_all cluster configs
  ansible.builtin.assert:
    that:
      - fetch_all_result.changed == false
      - fetch_all_result.failed == false
      - fetch_all_result.response is defined
      - fetch_all_result.total_available_results is defined
    fail_msg: "fetch_all cluster configs failed"
    success_msg: "fetch_all cluster configs passed"

- name: List cluster configs with limit
  nutanix.ncp.ntnx_system_defined_policy_cluster_configs_info_v2:
    system_defined_policy_ext_id: "{{ sda_policy_ext_id }}"
    limit: 1
  register: result
  ignore_errors: true

- name: Verify list with limit
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
    fail_msg: "List cluster configs with limit failed"
    success_msg: "List cluster configs with limit passed"

- name: Fetch cluster config ext_id if available from limit test
  ansible.builtin.set_fact:
    cluster_config_ext_id: "{{ result.response[0].ext_id }}"
  when:
    - result.response is defined
    - result.response | length > 0
    - result.response[0].ext_id is defined

- name: List cluster configs with filter
  nutanix.ncp.ntnx_system_defined_policy_cluster_configs_info_v2:
    system_defined_policy_ext_id: "{{ sda_policy_ext_id }}"
    filter: "extId eq '{{ cluster_config_ext_id }}'"
  register: result
  ignore_errors: true
  when: cluster_config_ext_id is defined

- name: Verify list with filter
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
      - result.response[0].ext_id == cluster_config_ext_id
    fail_msg: "List cluster configs with filter failed"
    success_msg: "List cluster configs with filter passed"
  when: cluster_config_ext_id is defined

- name: Get cluster config by ext_id
  nutanix.ncp.ntnx_system_defined_policy_cluster_configs_info_v2:
    system_defined_policy_ext_id: "{{ sda_policy_ext_id }}"
    ext_id: "{{ cluster_config_ext_id }}"
  register: result
  ignore_errors: true
  when: cluster_config_ext_id is defined

- name: Verify get by ext_id
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.ext_id == cluster_config_ext_id
      - result.ext_id == cluster_config_ext_id
      - result.system_defined_policy_ext_id == sda_policy_ext_id
    fail_msg: "Get cluster config by ext_id failed"
    success_msg: "Get cluster config by ext_id passed"
  when: cluster_config_ext_id is defined

- name: Attempt to fetch cluster config with invalid ext_id
  nutanix.ncp.ntnx_system_defined_policy_cluster_configs_info_v2:
    system_defined_policy_ext_id: "{{ sda_policy_ext_id }}"
    ext_id: "00000000-0000-0000-0000-000000000000"
  register: result
  ignore_errors: true

- name: Verify invalid ext_id fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Invalid ext_id should fail"
    success_msg: "Invalid ext_id correctly failed"

- name: Attempt to list with invalid policy ext_id
  nutanix.ncp.ntnx_system_defined_policy_cluster_configs_info_v2:
    system_defined_policy_ext_id: "invalid-policy-id"
  register: result
  ignore_errors: true

- name: Verify invalid policy ext_id fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Invalid policy ext_id should fail"
    success_msg: "Invalid policy ext_id correctly failed"

- name: Negative missing required system_defined_policy_ext_id  # noqa: args[module]
  nutanix.ncp.ntnx_system_defined_policy_cluster_configs_info_v2:
  register: result
  ignore_errors: true

- name: Verify missing required param fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Missing required param should fail"
    success_msg: "Missing required param correctly failed"

- name: Negative with invalid filter
  nutanix.ncp.ntnx_system_defined_policy_cluster_configs_info_v2:
    system_defined_policy_ext_id: "{{ sda_policy_ext_id }}"
    filter: "invalidField eq 'test'"
  register: result
  ignore_errors: true

- name: Verify invalid filter fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Invalid filter should fail"
    success_msg: "Invalid filter correctly failed"
