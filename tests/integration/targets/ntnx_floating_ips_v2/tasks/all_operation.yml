---
# Variables required before running this playbook:
# - vm
# - external_nat_subnet
# - external_nat_subnets
# - external_subnet_project
# - users
# - overlay_subnet
# - vpc

- name: Start testing ntnx_floating_ips_v2 ntnx_floating_ips_info_v2
  ansible.builtin.debug:
    msg: Start testing ntnx_floating_ips_v2 ntnx_floating_ips_info_v2

- name: Generate random floating ip name
  ansible.builtin.set_fact:
    fip1_name: "{{query('community.general.random_string',numbers=false, special=false,length=8).0}}"
    fip2_name: "{{query('community.general.random_string',numbers=false, special=false,length=8).0}}"
    fip3_name: "{{query('community.general.random_string',numbers=false, special=false,length=8).0}}"

- name: Fetch vm nic reference for tests
  nutanix.ncp.ntnx_vms_info:
    vm_uuid: "{{ vm.uuid }}"
  register: result

- name: Define variable
  ansible.builtin.set_fact:
    vm_nic_reference: "{{ result.response.status.resources.nic_list[0].uuid }}"

- name: Fetch categories for assigning
  nutanix.ncp.ntnx_categories_info_v2:
  register: result

- name: Define variable
  ansible.builtin.set_fact:
    category_ext_id: "{{ result.response[0].ext_id }}"

- name: Set todelete list
  ansible.builtin.set_fact:
    todelete: []

##############################################################
- name: Create floating ip with external subnet uuid with check mode
  nutanix.ncp.ntnx_floating_ips_v2:
    state: present
    name: "{{ fip1_name }}"
    project_ext_id: "83083083-0000-0000-0000-000000000000"
    external_subnet_reference: "{{ external_nat_subnet.uuid }}"
    floating_ip:
      ipv4:
        value: "{{ external_nat_subnets[0].floating_ip }}"
  register: result
  ignore_errors: true
  check_mode: true

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response.name == "{{ fip1_name }}"
      - result.response.floating_ip.ipv4.value == "{{ external_nat_subnets[0].floating_ip }}"
      - result.response.external_subnet_reference == "{{ external_nat_subnet.uuid }}"
      - result.response.project_ext_id == "83083083-0000-0000-0000-000000000000"
    fail_msg: " Unable to create floating ip with external subnet uuid with check mode"
    success_msg: " Floating ip with external subnet uuid created successfully with check mode"

##############################################################

# The floating IP below is created in the external_subnet_project fixture that
# prepare_env creates and permanently shares with the external NAT subnet. A
# per-run dedicated project is intentionally NOT used: floating IPs need a real
# external NAT subnet, and the only one on the cluster (external_nat_subnet) is
# permanently attached to the fixture VPC. A VPC-attached subnet cannot have a
# project share removed, and a project cannot be deleted while
# a subnet is shared with it, so a per-run project could never be torn down.
# The subnet is already shared with external_subnet_project by prepare_env;
# re-sharing here is idempotent (unique) and safe.
- name: Get current sharing of external NAT subnet
  nutanix.ncp.ntnx_subnets_info_v2:
    ext_id: "{{ external_nat_subnet.uuid }}"
  register: external_subnet_info

- name: Set current external NAT subnet sharing fact
  ansible.builtin.set_fact:
    external_subnet_current_shares: "{{ external_subnet_info.response.shared_with_projects if external_subnet_info.response.shared_with_projects else [] }}"

- name: Share external NAT subnet with the floating IP project
  nutanix.ncp.ntnx_subnets_v2:
    state: present
    ext_id: "{{ external_nat_subnet.uuid }}"
    shared_with_projects: "{{ (external_subnet_current_shares + [external_subnet_project.uuid]) | unique }}"
  register: share_external_subnet_result

- name: Verify external NAT subnet sharing after share
  nutanix.ncp.ntnx_subnets_info_v2:
    ext_id: "{{ external_nat_subnet.uuid }}"
  register: external_subnet_after_share

- name: Status of sharing external NAT subnet with the floating IP project
  ansible.builtin.assert:
    that:
      - share_external_subnet_result.failed == false
      - external_subnet_after_share.response.shared_with_projects is not none
      - external_subnet_project.uuid in external_subnet_after_share.response.shared_with_projects
    fail_msg: "External NAT subnet is not shared with project {{ external_subnet_project.uuid }}"
    success_msg: "External NAT subnet shared with project {{ external_subnet_project.uuid }} successfully"

##############################################################
- name: Create floating ip with external subnet uuid
  nutanix.ncp.ntnx_floating_ips_v2:
    state: present
    name: "{{ fip1_name }}"
    project_ext_id: "{{ external_subnet_project.uuid }}"
    external_subnet_reference: "{{ external_nat_subnet.uuid }}"
    metadata:
      project_reference_id: "{{ external_subnet_project.uuid }}"
      owner_reference_id: "{{ users[0] }}"
      category_ids:
        - "{{ category_ext_id }}"
    floating_ip:
      ipv4:
        value: "{{ external_nat_subnets[0].floating_ip }}"
  register: result
  ignore_errors: true

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.name == "{{ fip1_name }}"
      - result.response.external_subnet_reference == "{{ external_nat_subnet.uuid }}"
      - result.response.metadata.project_reference_id == "{{ external_subnet_project.uuid }}"
      - result.response.metadata.owner_reference_id == "{{ users[0] }}"
      - result.response.metadata.category_ids[0] == "{{ category_ext_id }}"
      - result.response.floating_ip.ipv4.value == "{{ external_nat_subnets[0].floating_ip }}"
      - result.response.project_ext_id == external_subnet_project.uuid
    fail_msg: " Unable to create floating ip with external subnet uuid "
    success_msg: " Floating ip with external subnet uuid created successfully "

- name: Fetch the created floating IP
  nutanix.ncp.ntnx_floating_ips_info_v2:
    filter: name eq '{{ fip1_name }}'
  register: result

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.response | length == 1
      - result.changed == false
      - result.failed == false
      - result.response[0].name == "{{ fip1_name }}"
      - result.response[0].external_subnet_reference == "{{ external_nat_subnet.uuid }}"
      - result.response[0].metadata.project_reference_id == "{{ external_subnet_project.uuid }}"
      - result.response[0].metadata.owner_reference_id == "{{ users[0] }}"
      - result.response[0].metadata.category_ids[0] == "{{ category_ext_id }}"
      - result.response[0].floating_ip.ipv4.value == "{{ external_nat_subnets[0].floating_ip }}"

    fail_msg: " Unable to create floating ip with external subnet uuid "
    success_msg: " Floating ip with external subnet uuid created successfully "


########################################################################

- name: List all floating IPs with fetch_all
  nutanix.ncp.ntnx_floating_ips_info_v2:
    fetch_all: true
  register: fetch_all_ntnx_floating_ips_info_v2
  ignore_errors: true

- name: List all floating IPs with fetch_all status
  ansible.builtin.assert:
    that:
      - fetch_all_ntnx_floating_ips_info_v2.changed == false
      - fetch_all_ntnx_floating_ips_info_v2.failed == false
      - fetch_all_ntnx_floating_ips_info_v2.response is defined
      - fetch_all_ntnx_floating_ips_info_v2.total_available_results is defined
      - (fetch_all_ntnx_floating_ips_info_v2.response | default([]) | length) == (fetch_all_ntnx_floating_ips_info_v2.total_available_results | int)
    fail_msg: "Unable to list all floating IPs with fetch_all"
    success_msg: "Listed all floating IPs with fetch_all successfully"

- name: Define variable
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [result.response[0].ext_id] }}"

- name: Get floating_ips using ext_id
  nutanix.ncp.ntnx_floating_ips_info_v2:
    ext_id: "{{ result.response[0].ext_id }}"
  register: result
  ignore_errors: true

- name: Listing Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.response.name == "{{ fip1_name }}"
      - result.response.external_subnet_reference == "{{ external_nat_subnet.uuid }}"

    fail_msg: " Unable to list fips "
    success_msg: " fips listed successfully "

##############################################################
- name: Check idempotency
  nutanix.ncp.ntnx_floating_ips_v2:
    state: present
    name: "{{ fip1_name }}"
    external_subnet_reference: "{{ external_nat_subnet.uuid }}"
    ext_id: "{{ result.ext_id }}"
  register: result
  ignore_errors: true

- name: Idempotency Status
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == false
      - result.msg == "Nothing to change."
    fail_msg: " Unable to check idempotency "
    success_msg: " Idempotency check finished successfully "
##############################################################
- name: Create floating ip with vpc uuid and private ip association
  nutanix.ncp.ntnx_floating_ips_v2:
    state: present
    external_subnet_reference: "{{ external_nat_subnet.uuid }}"
    name: "{{ fip2_name }}"
    association:
      private_ip_association:
        private_ip:
          ipv4:
            value: "{{ overlay_subnet.private_ip }}"
        vpc_reference: "{{ vpc.uuid }}"
  register: result
  ignore_errors: true

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.response.name == "{{ fip2_name }}"
      - result.response.external_subnet_reference == "{{ external_nat_subnet.uuid }}"
      - result.response.association.private_ip.ipv4.value == "{{ overlay_subnet.private_ip }}"
      - result.response.association.vpc_reference == "{{ vpc.uuid }}"

    fail_msg: " Unable to create floating ip with vpc "
    success_msg: " Floating ip with vpc uuid and external subnet uuid created successfully "

- name: Fetch the created floating IP
  nutanix.ncp.ntnx_floating_ips_info_v2:
    filter: name eq '{{ fip2_name }}'
  register: result

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.response | length == 1
      - result.response[0].name == "{{ fip2_name }}"
      - result.response[0].external_subnet_reference == "{{ external_nat_subnet.uuid }}"
      - result.response[0].association.private_ip.ipv4.value == "{{ overlay_subnet.private_ip }}"
      - result.response[0].association.vpc_reference == "{{ vpc.uuid }}"
    fail_msg: " Unable to create floating ip with vpc "
    success_msg: " Floating ip with vpc uuid and external subnet uuid created successfully "

- name: Define variable
  ansible.builtin.set_fact:
    fip_ext_id: "{{ result.response[0].ext_id }}"
- name: Define variable
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [result.response[0].ext_id] }}"
##########################################################
- name: Update floating ip name with check mode
  nutanix.ncp.ntnx_floating_ips_v2:
    state: present
    name: "{{ fip2_name }}_updated"
    ext_id: "{{ fip_ext_id }}"
    association:
      private_ip_association:
        private_ip:
          ipv4:
            value: "{{ overlay_subnet.private_ip1 }}"
        vpc_reference: "{{ vpc.uuid }}"
  register: result
  ignore_errors: true
  check_mode: true

- name: Update Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.ext_id == "{{ result.ext_id }}"
      - result.response.name == "{{ fip2_name }}_updated"
      - result.response.association.private_ip.ipv4.value == "{{ overlay_subnet.private_ip1 }}"
      - result.response.association.vpc_reference == "{{ vpc.uuid }}"
    fail_msg: " Unable to update floating ip name with check mode"
    success_msg: " Floating ip name updated successfully with check mode "

##########################################################
- name: Update floating ip name and private IP
  nutanix.ncp.ntnx_floating_ips_v2:
    state: present
    name: "{{ fip2_name }}_updated"
    ext_id: "{{ fip_ext_id }}"
    association:
      private_ip_association:
        private_ip:
          ipv4:
            value: "{{ overlay_subnet.private_ip1 }}"
        vpc_reference: "{{ vpc.uuid }}"
  register: result
  ignore_errors: true

- name: Update Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id == "{{ result.ext_id }}"
      - result.response.name == "{{ fip2_name }}_updated"
      - result.response.association.private_ip.ipv4.value == "{{ overlay_subnet.private_ip1 }}"
      - result.response.association.vpc_reference == "{{ vpc.uuid }}"
    fail_msg: " Unable to update floating ip"
    success_msg: " Floating ip name updated successfully"

########################################################
- name: Create floating ip with vm nic reference association
  nutanix.ncp.ntnx_floating_ips_v2:
    state: present
    external_subnet_reference: "{{ external_nat_subnet.uuid }}"
    association:
      vm_nic_association:
        vm_nic_reference: "{{ vm_nic_reference }}"
    name: "{{ fip3_name }}"
  ignore_errors: true
  register: result

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.response.name == "{{ fip3_name }}"
      - result.response.external_subnet_reference == "{{ external_nat_subnet.uuid }}"
      - result.response.association.vm_nic_reference == "{{ vm_nic_reference }}"
    fail_msg: " Unable to create floating ip with vm nic reference "
    success_msg: " Floating ip with external uuid and vm nic reference created successfully "

- name: Fetch the created floating IP
  nutanix.ncp.ntnx_floating_ips_info_v2:
    filter: name eq '{{ fip3_name }}'
  register: result

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.response | length == 1
      - result.response[0].name == "{{ fip3_name }}"
      - result.changed == false
      - result.response[0].external_subnet_reference == "{{ external_nat_subnet.uuid }}"
      - result.response[0].association.vm_nic_reference == "{{ vm_nic_reference }}"
    fail_msg: " Unable to create floating ip with vm"
    success_msg: " Floating ip with external uuid and vm created successfully "

- name: Define variable
  ansible.builtin.set_fact:
    fip_ext_id: "{{ result.response[0].ext_id }}"

- name: Define variable
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [result.response[0].ext_id] }}"

# using dummy reference here for generating spec only
- name: Generate update spec for floating ip with vm nic reference
  nutanix.ncp.ntnx_floating_ips_v2:
    state: present
    ext_id: "{{ fip_ext_id }}"
    external_subnet_reference: "{{ external_nat_subnet.uuid }}"
    association:
      vm_nic_association:
        vm_nic_reference: e96b0997-8b1a-4554-881b-f59dd689b3de
    name: "{{ fip3_name }}"
  check_mode: true
  ignore_errors: true
  register: result

- name: Creation Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.ext_id == result.response.ext_id
      - result.response.name == "{{ fip3_name }}"
      - result.response.external_subnet_reference == "{{ external_nat_subnet.uuid }}"
      - result.response.association.vm_nic_reference == "e96b0997-8b1a-4554-881b-f59dd689b3de"
    fail_msg: " Unable to create floating ip with vm"
    success_msg: " Floating ip with external uuid and vm created successfully "

##############################################################
- name: List Floating_ips
  nutanix.ncp.ntnx_floating_ips_info_v2:
  register: fips
  ignore_errors: true

- name: Listing Status
  ansible.builtin.assert:
    that:
      - fips.response is defined
      - fips.response | length >= 1
      - fips.total_available_results is defined
      - fips.total_available_results >= 1
    fail_msg: " Unable to list vpcs "
    success_msg: " Floating_ips listed successfully "
##############################################################
- name: List floating_ips using limit
  nutanix.ncp.ntnx_floating_ips_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: Listing Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.response | length == 1
    fail_msg: " Unable to list floating_ips "
    success_msg: " Floating_ips listed successfully "
#############################################################
- name: Get floating_ips using ext_id
  nutanix.ncp.ntnx_floating_ips_info_v2:
    ext_id: "{{ fips.response.1.ext_id }}"
  register: result
  ignore_errors: true

- name: Listing Status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.response.name == fips.response.1.name
    fail_msg: " Unable to list fips "
    success_msg: " fips listed successfully "
#########################################################

- name: Verify update of project_ext_id is not supported
  nutanix.ncp.ntnx_floating_ips_v2:
    state: present
    ext_id: "{{ fip_ext_id }}"
    project_ext_id: "00000000-0000-0000-0000-000000000001"
  register: result
  ignore_errors: true

- name: Verify update of project_ext_id is blocked status
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
      - 'result.msg == "Update is not supported for the following field(s): project_ext_id"'
    fail_msg: "Update of project_ext_id should have been blocked"
    success_msg: "Update of project_ext_id is correctly blocked"

- name: Delete floating IP with check mode enabled
  nutanix.ncp.ntnx_floating_ips_v2:
    state: absent
    ext_id: "{{ fip_ext_id }}"
  register: result
  ignore_errors: true
  check_mode: true

- name: Delete floating IP with check mode Status
  ansible.builtin.assert:
    that:
      - result.msg is defined
      - result.changed == false
      - result.failed == false
      - result.ext_id == "{{ fip_ext_id }}"
      - result.msg == "Floating IP with ext_id:{{ fip_ext_id }} will be deleted."
    fail_msg: "Delete floating ip with check mode failed"
    success_msg: "Delete floating ip with check mode passed"

- name: Delete all created floating ips
  nutanix.ncp.ntnx_floating_ips_v2:
    state: absent
    ext_id: "{{ item }}"
  register: result
  loop: "{{ todelete }}"
  ignore_errors: true

- name: Define variable
  ansible.builtin.set_fact:
    todelete: []

###########################################################
# Tests for shared_with_projects
###########################################################

- name: Create projects for sharing tests
  nutanix.ncp.ntnx_project_v2:
    state: present
    name: "{{ fip1_name }}-ansible-project-{{ item }}"
    project_id: "{{ fip1_name }}-ansible-project-id-{{ item }}"
  register: create_projects_result
  loop: "{{ range(1, 4) | list }}"
  ignore_errors: true

- name: Status of projects creation for sharing tests
  ansible.builtin.assert:
    that:
      - item.changed == true
      - item.failed == false
      - item.response is defined
      - item.ext_id is defined
      - item.ext_id | length > 0
      - item.task_ext_id is defined
      - item.response.state == "ACTIVE"
    fail_msg: "Unable to create project for sharing tests"
    success_msg: "Project for sharing tests created successfully"
  loop: "{{ create_projects_result.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Set project facts for sharing tests
  ansible.builtin.set_fact:
    share_project1:
      uuid: "{{ create_projects_result.results[0].ext_id }}"
    share_project2:
      uuid: "{{ create_projects_result.results[1].ext_id }}"
    share_project3:
      uuid: "{{ create_projects_result.results[2].ext_id }}"

###########################################################
# Check mode: sharing reflected in response
###########################################################
- name: Create floating IP with sharing in check mode
  nutanix.ncp.ntnx_floating_ips_v2:
    state: present
    name: "{{ fip1_name }}_shared_check"
    external_subnet_reference: "{{ external_nat_subnet.uuid }}"
    floating_ip:
      ipv4:
        value: "{{ external_nat_subnets[1].floating_ip }}"
    shared_with_projects:
      - "{{ share_project1.uuid }}"
  register: result
  check_mode: true
  ignore_errors: true

- name: Status of floating IP sharing check mode
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response.name == "{{ fip1_name }}_shared_check"
      - result.response.shared_with_projects == [share_project1.uuid]
    fail_msg: "Floating IP sharing check mode failed"
    success_msg: "Floating IP sharing check mode passed"

###########################################################
# Create floating IP shared with two projects
###########################################################
- name: Create floating IP shared with two projects
  nutanix.ncp.ntnx_floating_ips_v2:
    state: present
    name: "{{ fip1_name }}_shared"
    external_subnet_reference: "{{ external_nat_subnet.uuid }}"
    floating_ip:
      ipv4:
        value: "{{ external_nat_subnets[1].floating_ip }}"
    shared_with_projects:
      - "{{ share_project1.uuid }}"
      - "{{ share_project2.uuid }}"
  register: result
  ignore_errors: true

- name: Status of create floating IP shared with two projects
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.response.shared_with_projects is defined
      - result.response.shared_with_projects | length == 2
      - (result.response.shared_with_projects | sort) == ([share_project1.uuid, share_project2.uuid] | sort)
    fail_msg: "Create floating IP shared with two projects failed"
    success_msg: "Created floating IP shared with two projects"

- name: Set shared FIP ext_id
  ansible.builtin.set_fact:
    shared_fip_ext_id: "{{ result.ext_id }}"

- name: Add shared FIP to todelete
  ansible.builtin.set_fact:
    todelete: "{{ todelete + [shared_fip_ext_id] }}"

###########################################################
# Scenario: share with all three projects (add a project)
###########################################################
- name: Update floating IP to share with all three projects
  nutanix.ncp.ntnx_floating_ips_v2:
    state: present
    ext_id: "{{ shared_fip_ext_id }}"
    shared_with_projects:
      - "{{ share_project1.uuid }}"
      - "{{ share_project2.uuid }}"
      - "{{ share_project3.uuid }}"
  register: result
  ignore_errors: true

- name: Status of floating IP share with all three projects
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.shared_with_projects is not none
      - result.response.shared_with_projects | length == 3
      - (result.response.shared_with_projects | sort) == ([share_project1.uuid, share_project2.uuid, share_project3.uuid] | sort)
    fail_msg: "Floating IP share with all three projects failed"
    success_msg: "Floating IP shared with all three projects successfully"

###########################################################
# Scenario: sharing idempotency (same three projects again)
###########################################################
- name: Update floating IP sharing with same projects (idempotency)
  nutanix.ncp.ntnx_floating_ips_v2:
    state: present
    ext_id: "{{ shared_fip_ext_id }}"
    shared_with_projects:
      - "{{ share_project1.uuid }}"
      - "{{ share_project2.uuid }}"
      - "{{ share_project3.uuid }}"
  register: result
  ignore_errors: true

- name: Status of floating IP sharing idempotency
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == false
      - result.skipped == true
      - result.msg == "Nothing to change."
    fail_msg: "Floating IP sharing idempotency failed"
    success_msg: "Floating IP sharing idempotency passed"

###########################################################
# Scenario: reconcile to a subset (drop one, keep two)
###########################################################
- name: Update floating IP to reconcile shared projects to a subset
  nutanix.ncp.ntnx_floating_ips_v2:
    state: present
    ext_id: "{{ shared_fip_ext_id }}"
    shared_with_projects:
      - "{{ share_project2.uuid }}"
      - "{{ share_project3.uuid }}"
  register: result
  ignore_errors: true

- name: Status of floating IP reconcile to a subset
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.response.shared_with_projects is not none
      - result.response.shared_with_projects | length == 2
      - (result.response.shared_with_projects | sort) == ([share_project2.uuid, share_project3.uuid] | sort)
      - share_project1.uuid not in result.response.shared_with_projects
    fail_msg: "Floating IP reconcile to a subset failed"
    success_msg: "Floating IP reconciled to a subset successfully"

###########################################################
# Scenario: update sharing via check_mode
###########################################################
- name: Update floating IP sharing via check_mode
  nutanix.ncp.ntnx_floating_ips_v2:
    state: present
    ext_id: "{{ shared_fip_ext_id }}"
    shared_with_projects:
      - "{{ share_project1.uuid }}"
  register: result
  check_mode: true
  ignore_errors: true

- name: Status of floating IP sharing update check_mode
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response.shared_with_projects == [share_project1.uuid]
    fail_msg: "Floating IP sharing update check_mode failed"
    success_msg: "Floating IP sharing update check_mode passed"

###########################################################
# Scenario: unshare from all projects
###########################################################
- name: Update floating IP to unshare from all projects
  nutanix.ncp.ntnx_floating_ips_v2:
    state: present
    ext_id: "{{ shared_fip_ext_id }}"
    shared_with_projects: []
  register: result
  ignore_errors: true

- name: Status of floating IP unshare from all projects
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == true
      - result.response.shared_with_projects is none or result.response.shared_with_projects | length == 0
    fail_msg: "Floating IP unshare from all projects failed"
    success_msg: "Floating IP unshared from all projects"

###########################################################
# Cleanup shared FIP and projects
###########################################################
- name: Delete shared floating IP
  nutanix.ncp.ntnx_floating_ips_v2:
    state: absent
    ext_id: "{{ shared_fip_ext_id }}"
  register: result
  ignore_errors: true

- name: Status of shared floating IP deletion
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
    fail_msg: "Unable to delete shared floating IP"
    success_msg: "Shared floating IP deleted successfully"

- name: Remove shared FIP from todelete
  ansible.builtin.set_fact:
    todelete: "{{ todelete | reject('equalto', shared_fip_ext_id) | list }}"

- name: Delete projects created for sharing tests
  nutanix.ncp.ntnx_project_v2:
    state: absent
    ext_id: "{{ item }}"
  register: delete_projects_result
  loop:
    - "{{ share_project1.uuid }}"
    - "{{ share_project2.uuid }}"
    - "{{ share_project3.uuid }}"
  ignore_errors: true

- name: Status of sharing projects deletion
  ansible.builtin.assert:
    that:
      - item.changed == true
      - item.failed == false
      - item.ext_id == item.item
      - item.task_ext_id is defined
      - item.response.status == "SUCCEEDED"
    fail_msg: "Unable to delete sharing project"
    success_msg: "Sharing project deleted successfully"
  loop: "{{ delete_projects_result.results }}"
  loop_control:
    label: "{{ item.item }}"
#########################################################
