---
- name: Start legacy VM-VM anti-affinity policy tests
  ansible.builtin.debug:
    msg: "Starting legacy VM-VM anti-affinity policy integration tests"

- name: Set todelete list
  ansible.builtin.set_fact:
    todelete: []

################################################################################
# Info: List all legacy VM-VM anti-affinity policies
################################################################################

- name: List all legacy VM-VM anti-affinity policies
  nutanix.ncp.ntnx_legacy_vm_anti_affinity_policies_info_v2:
  register: list_result
  ignore_errors: true

- name: List all legacy VM-VM anti-affinity policies status
  ansible.builtin.assert:
    that:
      - list_result.response is defined
      - list_result.changed == false
      - list_result.failed == false
    fail_msg: "List all legacy VM-VM anti-affinity policies failed"
    success_msg: "List all legacy VM-VM anti-affinity policies passed"

- name: Set total results count from list
  ansible.builtin.set_fact:
    total_legacy_policies: "{{ list_result.total_available_results | int }}"
    has_legacy_policies: "{{ (list_result.response | default([]) | length) > 0 }}"

################################################################################
# Info: Get by ext_id (list + filter on extId; no Get-by-ID API)
################################################################################

- name: Set first legacy policy ext_id
  ansible.builtin.set_fact:
    legacy_policy_ext_id: "{{ list_result.response[0].ext_id }}"
  when: has_legacy_policies | bool

- name: Get legacy VM-VM anti-affinity policy using ext_id
  nutanix.ncp.ntnx_legacy_vm_anti_affinity_policies_info_v2:
    ext_id: "{{ legacy_policy_ext_id }}"
  register: get_result
  ignore_errors: true
  when: has_legacy_policies | bool

- name: Get legacy VM-VM anti-affinity policy using ext_id status
  ansible.builtin.assert:
    that:
      - get_result.changed == false
      - get_result.failed == false
      - get_result.ext_id == legacy_policy_ext_id
      - get_result.response is defined
      - get_result.response.ext_id == legacy_policy_ext_id
    fail_msg: "Get legacy policy using ext_id failed"
    success_msg: "Get legacy policy using ext_id passed"
  when: has_legacy_policies | bool

################################################################################
# Info: List with limit
################################################################################

- name: List legacy VM-VM anti-affinity policies with limit 1
  nutanix.ncp.ntnx_legacy_vm_anti_affinity_policies_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: List legacy VM-VM anti-affinity policies with limit status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response | length <= 1
    fail_msg: "List legacy policies with limit failed"
    success_msg: "List legacy policies with limit passed"

################################################################################
# Info: List with filter
################################################################################

- name: List legacy VM-VM anti-affinity policies with filter
  nutanix.ncp.ntnx_legacy_vm_anti_affinity_policies_info_v2:
    filter: "name eq 'nonexistent_legacy_policy_xyz'"
  register: result
  ignore_errors: true

- name: List legacy VM-VM anti-affinity policies with filter status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
    fail_msg: "List legacy policies with filter failed"
    success_msg: "List legacy policies with filter passed"

################################################################################
# Info: fetch_all
################################################################################

- name: List all legacy VM-VM anti-affinity policies with fetch_all
  nutanix.ncp.ntnx_legacy_vm_anti_affinity_policies_info_v2:
    fetch_all: true
  register: result
  ignore_errors: true

- name: List all legacy VM-VM anti-affinity policies with fetch_all status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - (result.response | length) == (result.total_available_results | int)
    fail_msg: "List legacy policies with fetch_all failed"
    success_msg: "List legacy policies with fetch_all passed"

################################################################################
# CRUD: Delete with check mode
################################################################################

- name: Delete a legacy VM-VM anti-affinity policy with check mode enabled
  nutanix.ncp.ntnx_legacy_vm_anti_affinity_policies_v2:
    ext_id: "00060a2b-5c99-5a52-ebd2-ac1f6b02d3e0"
    state: absent
  register: result
  ignore_errors: true
  check_mode: true

- name: Delete with check mode status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.msg is defined
    fail_msg: "Delete with check mode failed"
    success_msg: "Delete with check mode passed"

################################################################################
# CRUD: Delete live (skip if no legacy policies available)
################################################################################

- name: Check if any legacy policies exist for delete test
  ansible.builtin.set_fact:
    skip_delete: "{{ (total_legacy_policies | int) == 0 }}"

################################################################################
# CRUD: Negative tests
################################################################################

- name: Delete with missing ext_id (negative test)
  nutanix.ncp.ntnx_legacy_vm_anti_affinity_policies_v2:
    state: absent
  register: result
  ignore_errors: true

- name: Delete with missing ext_id status
  ansible.builtin.assert:
    that:
      - result.failed == true
    fail_msg: "Delete with missing ext_id should have failed"
    success_msg: "Delete with missing ext_id correctly failed"

- name: Delete with invalid ext_id (negative test)
  nutanix.ncp.ntnx_legacy_vm_anti_affinity_policies_v2:
    ext_id: "00000000-0000-0000-0000-000000000000"
    state: absent
  register: result
  ignore_errors: true

- name: Delete with invalid ext_id status
  ansible.builtin.assert:
    that:
      - result.failed == true
    fail_msg: "Delete with invalid ext_id should have failed"
    success_msg: "Delete with invalid ext_id correctly failed"

- name: End legacy VM-VM anti-affinity policy tests
  ansible.builtin.debug:
    msg: "Legacy VM-VM anti-affinity policy integration tests complete"
