---
# Integration tests for ntnx_resume_protection_recovery_plan_v2
#
# Test plan
# =========
# Resume Protection requires a Recovery Plan that has had a failover
# executed and protection paused. That infrastructure cannot be created on a
# single-PC test cluster by an Ansible playbook. To still get real coverage on
# every code path we exercise the module in three complementary ways:
#
#   1. check_mode - one check_mode test. Validates argument handling.
#   2. Negative tests - missing required ext_id, invalid enum on state,
#      and a well-formed but non-existent ext_id (rejected by the API).
#   3. Live end-to-end - when a real recovery plan is supplied via
#      `resume_protection_recovery_plan_ext_id` in integration_config.yml
#      this block triggers a real resume, asserts task success.

- name: Start Resume Protection Recovery Plan tests
  ansible.builtin.debug:
    msg: Start Resume Protection Recovery Plan tests

- name: Generate a random job name
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=10)[0] }}"

- name: Set fixture UUIDs used by check_mode / negative tests
  ansible.builtin.set_fact:
    job_name: "ansible_rp_{{ random_name }}"
    fake_recovery_plan_ext_id: "11111111-1111-1111-1111-111111111111"
    non_existent_recovery_plan_ext_id: "deadbeef-dead-dead-dead-deadbeefdead"

########################################################################################
# check_mode: test covering module attributes
########################################################################################

- name: Generate spec for resume protection in check mode
  nutanix.ncp.ntnx_resume_protection_recovery_plan_v2:
    ext_id: "{{ fake_recovery_plan_ext_id }}"
  check_mode: true
  register: result
  ignore_errors: true

- name: Verify check_mode spec generation
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.ext_id == fake_recovery_plan_ext_id
      - result.response.ext_id == fake_recovery_plan_ext_id
    success_msg: "check_mode spec for resume protection is generated successfully"
    fail_msg: "check_mode spec for resume protection was NOT generated correctly"

########################################################################################
# Negative tests
########################################################################################

- name: Trigger resume protection without ext_id (should fail)
  nutanix.ncp.ntnx_resume_protection_recovery_plan_v2:
  register: result
  ignore_errors: true

- name: Verify missing ext_id fails validation
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
      - "'ext_id' in result.msg"
    success_msg: "Missing ext_id was rejected as expected"
    fail_msg: "Module did not fail when ext_id was missing"

- name: Trigger resume protection with an invalid state value (should fail)
  nutanix.ncp.ntnx_resume_protection_recovery_plan_v2:
    ext_id: "{{ fake_recovery_plan_ext_id }}"
    state: absent
  register: result
  ignore_errors: true

- name: Verify invalid state value is rejected
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
      - "'value of state must be one of' in result.msg"
    success_msg: "Invalid state=absent was rejected as expected"
    fail_msg: "Module accepted an invalid state value"

- name: Trigger resume protection with a non-existent recovery plan (real API call, should fail)
  nutanix.ncp.ntnx_resume_protection_recovery_plan_v2:
    ext_id: "{{ non_existent_recovery_plan_ext_id }}"
  register: result
  ignore_errors: true

- name: Verify non-existent recovery plan fails at the API
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
      - "'Api Exception' in result.msg or 'not found' in (result.response | to_json | lower) or result.status is defined"
    success_msg: "Non-existent recovery plan was rejected by the API as expected"
    fail_msg: "Non-existent recovery plan did not fail as expected"

########################################################################################
# Live end-to-end (only when a real recovery plan is provided)
########################################################################################

- name: Live end-to-end resume protection
  when:
    - resume_protection_recovery_plan_ext_id is defined
    - resume_protection_recovery_plan_ext_id | length > 0
  block:
    - name: Trigger a real resume protection on the configured recovery plan
      nutanix.ncp.ntnx_resume_protection_recovery_plan_v2:
        ext_id: "{{ resume_protection_recovery_plan_ext_id }}"
      register: result
      ignore_errors: true

    - name: Verify the resume protection task succeeded
      ansible.builtin.assert:
        that:
          - result is defined
          - result.failed == false
          - result.changed == true
          - result.ext_id == resume_protection_recovery_plan_ext_id
          - result.task_ext_id is defined
          - result.response is defined
          - result.response.status == "SUCCEEDED"
        success_msg: "Resume protection completed successfully on the live recovery plan"
        fail_msg: "Resume protection did NOT complete successfully"
