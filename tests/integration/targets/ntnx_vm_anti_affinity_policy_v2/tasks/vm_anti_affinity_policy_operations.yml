##################################################################################
# Delete all vm anti-affinity policies
##################################################################################

- name: Delete all policies
  nutanix.ncp.ntnx_vm_anti_affinity_policy_v2:
    state: absent
    ext_id: "{{ item }}"
  register: result
  ignore_errors: true
  loop: "{{ todelete }}"

- name: Deletion status
  ansible.builtin.assert:
    that:
      - item.changed == true
      - item.failed == false
      - item.response is defined
      - item.response.status == 'SUCCEEDED'
      - result.changed == true
      - result.msg == "All items completed"
      - result.results | length == 2
    fail_msg: "Delete policies failed"
    success_msg: "Delete policies passed"
  loop: "{{ result.results }}"

- name: Delete resource group created for tests
  nutanix.ncp.ntnx_resource_group_v2:
    state: absent
    ext_id: "{{ resource_group_ext_id }}"
  register: delete_rg_result
  ignore_errors: true

- name: Status of resource group deletion for tests
  ansible.builtin.assert:
    that:
      - delete_rg_result.changed == true
      - delete_rg_result.failed == false
      - delete_rg_result.ext_id == resource_group_ext_id
      - delete_rg_result.response.status == "SUCCEEDED"
    fail_msg: "Unable to delete resource group created for tests"
    success_msg: "Resource group created for tests deleted successfully"

- name: Delete created categories
  nutanix.ncp.ntnx_categories_v2:
    ext_id: "{{ item }}"
    state: absent
  register: result
  loop: "{{ todelete_categories }}"
  ignore_errors: true

- name: Categories deletion status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.msg == "All items completed"
      - result.results | length == todelete_categories | length
      - item.failed == false
      - item.changed == true
    fail_msg: "Unable to delete categories"
    success_msg: "Categories deleted successfully"
  loop: "{{ result.results }}"

- name: Delete project created for tests
  nutanix.ncp.ntnx_project_v2:
    state: absent
    ext_id: "{{ project1.uuid }}"
  register: delete_project_result
  ignore_errors: true

- name: Status of project deletion for tests
  ansible.builtin.assert:
    that:
      - delete_project_result.changed == true
      - delete_project_result.failed == false
      - delete_project_result.ext_id == project1.uuid
      - delete_project_result.task_ext_id is defined
      - delete_project_result.response.status == "SUCCEEDED"
    fail_msg: "Unable to delete project created for tests"
    success_msg: "Project created for tests deleted successfully"
