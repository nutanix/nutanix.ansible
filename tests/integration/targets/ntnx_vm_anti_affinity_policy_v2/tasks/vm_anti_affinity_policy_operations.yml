##################################################################################
# Idempotency check
##################################################################################

- name: Check for idempotency by updating the same policy with same spec
  nutanix.ncp.ntnx_vm_anti_affinity_policy_v2:
    state: present
    ext_id: "{{ todelete[0] }}"
    name: "{{ policy_name }}_updated"
    description: "description for {{ policy_name }}_updated"
    categories:
      - ext_id: "{{ todelete_categories[3] }}"
  register: result
  ignore_errors: true

- name: Verify idempotency by updating the same policy with same spec
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.msg == "Nothing to change."
    fail_msg: "Verify idempotency by updating the same policy with same spec failed"
    success_msg: "Verify idempotency by updating the same policy with same spec passed"

- name: Verify update of project_ext_id is not supported
  nutanix.ncp.ntnx_vm_anti_affinity_policy_v2:
    state: present
    ext_id: "{{ todelete[1] }}"
    project_ext_id: "{{ wrong_project_ext_id }}"
  register: result
  ignore_errors: true

- name: Verify update of project_ext_id is not supported
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
      - 'result.msg == "Update is not supported for the following field(s): project_ext_id"'
    fail_msg: "Verify update of project_ext_id is not supported failed"
    success_msg: "Verify update of project_ext_id is not supported passed"

