- name: Start testing ntnx_vm_anti_affinity_policy_v2
  ansible.builtin.debug:
    msg: Start testing ntnx_vm_anti_affinity_policy_v2

- name: Generate random name
  ansible.builtin.set_fact:
    random_name:
      "ansible_{{ query('community.general.random_string', numbers=false,
      special=false, length=12)[0] }}"

- name: Set policy names
  ansible.builtin.set_fact:
    policy_name: "{{ random_name }}_anti_affinity_test"
    vm_name_prefix: "{{ random_name }}_af_vm"
    wrong_project_ext_id: "123e4567-e89b-12d3-a456-426614174000"
    todelete: []
    todelete_categories: []

# Create a project to be used for project_ext_id tests
###################################################################################################
- name: Create project for tests
  nutanix.ncp.ntnx_project_v2:
    state: present
    name: "{{ random_name }}-ansible-project"
    project_id: "{{ random_name }}-ansible-project-id"
  register: create_project_result
  ignore_errors: true

- name: Status of project creation for tests
  ansible.builtin.assert:
    that:
      - create_project_result.changed == true
      - create_project_result.failed == false
      - create_project_result.response is defined
      - create_project_result.ext_id is defined
      - create_project_result.ext_id | length > 0
      - create_project_result.task_ext_id is defined
      - create_project_result.response.state == "ACTIVE"
      - create_project_result.response.status == "SUCCEEDED"
    fail_msg: "Unable to create project for tests"
    success_msg: "Project for tests created successfully"

- name: Set project fact for tests
  ansible.builtin.set_fact:
    project1:
      name: "{{ random_name }}-ansible-project"
      uuid: "{{ create_project_result.ext_id }}"

# A project needs at least one Resource Group with placement targets before
# project-scoped VM creation can succeed via v4 APIs.
- name: Create resource group for the test project
  nutanix.ncp.ntnx_resource_group_v2:
    state: present
    name: "{{ random_name }}-ansible-rg"
    project_ext_id: "{{ project1.uuid }}"
    placement_targets:
      - cluster_ext_id: "{{ cluster.uuid }}"
        storage_containers:
          - ext_id: "{{ storage_container.uuid }}"
  register: create_rg_result
  ignore_errors: true

- name: Status of resource group creation for tests
  ansible.builtin.assert:
    that:
      - create_rg_result.changed == true
      - create_rg_result.failed == false
      - create_rg_result.response is defined
      - create_rg_result.ext_id is defined
      - create_rg_result.ext_id | length > 0
      - create_rg_result.response.project_ext_id == project1.uuid
      - create_rg_result.response.name == "{{ random_name }}-ansible-rg"
      - create_rg_result.response.placement_targets | length == 1
      - create_rg_result.response.placement_targets[0].cluster_ext_id == "{{ cluster.uuid }}"
      - create_rg_result.response.placement_targets[0].storage_containers | length == 1
      - create_rg_result.response.placement_targets[0].storage_containers[0].ext_id == "{{ storage_container.uuid }}"
    fail_msg: "Unable to create resource group for tests"
    success_msg: "Resource group for tests created successfully"

- name: Set resource group fact for tests
  ansible.builtin.set_fact:
    resource_group_ext_id: "{{ create_rg_result.ext_id }}"

- name: Create categories for anti-affinity policy tests
  nutanix.ncp.ntnx_categories_v2:
    key: "{{ random_name }}_af_key_{{ item }}"
    value: "{{ random_name }}_af_value_{{ item }}"
    description: "ansible anti-affinity category"
    project_ext_id: "{{ project1.uuid }}"
  register: category_create_result
  ignore_errors: true
  loop: "{{ range(0, 4) | list }}"

- name: Create categories for anti-affinity policy tests status
  ansible.builtin.assert:
    that:
      - category_create_result.changed == true
      - category_create_result is defined
      - category_create_result.results | length == 4
      - category_create_result.msg == "All items completed"
      - item.failed == false
      - item.response is defined
      - item.response.ext_id is defined
      - item.response.project_ext_id == "{{ project1.uuid }}"
    fail_msg: "Categories creation failed"
    success_msg: "Categories created successfully"
  loop: "{{ category_create_result.results }}"

- name: Save categories ext_id to delete list
  ansible.builtin.set_fact:
    todelete_categories: "{{ todelete_categories + [ item.response.ext_id ] }}"
  loop: "{{ category_create_result.results }}"

##################################################################################
# Create - Check mode
##################################################################################

- name: Generate spec for a VM-VM anti-affinity policy using check mode
  nutanix.ncp.ntnx_vm_anti_affinity_policy_v2:
    state: present
    name: "test_policy_1"
    description: "test_policy_1_description"
    categories:
      - ext_id: "00065133-7ad0-1d82-451d-5254003d8207"
      - ext_id: "00065133-7ad0-1d82-451d-5254003d8209"
    project_ext_id: "dd23e456-e89b-12d3-a456-426614174000"
  register: result
  ignore_errors: true
  check_mode: true

- name: Verify generated spec for a VM-VM anti-affinity policy using check mode
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.categories | length == 2
      - result.response.categories[0].ext_id ==
        "00065133-7ad0-1d82-451d-5254003d8207"
      - result.response.categories[1].ext_id ==
        "00065133-7ad0-1d82-451d-5254003d8209"
      - result.response.name == 'test_policy_1'
      - result.response.description == "test_policy_1_description"
      - result.response.project_ext_id == "dd23e456-e89b-12d3-a456-426614174000"
    fail_msg:
      "Verify generated spec for a VM-VM anti-affinity policy using check mode
      failed"
    success_msg:
      "Verify generated spec for a VM-VM anti-affinity policy using check
      mode passed"

##################################################################################
# Create - Minimal spec
##################################################################################

- name: Create a VM-VM anti-affinity policy without description
  nutanix.ncp.ntnx_vm_anti_affinity_policy_v2:
    state: present
    name: "{{ policy_name }}_1"
    categories:
      - ext_id: "{{ todelete_categories[0] }}"
    project_ext_id: "{{ project1.uuid }}"
  register: result
  ignore_errors: true

- name: Verify created VM-VM anti-affinity policy minimal spec with project
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.response.categories[0].ext_id == "{{ todelete_categories[0] }}"
      - result.response.name == "{{ policy_name }}_1"
      - result.response.project_ext_id == "{{ project1.uuid }}"
    fail_msg: "Verify created VM-VM anti-affinity policy minimal spec with project failed"
    success_msg: "Verify created VM-VM anti-affinity policy minimal spec with project passed"

- name: Add to delete list
  ansible.builtin.set_fact:
    todelete: '{{ todelete + [result["response"]["ext_id"]] }}'

