---
- name: Clean up the environment
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Include var file
      ansible.builtin.include_vars: ../vars/main.yml
    - name: Delete VM
      ignore_errors: true
      register: result
      nutanix.ncp.ntnx_vms:
        vm_uuid: "{{ vm.uuid }}"
        state: absent
        nutanix_host: "{{ ip }}"
        nutanix_username: "{{ username | default(omit) }}"
        nutanix_password: "{{ password | default(omit) }}"
        nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
        nutanix_debug: "{{ nutanix_debug | default(omit) }}"
        nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
        validate_certs: false
    #   # - name: Delete DR VM
    #   #   ntnx_vms:
    #   #     vm_uuid: '{{dr_vm.uuid }}'
    #   #     state: absent
    #   #     nutanix_host: "{{ ip }}"
    #   #     nutanix_username: "{{ username }}"
    #   #     nutanix_password: "{{ password }}"
    #   #     validate_certs: False
    - name: Delete overlay
      register: result
      ignore_errors: true
      nutanix.ncp.ntnx_subnets:
        state: absent
        nutanix_host: "{{ ip }}"
        nutanix_username: "{{ username | default(omit) }}"
        nutanix_password: "{{ password | default(omit) }}"
        nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
        nutanix_debug: "{{ nutanix_debug | default(omit) }}"
        nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
        validate_certs: false
        subnet_uuid: "{{ item }}"
      loop:
        - "{{ overlay.uuid }}"
    - name: Delete vpc
      register: result
      ignore_errors: true
      nutanix.ncp.ntnx_vpcs:
        state: absent
        nutanix_host: "{{ ip }}"
        nutanix_username: "{{ username | default(omit) }}"
        nutanix_password: "{{ password | default(omit) }}"
        nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
        nutanix_debug: "{{ nutanix_debug | default(omit) }}"
        nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
        validate_certs: false
        vpc_uuid: "{{ vpc.uuid }}"
    - name: Delete subnets
      ignore_errors: true
      register: result
      nutanix.ncp.ntnx_subnets:
        state: absent
        nutanix_host: "{{ ip }}"
        nutanix_username: "{{ username | default(omit) }}"
        nutanix_password: "{{ password | default(omit) }}"
        nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
        nutanix_debug: "{{ nutanix_debug | default(omit) }}"
        nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
        validate_certs: false
        subnet_uuid: "{{ item }}"
      loop:
        - "{{ external_nat_subnet.uuid }}"
        - "{{ static.uuid }}"
    - name: Delete fixture project for external subnet tests
      register: result
      ignore_errors: true
      nutanix.ncp.ntnx_project_v2:
        state: absent
        nutanix_host: "{{ ip }}"
        nutanix_username: "{{ username | default(omit) }}"
        nutanix_password: "{{ password | default(omit) }}"
        nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
        nutanix_debug: "{{ nutanix_debug | default(omit) }}"
        nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
        validate_certs: false
        ext_id: "{{ external_subnet_project.uuid }}"
    - name: Delete downloaded test files
      ignore_errors: true
      register: result
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ cirros_image.dest | default('', true) }}"
        - "{{ disk_image.dest | default('', true) }}"
        - "{{ xml_content.dest | default('', true) }}"
        - "{{ unattendxml.dest | default('', true) }}"
      when:
        - item is defined
        - item | string | trim | length > 0
        - item != '.'
        - item != './'
        - not item.endswith('/_work')
        - not item.endswith('/_work/')
        - item not in (playbook_dir | default(''))
