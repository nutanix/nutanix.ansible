---
- name: Prepare the environment
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Include var file for environment preparation
      ansible.builtin.include_vars: ../vars/main.yml
    - name: Create external subnet with NAT
      nutanix.ncp.ntnx_subnets:
        state: present
        nutanix_host: "{{ ip }}"
        nutanix_username: "{{ username | default(omit) }}"
        nutanix_password: "{{ password | default(omit) }}"
        nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
        nutanix_debug: "{{ nutanix_debug | default(omit) }}"
        nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
        validate_certs: false
        name: "{{external_nat_subnets[0].name}}_{{ external_nat_subnets[0].vlan_id }}"
        external_subnet:
          vlan_id: "{{external_nat_subnets[0].vlan_id}}"
          enable_nat: true
          cluster:
            name: "{{ cluster.name }}"
          ipam:
            network_ip: "{{ external_nat_subnets[0].network_ip }}"
            network_prefix: "{{ external_nat_subnets[0].network_prefix }}"
            gateway_ip: "{{ external_nat_subnets[0].gateway_ip_address }}"
            ip_pools:
              - start_ip: "{{ external_nat_subnets[0].dhcp.start_address }}"
                end_ip: "{{ external_nat_subnets[0].dhcp.end_address }}"
      register: result
    - name: Insert external subnet configuration block to vars
      ansible.builtin.blockinfile:
        path: ../vars/main.yml
        marker: "# {mark} ANSIBLE MANAGED BLOCK insertion 1"
        block: |
          external_nat_subnet:
            name: "{{external_nat_subnets[0].name}}_{{ external_nat_subnets[0].vlan_id }}"
            uuid: "{{result.subnet_uuid}}"

    # Fixture project permanently shared with the external NAT subnet. This is
    # done here (before the fixture VPC is attached below) because the backend
    # only rejects *unshare* while a VPC is attached (NETWORKING-10068), never
    # *share*. Tests that need a project-scoped VPC on this subnet consume this
    # pre-shared project instead of sharing/unsharing at runtime, which they
    # cannot cleanly undo.
    - name: Create fixture project for external subnet tests
      nutanix.ncp.ntnx_project_v2:
        state: present
        nutanix_host: "{{ ip }}"
        nutanix_username: "{{ username | default(omit) }}"
        nutanix_password: "{{ password | default(omit) }}"
        nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
        nutanix_debug: "{{ nutanix_debug | default(omit) }}"
        nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
        validate_certs: false
        name: "{{ external_nat_subnets[0].name }}_project_{{ external_nat_subnets[0].vlan_id }}"
        project_id: "{{ external_nat_subnets[0].name }}_project_{{ external_nat_subnets[0].vlan_id }}"
      register: project_result

    - name: Share external NAT subnet with the fixture project
      nutanix.ncp.ntnx_subnets_v2:
        state: present
        nutanix_host: "{{ ip }}"
        nutanix_username: "{{ username | default(omit) }}"
        nutanix_password: "{{ password | default(omit) }}"
        nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
        nutanix_debug: "{{ nutanix_debug | default(omit) }}"
        nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
        validate_certs: false
        ext_id: "{{ result.subnet_uuid }}"
        shared_with_projects:
          - "{{ project_result.ext_id }}"

    - name: Insert external subnet project configuration block to vars
      ansible.builtin.blockinfile:
        path: ../vars/main.yml
        marker: "# {mark} ANSIBLE MANAGED BLOCK insertion 6"
        block: |
          external_subnet_project:
            name: "{{ external_nat_subnets[0].name }}_project_{{ external_nat_subnets[0].vlan_id }}"
            uuid: "{{project_result.ext_id}}"

    - name: Create min VPC with external_subnet uuid
      nutanix.ncp.ntnx_vpcs:
        state: present
        nutanix_host: "{{ ip }}"
        nutanix_username: "{{ username | default(omit) }}"
        nutanix_password: "{{ password | default(omit) }}"
        nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
        nutanix_debug: "{{ nutanix_debug | default(omit) }}"
        nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
        validate_certs: false
        name: "{{vpc_name}}_{{ external_nat_subnets[0].vlan_id }}"
        external_subnets:
          - subnet_uuid: "{{ result.subnet_uuid }}"
      register: result

    - name: Insert  VPC configuration block to vars
      ansible.builtin.blockinfile:
        path: ../vars/main.yml
        marker: "# {mark} ANSIBLE MANAGED BLOCK insertion 2"
        block: |
          vpc:
            name: "{{vpc_name}}_{{ external_nat_subnets[0].vlan_id }}"
            uuid: "{{result.vpc_uuid}}"

    - name: Create vlan subnet with IPAM
      nutanix.ncp.ntnx_subnets:
        state: present
        nutanix_host: "{{ ip }}"
        nutanix_username: "{{ username | default(omit) }}"
        nutanix_password: "{{ password | default(omit) }}"
        nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
        nutanix_debug: "{{ nutanix_debug | default(omit) }}"
        nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
        validate_certs: false
        name: "{{static_subnet_name}}_{{ external_nat_subnets[0].vlan_id }}"
        vlan_subnet:
          vlan_id: "{{ (external_nat_subnets[0].vlan_id | int) + 1 }}"
          virtual_switch:
            name: vs0
          cluster:
            name: "{{ cluster.name }}"
          ipam:
            network_ip: 10.30.30.0
            network_prefix: 24
            gateway_ip: 10.30.30.254
            ip_pools:
              - start_ip: 10.30.30.10
                end_ip: 10.30.30.90
      register: result

    - name: Insert vlan subnet configuration block to var file
      ansible.builtin.blockinfile:
        path: ../vars/main.yml
        marker: "# {mark} ANSIBLE MANAGED BLOCK insertion 3"
        block: |
          static:
            name: "{{static_subnet_name}}_{{ external_nat_subnets[0].vlan_id }}"
            uuid: "{{result.subnet_uuid}}"
            network_ip: 10.30.30.0
            network_prefix: 24
            gateway_ip: 10.30.30.254

    - name: Include var file
      ansible.builtin.include_vars: ../vars/main.yml
    - name: Create overlay Subnet with minimum requirements
      nutanix.ncp.ntnx_subnets:
        state: present
        nutanix_host: "{{ ip }}"
        nutanix_username: "{{ username | default(omit) }}"
        nutanix_password: "{{ password | default(omit) }}"
        nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
        nutanix_debug: "{{ nutanix_debug | default(omit) }}"
        nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
        validate_certs: false
        name: "{{overlay_subnet.name}}_{{ external_nat_subnets[0].vlan_id }}"
        overlay_subnet:
          vpc:
            uuid: "{{ vpc.uuid }}"
          ipam:
            network_ip: "{{overlay_subnet.network_ip}}"
            network_prefix: "{{overlay_subnet.network_prefix}}"
            gateway_ip: "{{overlay_subnet.gateway_ip}}"
      register: result

    - name: Insert overlay subnet configuration block to var file
      ansible.builtin.blockinfile:
        path: ../vars/main.yml
        marker: "# {mark} ANSIBLE MANAGED BLOCK insertion 4"
        block: |
          overlay:
            name: "{{overlay_subnet.name}}_{{ external_nat_subnets[0].vlan_id }}"
            uuid: "{{result.subnet_uuid}}"

    - name: Create VM with overlay subnet
      nutanix.ncp.ntnx_vms:
        state: present
        nutanix_host: "{{ ip }}"
        nutanix_username: "{{ username | default(omit) }}"
        nutanix_password: "{{ password | default(omit) }}"
        nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
        nutanix_debug: "{{ nutanix_debug | default(omit) }}"
        nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
        validate_certs: false
        name: "{{vm_name}}_{{ external_nat_subnets[0].vlan_id }}"
        cluster:
          uuid: "{{ cluster.uuid }}"
        networks:
          - is_connected: true
            subnet:
              name: "{{overlay_subnet.name}}_{{ external_nat_subnets[0].vlan_id }}"
            private_ip: "{{overlay_subnet.private_ip}}"
          - is_connected: true
            subnet:
              name: "{{overlay_subnet.name}}_{{ external_nat_subnets[0].vlan_id }}"
            private_ip: "{{overlay_subnet.private_ip1}}"
      register: result

    - name: Insert vm configuration block to var file
      ansible.builtin.blockinfile:
        path: ../vars/main.yml
        marker: "# {mark} ANSIBLE MANAGED BLOCK insertion 5"
        block: |
          vm:
            name: "{{vm_name}}_{{ external_nat_subnets[0].vlan_id }}"
            uuid: "{{result.vm_uuid}}"

    # - name: create VM with static subnet for dr tests
    #   nutanix.ncp.ntnx_vms:
