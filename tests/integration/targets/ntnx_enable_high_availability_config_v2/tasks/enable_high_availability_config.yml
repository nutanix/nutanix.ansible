---
# Test plan for ntnx_enable_high_availability_config_v2
#   1. Discover AOS cluster
#   2. check_mode with inline dummy (all attributes)
#   3. check_mode with dryrun
#   4. Negative: missing cluster_ext_id
#   5. Negative: missing host_failures_to_tolerate_count
#   6. Negative: invalid cluster_ext_id
#   7. Live enable with dryrun validation
#   8. Live enable

- name: Start enable high availability config tests
  ansible.builtin.debug:
    msg: Start ntnx_enable_high_availability_config_v2 tests

- name: Set placeholder IDs
  ansible.builtin.set_fact:
    placeholder_cluster_ext_id: "00061fa4-ef93-7dd8-185b-ac1f6b6f97e2"
    fake_cluster_ext_id: "00000000-0000-0000-0000-000000000001"

####################################################################
# 1. Prerequisite discovery
####################################################################

- name: List AOS clusters to pick target
  nutanix.ncp.ntnx_clusters_info_v2:
    filter: "config/clusterFunction/any(t:t eq Clustermgmt.Config.ClusterFunctionRef'AOS')"
  register: clusters_result
  ignore_errors: true

- name: Set target cluster ext_id
  ansible.builtin.set_fact:
    target_cluster_ext_id: "{{ clusters_result.response[0].ext_id }}"
  when:
    - clusters_result is defined
    - not clusters_result.failed
    - clusters_result.response is defined
    - clusters_result.response | length > 0

- name: Fallback target cluster ext_id
  ansible.builtin.set_fact:
    target_cluster_ext_id: "{{ placeholder_cluster_ext_id }}"
  when: target_cluster_ext_id is not defined

####################################################################
# 2. Check mode with inline dummy - all fields
####################################################################

- name: Enable HA in check mode with all attributes (inline dummy)
  nutanix.ncp.ntnx_enable_high_availability_config_v2:
    cluster_ext_id: "22222222-2222-2222-2222-222222222222"
    host_failures_to_tolerate_count: 1
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify check mode enable HA with all attributes
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.host_failures_to_tolerate_count == 1
    success_msg: "Check mode enable HA with all attributes passed"
    fail_msg: "Check mode enable HA with all attributes failed"

####################################################################
# 3. Check mode with dryrun
####################################################################

- name: Enable HA in check mode with dryrun (inline dummy)
  nutanix.ncp.ntnx_enable_high_availability_config_v2:
    cluster_ext_id: "33333333-3333-3333-3333-333333333333"
    host_failures_to_tolerate_count: 2
    dryrun: true
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify check mode enable HA with dryrun
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
    success_msg: "Check mode enable HA with dryrun passed"
    fail_msg: "Check mode enable HA with dryrun failed"

####################################################################
# 4 & 5. Negative: missing required fields
####################################################################

- name: Enable HA with missing cluster_ext_id (should fail)
  nutanix.ncp.ntnx_enable_high_availability_config_v2:
    host_failures_to_tolerate_count: 1
  register: result
  ignore_errors: true

- name: Verify missing cluster_ext_id fails
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    success_msg: "Missing cluster_ext_id correctly failed"
    fail_msg: "Missing cluster_ext_id did not fail as expected"

- name: Enable HA with missing host_failures_to_tolerate_count (should fail)
  nutanix.ncp.ntnx_enable_high_availability_config_v2:
    cluster_ext_id: "{{ placeholder_cluster_ext_id }}"
  register: result
  ignore_errors: true

- name: Verify missing host_failures_to_tolerate_count fails
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    success_msg: "Missing host_failures_to_tolerate_count correctly failed"
    fail_msg: "Missing host_failures_to_tolerate_count did not fail as expected"

####################################################################
# 6. Negative: invalid cluster_ext_id
####################################################################

- name: Enable HA with invalid cluster_ext_id
  nutanix.ncp.ntnx_enable_high_availability_config_v2:
    cluster_ext_id: "{{ fake_cluster_ext_id }}"
    host_failures_to_tolerate_count: 1
  register: result
  ignore_errors: true

- name: Verify invalid cluster_ext_id fails
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
    success_msg: "Invalid cluster_ext_id correctly failed"
    fail_msg: "Invalid cluster_ext_id did not fail as expected"

####################################################################
# 7 & 8. Live enable with dryrun and without
####################################################################

- name: Enable HA with dryrun validation on target cluster (live)
  nutanix.ncp.ntnx_enable_high_availability_config_v2:
    cluster_ext_id: "{{ target_cluster_ext_id }}"
    host_failures_to_tolerate_count: 1
    dryrun: true
  register: result
  ignore_errors: true

- name: Verify live enable HA dryrun result
  ansible.builtin.assert:
    that:
      - result is defined
    success_msg: "Live enable HA dryrun executed"
    fail_msg: "Live enable HA dryrun unexpected"

- name: Enable HA on target cluster (live)
  nutanix.ncp.ntnx_enable_high_availability_config_v2:
    cluster_ext_id: "{{ target_cluster_ext_id }}"
    host_failures_to_tolerate_count: 1
  register: result
  ignore_errors: true

- name: Verify live enable HA result
  ansible.builtin.assert:
    that:
      - result is defined
    success_msg: "Live enable HA executed"
    fail_msg: "Live enable HA unexpected"

- name: Verify live enable changed when succeeded
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.response is defined
      - result.task_ext_id is defined
    success_msg: "Live enable HA changed correctly"
    fail_msg: "Live enable HA did not report changed"
  when: not result.failed
