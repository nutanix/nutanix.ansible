---
# Test plan for ntnx_files_recommendation_v2 and ntnx_files_recommendations_info_v2
#
# Recommendations are generated by the file server (One-Click Performance Optimizer)
# to advise SCALE_UP, SCALE_OUT or REBALANCE actions. The SDK exposes only
# Get / List / Delete for this entity (no Create/Update), so the tests cover:
#   Input validation / module logic (no live data needed):
#     1. Info module - missing required file_server_ext_id -> argument error.
#     2. CRUD module - state=present not supported -> descriptive error.
#     3. CRUD module - delete with missing ext_id -> required_if error.
#   Error paths against the live cluster:
#     4. Info module - list with invalid file_server_ext_id -> descriptive error.
#     5. Info module - get with invalid ext_id -> descriptive error.
#     6. CRUD module - delete with invalid ext_id -> descriptive error.
#   Happy-path lifecycle against the live cluster:
#     7. Info module - list all recommendations for the file server (may be empty).
#     8. Info module - list with limit (when recommendations exist).
#     9. Info module - list with filter on recommendationType (when recommendations exist).
#    10. Info module - get by ext_id (when recommendations exist); assert enum + fields.
#    11. CRUD module - delete check_mode -> "will be deleted" msg, changed false.
#    12. CRUD module - real delete of a recommendation (when one exists).

- name: Start Files Recommendation tests
  ansible.builtin.debug:
    msg: Start Files Recommendation tests

- name: Set recommendation test facts
  ansible.builtin.set_fact:
    file_server_ext_id: "{{ files_recommendation.file_server_ext_id }}"
    invalid_ext_id: "00000000-0000-0000-0000-000000000000"

- name: Verify file_server_ext_id prerequisite is provided
  ansible.builtin.assert:
    that:
      - file_server_ext_id is defined
      - file_server_ext_id | length > 0
    success_msg: "file_server_ext_id prerequisite is provided"
    fail_msg: "file_server_ext_id must be set in integration_config.yml (files_recommendation.file_server_ext_id)"

########################################################################################
# Input validation / module logic tests (no live data required)
########################################################################################

- name: Info - list recommendations with missing file_server_ext_id
  nutanix.ncp.ntnx_files_recommendations_info_v2: {}
  register: result
  ignore_errors: true

- name: Info - list recommendations with missing file_server_ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - "'file_server_ext_id' in result.msg"
    success_msg: "List recommendations with missing file_server_ext_id failed as expected"
    fail_msg: "List recommendations with missing file_server_ext_id did not fail as expected"

- name: Delete recommendation with state=present (unsupported)
  nutanix.ncp.ntnx_files_recommendation_v2:
    state: present
    file_server_ext_id: "{{ file_server_ext_id }}"
    ext_id: "{{ invalid_ext_id }}"
  register: result
  ignore_errors: true

- name: Delete recommendation with state=present (unsupported) status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - "'cannot be created' in result.msg"
    success_msg: "state=present correctly reported as unsupported"
    fail_msg: "state=present did not fail as expected"

- name: Delete recommendation with missing ext_id
  nutanix.ncp.ntnx_files_recommendation_v2:
    state: absent
    file_server_ext_id: "{{ file_server_ext_id }}"
  register: result
  ignore_errors: true

- name: Delete recommendation with missing ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - "'state is absent but all of the following are missing: ext_id' in result.msg"
    success_msg: "Delete recommendation with missing ext_id failed as expected"
    fail_msg: "Delete recommendation with missing ext_id did not fail as expected"

########################################################################################
# Error paths against the live cluster
########################################################################################

- name: Info - list recommendations with invalid file server ext_id
  nutanix.ncp.ntnx_files_recommendations_info_v2:
    file_server_ext_id: "{{ invalid_ext_id }}"
  register: result
  ignore_errors: true

- name: Info - list recommendations with invalid file server ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
    success_msg: "List recommendations with invalid file server ext_id failed as expected"
    fail_msg: "List recommendations with invalid file server ext_id did not fail as expected"

- name: Get recommendation with invalid ext_id
  nutanix.ncp.ntnx_files_recommendations_info_v2:
    file_server_ext_id: "{{ file_server_ext_id }}"
    ext_id: "{{ invalid_ext_id }}"
  register: result
  ignore_errors: true

- name: Get recommendation with invalid ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
    success_msg: "Get recommendation with invalid ext_id failed as expected"
    fail_msg: "Get recommendation with invalid ext_id did not fail as expected"

- name: Delete recommendation with invalid ext_id
  nutanix.ncp.ntnx_files_recommendation_v2:
    state: absent
    file_server_ext_id: "{{ file_server_ext_id }}"
    ext_id: "{{ invalid_ext_id }}"
  register: result
  ignore_errors: true

- name: Delete recommendation with invalid ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
    success_msg: "Delete recommendation with invalid ext_id failed as expected"
    fail_msg: "Delete recommendation with invalid ext_id did not fail as expected"

########################################################################################
# Info Module Tests - Happy-path list
########################################################################################

- name: List all recommendations for the file server
  nutanix.ncp.ntnx_files_recommendations_info_v2:
    file_server_ext_id: "{{ file_server_ext_id }}"
  register: list_result
  ignore_errors: true

- name: List all recommendations for the file server status
  ansible.builtin.assert:
    that:
      - list_result is defined
      - list_result.changed == false
      - list_result.failed == false
      - list_result.response is defined
      - list_result.response is iterable
      - list_result.total_available_results is defined
    success_msg: "List all recommendations for the file server passed"
    fail_msg: "List all recommendations for the file server failed"

- name: Set recommendations count
  ansible.builtin.set_fact:
    recommendations_count: "{{ list_result.response | length }}"

########################################################################################
# Info + CRUD lifecycle tests (when recommendations exist)
########################################################################################

- name: Run recommendation-dependent tests when recommendations exist
  when: recommendations_count | int > 0
  block:
    - name: Set first recommendation facts
      ansible.builtin.set_fact:
        first_recommendation_ext_id: "{{ list_result.response[0].ext_id }}"
        first_recommendation_type: "{{ list_result.response[0].recommendation_type }}"

    - name: List recommendations with limit
      nutanix.ncp.ntnx_files_recommendations_info_v2:
        file_server_ext_id: "{{ file_server_ext_id }}"
        limit: 1
      register: result
      ignore_errors: true

    - name: List recommendations with limit status
      ansible.builtin.assert:
        that:
          - result is defined
          - result.changed == false
          - result.failed == false
          - result.response is defined
          - result.response | length <= 1
        success_msg: "List recommendations with limit passed"
        fail_msg: "List recommendations with limit failed"

    - name: List recommendations with filter on recommendationType
      nutanix.ncp.ntnx_files_recommendations_info_v2:
        file_server_ext_id: "{{ file_server_ext_id }}"
        filter: "recommendationType eq Files.Config.RecommendationType'{{ first_recommendation_type }}'"
      register: result
      ignore_errors: true

    - name: List recommendations with filter on recommendationType status
      ansible.builtin.assert:
        that:
          - result is defined
          - result.changed == false
          - result.failed == false
          - result.response is defined
          - result.response | length > 0
          - result.response | selectattr('recommendation_type', 'equalto', first_recommendation_type) | list | length == result.response | length
        success_msg: "List recommendations with filter passed"
        fail_msg: "List recommendations with filter failed"

    - name: Get recommendation using ext_id
      nutanix.ncp.ntnx_files_recommendations_info_v2:
        file_server_ext_id: "{{ file_server_ext_id }}"
        ext_id: "{{ first_recommendation_ext_id }}"
      register: result
      ignore_errors: true

    - name: Get recommendation using ext_id status
      ansible.builtin.assert:
        that:
          - result is defined
          - result.changed == false
          - result.failed == false
          - result.ext_id == first_recommendation_ext_id
          - result.response is defined
          - result.response.ext_id == first_recommendation_ext_id
          - result.response.recommendation_type in ["SCALE_UP", "SCALE_OUT", "REBALANCE"]
        success_msg: "Get recommendation using ext_id passed"
        fail_msg: "Get recommendation using ext_id failed"

    - name: Delete recommendation with check mode
      nutanix.ncp.ntnx_files_recommendation_v2:
        state: absent
        file_server_ext_id: "{{ file_server_ext_id }}"
        ext_id: "{{ first_recommendation_ext_id }}"
      check_mode: true
      register: result
      ignore_errors: true

    - name: Delete recommendation with check mode status
      ansible.builtin.assert:
        that:
          - result is defined
          - result.changed == false
          - result.failed == false
          - result.ext_id == first_recommendation_ext_id
          - "'will be deleted' in result.msg"
        success_msg: "Delete recommendation with check mode passed"
        fail_msg: "Delete recommendation with check mode failed"

    - name: Delete recommendation (real)
      nutanix.ncp.ntnx_files_recommendation_v2:
        state: absent
        file_server_ext_id: "{{ file_server_ext_id }}"
        ext_id: "{{ first_recommendation_ext_id }}"
      register: result
      ignore_errors: true

    - name: Delete recommendation (real) status
      ansible.builtin.assert:
        that:
          - result is defined
          - result.changed == true
          - result.failed == false
          - result.ext_id == first_recommendation_ext_id
        success_msg: "Delete recommendation passed"
        fail_msg: "Delete recommendation failed"

- name: Skip recommendation-dependent tests message
  when: recommendations_count | int == 0
  ansible.builtin.debug:
    msg: >-
      No recommendations exist for file server {{ file_server_ext_id }};
      skipping get-by-id, filter, limit and real delete tests.

- name: Finish Files Recommendation tests
  ansible.builtin.debug:
    msg: Finish Files Recommendation tests
