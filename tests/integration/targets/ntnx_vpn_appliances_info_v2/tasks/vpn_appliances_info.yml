---
# Test plan (VPN appliances info)
#
# This entity is READ-ONLY. There is no create/update/delete API in the
# ntnx_networking_py_client SDK for third-party VPN appliance vendor configs -
# they are generated by the platform from the parent VPN connection.
#
# Scenarios covered below:
#   * Argument-validation errors (missing vpn_connection_ext_id,
#     mutually exclusive ext_id + filter). These do NOT require a real VPN
#     connection on the cluster.
#   * Live LIST call against a valid VPN connection - asserts the response
#     shape, total_available_results field and that each appliance dict has
#     the fields (name, ext_id) documented by the SDK. Skipped if no
#     `vpn_connection_ext_id` is available on the cluster.
#   * Live LIST with `limit` - asserts response length respects the limit.
#   * Live LIST with `filter` - asserts each returned appliance matches the
#     filter expression.
#   * Live GET-by-ID - asserts a plain-text configuration payload is returned.
#   * Idempotency: two successive gets must both return the same payload
#     and `changed=false`.
#   * Negative: get by non-existent ext_id / vpn_connection_ext_id must fail
#     with a descriptive error message.
#
# `vpn_connection_ext_id` is expected to be supplied via
# `vpn_appliance_vpn_connection_ext_id` in integration_config.yml. If it is
# not set, the live-cluster scenarios are skipped gracefully but the
# argument-validation scenarios still run.

- name: Start VPN appliances info tests
  ansible.builtin.debug:
    msg: Start VPN appliances info tests

- name: Resolve the vpn_connection_ext_id to use for the live tests
  ansible.builtin.set_fact:
    vpn_connection_ext_id: >-
      {{ vpn_appliance_vpn_connection_ext_id
         | default(vpn_connection.ext_id | default(''), true) }}

- name: Report whether a live VPN connection is available
  ansible.builtin.debug:
    msg: >-
      vpn_connection_ext_id resolved to
      "{{ vpn_connection_ext_id | default('') }}" -
      live-cluster scenarios will be
      {{ 'executed' if vpn_connection_ext_id | length > 0 else 'skipped' }}.

########################################################################################
# Argument-validation tests (no live cluster required)
########################################################################################

- name: List appliances with missing vpn_connection_ext_id (should fail)
  nutanix.ncp.ntnx_vpn_appliances_info_v2: {}
  register: result
  ignore_errors: true

- name: List appliances with missing vpn_connection_ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - "'vpn_connection_ext_id' in result.msg"
    success_msg: "List appliances with missing vpn_connection_ext_id failed as expected"
    fail_msg: "List appliances with missing vpn_connection_ext_id did not fail as expected"

- name: List appliances mutually-exclusive combination ext_id + filter (should fail)
  nutanix.ncp.ntnx_vpn_appliances_info_v2:
    vpn_connection_ext_id: "2e40ff57-20aa-4d2b-b179-298db969c20d"
    ext_id: "9f4b3d1c-6a15-4c8b-9d12-6b6b9f13a1b2"
    filter: "name eq 'PaloAlto'"
  register: result
  ignore_errors: true

- name: List appliances mutually-exclusive combination ext_id + filter status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - "'mutually exclusive' in result.msg"
    success_msg: "Mutually exclusive ext_id + filter failed as expected"
    fail_msg: "Mutually exclusive ext_id + filter did not fail as expected"

########################################################################################
# Live cluster scenarios (require vpn_connection_ext_id)
########################################################################################

- name: Live cluster scenarios for VPN appliances
  when: vpn_connection_ext_id | default('') | length > 0
  block:
    - name: List all supported VPN appliances for the VPN connection
      nutanix.ncp.ntnx_vpn_appliances_info_v2:
        vpn_connection_ext_id: "{{ vpn_connection_ext_id }}"
      register: list_all
      ignore_errors: true

    - name: List all supported VPN appliances status
      ansible.builtin.assert:
        that:
          - list_all is defined
          - list_all.changed == false
          - list_all.failed == false
          - list_all.response is defined
          - list_all.response | length > 0
          - list_all.total_available_results is defined
          - list_all.total_available_results >= (list_all.response | length)
          - list_all.vpn_connection_ext_id == vpn_connection_ext_id
        success_msg: "Listing supported VPN appliances succeeded"
        fail_msg: "Listing supported VPN appliances failed"

    - name: Assert each returned appliance has the SDK-documented fields
      ansible.builtin.assert:
        that:
          - item.ext_id is defined
          - item.ext_id | length > 0
          - item.name is defined
          - item.name | length > 0
        success_msg: "Appliance {{ item.name }} ({{ item.ext_id }}) has the expected fields"
        fail_msg: "Appliance entry is missing expected fields"
      loop: "{{ list_all.response }}"
      loop_control:
        label: "{{ item.name | default(item.ext_id) }}"

    - name: Save the first appliance ext_id for subsequent tests
      ansible.builtin.set_fact:
        appliance_ext_id: "{{ list_all.response[0].ext_id }}"
        appliance_name: "{{ list_all.response[0].name }}"

    - name: List VPN appliances with limit=1
      nutanix.ncp.ntnx_vpn_appliances_info_v2:
        vpn_connection_ext_id: "{{ vpn_connection_ext_id }}"
        limit: 1
      register: list_limit
      ignore_errors: true

    - name: List VPN appliances with limit=1 status
      ansible.builtin.assert:
        that:
          - list_limit is defined
          - list_limit.changed == false
          - list_limit.failed == false
          - list_limit.response is defined
          - list_limit.response | length == 1
          - list_limit.total_available_results is defined
          - list_limit.total_available_results >= 1
        success_msg: "List with limit=1 returned exactly one appliance"
        fail_msg: "List with limit=1 did not return exactly one appliance"

    - name: List VPN appliances with a name filter derived from a real appliance
      nutanix.ncp.ntnx_vpn_appliances_info_v2:
        vpn_connection_ext_id: "{{ vpn_connection_ext_id }}"
        filter: "name eq '{{ appliance_name }}'"
      register: list_filter
      ignore_errors: true

    - name: List VPN appliances with name filter status
      ansible.builtin.assert:
        that:
          - list_filter is defined
          - list_filter.changed == false
          - list_filter.failed == false
          - list_filter.response is defined
          - list_filter.response | length >= 1
        success_msg: "Filtering appliances by name returned matches"
        fail_msg: "Filtering appliances by name did not return matches"

    - name: Assert every filtered appliance matches the filter expression
      ansible.builtin.assert:
        that:
          - item.name == appliance_name
        success_msg: "Filtered entry {{ item.name }} matches the filter"
        fail_msg: "Filtered entry does not match the filter"
      loop: "{{ list_filter.response }}"
      loop_control:
        label: "{{ item.name | default(item.ext_id) }}"

    - name: Fetch vendor config for a specific appliance
      nutanix.ncp.ntnx_vpn_appliances_info_v2:
        vpn_connection_ext_id: "{{ vpn_connection_ext_id }}"
        ext_id: "{{ appliance_ext_id }}"
      register: info_first
      ignore_errors: true

    - name: Fetch vendor config status
      ansible.builtin.assert:
        that:
          - info_first is defined
          - info_first.changed == false
          - info_first.failed == false
          - info_first.response is defined
          - (info_first.response | string) | length > 0
          - info_first.ext_id == appliance_ext_id
          - info_first.vpn_connection_ext_id == vpn_connection_ext_id
        success_msg: "Fetching vendor config succeeded"
        fail_msg: "Fetching vendor config failed"

    - name: Fetch vendor config again to verify idempotency of read
      nutanix.ncp.ntnx_vpn_appliances_info_v2:
        vpn_connection_ext_id: "{{ vpn_connection_ext_id }}"
        ext_id: "{{ appliance_ext_id }}"
      register: info_second
      ignore_errors: true

    - name: Idempotency status
      ansible.builtin.assert:
        that:
          - info_second is defined
          - info_second.changed == false
          - info_second.failed == false
          - info_second.response is defined
          - (info_second.response | string) == (info_first.response | string)
        success_msg: "Repeat fetch returned identical payload, read is idempotent"
        fail_msg: "Repeat fetch did not return identical payload"

########################################################################################
# Negative tests against the live cluster
########################################################################################

    - name: Fetch vendor config with a non-existent ext_id (should fail)
      nutanix.ncp.ntnx_vpn_appliances_info_v2:
        vpn_connection_ext_id: "{{ vpn_connection_ext_id }}"
        ext_id: "00000000-0000-0000-0000-000000000000"
      register: not_found
      ignore_errors: true

    - name: Fetch vendor config with a non-existent ext_id status
      ansible.builtin.assert:
        that:
          - not_found is defined
          - not_found.failed == true
          - not_found.msg is defined
        success_msg: "Fetching non-existent appliance failed as expected"
        fail_msg: "Fetching non-existent appliance did not fail as expected"

    - name: Fetch vendor config with a non-existent vpn_connection_ext_id (should fail)
      nutanix.ncp.ntnx_vpn_appliances_info_v2:
        vpn_connection_ext_id: "00000000-0000-0000-0000-000000000000"
        ext_id: "{{ appliance_ext_id | default('9f4b3d1c-6a15-4c8b-9d12-6b6b9f13a1b2') }}"
      register: bad_vpn
      ignore_errors: true

    - name: Fetch vendor config with a non-existent vpn_connection_ext_id status
      ansible.builtin.assert:
        that:
          - bad_vpn is defined
          - bad_vpn.failed == true
          - bad_vpn.msg is defined
        success_msg: "Fetch with non-existent vpn_connection_ext_id failed as expected"
        fail_msg: "Fetch with non-existent vpn_connection_ext_id did not fail as expected"

- name: End VPN appliances info tests
  ansible.builtin.debug:
    msg: End VPN appliances info tests
