---
- name: Start ntnx_system_defined_policy_cluster_config_v2 tests
  ansible.builtin.debug:
    msg: "Starting ntnx_system_defined_policy_cluster_config_v2 tests"

- name: Fetch system defined policies to get IDs
  nutanix.ncp.ntnx_system_defined_policies_info_v2:
    limit: 5
  register: policies_info
  ignore_errors: true

- name: Verify policies list
  ansible.builtin.assert:
    that:
      - policies_info.failed == false
      - policies_info.response is defined
      - policies_info.response | length > 0
    fail_msg: "Failed to fetch policies for cluster config tests"
    success_msg: "Fetched policies for cluster config tests"

- name: Set sda policy ext_id
  ansible.builtin.set_fact:
    sda_policy_ext_id: "{{ policies_info.response[0].ext_id }}"

- name: Fetch cluster configs for policy
  nutanix.ncp.ntnx_system_defined_policy_cluster_configs_info_v2:
    system_defined_policy_ext_id: "{{ sda_policy_ext_id }}"
  register: cluster_configs
  ignore_errors: true

- name: Verify cluster configs list
  ansible.builtin.assert:
    that:
      - cluster_configs.failed == false
      - cluster_configs.response is defined
    fail_msg: "Failed to fetch cluster configs"
    success_msg: "Fetched cluster configs"

- name: Set cluster config ext_id
  ansible.builtin.set_fact:
    cluster_config_ext_id: "{{ cluster_configs.response[0].ext_id }}"
  when:
    - cluster_configs.response is defined
    - cluster_configs.response | length > 0
    - cluster_configs.response[0].ext_id is defined

- name: Get cluster config info
  nutanix.ncp.ntnx_system_defined_policy_cluster_configs_info_v2:
    system_defined_policy_ext_id: "{{ sda_policy_ext_id }}"
    ext_id: "{{ cluster_config_ext_id }}"
  register: result
  ignore_errors: true
  when: cluster_config_ext_id is defined

- name: Verify get cluster config
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
    fail_msg: "Get cluster config failed"
    success_msg: "Get cluster config passed"
  when: cluster_config_ext_id is defined

- name: Update cluster config with check mode
  nutanix.ncp.ntnx_system_defined_policy_cluster_config_v2:
    state: present
    system_defined_policy_ext_id: "{{ sda_policy_ext_id }}"
    ext_id: "{{ cluster_config_ext_id }}"
    is_enabled: true
  register: result
  ignore_errors: true
  check_mode: true
  when: cluster_config_ext_id is defined

- name: Verify check mode update
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
    fail_msg: "Check mode update failed"
    success_msg: "Check mode update passed"
  when: cluster_config_ext_id is defined

- name: Update cluster config with missing required fields negative  # noqa: args[module]
  nutanix.ncp.ntnx_system_defined_policy_cluster_config_v2:
    state: present
  register: result
  ignore_errors: true

- name: Verify missing fields fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Missing required fields should fail"
    success_msg: "Missing required fields correctly failed"

- name: Update with invalid IDs negative
  nutanix.ncp.ntnx_system_defined_policy_cluster_config_v2:
    state: present
    system_defined_policy_ext_id: "00000000-0000-0000-0000-000000000000"
    ext_id: "00000000-0000-0000-0000-000000000000"
    is_enabled: true
  register: result
  ignore_errors: true

- name: Verify invalid IDs fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Invalid IDs should fail"
    success_msg: "Invalid IDs correctly failed"
  when: cluster_config_ext_id is not defined

- name: Update cluster config live if available
  nutanix.ncp.ntnx_system_defined_policy_cluster_config_v2:
    state: present
    system_defined_policy_ext_id: "{{ sda_policy_ext_id }}"
    ext_id: "{{ cluster_config_ext_id }}"
    is_enabled: true
  register: result
  ignore_errors: true
  when: cluster_config_ext_id is defined

- name: Verify live update
  ansible.builtin.assert:
    that:
      - result.failed == false
    fail_msg: "Live update failed"
    success_msg: "Live update passed"
  when: cluster_config_ext_id is defined
