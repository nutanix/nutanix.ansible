- name: Power on non-existent ESXi VM
  nutanix.ncp.ntnx_esxi_vms_power_actions_v2:
    state: power_on
    ext_id: "00000000-0000-0000-0000-000000000001"
  register: result
  ignore_errors: true

- name: Assert power on of non-existent ESXi VM fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
      - result.msg is defined
    fail_msg: Power on of non-existent ESXi VM did not fail
    success_msg: Power on of non-existent ESXi VM failed as expected
