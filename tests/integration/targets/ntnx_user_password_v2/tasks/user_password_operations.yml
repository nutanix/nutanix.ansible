---
- name: Start ntnx_user_password_v2 tests
  ansible.builtin.debug:
    msg: start ntnx_user_password_v2 tests

- name: Generate random names
  ansible.builtin.set_fact:
    random_string: "{{ query('community.general.random_string', numbers=false, special=false, length=12) }}"
    todelete: []

- name: Ensure Pattern Compliance
  ansible.builtin.set_fact:
    random: "user_ansible_pwd_{{ random_string | regex_replace('[^a-zA-Z0-9]', '') }}"
    starting_password: "OldStrong.Password.123"
    reset_password: "ResetStrong.Password.123"
    changed_password: "ChangedStrong.Password.123"
    other_user_password: "OtherStrong.Password.789"

- name: Set test usernames
  ansible.builtin.set_fact:
    target_username: "{{ random }}_target"
    other_username: "{{ random }}_other"

########################################################################################

- name: Create temporary local user (target of password actions)
  nutanix.ncp.ntnx_users_v2:
    user_type: LOCAL
    username: "{{ target_username }}"
    first_name: "{{ random }}_firstname"
    last_name: "{{ random }}_lastname"
    display_name: "{{ random }}_display"
    password: "{{ starting_password }}"
    email_id: "{{ random }}@example.com"
    locale: en-US
    status: ACTIVE
    is_force_reset_password_enabled: false
  register: result
  ignore_errors: true

- name: Debug Create temporary local user (target of password actions) result
  ansible.builtin.debug:
    var: result

- name: Create temporary local user (target of password actions) status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.response.ext_id == result.ext_id
      - result.response.user_type == "LOCAL"
      - result.response.username | lower == target_username | lower
      - result.response.first_name == "{{ random }}_firstname"
      - result.response.last_name == "{{ random }}_lastname"
      - result.response.display_name == "{{ random }}_display"
      - result.response.email_id == "{{ random }}@example.com"
      - result.response.locale == "en-US"
      - result.response.status == "ACTIVE"
      - result.response.is_force_reset_password_enabled == false
    fail_msg: "Could not create the temporary target user"
    success_msg: "Temporary target user created"

- name: Store target user ext_id
  ansible.builtin.set_fact:
    target_ext_id: "{{ result.ext_id }}"
    todelete: "{{ todelete + [result.ext_id] }}"

- name: Create secondary local user (used for negative admin-change test)
  nutanix.ncp.ntnx_users_v2:
    user_type: LOCAL
    username: "{{ other_username }}"
    first_name: "{{ random }}_other_firstname"
    last_name: "{{ random }}_other_lastname"
    password: "{{ other_user_password }}"
    email_id: "{{ random }}_other@example.com"
    locale: en-US
    status: ACTIVE
    is_force_reset_password_enabled: false
  register: result
  ignore_errors: true

- name: Debug Create secondary local user (used for negative admin-change test) result
  ansible.builtin.debug:
    var: result

- name: Create secondary local user status
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.response.ext_id == result.ext_id
      - result.response.user_type == "LOCAL"
      - result.response.username | lower == other_username | lower
      - result.response.first_name == "{{ random }}_other_firstname"
      - result.response.last_name == "{{ random }}_other_lastname"
      - result.response.email_id == "{{ random }}_other@example.com"
      - result.response.locale == "en-US"
      - result.response.status == "ACTIVE"
      - result.response.is_force_reset_password_enabled == false
    fail_msg: "Could not create the secondary user"
    success_msg: "Secondary user created"

- name: Store secondary user ext_id
  ansible.builtin.set_fact:
    other_ext_id: "{{ result.ext_id }}"
    todelete: "{{ todelete + [result.ext_id] }}"

########################################################################################

- name: Generate spec for resetting user password using check mode
  nutanix.ncp.ntnx_user_password_v2:
    state: present
    ext_id: "{{ target_ext_id }}"
    new_password: "{{ reset_password }}"
  check_mode: true
  register: result
  ignore_errors: true

- name: Debug Generate spec for resetting user password using check mode result
  ansible.builtin.debug:
    var: result

- name: Generate spec for resetting user password using check mode status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.ext_id == target_ext_id
      - result.response is defined
      - result.response.new_password is defined
    fail_msg: "Reset password check mode failed"
    success_msg: "Reset password check mode passed"

########################################################################################

- name: Generate spec for changing user password using check mode
  nutanix.ncp.ntnx_user_password_v2:
    state: present
    username: "{{ target_username }}"
    old_password: "{{ starting_password }}"
    new_password: "{{ reset_password }}"
  check_mode: true
  register: result
  ignore_errors: true

- name: Debug Generate spec for changing user password using check mode result
  ansible.builtin.debug:
    var: result

- name: Generate spec for changing user password using check mode status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.username == target_username
      - result.response.old_password is defined
      - result.response.new_password is defined
    fail_msg: "Change password check mode failed"
    success_msg: "Change password check mode passed"

########################################################################################
# Reset password (admin)
########################################################################################

- name: Reset the target user's password
  nutanix.ncp.ntnx_user_password_v2:
    state: present
    ext_id: "{{ target_ext_id }}"
    new_password: "{{ reset_password }}"
  register: result
  ignore_errors: true

- name: Debug Reset the target user's password result
  ansible.builtin.debug:
    var: result

- name: Reset the target user's password status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id == target_ext_id
      - result.response is defined
      - result.response.message == "User Password reset successful."
    fail_msg: "Reset password did not succeed: {{ result }}"
    success_msg: "Reset password succeeded"

#####################################################################################################################################

- name: Change the target user's password
  nutanix.ncp.ntnx_user_password_v2:
    nutanix_api_key: "{{ omit }}"
    nutanix_username: "{{ target_username | lower }}"
    nutanix_password: "{{ reset_password }}"
    state: present
    username: "{{ target_username | lower }}"
    old_password: "{{ reset_password }}"
    new_password: "{{ changed_password }}"
  register: result
  ignore_errors: true

- name: Debug Change the target user's password result
  ansible.builtin.debug:
    var: result

- name: Change the target user's password status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.response.message == "User Password change successful."
    fail_msg: "Change password did not succeed: {{ result }}"
    success_msg: "Change password succeeded"

########################################################################################
# Negative / error tests
########################################################################################

- name: Reset password with wrong external ID
  nutanix.ncp.ntnx_user_password_v2:
    state: present
    ext_id: "00000000-0000-0000-0000-000000000001"
    new_password: "{{ reset_password }}"
  register: result
  ignore_errors: true

- name: Debug Reset password with wrong external ID result
  ansible.builtin.debug:
    var: result

- name: Reset password with wrong external ID status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
      - result.msg == "Api Exception raised while resetting user password"
      - result.response is defined
      - result.response.data.error | length > 0
    fail_msg: "Reset with bogus ext_id should have failed"
    success_msg: "Reset with bogus ext_id failed as expected"

- name: Change password with wrong old password
  nutanix.ncp.ntnx_user_password_v2:
    state: present
    username: "{{ username }}"
    old_password: "definitely.not.the.password"
    new_password: "AnotherStrong.Password.123"
  register: result
  ignore_errors: true

- name: Debug Change password with wrong old password result
  ansible.builtin.debug:
    var: result

- name: Change password with wrong old password status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
      - result.msg == "Api Exception raised while changing user password"
      - result.response is defined
      - result.response.data.error | length > 0
    fail_msg: "Change with wrong old_password should have failed"
    success_msg: "Change with wrong old_password failed as expected"

- name: Admin attempting to change another user's password
  nutanix.ncp.ntnx_user_password_v2:
    state: present
    username: "{{ other_username }}"
    old_password: "{{ other_user_password }}"
    new_password: "SomeNew.Password.123"
  register: result
  ignore_errors: true

- name: Debug Admin attempting to change another user's password result
  ansible.builtin.debug:
    var: result

- name: Admin attempting to change another user's password status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
      - result.msg == "Api Exception raised while changing user password"
      - result.response is defined
      - result.response.data.error | length > 0
    fail_msg: "Admin change on other user should have failed"
    success_msg: "Admin change on other user failed as expected"

- name: Reset password with missing new_password
  nutanix.ncp.ntnx_user_password_v2:
    state: present
    ext_id: "{{ target_ext_id }}"
  register: result
  ignore_errors: true

- name: Debug Reset password with missing new_password result
  ansible.builtin.debug:
    var: result

- name: Reset password with missing new_password status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
      - '"missing required arguments: new_password" in result.msg'
    fail_msg: "Argument spec should require new_password"
    success_msg: "Argument spec rejected missing new_password"

- name: Reset password with ext_id and username together
  nutanix.ncp.ntnx_user_password_v2:
    state: present
    ext_id: "{{ target_ext_id }}"
    username: "{{ target_username }}"
    old_password: "{{ reset_password }}"
    new_password: "does.not.matter.123"
  register: result
  ignore_errors: true

- name: Debug Reset password with ext_id and username together result
  ansible.builtin.debug:
    var: result

- name: Reset password with ext_id and username together status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
      - '"parameters are mutually exclusive: ext_id|username, ext_id|old_password" in result.msg'
    fail_msg: "Argument spec should reject ext_id + username together"
    success_msg: "Mutual exclusion enforced"

- name: Reset password with neither ext_id nor username
  nutanix.ncp.ntnx_user_password_v2:
    state: present
    new_password: "does.not.matter.123"
  register: result
  ignore_errors: true

- name: Debug Reset password with neither ext_id nor username result
  ansible.builtin.debug:
    var: result

- name: Reset password with neither ext_id nor username status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
      - '"one of the following is required: ext_id, username" in result.msg'
    fail_msg: "Argument spec should require one of ext_id or username"
    success_msg: "required_one_of enforced"

- name: Change password with username and missing old_password
  nutanix.ncp.ntnx_user_password_v2:
    state: present
    username: "{{ target_username }}"
    new_password: "does.not.matter.123"
  register: result
  ignore_errors: true

- name: Debug Change password with username and missing old_password result
  ansible.builtin.debug:
    var: result

- name: Change password with username and missing old_password status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
      - '"parameters are required together: username, old_password" in result.msg'
    fail_msg: "Argument spec should require username+old_password together"
    success_msg: "required_together enforced"

########################################################################################
# Cleanup - use V3 delete API (same as ntnx_users_v2; V4 delete unavailable)
########################################################################################

- name: Delete created users
  nutanix.ncp.ntnx_users:
    state: absent
    user_uuid: "{{ item }}"
  loop: "{{ todelete }}"
  register: result
  ignore_errors: true
  when: todelete | length > 0

- name: Debug Delete created users result
  ansible.builtin.debug:
    var: result

- name: Delete created users status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.msg == "All items completed"
      - result.results | length == todelete | length
      - item.failed == false
    fail_msg: "Delete created users failed"
    success_msg: "Delete created users passed"
  loop: "{{ result.results }}"
  when: todelete | length > 0 and result | length > 0

- name: Reset todelete list
  ansible.builtin.set_fact:
    todelete: []
