---
- name: Set module defaults
  module_defaults:
    group/nutanix.ncp.ntnx:
      nutanix_host: "{{ ip }}"
      nutanix_username: "{{ username | default(omit) }}"
      nutanix_password: "{{ password | default(omit) }}"
      nutanix_api_key: "{{ nutanix_api_key | default(omit) }}"
      validate_certs: "{{ validate_certs }}"
      nutanix_debug: "{{ nutanix_debug | default(omit) }}"
      nutanix_log_file: "{{ nutanix_log_file | default(omit) }}"
  block:
    - name: Import volume disk stats info tests
      ansible.builtin.import_tasks: "volume_disk_stats.yml"
  rescue:
    - name: Attempt to delete any leftover Volume Disk
      nutanix.ncp.ntnx_volume_groups_disks_v2:
        state: absent
        volume_group_ext_id: "{{ vg_uuid | default(omit) }}"
        ext_id: "{{ disk_uuid | default(omit) }}"
      when:
        - vg_uuid is defined
        - disk_uuid is defined
      ignore_errors: true

    - name: Attempt to delete any leftover Volume Group
      nutanix.ncp.ntnx_volume_groups_v2:
        state: absent
        ext_id: "{{ vg_uuid | default(omit) }}"
      when:
        - vg_uuid is defined
      ignore_errors: true

    - name: Surface original failure
      ansible.builtin.fail:
        msg: "ntnx_volume_disk_stats_info_v2 tests failed; leftover resources (if any) were cleaned up in rescue."
