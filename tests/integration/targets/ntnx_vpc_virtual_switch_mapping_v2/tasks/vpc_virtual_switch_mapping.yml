---
- name: Start VPC Virtual Switch Mapping tests
  ansible.builtin.debug:
    msg: Start VPC Virtual Switch Mapping tests

- name: Generate random names
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"
    suffix_name: "ansible"
    todelete_categories: []

- name: Set names for virtual switch and categories
  ansible.builtin.set_fact:
    vs_name: "vs_{{ suffix_name }}_{{ random_name }}_vpc_map"
    category_key_1: "{{ random_name }}{{ suffix_name }}_key1"
    category_value_1: "{{ random_name }}{{ suffix_name }}_value1"
    category_key_2: "{{ random_name }}{{ suffix_name }}_key2"
    category_value_2: "{{ random_name }}{{ suffix_name }}_value2"

- name: Set bridge interface network config for new virtual switch
  ansible.builtin.set_fact:
    vs_host_bridge_ip: "192.168.100.10"
    vs_host_bridge_prefix_length: 24
    vs_gateway_ip: "192.168.100.1"
    vs_vlan_identifier: 100

########################################################################################
# Step 1: List all existing VPC virtual switch mappings (initial state)
########################################################################################

- name: List all VPC virtual switch mappings (initial state)
  nutanix.ncp.ntnx_vpc_virtual_switch_mappings_info_v2:
  register: initial_mappings
  ignore_errors: true

- name: Assert initial mappings listed successfully
  ansible.builtin.assert:
    that:
      - initial_mappings is defined
      - initial_mappings.failed == false
      - initial_mappings.changed == false
      - initial_mappings.response is defined
    success_msg: "Initial VPC virtual switch mappings listed successfully"
    fail_msg: "Failed to list initial VPC virtual switch mappings"

- name: Save initial mappings spec for restore at cleanup
  ansible.builtin.set_fact:
    initial_mappings_restore: >-
      {{ initial_mappings.response
         | map('combine', {})
         | list
         | json_query('[].{virtual_switch_uuid: virtual_switch_uuid,
                            cluster_uuids: cluster_uuids,
                            is_all_traffic_permitted: is_all_traffic_permitted}') }}

########################################################################################
# Step 2: Fetch hosts in cluster and create a virtual switch
########################################################################################

- name: Fetch hosts in cluster
  nutanix.ncp.ntnx_hosts_info_v2:
    cluster_ext_id: "{{ cluster.uuid }}"
  register: hosts_info
  ignore_errors: true

- name: Assert hosts in cluster fetched
  ansible.builtin.assert:
    that:
      - hosts_info is defined
      - hosts_info.failed == false
      - hosts_info.response is defined
      - hosts_info.response | length > 0
    success_msg: "Hosts in cluster fetched successfully"
    fail_msg: "Failed to fetch hosts in cluster"

- name: Set host ext_id
  ansible.builtin.set_fact:
    host_ext_id: "{{ hosts_info.response[0].ext_id }}"

- name: Create virtual switch with bridge interface IP configured on host
  nutanix.ncp.ntnx_virtual_switch_v2:
    name: "{{ vs_name }}"
    bond_mode: "NONE"
    clusters:
      - ext_id: "{{ cluster.uuid }}"
        hosts:
          - ext_id: "{{ host_ext_id }}"
            ip_address:
              ip:
                value: "{{ vs_host_bridge_ip }}"
                prefix_length: "{{ vs_host_bridge_prefix_length }}"
              prefix_length: "{{ vs_host_bridge_prefix_length }}"
        gateway_ip_address:
          value: "{{ vs_gateway_ip }}"
          prefix_length: "{{ vs_host_bridge_prefix_length }}"
        vlan_identifier: "{{ vs_vlan_identifier }}"
  register: vs_create_result
  ignore_errors: true

- name: Assert virtual switch created successfully with bridge interface IP
  ansible.builtin.assert:
    that:
      - vs_create_result is defined
      - vs_create_result.changed == true
      - vs_create_result.failed == false
      - vs_create_result.ext_id is defined
      - vs_create_result.task_ext_id is defined
      - vs_create_result.response is defined
      - vs_create_result.response.name == vs_name
      - vs_create_result.response.clusters | length == 1
      - vs_create_result.response.clusters[0].ext_id == cluster.uuid
      - vs_create_result.response.clusters[0].hosts | length == 1
      - vs_create_result.response.clusters[0].hosts[0].ext_id == host_ext_id
      - vs_create_result.response.clusters[0].hosts[0].ip_address.ip.value == vs_host_bridge_ip
      - vs_create_result.response.clusters[0].hosts[0].ip_address.prefix_length == vs_host_bridge_prefix_length
      - vs_create_result.response.clusters[0].gateway_ip_address.value == vs_gateway_ip
      - vs_create_result.response.clusters[0].vlan_identifier == vs_vlan_identifier
    success_msg: "Virtual switch with bridge interface IP created successfully"
    fail_msg: "Virtual switch creation failed"

- name: Save virtual switch ext_id
  ansible.builtin.set_fact:
    virtual_switch_uuid: "{{ vs_create_result.ext_id }}"

########################################################################################
# Step 3: Create two categories with random keys and values
########################################################################################

- name: Create first category
  nutanix.ncp.ntnx_categories_v2:
    key: "{{ category_key_1 }}"
    value: "{{ category_value_1 }}"
    description: "Category 1 for VPC virtual switch mapping tests"
  register: category_1_result
  ignore_errors: true

- name: Assert first category created
  ansible.builtin.assert:
    that:
      - category_1_result is defined
      - category_1_result.failed == false
      - category_1_result.changed == true
      - category_1_result.response is defined
      - category_1_result.response.ext_id is defined
      - category_1_result.response.key == category_key_1
      - category_1_result.response.value == category_value_1
    success_msg: "First category created successfully"
    fail_msg: "Failed to create first category"

- name: Save first category ext_id
  ansible.builtin.set_fact:
    category_ext_id_1: "{{ category_1_result.response.ext_id }}"
    todelete_categories: "{{ todelete_categories + [category_1_result.response.ext_id] }}"

- name: Create second category
  nutanix.ncp.ntnx_categories_v2:
    key: "{{ category_key_2 }}"
    value: "{{ category_value_2 }}"
    description: "Category 2 for VPC virtual switch mapping tests"
  register: category_2_result
  ignore_errors: true

- name: Assert second category created
  ansible.builtin.assert:
    that:
      - category_2_result is defined
      - category_2_result.failed == false
      - category_2_result.changed == true
      - category_2_result.response is defined
      - category_2_result.response.ext_id is defined
      - category_2_result.response.key == category_key_2
      - category_2_result.response.value == category_value_2
    success_msg: "Second category created successfully"
    fail_msg: "Failed to create second category"

- name: Save second category ext_id
  ansible.builtin.set_fact:
    category_ext_id_2: "{{ category_2_result.response.ext_id }}"
    todelete_categories: "{{ todelete_categories + [category_2_result.response.ext_id] }}"

########################################################################################
# Step 4: Set VPC virtual switch mappings using check_mode with random hardcoded values
########################################################################################

- name: Generate spec for Setting VPC virtual switch mappings
  nutanix.ncp.ntnx_vpc_virtual_switch_mapping_v2:
    virtual_switch_mappings:
      - virtual_switch_uuid: "11111111-1111-1111-1111-111111111111"
        cluster_uuids:
          - "22222222-2222-2222-2222-222222222222"
          - "33333333-3333-3333-3333-333333333333"
        is_all_traffic_permitted: true
        metadata:
          owner_reference_id: "44444444-4444-4444-4444-444444444444"
          owner_user_name: "dummy_owner"
          project_reference_id: "55555555-5555-5555-5555-555555555555"
          project_name: "dummy_project"
          category_ids:
            - "66666666-6666-6666-6666-666666666666"
            - "77777777-7777-7777-7777-777777777777"
      - virtual_switch_uuid: "88888888-8888-8888-8888-888888888888"
        cluster_uuids:
          - "99999999-9999-9999-9999-999999999999"
        is_all_traffic_permitted: false
  check_mode: true
  register: check_mode_set_result
  ignore_errors: true

- name: Assert spec for Setting VPC virtual switch mappings generated successfully
  ansible.builtin.assert:
    that:
      - check_mode_set_result is defined
      - check_mode_set_result.failed == false
      - check_mode_set_result.changed == false
      - check_mode_set_result.response is defined
      - check_mode_set_result.response | length == 2
      - check_mode_set_result.response[0].virtual_switch_uuid == "11111111-1111-1111-1111-111111111111"
      - check_mode_set_result.response[0].cluster_uuids | length == 2
      - check_mode_set_result.response[0].is_all_traffic_permitted == true
      - check_mode_set_result.response[0].metadata.owner_reference_id == "44444444-4444-4444-4444-444444444444"
      - check_mode_set_result.response[0].metadata.owner_user_name == "dummy_owner"
      - check_mode_set_result.response[0].metadata.project_reference_id == "55555555-5555-5555-5555-555555555555"
      - check_mode_set_result.response[0].metadata.project_name == "dummy_project"
      - check_mode_set_result.response[0].metadata.category_ids | length == 2
      - check_mode_set_result.response[1].virtual_switch_uuid == "88888888-8888-8888-8888-888888888888"
      - check_mode_set_result.response[1].is_all_traffic_permitted == false
    success_msg: "Spec for Setting VPC virtual switch mappings generated successfully"
    fail_msg: "Spec for Setting VPC virtual switch mappings generation failed"

########################################################################################
# Step 5: Set VPC virtual switch mappings with real values
########################################################################################

- name: Set VPC virtual switch mappings with metadata and newly created virtual switch
  nutanix.ncp.ntnx_vpc_virtual_switch_mapping_v2:
    virtual_switch_mappings:
      - virtual_switch_uuid: "{{ virtual_switch_uuid }}"
        cluster_uuids:
          - "{{ cluster.uuid }}"
        is_all_traffic_permitted: true
        metadata:
          owner_reference_id: "{{ owner.uuid }}"
          project_reference_id: "{{ project.uuid }}"
          project_name: "{{ project.name }}"
          category_ids:
            - "{{ category_ext_id_1 }}"
            - "{{ category_ext_id_2 }}"
  register: set_mappings_result
  ignore_errors: true

- name: Assert set VPC virtual switch mappings task succeeded
  ansible.builtin.assert:
    that:
      - set_mappings_result is defined
      - set_mappings_result.changed == true
      - set_mappings_result.failed == false
      - set_mappings_result.task_ext_id is defined
      - set_mappings_result.response is defined
      - set_mappings_result.response.status == "SUCCEEDED"
    success_msg: "Set VPC virtual switch mappings task succeeded"
    fail_msg: "Set VPC virtual switch mappings task failed"

########################################################################################
# Step 6: Negative test - set with wrong (non-existent) virtual switch External ID
########################################################################################

- name: Set VPC virtual switch mappings with wrong virtual switch External ID (should fail)
  nutanix.ncp.ntnx_vpc_virtual_switch_mapping_v2:
    virtual_switch_mappings:
      - virtual_switch_uuid: "04595a7b-010c-4a89-58dd-060c94e9a1f0"
        cluster_uuids:
          - "{{ cluster.uuid }}"
        is_all_traffic_permitted: true
  register: negative_set_result
  ignore_errors: true

- name: Assert negative set failed as expected
  ansible.builtin.assert:
    that:
      - negative_set_result is defined
      - negative_set_result.failed == true
      - negative_set_result.changed == false
      - negative_set_result.msg == "Task Failed"
      - negative_set_result.response is defined
      - negative_set_result.response.status == "FAILED"
      - negative_set_result.response.error_messages is defined
      - negative_set_result.response.error_messages | length > 0
    success_msg: "Set VPC virtual switch mappings with wrong virtual switch External ID failed as expected"
    fail_msg: "Set VPC virtual switch mappings with wrong virtual switch External ID did not fail as expected"

########################################################################################
# Step 7: List all VPC virtual switch mappings again and assert new changes
########################################################################################

- name: List all VPC virtual switch mappings after set with new configuration
  nutanix.ncp.ntnx_vpc_virtual_switch_mappings_info_v2:
  register: list_after_set_result
  ignore_errors: true

- name: Filter list to mappings for the newly created virtual switch
  ansible.builtin.set_fact:
    new_vs_mappings: >-
      {{ list_after_set_result.response
         | selectattr('virtual_switch_uuid', 'equalto', virtual_switch_uuid)
         | list }}

- name: Assert new mapping is present and configured correctly with new configuration
  ansible.builtin.assert:
    that:
      - list_after_set_result is defined
      - list_after_set_result.failed == false
      - list_after_set_result.changed == false
      - list_after_set_result.response is defined
      - list_after_set_result.response | length > 0
      - new_vs_mappings | length == 1
      - new_vs_mappings[0].virtual_switch_uuid == virtual_switch_uuid
      - new_vs_mappings[0].cluster_uuids | length == 1
      - new_vs_mappings[0].cluster_uuids[0] == cluster.uuid
      - new_vs_mappings[0].is_all_traffic_permitted == true
      - new_vs_mappings[0].ext_id is none
    success_msg: "VPC virtual switch mappings updated successfully with new configuration"
    fail_msg: "VPC virtual switch mappings do not reflect the new configuration"

########################################################################################
# Cleanup: restore initial mappings (if any) and delete created categories
########################################################################################

- name: Restore initial VPC virtual switch mappings
  nutanix.ncp.ntnx_vpc_virtual_switch_mapping_v2:
    virtual_switch_mappings: "{{ initial_mappings_restore }}"
  register: restore_mappings_result
  ignore_errors: true
  when: initial_mappings_restore | length > 0

- name: Assert restore mappings task succeeded
  ansible.builtin.assert:
    that:
      - restore_mappings_result is defined
      - restore_mappings_result.changed == true
      - restore_mappings_result.failed == false
      - restore_mappings_result.task_ext_id is defined
      - restore_mappings_result.response is defined
      - restore_mappings_result.response.status == "SUCCEEDED"
    success_msg: "Restore VPC virtual switch mappings task succeeded"
    fail_msg: "Restore VPC virtual switch mappings task failed"

- name: Delete created virtual switch
  nutanix.ncp.ntnx_virtual_switch_v2:
    ext_id: "{{ virtual_switch_uuid }}"
    state: absent
  register: delete_vs_result
  ignore_errors: true

- name: Assert virtual switch deleted
  ansible.builtin.assert:
    that:
      - delete_vs_result is defined
      - delete_vs_result.changed == true
      - delete_vs_result.failed == false
      - delete_vs_result.task_ext_id is defined
      - delete_vs_result.response is defined
      - delete_vs_result.response.status == "SUCCEEDED"
    success_msg: "Virtual switch deleted successfully"
    fail_msg: "Failed to delete virtual switch"

- name: Delete created categories
  nutanix.ncp.ntnx_categories_v2:
    ext_id: "{{ item }}"
    state: absent
  register: delete_categories_result
  loop: "{{ todelete_categories }}"
  ignore_errors: true

- name: Assert categories deletion task overall
  ansible.builtin.assert:
    that:
      - delete_categories_result is defined
      - delete_categories_result.changed == true
      - delete_categories_result.msg == "All items completed"
      - delete_categories_result.results is defined
      - delete_categories_result.results | length == todelete_categories | length
    success_msg: "All categories deletion task completed"
    fail_msg: "Categories deletion task did not complete as expected"
