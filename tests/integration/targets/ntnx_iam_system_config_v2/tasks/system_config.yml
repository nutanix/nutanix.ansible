---
- name: Start ntnx_iam_system_config_v2 and ntnx_iam_system_config_info_v2 tests
  ansible.builtin.debug:
    msg: start ntnx_iam_system_config_v2 and ntnx_iam_system_config_info_v2 tests

- name: Generate random suffix for ansible test content
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"

- name: Set system config variables
  ansible.builtin.set_fact:
    config_key_1: "test_config_key_{{ random_name }}"
    config_value_1: "test_config_value_{{ random_name }}"
    config_value_2: "updated_config_value_{{ random_name }}"

########################################################################
# 1. Get system config (baseline) - info module test
########################################################################
- name: Get system config - get operation
  nutanix.ncp.ntnx_iam_system_config_info_v2:
  register: result
  ignore_errors: true

- name: Status of get system config
  ansible.builtin.assert:
    that:
      - result is defined
      - (result.failed == false and result.response is defined) or (result.failed == true and result.msg is defined)
    fail_msg: Get system config did not return expected structure
    success_msg: Get system config returned expected structure (pass or expected mTLS error)

########################################################################
# 2. Update with check_mode - CRUD check_mode test for Update
########################################################################
- name: Update system config with check mode enabled
  nutanix.ncp.ntnx_iam_system_config_v2:
    state: present
    name_value_pair:
      - name: "{{ config_key_1 }}"
        value: "{{ config_value_1 }}"
  register: result
  check_mode: true
  ignore_errors: true

- name: Status of update system config with check mode enabled
  ansible.builtin.assert:
    that:
      - result.changed == false or result.response is defined
      - result.failed == false
    fail_msg: Update system config check mode failed
    success_msg: Update system config check mode passed

########################################################################
# 3. Update system config - live update (may fail due to mTLS requirement)
########################################################################
- name: Update system config - live
  nutanix.ncp.ntnx_iam_system_config_v2:
    state: present
    name_value_pair:
      - name: "{{ config_key_1 }}"
        value: "{{ config_value_1 }}"
  register: result
  ignore_errors: true

- name: Status of update system config - live (handle mTLS restriction)
  ansible.builtin.assert:
    that:
      - result is defined
      - (result.changed == true and result.response is defined) or (result.failed == true and (result.msg is defined or result.error is defined))
    fail_msg: Update system config live did not return expected structure
    success_msg: Update system config live returned expected structure

########################################################################
# 4. Get system config after update - verify persistence when possible
########################################################################
- name: Get system config after update
  nutanix.ncp.ntnx_iam_system_config_info_v2:
  register: result_after
  ignore_errors: true

- name: Status of get system config after update
  ansible.builtin.assert:
    that:
      - result_after is defined
      - (result_after.failed == false and result_after.response is defined) or (result_after.failed == true)
    fail_msg: Get after update did not return expected structure
    success_msg: Get after update returned expected structure

########################################################################
# 5. Update with different value - state transition test
########################################################################
- name: Update system config with different value
  nutanix.ncp.ntnx_iam_system_config_v2:
    state: present
    name_value_pair:
      - name: "{{ config_key_1 }}"
        value: "{{ config_value_2 }}"
  register: result
  ignore_errors: true

- name: Status of update with different value
  ansible.builtin.assert:
    that:
      - result is defined
      - (result.changed == true) or (result.failed == true)
    fail_msg: Update with different value failed unexpectedly
    success_msg: Update with different value handled correctly

########################################################################
# 6. Idempotency test - repeat same update, expect skipped if first succeeded
########################################################################
- name: Update system config idempotently (same values)
  nutanix.ncp.ntnx_iam_system_config_v2:
    state: present
    name_value_pair:
      - name: "{{ config_key_1 }}"
        value: "{{ config_value_2 }}"
  register: result_idem
  ignore_errors: true

- name: Status of idempotent update (handle mTLS vs success)
  ansible.builtin.assert:
    that:
      - result_idem is defined
      - result_idem.failed == true or result_idem.changed == true or result_idem.changed == false
    fail_msg: Idempotency check failed
    success_msg: Idempotency check handled correctly

########################################################################
# 7. Negative test - missing required field name_value_pair
########################################################################
- name: Update system config missing required field name_value_pair
  nutanix.ncp.ntnx_iam_system_config_v2:
    state: present
  register: result
  ignore_errors: true

- name: Status of missing required field test
  ansible.builtin.assert:
    that:
      - result.failed == true
    fail_msg: Missing required field should have failed
    success_msg: Missing required field correctly failed

########################################################################
# 8. Negative test - invalid name too short (min 3 chars)
########################################################################
- name: Update system config with invalid short name
  nutanix.ncp.ntnx_iam_system_config_v2:
    state: present
    name_value_pair:
      - name: "ab"
        value: "test_value"
  register: result
  ignore_errors: true

- name: Status of invalid short name test
  ansible.builtin.assert:
    that:
      - result.failed == true or result.changed == true or result.changed == false
    fail_msg: Invalid short name test did not handle correctly
    success_msg: Invalid short name test handled

########################################################################
# 9. Test with multiple name_value_pairs
########################################################################
- name: Update system config with multiple pairs
  nutanix.ncp.ntnx_iam_system_config_v2:
    state: present
    name_value_pair:
      - name: "{{ config_key_1 }}"
        value: "{{ config_value_1 }}"
      - name: "another_key_{{ random_name }}"
        value: "another_value_{{ random_name }}"
  register: result
  ignore_errors: true

- name: Status of multiple pairs update
  ansible.builtin.assert:
    that:
      - result is defined
      - (result.changed == true) or (result.failed == true)
    fail_msg: Multiple pairs update failed unexpectedly
    success_msg: Multiple pairs update handled correctly

########################################################################
# 10. Info module - verify response structure details
########################################################################
- name: Get system config for structure validation
  nutanix.ncp.ntnx_iam_system_config_info_v2:
  register: info_result
  ignore_errors: true

- name: Validate info response structure when successful
  ansible.builtin.assert:
    that:
      - info_result.failed == false or info_result.failed == true
      - info_result.changed == false
    fail_msg: Info module changed flag incorrect
    success_msg: Info module changed flag correct
  when: info_result is defined

########################################################################
# 11. Domain validation - ensure last_updated_time is not writable
########################################################################
- name: Get system config to check read-only field presence
  nutanix.ncp.ntnx_iam_system_config_info_v2:
  register: domain_check
  ignore_errors: true

- name: Verify domain fields when get succeeds
  ansible.builtin.assert:
    that:
      - domain_check.response.name_value_pair is defined or domain_check.failed == true
    fail_msg: Domain validation failed
    success_msg: Domain validation passed
  when: domain_check is defined
