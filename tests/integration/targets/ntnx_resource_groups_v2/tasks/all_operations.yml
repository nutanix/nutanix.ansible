---
- name: Start testing ntnx_resource_group_v2, ntnx_resource_groups_info_v2
  ansible.builtin.debug:
    msg: Start testing ntnx_resource_group_v2, ntnx_resource_groups_info_v2

- name: Generate random name
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"

- name: Set suffix name
  ansible.builtin.set_fact:
    suffix_name: "ansible-ag-rg"

- name: Generate resource group names
  ansible.builtin.set_fact:
    rg_name: "{{ suffix_name }}{{ random_name }}"

- name: Set todelete lists
  ansible.builtin.set_fact:
    todelete_rg: []
    todelete_projects: []

###########################################################
# SETUP - Create projects for resource group tests
###########################################################
- name: Create project 1 for resource group tests
  nutanix.ncp.ntnx_project_v2:
    state: present
    name: "{{ rg_name }}-project1"
    project_id: "{{ rg_name }}-project-id1"
  register: project_result1
  ignore_errors: true

- name: Verify create project 1
  ansible.builtin.assert:
    that:
      - project_result1.changed == true
      - project_result1.failed == false
      - project_result1.response is defined
      - project_result1.ext_id is defined
      - project_result1.ext_id | length > 0
      - project_result1.task_ext_id is defined
      - project_result1.response.id == rg_name ~ "-project-id1"
      - project_result1.response.name == rg_name ~ "-project1"
      - project_result1.response.state == "ACTIVE"
    fail_msg: "Create project 1 failed"
    success_msg: "Create project 1 passed"

- name: Save project 1 ext_id
  ansible.builtin.set_fact:
    project1_ext_id: "{{ project_result1.ext_id }}"
    todelete_projects: "{{ todelete_projects + [project_result1.ext_id] }}"

- name: Create project 2 for resource group tests
  nutanix.ncp.ntnx_project_v2:
    state: present
    name: "{{ rg_name }}-project2"
    project_id: "{{ rg_name }}-project-id2"
  register: project_result2
  ignore_errors: true

- name: Verify create project 2
  ansible.builtin.assert:
    that:
      - project_result2.changed == true
      - project_result2.failed == false
      - project_result2.response is defined
      - project_result2.ext_id is defined
      - project_result2.ext_id | length > 0
      - project_result2.task_ext_id is defined
      - project_result2.response.id == rg_name ~ "-project-id2"
      - project_result2.response.name == rg_name ~ "-project2"
      - project_result2.response.state == "ACTIVE"
      - project_result2.response.status == "SUCCEEDED"
    fail_msg: "Create project 2 failed"
    success_msg: "Create project 2 passed"

- name: Save project 2 ext_id
  ansible.builtin.set_fact:
    project2_ext_id: "{{ project_result2.ext_id }}"
    todelete_projects: "{{ todelete_projects + [project_result2.ext_id] }}"

###########################################################
# CHECK MODE TESTS - CREATE
###########################################################
- name: Generate spec for creating resource group using check mode
  nutanix.ncp.ntnx_resource_group_v2:
    state: present
    name: "check-mode-rg"
    project_ext_id: "83083083-0000-0000-0000-000000000000"
    placement_targets:
      - cluster_ext_id: "00064d33-1010-d636-5dc1-525400a68708"
        storage_containers:
          - ext_id: "4f4a1816-214f-4430-ba52-54fe9df34077"
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify spec of resource group create using check mode
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.name == "check-mode-rg"
      - result.response.project_ext_id == "83083083-0000-0000-0000-000000000000"
      - result.response.placement_targets | length == 1
      - result.response.placement_targets[0].cluster_ext_id == "00064d33-1010-d636-5dc1-525400a68708"
      - result.response.placement_targets[0].storage_containers | length == 1
      - result.response.placement_targets[0].storage_containers[0].ext_id == "4f4a1816-214f-4430-ba52-54fe9df34077"
    fail_msg: "Unable to generate spec for resource group create using check mode"
    success_msg: "Spec generated successfully for resource group create using check mode"

###########################################################
# CREATE OPERATIONS
###########################################################
- name: Create resource group with minimum fields (project 1)
  nutanix.ncp.ntnx_resource_group_v2:
    state: present
    name: "{{ rg_name }}1"
    project_ext_id: "{{ project1_ext_id }}"
  register: result
  ignore_errors: true

- name: Verify create with minimum fields
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.ext_id is defined
      - result.ext_id | length > 0
      - result.task_ext_id is defined
      - result.response.name == rg_name ~ "1"
      - result.response.project_ext_id == project1_ext_id
    fail_msg: "Create resource group with minimum fields failed"
    success_msg: "Create resource group with minimum fields passed"

- name: Save resource group ext_id for update tests
  ansible.builtin.set_fact:
    rg_ext_id: "{{ result.ext_id }}"

- name: Adding resource group ext_id to delete list
  ansible.builtin.set_fact:
    todelete_rg: "{{ todelete_rg + [result.ext_id] }}"

- name: Create resource group with all fields (project 2)
  nutanix.ncp.ntnx_resource_group_v2:
    state: present
    name: "{{ rg_name }}2"
    project_ext_id: "{{ project2_ext_id }}"
    placement_targets:
      - cluster_ext_id: "{{ cluster.uuid }}"
  register: result
  ignore_errors: true

- name: Verify create with all fields
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.ext_id is defined
      - result.ext_id | length > 0
      - result.task_ext_id is defined
      - result.response.name == rg_name ~ "2"
      - result.response.project_ext_id == project2_ext_id
      - result.response.placement_targets | length == 1
      - result.response.placement_targets[0].cluster_ext_id == cluster.uuid
    fail_msg: "Create resource group with all fields failed"
    success_msg: "Create resource group with all fields passed"

- name: Adding resource group ext_id to delete list
  ansible.builtin.set_fact:
    todelete_rg: "{{ todelete_rg + [result.ext_id] }}"

###########################################################
# CHECK MODE TESTS - UPDATE
###########################################################
- name: Generate spec for updating resource group name using check mode
  nutanix.ncp.ntnx_resource_group_v2:
    state: present
    ext_id: "{{ rg_ext_id }}"
    name: "{{ rg_name }}1-checkmode"
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify spec of resource group update name using check mode
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.name == rg_name ~ "1-checkmode"
      - result.ext_id == rg_ext_id
    fail_msg: "Unable to generate spec for resource group update name using check mode"
    success_msg: "Spec generated successfully for resource group update name using check mode"

- name: Verify resource group unchanged after check mode update
  nutanix.ncp.ntnx_resource_groups_info_v2:
    ext_id: "{{ rg_ext_id }}"
  register: verify_result

- name: Assert original name preserved after check mode
  ansible.builtin.assert:
    that:
      - verify_result.changed == false
      - verify_result.failed == false
      - verify_result.response.name == rg_name ~ "1"
    fail_msg: "Check mode incorrectly modified the resource group"
    success_msg: "Check mode correctly did not modify the resource group"

###########################################################
# UPDATE OPERATIONS
###########################################################
- name: Update resource group name
  nutanix.ncp.ntnx_resource_group_v2:
    state: present
    ext_id: "{{ rg_ext_id }}"
    name: "{{ rg_name }}1-updated"
  register: result
  ignore_errors: true

- name: Verify update name
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.task_ext_id is defined
      - result.ext_id == rg_ext_id
      - result.response.name == rg_name ~ "1-updated"
    fail_msg: "Update resource group name failed"
    success_msg: "Update resource group name passed"

###########################################################
# IDEMPOTENCY TEST
###########################################################
- name: Check idempotency - no changes
  nutanix.ncp.ntnx_resource_group_v2:
    state: present
    ext_id: "{{ rg_ext_id }}"
    name: "{{ rg_name }}1-updated"
  register: result
  ignore_errors: true

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.skipped == true
      - result.msg == "Nothing to change."
    fail_msg: "Idempotency check failed"
    success_msg: "Idempotency check passed"

###########################################################
# UPDATE OF project_ext_id IS BLOCKED
###########################################################
- name: Verify update of project_ext_id is not supported
  nutanix.ncp.ntnx_resource_group_v2:
    state: present
    ext_id: "{{ rg_ext_id }}"
    project_ext_id: "00000000-0000-0000-0000-000000000001"
  register: result
  ignore_errors: true

- name: Verify update of project_ext_id is blocked status
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
      - 'result.msg == "Update is not supported for the following field(s): project_ext_id"'
    fail_msg: "Update of project_ext_id should have been blocked"
    success_msg: "Update of project_ext_id is correctly blocked"

###########################################################
# CHECK MODE TESTS - DELETE
###########################################################
- name: Delete resource group with check mode
  nutanix.ncp.ntnx_resource_group_v2:
    state: absent
    ext_id: "{{ rg_ext_id }}"
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify check mode delete
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.msg is defined
      - result.ext_id == rg_ext_id
    fail_msg: "Check mode delete failed"
    success_msg: "Check mode delete passed"

- name: Verify resource group still exists after check mode delete
  nutanix.ncp.ntnx_resource_groups_info_v2:
    ext_id: "{{ rg_ext_id }}"
  register: result
  ignore_errors: true

- name: Verify resource group is not actually deleted
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.ext_id == rg_ext_id
    fail_msg: "Resource group was unexpectedly deleted by check mode"
    success_msg: "Resource group still exists after check mode delete"

###########################################################
# INFO OPERATIONS
###########################################################
- name: List all resource groups
  nutanix.ncp.ntnx_resource_groups_info_v2:
  register: list_result
  ignore_errors: true

- name: Verify list all resource groups
  ansible.builtin.assert:
    that:
      - list_result.changed == false
      - list_result.failed == false
      - list_result.response is defined
      - list_result.response | length >= 2
      - list_result.total_available_results is defined
      - list_result.total_available_results >= 2
    fail_msg: "List all resource groups failed"
    success_msg: "List all resource groups passed"

- name: Get resource group by ext_id
  nutanix.ncp.ntnx_resource_groups_info_v2:
    ext_id: "{{ rg_ext_id }}"
  register: result
  ignore_errors: true

- name: Verify get resource group by ext_id
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.ext_id == rg_ext_id
      - result.response.name == rg_name ~ "1-updated"
      - result.response.project_ext_id == project1_ext_id
    fail_msg: "Get resource group by ext_id failed"
    success_msg: "Get resource group by ext_id passed"

- name: List resource groups with filter
  nutanix.ncp.ntnx_resource_groups_info_v2:
    filter: "name eq '{{ rg_name }}1-updated'"
  register: result
  ignore_errors: true

- name: Verify list with filter
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
      - result.response[0].name == rg_name ~ "1-updated"
    fail_msg: "List resource groups with filter failed"
    success_msg: "List resource groups with filter passed"

- name: List resource groups with limit
  nutanix.ncp.ntnx_resource_groups_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: Verify list with limit
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
    fail_msg: "List resource groups with limit failed"
    success_msg: "List resource groups with limit passed"

###########################################################
# NEGATIVE SCENARIOS
###########################################################
- name: "Negative: Create resource group without name"
  nutanix.ncp.ntnx_resource_group_v2:
    state: present
    project_ext_id: "{{ project1_ext_id }}"
  register: result
  ignore_errors: true

- name: Verify create without name fails
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == true
      - "'state is present but any of the following are missing: name, ext_id' in result.msg"
    fail_msg: "Negative test - create without name should fail"
    success_msg: "Negative test - create without name correctly failed"

- name: "Negative: Update resource group with wrong ext_id"
  nutanix.ncp.ntnx_resource_group_v2:
    state: present
    ext_id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
    name: "{{ rg_name }}1-updated"
  register: result
  ignore_errors: true

- name: Verify update with wrong ext_id fails
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == true
      - "'Api Exception raised while fetching resource group using ext_id' in result.msg"
    fail_msg: "Negative test - update with wrong ext_id should fail"
    success_msg: "Negative test - update with wrong ext_id correctly failed"

- name: "Negative: Delete resource group with non-existent ext_id"
  nutanix.ncp.ntnx_resource_group_v2:
    state: absent
    ext_id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
  register: result
  ignore_errors: true

- name: Verify delete with non-existent ext_id fails
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == true
      - "'Api Exception raised while fetching resource group using ext_id' in result.msg"
    fail_msg: "Negative test - delete with non-existent ext_id should fail"
    success_msg: "Negative test - delete with non-existent ext_id correctly failed"

- name: "Negative: Get resource group info with non-existent ext_id"
  nutanix.ncp.ntnx_resource_groups_info_v2:
    ext_id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
  register: result
  ignore_errors: true

- name: Verify get info with non-existent ext_id fails
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == true
      - "'Api Exception raised while fetching resource group using ext_id' in result.msg"
    fail_msg: "Negative test - get info with non-existent ext_id should fail"
    success_msg: "Negative test - get info with non-existent ext_id correctly failed"

- name: "Negative: Update resource group with non-existent ext_id"
  nutanix.ncp.ntnx_resource_group_v2:
    state: present
    ext_id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
    name: "nonexistent-rg"
  register: result
  ignore_errors: true

- name: Verify update with non-existent ext_id fails
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == true
      - "'Api Exception raised while fetching resource group using ext_id' in result.msg"
    fail_msg: "Negative test - update with non-existent ext_id should fail"
    success_msg: "Negative test - update with non-existent ext_id correctly failed"

###########################################################
# DELETE OPERATIONS
###########################################################
- name: Delete all created resource groups
  nutanix.ncp.ntnx_resource_group_v2:
    state: absent
    ext_id: "{{ item }}"
  register: result
  loop: "{{ todelete_rg }}"
  ignore_errors: true

- name: Verify deletion loop result
  ansible.builtin.assert:
    that:
      - result.results is defined
      - result.results | length == todelete_rg | length
      - result.msg == "All items completed"
    fail_msg: "Delete loop did not return expected number of results"
    success_msg: "Delete loop returned expected number of results"

- name: Verify each resource group deletion
  ansible.builtin.assert:
    that:
      - item.changed == true
      - item.failed == false
      - item.task_ext_id is defined
      - item.ext_id is defined
      - item.response is defined
      - item.response.status == "SUCCEEDED"
    fail_msg: "Deletion failed for resource group {{ item.item }}"
    success_msg: "Resource group {{ item.item }} deleted successfully"
  loop: "{{ result.results }}"
  loop_control:
    label: "{{ item.item }}"

###########################################################
# CLEANUP - Delete test projects
###########################################################
- name: Delete all test projects
  nutanix.ncp.ntnx_project_v2:
    state: absent
    ext_id: "{{ item }}"
  register: cleanup_result
  loop: "{{ todelete_projects }}"
  ignore_errors: true

- name: Verify each project cleanup
  ansible.builtin.assert:
    that:
      - cleanup_result.results is defined
      - cleanup_result.results | length == todelete_projects | length
      - cleanup_result.msg == "All items completed"
      - item.changed == true
      - item.failed == false
      - item.task_ext_id is defined
      - item.ext_id is defined
      - item.response.status == "SUCCEEDED"
    fail_msg: "Cleanup failed for project {{ item.item }}"
    success_msg: "Project {{ item.item }} cleaned up successfully"
  loop: "{{ cleanup_result.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: End testing ntnx_resource_groups_v2, ntnx_resource_groups_info_v2
  ansible.builtin.debug:
    msg: End testing ntnx_resource_groups_v2, ntnx_resource_groups_info_v2
