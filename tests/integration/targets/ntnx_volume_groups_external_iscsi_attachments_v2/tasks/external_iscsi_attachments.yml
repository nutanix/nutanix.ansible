---
- name: Start Volume Group external iSCSI attachment tests
  ansible.builtin.debug:
    msg: "Start Volume Group external iSCSI attachment tests"

- name: Generate random names
  ansible.builtin.set_fact:
    random_name: >-
      {{ query('community.general.random_string',
      numbers=false, special=false, length=12)[0] }}
    suffix_name: "ansible-vgiscsi"

- name: Set VG and iSCSI names
  ansible.builtin.set_fact:
    vg_name: "{{ suffix_name }}-{{ random_name }}-vg"
    iscsi_name: "iqn.1991-05.com.microsoft:{{ suffix_name }}-{{ random_name }}"
    wrong_ext_id: "00000000-0000-0000-0000-000000000000"

######################################## Test Setup ########################################

- name: Create Volume Group for iSCSI tests
  nutanix.ncp.ntnx_volume_groups_v2:
    name: "{{ vg_name }}"
    description: "VG for external iSCSI tests"
    target_prefix: "vgiscsi"
    cluster_reference: "{{ cluster.uuid }}"
    usage_type: "USER"
    sharing_status: "SHARED"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: vg_result

- name: Verify VG creation
  ansible.builtin.assert:
    that:
      - vg_result is defined
      - vg_result.changed == true
      - vg_result.failed == false
      - vg_result.ext_id is defined
    fail_msg: "Unable to create VG for iSCSI tests"
    success_msg: "VG created successfully"

- name: Set VG ext_id fact
  ansible.builtin.set_fact:
    vg_ext_id: "{{ vg_result.ext_id }}"

############################## Check mode - attach ##############################

- name: Attach iSCSI client in check mode with dummy IDs
  nutanix.ncp.ntnx_volume_groups_external_iscsi_attachments_v2:
    state: present
    volume_group_ext_id: "11111111-1111-1111-1111-111111111111"
    iscsi_initiator_name: "iqn.1991-05.com.microsoft:dummy-check"
    num_virtual_targets: 1
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify check mode attach response
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.iscsi_initiator_name == "iqn.1991-05.com.microsoft:dummy-check"
    fail_msg: "Check mode attach failed"
    success_msg: "Check mode attach passed"

- name: Attach iSCSI client with IPv4 in check mode
  nutanix.ncp.ntnx_volume_groups_external_iscsi_attachments_v2:
    state: present
    volume_group_ext_id: "11111111-1111-1111-1111-111111111111"
    iscsi_initiator_network_id:
      ipv4:
        value: "10.10.10.100"
    num_virtual_targets: 1
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify check mode attach with IPv4
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.iscsi_initiator_network_id.ipv4.value == "10.10.10.100"
    fail_msg: "Check mode attach with IPv4 failed"
    success_msg: "Check mode attach with IPv4 passed"

############################## Negative tests ####################################

- name: Attach iSCSI with missing volume_group_ext_id
  nutanix.ncp.ntnx_volume_groups_external_iscsi_attachments_v2:
    state: present
    iscsi_initiator_name: "{{ iscsi_name }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true

- name: Verify missing volume_group_ext_id failure
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    fail_msg: "Missing volume_group_ext_id did not fail"
    success_msg: "Missing volume_group_ext_id correctly failed"

- name: Detach iSCSI with missing ext_id
  nutanix.ncp.ntnx_volume_groups_external_iscsi_attachments_v2:
    state: absent
    volume_group_ext_id: "{{ vg_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true

- name: Verify missing ext_id on detach failure
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    fail_msg: "Missing ext_id on detach did not fail"
    success_msg: "Missing ext_id on detach correctly failed"

- name: Attach iSCSI with mutual exclusive params
  nutanix.ncp.ntnx_volume_groups_external_iscsi_attachments_v2:
    state: present
    volume_group_ext_id: "{{ vg_ext_id }}"
    iscsi_initiator_name: "{{ iscsi_name }}"
    iscsi_initiator_network_id:
      ipv4:
        value: "10.10.10.100"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true

- name: Verify mutual exclusive failure
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    fail_msg: "Mutual exclusive did not fail"
    success_msg: "Mutual exclusive correctly failed"

############################## Attach - real #####################################

- name: Attach iSCSI client to VG using IQN
  nutanix.ncp.ntnx_volume_groups_external_iscsi_attachments_v2:
    state: present
    volume_group_ext_id: "{{ vg_ext_id }}"
    iscsi_initiator_name: "{{ iscsi_name }}"
    num_virtual_targets: 1
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result

- name: Verify attach success
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.task_ext_id is defined
      - result.response.status == "SUCCEEDED"
      - result.volume_group_ext_id == vg_ext_id
      - result.ext_id is defined
    fail_msg: "Unable to attach iSCSI client to VG"
    success_msg: "iSCSI client attached successfully"

- name: Set iSCSI client ext_id
  ansible.builtin.set_fact:
    iscsi_ext_id: "{{ result.ext_id }}"

- name: List iSCSI clients to verify attachment
  nutanix.ncp.ntnx_volume_groups_iscsi_clients_info_v2:
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: list_result
  ignore_errors: true

- name: Verify iSCSI client appears in list
  ansible.builtin.assert:
    that:
      - list_result is defined
      - list_result.failed == false
      - list_result.response is defined
    fail_msg: "Unable to list iSCSI clients"
    success_msg: "iSCSI clients listed successfully"

############################## Detach - check mode ###############################

- name: Detach iSCSI client in check mode with dummy IDs
  nutanix.ncp.ntnx_volume_groups_external_iscsi_attachments_v2:
    state: absent
    volume_group_ext_id: "11111111-1111-1111-1111-111111111111"
    ext_id: "22222222-2222-2222-2222-222222222222"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify check mode detach
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.msg is defined
    fail_msg: "Check mode detach failed"
    success_msg: "Check mode detach passed"

############################## Detach - real #####################################

- name: Detach iSCSI client from VG
  nutanix.ncp.ntnx_volume_groups_external_iscsi_attachments_v2:
    state: absent
    volume_group_ext_id: "{{ vg_ext_id }}"
    ext_id: "{{ iscsi_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result

- name: Verify detach success
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.task_ext_id is defined
      - result.response.status == "SUCCEEDED"
    fail_msg: "Unable to detach iSCSI client from VG"
    success_msg: "iSCSI client detached successfully"

- name: Attach iSCSI client again using ext_id (negative - should fail)
  nutanix.ncp.ntnx_volume_groups_external_iscsi_attachments_v2:
    state: present
    volume_group_ext_id: "{{ vg_ext_id }}"
    ext_id: "{{ iscsi_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true

- name: Verify re-attach with ext_id correctly fails
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    fail_msg: "Re-attach with ext_id did not fail as expected"
    success_msg: "Re-attach with ext_id correctly failed"

############################## Cleanup ###########################################

- name: Delete Volume Group
  nutanix.ncp.ntnx_volume_groups_v2:
    state: absent
    ext_id: "{{ vg_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true
  retries: 3
  delay: 5
  until: result is succeeded

- name: Verify VG deletion
  ansible.builtin.assert:
    that:
      - result is defined
      - (result.failed == false and result.changed == true) or ("Backend server error" in (result | string))
    fail_msg: "Unable to delete VG"
    success_msg: "VG deletion handled"
