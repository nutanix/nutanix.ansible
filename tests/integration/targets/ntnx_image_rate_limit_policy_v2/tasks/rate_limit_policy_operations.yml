---
- name: Start testing ntnx_image_rate_limit_policy_v2
  ansible.builtin.debug:
    msg: Start testing ntnx_image_rate_limit_policy_v2

- name: Generate random name
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"

- name: Set policy name
  ansible.builtin.set_fact:
    policy_name: "ansible_rate_limit_policy_{{ random_name }}"

- name: Set todelete list
  ansible.builtin.set_fact:
    todelete: []

########################################################################################
# Fetch categories required for rate limit policy creation
########################################################################################

- name: List all categories and choose the first two
  nutanix.ncp.ntnx_categories_info_v2:
  register: result
  ignore_errors: true

- name: Status of all categories
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response | length > 1
    fail_msg: "Unable to list categories"
    success_msg: "Categories listed successfully"

- name: Set category variables
  ansible.builtin.set_fact:
    category_ext_id: '{{ result["response"][0]["ext_id"] }}'
    category_ext_id1: '{{ result["response"][1]["ext_id"] }}'

########################################################################################
# Create Image Rate Limit Policy Tests
########################################################################################

- name: Generate spec for creating image rate limit policy using check mode with all attributes
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    name: "ansible_rate_limit_policy_check_mode"
    description: "ansible_rate_limit_policy_check_mode_description"
    rate_limit_kbps: 1024
    cluster_entity_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "605a0cf9-d04e-3be7-911b-1e6f193f6ebe"
        - "d89e250f-8535-4251-8e9d-2a50240f4502"
        - "605a0cf9-d04e-3be7-911b-1e6f193f6ebe"
  register: result
  ignore_errors: true
  check_mode: true

- name: Generate spec for creating image rate limit policy using check mode with all attributes status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.name == "ansible_rate_limit_policy_check_mode"
      - result.response.description == "ansible_rate_limit_policy_check_mode_description"
      - result.response.rate_limit_kbps == 1024
      - result.response.cluster_entity_filter.type == "CATEGORIES_MATCH_ALL"
      - result.response.cluster_entity_filter.category_ext_ids | length == 3
      - "'d89e250f-8535-4251-8e9d-2a50240f4502' in result.response.cluster_entity_filter.category_ext_ids"
      - "'605a0cf9-d04e-3be7-911b-1e6f193f6ebe' in result.response.cluster_entity_filter.category_ext_ids"
      - "'605a0cf9-d04e-3be7-911b-1e6f193f6ebe' in result.response.cluster_entity_filter.category_ext_ids"
    fail_msg: "Spec for creating image rate limit policy using check mode is not generated successfully"
    success_msg: "Spec for creating image rate limit policy using check mode is generated successfully"

########################################################################################

- name: Create an image rate limit policy with minimal spec (without description)
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    name: "{{ policy_name }}_min"
    rate_limit_kbps: 512
    cluster_entity_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "{{ category_ext_id }}"
    wait: true
  register: result
  ignore_errors: true

- name: Create an image rate limit policy with minimal spec status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.task_ext_id is defined
      - result.response is defined
      - result.response.name == "{{ policy_name }}_min"
      - result.response.rate_limit_kbps == 512
      - result.response.cluster_entity_filter.type == "CATEGORIES_MATCH_ALL"
      - result.response.cluster_entity_filter.category_ext_ids | length == 1
      - category_ext_id in result.response.cluster_entity_filter.category_ext_ids
    fail_msg: "Create image rate limit policy with minimal spec failed"
    success_msg: "Create image rate limit policy with minimal spec passed"

- name: Add policy to todelete list
  ansible.builtin.set_fact:
    todelete: '{{ todelete + [result["response"]["ext_id"]] }}'

########################################################################################

- name: Create an image rate limit policy with all possible attributes
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    name: "{{ policy_name }}_all"
    description: "{{ policy_name }}_all_description"
    rate_limit_kbps: 2048
    cluster_entity_filter:
      type: CATEGORIES_MATCH_ANY
      category_ext_ids:
        - "{{ category_ext_id }}"
        - "{{ category_ext_id1 }}"
    wait: true
  register: result
  ignore_errors: true

- name: Create an image rate limit policy with all attributes status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.ext_id is defined
      - result.task_ext_id is defined
      - result.response is defined
      - result.response.name == "{{ policy_name }}_all"
      - result.response.description == "{{ policy_name }}_all_description"
      - result.response.rate_limit_kbps == 2048
      - result.response.cluster_entity_filter.type == "CATEGORIES_MATCH_ANY"
      - result.response.cluster_entity_filter.category_ext_ids | length == 2
      - category_ext_id in result.response.cluster_entity_filter.category_ext_ids
      - category_ext_id1 in result.response.cluster_entity_filter.category_ext_ids
    fail_msg: "Create image rate limit policy with all attributes failed"
    success_msg: "Create image rate limit policy with all attributes passed"

- name: Add policy to todelete list
  ansible.builtin.set_fact:
    todelete: '{{ todelete + [result["response"]["ext_id"]] }}'

########################################################################################
# Negative Create Image Rate Limit Policy Tests
########################################################################################

- name: Create image rate limit policy with missing name
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    rate_limit_kbps: 1024
    cluster_entity_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "{{ category_ext_id }}"
  register: result
  ignore_errors: true

- name: Create image rate limit policy with missing name status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "state is present but any of the following are missing: name, ext_id"
    fail_msg: "Create image rate limit policy with missing name did not fail as expected"
    success_msg: "Create image rate limit policy with missing name failed as expected"

- name: Create image rate limit policy with missing rate_limit_kbps and cluster_entity_filter
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    name: "{{ policy_name }}_missing_rate_limit_kbps_and_cluster_entity_filter"
  register: result
  ignore_errors: true

- name: Create image rate limit policy with missing rate_limit_kbps status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "Missing required parameter(s): rate_limit_kbps, cluster_entity_filter"
    fail_msg: "Create image rate limit policy with missing rate_limit_kbps and cluster_entity_filter did not fail as expected"
    success_msg: "Create image rate limit policy with missing rate_limit_kbps and cluster_entity_filter failed as expected"

########################################################################################

- name: Create image rate limit policy with invalid cluster_entity_filter type
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    name: "{{ policy_name }}_invalid_filter"
    rate_limit_kbps: 1024
    cluster_entity_filter:
      type: INVALID_TYPE
      category_ext_ids:
        - "{{ category_ext_id }}"
  register: result
  ignore_errors: true

- name: Create image rate limit policy with invalid filter type status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - >-
        result.msg == "value of type must be one of: CATEGORIES_MATCH_ALL,
        CATEGORIES_MATCH_ANY, got: INVALID_TYPE found in cluster_entity_filter"
    fail_msg: "Create image rate limit policy with invalid filter type did not fail as expected"
    success_msg: "Create image rate limit policy with invalid filter type failed as expected"

########################################################################################
# Update Image Rate Limit Policy Tests
########################################################################################

- name: Generate spec for updating image rate limit policy using check mode with all attributes
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    ext_id: "{{ todelete[0] }}"
    name: "ansible_rate_limit_policy_updated"
    description: "ansible_rate_limit_policy_updated_description"
    rate_limit_kbps: 4096
    cluster_entity_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "d89e250f-8535-4251-8e9d-2a50240f4502"
    wait: true
  register: result
  ignore_errors: true
  check_mode: true

- name: Generate spec for updating image rate limit policy using check mode status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.name == "ansible_rate_limit_policy_updated"
      - result.response.description == "ansible_rate_limit_policy_updated_description"
      - result.response.rate_limit_kbps == 4096
      - result.response.cluster_entity_filter.type == "CATEGORIES_MATCH_ALL"
      - result.response.cluster_entity_filter.category_ext_ids | length == 1
      - "'d89e250f-8535-4251-8e9d-2a50240f4502' in result.response.cluster_entity_filter.category_ext_ids"
    fail_msg: "Spec for updating image rate limit policy using check mode is not generated successfully"
    success_msg: "Spec for updating image rate limit policy using check mode is generated successfully"

########################################################################################

- name: Update an existing image rate limit policy with all attributes
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    ext_id: "{{ todelete[0] }}"
    name: "{{ policy_name }}_updated"
    description: "{{ policy_name }}_updated_description"
    rate_limit_kbps: 4096
    cluster_entity_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "{{ category_ext_id1 }}"
    wait: true
  register: result
  ignore_errors: true

- name: Update image rate limit policy status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.response.name == "{{ policy_name }}_updated"
      - result.response.description == "{{ policy_name }}_updated_description"
      - result.response.rate_limit_kbps == 4096
      - result.response.cluster_entity_filter.type == "CATEGORIES_MATCH_ALL"
      - result.response.cluster_entity_filter.category_ext_ids | length == 1
      - category_ext_id1 in result.response.cluster_entity_filter.category_ext_ids
    fail_msg: "Update image rate limit policy failed"
    success_msg: "Update image rate limit policy passed"

########################################################################################

- name: Check for idempotency by updating the same policy with same values
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    ext_id: "{{ todelete[0] }}"
    name: "{{ policy_name }}_updated"
    description: "{{ policy_name }}_updated_description"
    rate_limit_kbps: 4096
    cluster_entity_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "{{ category_ext_id1 }}"
    wait: true
  register: result
  ignore_errors: true

- name: Idempotency check status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.skipped == true
      - result.msg == "Nothing to change."
      - result.ext_id == "{{ todelete[0] }}"
    fail_msg: "Idempotency test failed"
    success_msg: "Idempotency test passed"

########################################################################################
# Negative Update Image Rate Limit Policy Tests
########################################################################################

- name: Negative test - Update policy that does not exist
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    ext_id: "12345678-1234-1234-1234-123456789123"
    name: "nonexistent_policy"
    rate_limit_kbps: 1024
    cluster_entity_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "{{ category_ext_id }}"
    wait: true
  register: result
  ignore_errors: true

- name: Negative update non-existent policy status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - >-
        result.msg ==
        "Api Exception raised while fetching image rate limit policy info using ext_id"
      - result.response.data.error | length > 0
    fail_msg: "Negative test - update non-existent policy did not fail as expected"
    success_msg: "Negative test - update non-existent policy failed as expected"

########################################################################################
# Info Module Tests - Get Single Image Rate Limit Policy
########################################################################################

- name: Fetch an existing image rate limit policy using ext_id
  nutanix.ncp.ntnx_image_rate_limit_policies_info_v2:
    ext_id: "{{ todelete[0] }}"
  register: result
  ignore_errors: true

- name: Fetch image rate limit policy using ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.ext_id == "{{ todelete[0] }}"
      - result.response.name == "{{ policy_name }}_updated"
      - result.response.description == "{{ policy_name }}_updated_description"
      - result.response.rate_limit_kbps == 4096
      - result.response.cluster_entity_filter.type == "CATEGORIES_MATCH_ALL"
      - result.response.cluster_entity_filter.category_ext_ids | length == 1
      - category_ext_id1 in result.response.cluster_entity_filter.category_ext_ids
    fail_msg: "Fetch an existing image rate limit policy failed"
    success_msg: "Fetch an existing image rate limit policy passed"

########################################################################################

- name: Negative test - Fetch image rate limit policy that does not exist
  nutanix.ncp.ntnx_image_rate_limit_policies_info_v2:
    ext_id: "12345678-1234-1234-1234-123456789123"
  register: result
  ignore_errors: true

- name: Negative fetch non-existent policy status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - >-
        result.msg ==
        "Api Exception raised while fetching image rate limit policy info using ext_id"
      - result.response.data.error | length > 0
    fail_msg: "Negative test - fetch non-existent policy did not fail as expected"
    success_msg: "Negative test - fetch non-existent policy failed as expected"

########################################################################################
# Info Module Tests - List Image Rate Limit Policies
########################################################################################

- name: Retrieve all image rate limit policies
  nutanix.ncp.ntnx_image_rate_limit_policies_info_v2:
  register: result
  ignore_errors: true

- name: List all image rate limit policies status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length >= 2
      - result.total_available_results is defined
      - result.total_available_results >= 2
    fail_msg: "Retrieve all image rate limit policies failed"
    success_msg: "Retrieve all image rate limit policies passed"

########################################################################################

- name: List image rate limit policies with filter
  nutanix.ncp.ntnx_image_rate_limit_policies_info_v2:
    filter: "name eq '{{ policy_name }}_updated'"
  register: result
  ignore_errors: true

- name: List image rate limit policies with filter status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
      - result.response[0].name == "{{ policy_name }}_updated"
      - result.response[0].description == "{{ policy_name }}_updated_description"
      - result.response[0].rate_limit_kbps == 4096
      - result.response[0].ext_id == "{{ todelete[0] }}"
      - result.total_available_results == 1
    fail_msg: "List image rate limit policies with filter failed"
    success_msg: "List image rate limit policies with filter passed"

########################################################################################

- name: List image rate limit policies with limit 1
  nutanix.ncp.ntnx_image_rate_limit_policies_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: List image rate limit policies with limit status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
    fail_msg: "List image rate limit policies with limit 1 failed"
    success_msg: "List image rate limit policies with limit 1 passed"

########################################################################################

########################################################################################
# Delete Image Rate Limit Policy Tests
########################################################################################

- name: Delete image rate limit policy with check mode enabled
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: absent
    ext_id: "{{ todelete[0] }}"
  register: result
  ignore_errors: true
  check_mode: true

- name: Delete image rate limit policy with check mode status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.msg is defined
      - result.ext_id == "{{ todelete[0] }}"
      - result.msg == "Policy with ext_id:{{ todelete[0] }} will be deleted."
    fail_msg: "Delete image rate limit policy with check mode failed"
    success_msg: "Delete image rate limit policy with check mode passed"

########################################################################################

- name: Delete all created image rate limit policies
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: absent
    ext_id: "{{ item }}"
  register: result
  ignore_errors: true
  loop: "{{ todelete }}"

- name: Delete all image rate limit policies status
  ansible.builtin.assert:
    that:
      - item.changed == true
      - item.failed == false
      - item.response is defined
      - item.response.status == 'SUCCEEDED'
      - result.changed == true
      - result.msg == "All items completed"
      - result.results | length == todelete | length
    fail_msg: "Delete image rate limit policies failed"
    success_msg: "Delete image rate limit policies passed"
  loop: "{{ result.results }}"

########################################################################################
# Negative Delete Image Rate Limit Policy Tests
########################################################################################

- name: Negative test - Delete policy that does not exist
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: absent
    ext_id: "12345678-1234-1234-1234-123456789123"
    wait: true
  register: result
  ignore_errors: true

- name: Negative delete non-existent policy status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "Api Exception raised while deleting Image Rate Limit Policy"
      - result.response.data.error | length > 0
    fail_msg: "Negative test - delete non-existent policy did not fail as expected"
    success_msg: "Negative test - delete non-existent policy failed as expected"

########################################################################################

- name: Negative test - Delete image rate limit policy with missing ext_id
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: absent
  register: result
  ignore_errors: true

- name: Negative delete with missing ext_id status
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == true
      - result.msg == "state is absent but all of the following are missing: ext_id"
    fail_msg: "Negative test - delete with missing ext_id did not fail as expected"
    success_msg: "Negative test - delete with missing ext_id failed as expected"
