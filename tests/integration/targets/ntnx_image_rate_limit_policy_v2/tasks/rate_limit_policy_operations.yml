---
- name: Start testing ntnx_image_rate_limit_policy_v2
  ansible.builtin.debug:
    msg: Start testing ntnx_image_rate_limit_policy_v2

- name: Generate random name
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"

- name: Set policy name
  ansible.builtin.set_fact:
    policy_name: "{{ random_name }}_rate_limit_test"

- name: List all categories and choose the first two
  nutanix.ncp.ntnx_categories_info_v2:
  register: result
  ignore_errors: true

- name: Status of all categories
  ansible.builtin.assert:
    that:
      - result.response is defined
      - result.changed == false
      - result.failed == false
      - result.response | length > 0
    fail_msg: "Unable to list categories"
    success_msg: "Categories listed successfully"

- name: Set variables
  ansible.builtin.set_fact:
    category_ext_id: '{{ result["response"][0]["ext_id"] }}'
    category_ext_id1: '{{ result["response"][1]["ext_id"] }}'

- name: Set todelete list
  ansible.builtin.set_fact:
    todelete: []

##################################################################################

- name: Create an image rate limit policy - check mode is enabled
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    name: "{{ policy_name }}1"
    description: "{{ policy_name }}1_description"
    rate_limit_kbps: 1024
    cluster_entity_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "{{ category_ext_id }}"
    wait: true
  register: result
  ignore_errors: true
  check_mode: true

- name: Creation Check Mode Status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.cluster_entity_filter.category_ext_ids[0] == "{{ category_ext_id }}"
      - result.response.cluster_entity_filter.type == "CATEGORIES_MATCH_ALL"
      - result.response.name == "{{ policy_name }}1"
      - result.response.description == "{{ policy_name }}1_description"
      - result.response.rate_limit_kbps == 1024
    fail_msg: "Create image rate limit policy check mode failed"
    success_msg: "Create image rate limit policy check mode passed"

###########################################################################################

- name: Create an image rate limit policy with minimal spec
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    name: "{{ policy_name }}2"
    rate_limit_kbps: 512
    cluster_entity_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "{{ category_ext_id }}"
    wait: true
  register: result
  ignore_errors: true

- name: Creation Status - minimal spec
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.response.cluster_entity_filter.category_ext_ids[0] == "{{ category_ext_id }}"
      - result.response.cluster_entity_filter.type == "CATEGORIES_MATCH_ALL"
      - result.response.name == "{{ policy_name }}2"
      - result.response.rate_limit_kbps == 512
    fail_msg: "Create image rate limit policy with minimal spec failed"
    success_msg: "Create image rate limit policy with minimal spec passed"

- name: Add to delete list
  ansible.builtin.set_fact:
    todelete: '{{ todelete + [result["response"]["ext_id"]] }}'

###########################################################################################

- name: Create an image rate limit policy with all possible attributes
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    name: "{{ policy_name }}3"
    description: "{{ policy_name }}3_description"
    rate_limit_kbps: 2048
    cluster_entity_filter:
      type: CATEGORIES_MATCH_ANY
      category_ext_ids:
        - "{{ category_ext_id }}"
    wait: true
  register: result
  ignore_errors: true

- name: Creation Status - all attributes
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.response.cluster_entity_filter.category_ext_ids[0] == "{{ category_ext_id }}"
      - result.response.cluster_entity_filter.type == "CATEGORIES_MATCH_ANY"
      - result.response.name == "{{ policy_name }}3"
      - result.response.description == "{{ policy_name }}3_description"
      - result.response.rate_limit_kbps == 2048
    fail_msg: "Create image rate limit policy with all attributes failed"
    success_msg: "Create image rate limit policy with all attributes passed"

- name: Add to delete list
  ansible.builtin.set_fact:
    todelete: '{{ todelete + [result["response"]["ext_id"]] }}'

##########################################################################################

- name: Update an existing image rate limit policy - check mode is enabled
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    ext_id: "{{ todelete[0] }}"
    name: "{{ policy_name }}4"
    description: "{{ policy_name }}4_description"
    rate_limit_kbps: 4096
    cluster_entity_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "{{ category_ext_id1 }}"
    wait: true
  register: result
  ignore_errors: true
  check_mode: true

- name: Update Check Mode Status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.name == "{{ policy_name }}4"
      - result.response.description == "{{ policy_name }}4_description"
      - result.response.rate_limit_kbps == 4096
      - result.response.cluster_entity_filter.category_ext_ids[0] == "{{ category_ext_id1 }}"
    fail_msg: "Update image rate limit policy check mode failed"
    success_msg: "Update image rate limit policy check mode passed"

##########################################################################################

- name: Update an existing image rate limit policy
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    ext_id: "{{ todelete[0] }}"
    name: "{{ policy_name }}4"
    description: "{{ policy_name }}4_description"
    rate_limit_kbps: 4096
    cluster_entity_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "{{ category_ext_id1 }}"
    wait: true
  register: result
  ignore_errors: true

- name: Update Status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.response.name == "{{ policy_name }}4"
      - result.response.description == "{{ policy_name }}4_description"
      - result.response.rate_limit_kbps == 4096
      - result.response.cluster_entity_filter.category_ext_ids[0] == "{{ category_ext_id1 }}"
    fail_msg: "Update image rate limit policy failed"
    success_msg: "Update image rate limit policy passed"

###########################################################################################

- name: Check for idempotency by updating the same policy
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    ext_id: "{{ todelete[0] }}"
    name: "{{ policy_name }}4"
    description: "{{ policy_name }}4_description"
    rate_limit_kbps: 4096
    cluster_entity_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "{{ category_ext_id1 }}"
    wait: true
  register: result
  ignore_errors: true

- name: Idempotency Status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.msg == "Nothing to change."
      - result.ext_id == "{{ todelete[0] }}"
    fail_msg: "Check for idempotency failed"
    success_msg: "Check for idempotency passed"

###############################################################################

- name: Get an existing image rate limit policy
  nutanix.ncp.ntnx_image_rate_limit_policies_info_v2:
    ext_id: "{{ todelete[0] }}"
  register: result
  ignore_errors: true

- name: Get Status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.ext_id == "{{ todelete[0] }}"
    fail_msg: "Get an existing image rate limit policy failed"
    success_msg: "Get an existing image rate limit policy passed"

################################################################################

- name: Retrieve all rate limit policies
  nutanix.ncp.ntnx_image_rate_limit_policies_info_v2:
  register: result
  ignore_errors: true

- name: List Status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length > 0
      - result.total_available_results is defined
      - result.total_available_results > 0
    fail_msg: "Retrieve all rate limit policies failed"
    success_msg: "Retrieve all rate limit policies passed"

################################################################################

- name: Retrieve all rate limit policies with limit 1
  nutanix.ncp.ntnx_image_rate_limit_policies_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: Limit Status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
    fail_msg: "Retrieve all rate limit policies with limit 1 failed"
    success_msg: "Retrieve all rate limit policies with limit 1 passed"

################################################################################

- name: Negative test - Update policy that does not exist
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: present
    ext_id: "12345678-1234-1234-1234-123456789123"
    name: "nonexistent_policy"
    rate_limit_kbps: 1024
    cluster_entity_filter:
      type: CATEGORIES_MATCH_ALL
      category_ext_ids:
        - "{{ category_ext_id }}"
    wait: true
  register: result
  ignore_errors: true

- name: Negative Update Status
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Negative test - update non-existent policy did not fail as expected"
    success_msg: "Negative test - update non-existent policy failed as expected"

################################################################################

- name: Negative test - Delete policy that does not exist
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: absent
    ext_id: "12345678-1234-1234-1234-123456789123"
    wait: true
  register: result
  ignore_errors: true

- name: Negative Delete Status
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Negative test - delete non-existent policy did not fail as expected"
    success_msg: "Negative test - delete non-existent policy failed as expected"

################################################################################

- name: Negative test - Get policy that does not exist
  nutanix.ncp.ntnx_image_rate_limit_policies_info_v2:
    ext_id: "12345678-1234-1234-1234-123456789123"
  register: result
  ignore_errors: true

- name: Negative Get Status
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Negative test - get non-existent policy did not fail as expected"
    success_msg: "Negative test - get non-existent policy failed as expected"

################################################################################

- name: Delete policy with check mode enabled
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: absent
    ext_id: "{{ todelete[0] }}"
  register: result
  ignore_errors: true
  check_mode: true

- name: Delete Check Mode Status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.msg is defined
      - result.ext_id == "{{ todelete[0] }}"
      - result.msg == "Policy with ext_id:{{ todelete[0] }} will be deleted."
    fail_msg: "Delete policy with check mode enabled failed"
    success_msg: "Delete policy with check mode enabled passed"

- name: Delete all created policies
  nutanix.ncp.ntnx_image_rate_limit_policy_v2:
    state: absent
    ext_id: "{{ item }}"
    wait: true
  register: result
  ignore_errors: true
  loop: "{{ todelete }}"

- name: Deletion Status
  ansible.builtin.assert:
    that:
      - item.changed == true
      - item.failed == false
      - item.response is defined
      - item.response.status == 'SUCCEEDED'
    fail_msg: "Delete policies failed"
    success_msg: "Delete policies passed"
  loop: "{{ result.results }}"
