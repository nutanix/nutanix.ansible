---
- name: Start ntnx_alerts_info_v2 tests
  ansible.builtin.debug:
    msg: "Starting ntnx_alerts_info_v2 tests"

- name: List all alerts
  nutanix.ncp.ntnx_alerts_info_v2:
  register: result
  ignore_errors: true

- name: Verify list all alerts
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.total_available_results is defined
    fail_msg: "Failed to list all alerts"
    success_msg: "Listed all alerts successfully"

- name: List all alerts with fetch_all
  nutanix.ncp.ntnx_alerts_info_v2:
    fetch_all: true
  register: fetch_all_result
  ignore_errors: true

- name: Verify fetch_all alerts
  ansible.builtin.assert:
    that:
      - fetch_all_result.changed == false
      - fetch_all_result.failed == false
      - fetch_all_result.response is defined
      - fetch_all_result.total_available_results is defined
      - (fetch_all_result.response | default([]) | length) == (fetch_all_result.total_available_results | int)
    fail_msg: "fetch_all for alerts failed"
    success_msg: "fetch_all for alerts passed"

- name: List alerts with limit
  nutanix.ncp.ntnx_alerts_info_v2:
    limit: 1
  register: result
  ignore_errors: true

- name: Verify list alerts with limit
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response | length == 1
    fail_msg: "List alerts with limit failed"
    success_msg: "List alerts with limit passed"

- name: List alerts with filter
  nutanix.ncp.ntnx_alerts_info_v2:
    filter: "isResolved eq false"
  register: result
  ignore_errors: true

- name: Verify list alerts with filter
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
    fail_msg: "List alerts with filter failed"
    success_msg: "List alerts with filter passed"

- name: List alerts with apply
  nutanix.ncp.ntnx_alerts_info_v2:
    apply: "groupby((severity))"
  register: result
  ignore_errors: true

- name: Verify list alerts with apply
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
    fail_msg: "List alerts with apply failed"
    success_msg: "List alerts with apply passed"

- name: Attempt to fetch alert with invalid ext_id
  nutanix.ncp.ntnx_alerts_info_v2:
    ext_id: "00000000-0000-0000-0000-000000000000"
  register: result
  ignore_errors: true

- name: Verify invalid ext_id fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Invalid ext_id should fail"
    success_msg: "Invalid ext_id correctly failed"

- name: Fetch alert by ext_id if available
  nutanix.ncp.ntnx_alerts_info_v2:
    limit: 1
  register: list_one
  ignore_errors: true

- name: Set alert ext_id fact
  ansible.builtin.set_fact:
    alert_ext_id: "{{ list_one.response[0].ext_id }}"
  when:
    - list_one.response is defined
    - list_one.response | length > 0
    - list_one.response[0].ext_id is defined

- name: Get alert by ext_id
  nutanix.ncp.ntnx_alerts_info_v2:
    ext_id: "{{ alert_ext_id }}"
  register: result
  ignore_errors: true
  when: alert_ext_id is defined

- name: Verify get alert by ext_id
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.ext_id == alert_ext_id
    fail_msg: "Get alert by ext_id failed"
    success_msg: "Get alert by ext_id passed"
  when: alert_ext_id is defined

- name: Get alert by ext_id with expand
  nutanix.ncp.ntnx_alerts_info_v2:
    ext_id: "{{ alert_ext_id }}"
    expand: "project"
  register: result
  ignore_errors: true
  when: alert_ext_id is defined

- name: Verify get alert with expand
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
    fail_msg: "Get alert with expand failed"
    success_msg: "Get alert with expand passed"
  when: alert_ext_id is defined

- name: Negative with invalid filter
  nutanix.ncp.ntnx_alerts_info_v2:
    filter: "invalidField eq 'test'"
  register: result
  ignore_errors: true

- name: Verify invalid filter fails
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.changed == false
    fail_msg: "Invalid filter should fail"
    success_msg: "Invalid filter correctly failed"
