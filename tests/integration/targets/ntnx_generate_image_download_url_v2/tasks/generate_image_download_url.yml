---
# Test plan for ntnx_generate_image_download_url_v2
# Domain: Images - Generate image download URL
# SDK: ImageGenerateDownloadUrlConfig with expiry_seconds (1-86400, default 600)
#      and preferred_location OneOf cluster_reference/content_repository_reference
# Module: generate_image_download_url via ImagesApi, returns TaskReference
#
# Scenarios covered:
# 1. Check mode with required ext_id only
# 2. Check mode with expiry_seconds
# 3. Check mode with preferred_location cluster_reference
# 4. Live generate with default expiry (required only)
# 5. Live generate with custom expiry_seconds
# 6. Live generate with preferred_location cluster_reference
# 7. Negative: missing required ext_id
# 8. Negative: invalid expiry_seconds (0, out of range)
# 9. Negative: invalid ext_id non-existent
# 10. Negative: mutually exclusive preferred_location both set

- name: Start testing ntnx_generate_image_download_url_v2
  ansible.builtin.debug:
    msg: Start testing ntnx_generate_image_download_url_v2

- name: Generate random name for uniqueness
  ansible.builtin.set_fact:
    random_name: "{{ query('community.general.random_string', numbers=false, special=false, length=12)[0] }}"

- name: Set todelete list
  ansible.builtin.set_fact:
    todelete: []

##############################################################################
# Prerequisite: discover an existing image for testing
##############################################################################

- name: List images to discover test image
  nutanix.ncp.ntnx_images_info_v2:
    limit: 5
  register: images_result
  ignore_errors: true

- name: Assert images discovered
  ansible.builtin.assert:
    that:
      - images_result.failed == false
      - images_result.response is defined
      - images_result.response | length > 0
      - images_result.response[0].ext_id is defined
    fail_msg: Unable to discover images for generate download URL tests
    success_msg: Images discovered for generate download URL tests

- name: Set image_uuid fact
  ansible.builtin.set_fact:
    image_uuid: "{{ images_result.response[0].ext_id }}"

- name: Set cluster fact if available
  ansible.builtin.set_fact:
    cluster_uuid: "{{ images_result.response[0].cluster_location_ext_ids[0] }}"
  when: images_result.response[0].cluster_location_ext_ids is defined and images_result.response[0].cluster_location_ext_ids | length > 0

##############################################################################
# Check mode tests - inline dummy values, do not use vars
##############################################################################

- name: Generate image download URL with check mode enabled (required only)
  nutanix.ncp.ntnx_generate_image_download_url_v2:
    ext_id: "83083083-0000-0000-0000-000000000001"
  register: result
  ignore_errors: true
  check_mode: true

- name: Generate download URL check mode status (required only)
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
    fail_msg: Generate image download URL with check mode failed
    success_msg: Generate image download URL with check mode passed

- name: Generate image download URL with expiry check mode enabled
  nutanix.ncp.ntnx_generate_image_download_url_v2:
    ext_id: "83083083-0000-0000-0000-000000000001"
    expiry_seconds: 900
  register: result
  ignore_errors: true
  check_mode: true

- name: Generate download URL with expiry check mode status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.expiry_seconds == 900
    fail_msg: Generate download URL with expiry check mode failed
    success_msg: Generate download URL with expiry check mode passed

- name: Generate image download URL with cluster preferred location check mode
  nutanix.ncp.ntnx_generate_image_download_url_v2:
    ext_id: "83083083-0000-0000-0000-000000000001"
    expiry_seconds: 600
    preferred_location:
      cluster_reference:
        ext_id: "00000000-0000-0000-0000-000000000001"
  register: result
  ignore_errors: true
  check_mode: true

- name: Generate download URL with cluster location check mode status
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.preferred_location is defined
    fail_msg: Generate URL with cluster location check mode failed
    success_msg: Generate URL with cluster location check mode passed

##############################################################################
# Live generate tests with real image
##############################################################################

- name: Generate image download URL with default expiry (live)
  nutanix.ncp.ntnx_generate_image_download_url_v2:
    ext_id: "{{ image_uuid }}"
  register: result
  ignore_errors: true

- name: Generate download URL default expiry status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.ext_id == image_uuid
      - result.task_ext_id is defined
      - result.task_ext_id | length > 0
      - result.response.ext_id == result.task_ext_id
    fail_msg: Generate image download URL live default failed
    success_msg: Generate image download URL live default passed

- name: Generate image download URL with custom expiry 900 (live)
  nutanix.ncp.ntnx_generate_image_download_url_v2:
    ext_id: "{{ image_uuid }}"
    expiry_seconds: 900
  register: result
  ignore_errors: true

- name: Generate download URL with custom expiry status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.ext_id == image_uuid
      - result.task_ext_id is defined
      - result.response.status is defined
    fail_msg: Generate download URL with custom expiry live failed
    success_msg: Generate download URL with custom expiry live passed

- name: Generate image download URL with preferred cluster location (live)
  nutanix.ncp.ntnx_generate_image_download_url_v2:
    ext_id: "{{ image_uuid }}"
    expiry_seconds: 1200
    preferred_location:
      cluster_reference:
        ext_id: "{{ cluster_uuid }}"
  register: result
  ignore_errors: true
  when: cluster_uuid is defined

- name: Generate download URL with cluster location live status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.ext_id == image_uuid
      - result.task_ext_id is defined
    fail_msg: Generate URL with cluster location live failed
    success_msg: Generate URL with cluster location live passed
  when: cluster_uuid is defined

- name: Generate image download URL with long expiry 86400 (live)
  nutanix.ncp.ntnx_generate_image_download_url_v2:
    ext_id: "{{ image_uuid }}"
    expiry_seconds: 86400
  register: result
  ignore_errors: true

- name: Generate download URL with max expiry status
  ansible.builtin.assert:
    that:
      - result.changed == true
      - result.failed == false
      - result.response is defined
      - result.task_ext_id is defined
    fail_msg: Generate download URL with max expiry failed
    success_msg: Generate download URL with max expiry passed

##############################################################################
# Negative / Error tests
##############################################################################

- name: Generate image download URL missing required ext_id (negative)
  nutanix.ncp.ntnx_generate_image_download_url_v2:
    expiry_seconds: 600
  register: result
  ignore_errors: true

- name: Missing required ext_id status
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.msg is defined
    fail_msg: Missing required ext_id negative test failed - should have errored
    success_msg: Missing required ext_id negative test passed

- name: Generate image download URL with invalid expiry 0 (negative)
  nutanix.ncp.ntnx_generate_image_download_url_v2:
    ext_id: "{{ image_uuid }}"
    expiry_seconds: 0
  register: result
  ignore_errors: true

- name: Invalid expiry 0 status
  ansible.builtin.assert:
    that:
      - result.failed == true
    fail_msg: Invalid expiry 0 should have failed
    success_msg: Invalid expiry 0 correctly failed

- name: Generate image download URL with invalid expiry 86401 (negative)
  nutanix.ncp.ntnx_generate_image_download_url_v2:
    ext_id: "{{ image_uuid }}"
    expiry_seconds: 86401
  register: result
  ignore_errors: true

- name: Invalid expiry 86401 status
  ansible.builtin.assert:
    that:
      - result.failed == true
    fail_msg: Invalid expiry 86401 should have failed
    success_msg: Invalid expiry 86401 correctly failed

- name: Generate image download URL with non-existent ext_id (negative)
  nutanix.ncp.ntnx_generate_image_download_url_v2:
    ext_id: "00000000-0000-0000-0000-000000000000"
    expiry_seconds: 600
  register: result
  ignore_errors: true

- name: Non-existent ext_id status
  ansible.builtin.assert:
    that:
      - result.failed == true
      - result.msg is defined or result.error is defined
    fail_msg: Non-existent ext_id should have failed
    success_msg: Non-existent ext_id correctly failed

- name: Generate URL with both preferred_location options (mutually exclusive negative)
  nutanix.ncp.ntnx_generate_image_download_url_v2:
    ext_id: "83083083-0000-0000-0000-000000000001"
    preferred_location:
      cluster_reference:
        ext_id: "00000000-0000-0000-0000-000000000001"
      content_repository_reference:
        ext_id: "11111111-1111-1111-1111-111111111111"
  register: result
  ignore_errors: true

- name: Mutually exclusive preferred_location status
  ansible.builtin.assert:
    that:
      - result.failed == true
    fail_msg: Mutually exclusive preferred_location should have failed
    success_msg: Mutually exclusive preferred_location correctly failed
