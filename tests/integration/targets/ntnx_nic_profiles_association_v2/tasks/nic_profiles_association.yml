---
- name: Start NIC profile association tests
  ansible.builtin.debug:
    msg: "Start NIC profile association tests"

- name: Generate random names
  ansible.builtin.set_fact:
    random_name: >-
      {{ query('community.general.random_string',
      numbers=false, special=false, length=12)[0] }}
    suffix_name: "ansible"

- name: Set NIC profile and association names
  ansible.builtin.set_fact:
    nic_profile_name: "nic_profile_{{ suffix_name }}_{{ random_name }}"
    wrong_ext_id: "00000000-0000-0000-0000-000000000000"

############################## Fetch host and host NIC info ##############################

- name: Fetch hosts in cluster
  nutanix.ncp.ntnx_hosts_info_v2:
    cluster_ext_id: "{{ cluster.uuid }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: hosts_info
  ignore_errors: true

- name: Verify hosts fetch
  ansible.builtin.assert:
    that:
      - hosts_info is defined
      - hosts_info.failed == false
      - hosts_info.response is defined
      - hosts_info.response | length > 0
    fail_msg: "Unable to fetch hosts"
    success_msg: "Hosts fetched successfully"

- name: Set host ext_id
  ansible.builtin.set_fact:
    host_ext_id: "{{ hosts_info.response[0].ext_id }}"

- name: Fetch host NICs for NIC profile association
  nutanix.ncp.ntnx_cluster_host_nics_info_v2:
    cluster_ext_id: "{{ cluster.uuid }}"
    host_ext_id: "{{ host_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: host_nics_info
  ignore_errors: true

- name: Verify host NICs fetch
  ansible.builtin.assert:
    that:
      - host_nics_info is defined
      - host_nics_info.failed == false
      - host_nics_info.response is defined
    fail_msg: "Unable to fetch host NICs"
    success_msg: "Host NICs fetched successfully"

- name: Check if host NICs available
  ansible.builtin.set_fact:
    has_host_nics: "{{ host_nics_info.response | length > 0 }}"

- name: Set host NIC ext_id when available
  ansible.builtin.set_fact:
    host_nic_ext_id: "{{ host_nics_info.response[0].ext_id }}"
  when: has_host_nics | bool

- name: Set dummy host NIC when none available
  ansible.builtin.set_fact:
    host_nic_ext_id: "11111111-1111-1111-1111-111111111111"
  when: not has_host_nics | bool

############################## Create NIC profile ##############################

- name: Find SRIOV-capable host NIC
  ansible.builtin.set_fact:
    sriov_nics: "{{ host_nics_info.response | selectattr('supported_capabilities', 'defined') | selectattr('supported_capabilities', 'contains', 'SRIOV') | list }}"
  when: has_host_nics | bool

- name: Set NIC family for profile creation
  ansible.builtin.set_fact:
    target_nic_family: "{{ (sriov_nics[0].pci_model_id if sriov_nics is defined and sriov_nics | length > 0 else host_nics_info.response[0].pci_model_id) if (has_host_nics | bool) else nic_profile.first_nic_profile_family }}"
    target_capability: "SRIOV"
    has_sriov_nic: "{{ sriov_nics is defined and sriov_nics | length > 0 }}"
  when: has_host_nics | bool

- name: Set NIC family fallback when no host NICs
  ansible.builtin.set_fact:
    target_nic_family: "{{ nic_profile.first_nic_profile_family }}"
    target_capability: "SRIOV"
    has_sriov_nic: false
  when: not has_host_nics | bool

- name: Override host NIC ext_id to use SRIOV-capable NIC if available
  ansible.builtin.set_fact:
    host_nic_ext_id: "{{ sriov_nics[0].ext_id }}"
  when: has_sriov_nic | bool

- name: Create NIC profile for association tests
  nutanix.ncp.ntnx_nic_profiles_v2:
    name: "{{ nic_profile_name }}"
    description: "NIC profile for association tests"
    capability_config:
      capability_type: "{{ target_capability }}"
    nic_family: "{{ target_nic_family }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: nic_profile_result
  when: has_host_nics | bool or true

- name: Verify NIC profile creation
  ansible.builtin.assert:
    that:
      - nic_profile_result is defined
      - nic_profile_result.changed == true
      - nic_profile_result.failed == false
      - nic_profile_result.response.ext_id is defined
    fail_msg: "Unable to create NIC profile"
    success_msg: "NIC profile created successfully"

- name: Set NIC profile ext_id
  ansible.builtin.set_fact:
    nic_profile_ext_id: "{{ nic_profile_result.response.ext_id }}"

############################## Check mode - associate ##############################

- name: Associate host NIC with NIC profile in check mode with dummy IDs
  nutanix.ncp.ntnx_nic_profiles_association_v2:
    state: present
    ext_id: "11111111-1111-1111-1111-111111111111"
    host_nic_ext_id: "22222222-2222-2222-2222-222222222222"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify check mode associate response
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.host_nic_ext_id == "22222222-2222-2222-2222-222222222222"
    fail_msg: "Check mode associate failed"
    success_msg: "Check mode associate passed"

############################## Negative tests ####################################

- name: Associate with missing ext_id
  nutanix.ncp.ntnx_nic_profiles_association_v2:
    state: present
    host_nic_ext_id: "{{ host_nic_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true

- name: Verify missing ext_id failure
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    fail_msg: "Missing ext_id did not fail"
    success_msg: "Missing ext_id correctly failed"

- name: Associate with missing host_nic_ext_id
  nutanix.ncp.ntnx_nic_profiles_association_v2:
    state: present
    ext_id: "{{ nic_profile_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true

- name: Verify missing host_nic_ext_id failure
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    fail_msg: "Missing host_nic_ext_id did not fail"
    success_msg: "Missing host_nic_ext_id correctly failed"

############################## Associate - real (if host NICs exist) #############

- name: Associate host NIC with NIC profile
  nutanix.ncp.ntnx_nic_profiles_association_v2:
    state: present
    ext_id: "{{ nic_profile_ext_id }}"
    host_nic_ext_id: "{{ host_nic_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true
  when: has_sriov_nic | bool

- name: Skip associate when no SRIOV NIC available
  ansible.builtin.debug:
    msg: "No SRIOV-capable host NIC found - skipping associate/detach live tests"
  when: not has_sriov_nic | bool

- name: Verify associate success when host NICs available
  ansible.builtin.assert:
    that:
      - result is defined
      - (result.failed == false and result.changed == true) or (result.failed == true and ("NETWORKING-10056" in (result | string) or "does not support" in (result | string)))
    fail_msg: "Unable to associate host NIC with NIC profile"
    success_msg: "Host NIC associate handled (success or env skip)"
  when: has_sriov_nic | bool

- name: Set NIC association success flag
  ansible.builtin.set_fact:
    nic_assoc_succeeded: "{{ result.failed == false }}"
  when: has_sriov_nic | bool and result is defined

- name: Associate with wrong ext_id (negative)
  nutanix.ncp.ntnx_nic_profiles_association_v2:
    state: present
    ext_id: "{{ wrong_ext_id }}"
    host_nic_ext_id: "{{ host_nic_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true

- name: Verify wrong ext_id failure
  ansible.builtin.assert:
    that:
      - result is defined
      - result.failed == true
      - result.changed == false
    fail_msg: "Wrong ext_id did not fail"
    success_msg: "Wrong ext_id correctly failed"

############################## Disassociate - check mode #########################

- name: Disassociate host NIC from NIC profile in check mode with dummy IDs
  nutanix.ncp.ntnx_nic_profiles_association_v2:
    state: absent
    ext_id: "11111111-1111-1111-1111-111111111111"
    host_nic_ext_id: "22222222-2222-2222-2222-222222222222"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  check_mode: true
  ignore_errors: true

- name: Verify check mode disassociate
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == false
      - result.failed == false
      - result.response is defined
      - result.response.host_nic_ext_id == "22222222-2222-2222-2222-222222222222"
    fail_msg: "Check mode disassociate failed"
    success_msg: "Check mode disassociate passed"

############################## Disassociate - real ###############################

- name: Disassociate host NIC from NIC profile
  nutanix.ncp.ntnx_nic_profiles_association_v2:
    state: absent
    ext_id: "{{ nic_profile_ext_id }}"
    host_nic_ext_id: "{{ host_nic_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true
  when: has_sriov_nic | bool and nic_assoc_succeeded is defined and nic_assoc_succeeded | bool

- name: Verify disassociate success when host NICs available
  ansible.builtin.assert:
    that:
      - result is defined
      - (result.failed == false and result.changed == true) or (nic_assoc_succeeded is defined and not nic_assoc_succeeded)
    fail_msg: "Unable to disassociate host NIC"
    success_msg: "Host NIC disassociate handled"
  when: has_sriov_nic | bool and nic_assoc_succeeded is defined

############################## Cleanup ###########################################

- name: Delete NIC profile
  nutanix.ncp.ntnx_nic_profiles_v2:
    state: absent
    ext_id: "{{ nic_profile_ext_id }}"
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: "{{ validate_certs }}"
  register: result
  ignore_errors: true

- name: Verify NIC profile deletion
  ansible.builtin.assert:
    that:
      - result is defined
      - result.changed == true
      - result.failed == false
      - result.response.status == "SUCCEEDED"
    fail_msg: "Unable to delete NIC profile"
    success_msg: "NIC profile deleted successfully"
